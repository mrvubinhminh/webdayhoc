<title>Máy Tính Thầy Vũ Tiến Lực</title>
<style>
:root{
  --bg:#eef1f5; --ink:#1b1f24; --sub:#5b6572; --card:#ffffff; --line:#d7dce2;
  --device:#2b2f36; --device2:#20232a; --screen:#dfe6d8; --screen2:#e7edda;
  --screen-ink:#1c2a1c; --key-fn:#3a3f47; --key-fn-ink:#eef1f0;
  --key-num:#454b54; --key-num-ink:#ffffff; --key-op:#57616e; --key-op-ink:#ffffff;
  --shift:#e08a2b; --alpha:#2e9e6b; --del:#c94f4f; --ac:#c94f4f;
  --accent:#3b82f6; --focus:#3b82f6; --shadow:0 10px 30px rgba(0,0,0,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161a; --ink:#eef1f5; --sub:#a3acb8; --card:#1c1f25; --line:#2b3038;
  }
}
:root[data-theme="dark"]{
  --bg:#14161a; --ink:#eef1f5; --sub:#a3acb8; --card:#1c1f25; --line:#2b3038;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
.wrap{max-width:1180px;margin:0 auto;padding:16px 16px 30px;}
.layout{display:grid;grid-template-columns:minmax(340px,470px) 1fr;gap:22px;align-items:start;}
@media (max-width:880px){.layout{grid-template-columns:1fr;}}

/* ---- device ---- */
.device{background:linear-gradient(180deg,var(--device),var(--device2));border-radius:22px;padding:12px 14px 14px;box-shadow:var(--shadow);}
.brand-row{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#aab0bb;font-size:11px;padding:2px 6px 10px;letter-spacing:.04em;flex-wrap:wrap;}
.brand-row b{color:#e7eaef;font-weight:700;}
.screen{background:linear-gradient(180deg,var(--screen2),var(--screen));border-radius:10px;padding:10px 12px;color:var(--screen-ink);min-height:190px;display:flex;flex-direction:column;box-shadow:inset 0 2px 8px rgba(0,0,0,.25);}
.status-row{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;font-weight:700;color:#39492f;opacity:.85;margin-bottom:4px;}
.status-row .chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{border:1px solid rgba(30,40,20,.35);border-radius:5px;padding:1px 5px;cursor:pointer;user-select:none;background:rgba(255,255,255,.15);}
.chip.on{background:#39492f;color:#eef3e4;border-color:#39492f;}
.status-row .icons{display:flex;gap:8px;font-size:12px;opacity:.8;}
.status-row .icons span{cursor:pointer;padding:0 2px;}
.exprline{flex:1;min-height:56px;display:flex;align-items:center;overflow-x:auto;font-size:23px;line-height:1.3;padding:6px 2px;font-family:"Cambria Math","Times New Roman",serif;}
.exprline::-webkit-scrollbar{height:0;}
.resultline{text-align:right;font-size:26px;font-weight:600;min-height:32px;padding:2px 2px 4px;border-top:1px dashed rgba(30,40,20,.25);word-break:break-all;}
.hintline{font-size:11.5px;color:#4b5a40;opacity:.8;padding:2px 2px 0;display:flex;justify-content:space-between;gap:6px;align-items:center;}
.hintline .solvebtn{border:1px solid rgba(30,40,20,.35);border-radius:6px;padding:1px 6px;cursor:pointer;background:rgba(255,255,255,.2);white-space:nowrap;}

/* natural-display nodes */
.mrow{display:inline-flex;align-items:center;white-space:nowrap;}
.mfrac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 2px;font-size:.85em;}
.mfrac .num,.mfrac .den{padding:0 3px;min-width:10px;min-height:1.1em;display:inline-flex;}
.mfrac .bar{width:100%;border-top:1.5px solid var(--screen-ink);margin:1px 0;}
.msqrt{display:inline-flex;align-items:flex-start;margin:0 1px;}
.msqrt .rad{font-size:1.05em;padding-right:1px;}
.msqrt .body{border-top:1.5px solid var(--screen-ink);padding:0 3px 0 2px;min-width:8px;min-height:1em;}
.mnroot{display:inline-flex;align-items:flex-end;margin:0 1px;}
.mnroot .idx{font-size:.6em;min-width:6px;padding-bottom:.6em;}
.mpow{display:inline-flex;align-items:flex-start;margin:0 1px;}
.mpow .exp{font-size:.65em;min-width:6px;transform:translateY(-.3em);}
.mlog{display:inline-flex;align-items:flex-end;margin:0 1px;}
.mlog .base{font-size:.6em;min-width:5px;}
.mempty{display:inline-block;min-width:9px;min-height:1em;border-bottom:1px dotted rgba(30,40,20,.5);}
.caret{display:inline-block;width:1px;background:#1c2a1c;animation:blink 1s steps(1) infinite;margin:0 -.5px;align-self:stretch;}
@keyframes blink{50%{opacity:0;}}
.mvar{font-style:italic;}

/* history */
.histpanel{margin-top:10px;}
.histpanel h3{font-size:12px;color:var(--sub);margin:0 0 6px;font-weight:600;}
.histlist{display:flex;flex-direction:column;gap:4px;max-height:150px;overflow-y:auto;}
.histitem{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;}
.histitem:hover{border-color:var(--accent);}
.histitem .e{color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.histitem .r{font-weight:700;white-space:nowrap;}

/* ---- keypad ---- */
.padwrap{margin-top:10px;}
.ctrlcluster{display:grid;grid-template-columns:minmax(0,52px) minmax(0,52px) minmax(80px,1fr) minmax(0,52px) minmax(0,52px);gap:5px;align-items:center;margin-bottom:6px;}
.ctrlcluster .key{padding-left:1px;padding-right:1px;font-size:12px;min-height:34px;}
.dpad{position:relative;width:88px;height:88px;margin:0 auto;border-radius:50%;background:#181b20;box-shadow:inset 0 2px 6px rgba(0,0,0,.5);}
.dpad button{position:absolute;background:#33383f;color:#dfe3e8;border:none;font-size:13px;cursor:pointer;}
.dpad button:hover{background:#3d434c;}
.dpad .up{top:2px;left:30px;width:28px;height:26px;border-radius:13px 13px 4px 4px;}
.dpad .down{bottom:2px;left:30px;width:28px;height:26px;border-radius:4px 4px 13px 13px;}
.dpad .left{left:2px;top:30px;width:26px;height:28px;border-radius:13px 4px 4px 13px;}
.dpad .right{right:2px;top:30px;width:26px;height:28px;border-radius:4px 13px 13px 4px;}
.dpad .ok{left:30px;top:30px;width:28px;height:28px;border-radius:50%;background:#454b54;font-size:9px;}

.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;}
.grid.tools{grid-template-columns:repeat(7,1fr);margin-bottom:6px;}
.key{position:relative;border:none;border-radius:9px;padding:6px 2px 4px;cursor:pointer;color:var(--key-fn-ink);background:var(--key-fn);font-size:13.5px;font-weight:600;min-height:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;transition:transform .05s;}
.key:active{transform:scale(.94);}
.key .shiftlbl{position:absolute;top:1px;left:5px;font-size:8.5px;color:var(--shift);font-weight:700;}
.key .alphalbl{position:absolute;top:1px;right:5px;font-size:8.5px;color:var(--alpha);font-weight:700;}
.key.num{background:var(--key-num);color:var(--key-num-ink);font-size:16px;}
.key.op{background:var(--key-op);color:var(--key-op-ink);font-size:16px;}
.key.shift{background:var(--shift);color:#2a1600;}
.key.alpha{background:var(--alpha);color:#062018;}
.key.del{background:var(--del);color:#fff;}
.key.ac{background:var(--ac);color:#fff;}
.key.wide{grid-column:span 2;}
.key.on{outline:2px solid #fff;}
.key.ghost{background:#2f333a;}
.spacer{visibility:hidden;}

.numblock{margin-top:7px;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;}

/* modal */
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;}
.modalbg.show{display:flex;}
.modal{background:var(--card);color:var(--ink);border-radius:14px;padding:18px;max-width:480px;width:100%;max-height:82vh;overflow-y:auto;box-shadow:var(--shadow);}
.modal h2{margin:0 0 4px;font-size:16px;}
.modal p.desc{color:var(--sub);font-size:12.5px;margin:0 0 12px;}
.modal .row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.modal .row label{font-size:12.5px;color:var(--sub);display:block;margin-bottom:3px;}
.modal input,.modal select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--ink);font-size:14px;width:100%;}
.modal .grid-choice{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.modal .choice{border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;font-size:13px;background:var(--bg);}
.modal .choice:hover{border-color:var(--accent);}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}
.btn{border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;}
.btn.primary{background:var(--accent);color:#fff;}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
.steplist{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.stepitem{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;}
.stepitem b{display:block;font-size:11px;color:var(--sub);margin-bottom:3px;font-weight:600;}
.matgrid{display:inline-grid;gap:4px;margin:6px 0;}
.matgrid input{width:56px;text-align:center;padding:5px;}
.graphwrap{width:100%;max-width:380px;margin:8px auto;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px;}
.const-list,.conv-list{display:flex;flex-direction:column;gap:4px;max-height:340px;overflow-y:auto;}
.const-item,.conv-item{display:flex;justify-content:space-between;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:12.5px;}
.const-item:hover,.conv-item:hover{border-color:var(--accent);}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#20232a;color:#eef1f5;padding:9px 16px;border-radius:8px;font-size:13px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:var(--shadow);}
.toast.show{opacity:1;}
@media (max-width:420px){
  .wrap{padding:12px 8px 30px;}
  .grid,.grid.tools,.numblock{gap:5px;}
  .key{font-size:12px;padding:5px 1px 4px;min-height:34px;}
  .key.num{font-size:14px;}
  .exprline{font-size:19px;}
  .resultline{font-size:21px;}
  .brand-row{font-size:10px;}
  .brand-row span{display:none;}
}
/* ---- Phone app mode: the calculator fills exactly one screen, no page scroll ---- */
@media (max-width:680px){
  html,body{height:100%;}
  body{overflow:hidden;}
  .wrap{
    max-width:520px;margin:0 auto;padding:8px;box-sizing:border-box;
    display:flex;flex-direction:column;overflow:hidden;
    height:100vh;height:100dvh;
  }
  .layout{display:block;flex:1;min-height:0;}
  .hist-col{display:none;}
  .calc-col{height:100%;display:flex;flex-direction:column;min-height:0;}
  .device{flex:0 0 auto;padding:9px 9px 11px;border-radius:16px;}
  .padwrap{flex:1;min-height:0;margin-top:7px;display:flex;flex-direction:column;gap:5px;overflow-y:auto;}
  .ctrlcluster{flex:0 0 auto;margin-bottom:0;}
  .grid.tools{flex:0 0 auto;margin-bottom:0;}
  .grid{flex:1 1 0;min-height:230px;grid-auto-rows:1fr;}
  .grid.tools{min-height:0;}
  .numblock{flex:1.15 1 0;min-height:130px;grid-template-rows:repeat(4,1fr);margin-top:0;}
  .key{min-height:0;}
  .exprline{min-height:0;}
}
@media (max-width:680px) and (max-height:700px){
  .device{padding:6px 8px 8px;}
  .screen{min-height:0;padding:6px 8px;}
  .brand-row{padding:0 2px 4px;}
  .status-row{margin-bottom:1px;}
  .exprline{font-size:15px;padding:2px;min-height:0;}
  .resultline{font-size:16px;min-height:0;padding:1px 2px;}
  .hintline{font-size:9.5px;}
  .key{font-size:10.5px;}
  .key .shiftlbl,.key .alphalbl{display:none;}
  .dpad{width:64px;height:64px;}
  .dpad .up,.dpad .down{left:19px;width:24px;height:20px;}
  .dpad .left,.dpad .right{top:19px;height:24px;width:20px;}
  .dpad .ok{left:19px;top:19px;width:24px;height:24px;font-size:7.5px;}
  .grid{min-height:170px;}
  .numblock{min-height:100px;}
  .padwrap{gap:3px;margin-top:4px;}
  .ctrlcluster{gap:4px;margin-bottom:3px;}
  .grid.tools{gap:4px;min-height:0;}
}
@media (max-width:680px) and (max-height:420px){
  .grid{min-height:120px;}
  .numblock{min-height:74px;}
  .grid.tools{min-height:0;}
  .key{font-size:9.5px;padding:2px 1px;}
  .dpad{width:52px;height:52px;}
  .dpad .up,.dpad .down{left:15px;width:22px;height:16px;}
  .dpad .left,.dpad .right{top:15px;height:22px;width:16px;}
  .dpad .ok{left:15px;top:15px;width:22px;height:22px;font-size:7px;}
  .ctrlcluster .key{font-size:10px;}
}
</style>

<script>
(function(){
'use strict';
const math = window.math;
const mathFrac = math.create(math.all);
mathFrac.config({number:'Fraction'});

/* ================= Natural-display editor: tree + cursor zipper ================= */
let uid=1;
function mkArr(){const a=[];a.__id='a'+(uid++);return a;}
function newTemplate(t){
  const node={t,id:'n'+(uid++)};
  if(t==='frac'){node.num=mkArr();node.den=mkArr();node.fields=['num','den'];}
  else if(t==='sqrt'){node.body=mkArr();node.fields=['body'];}
  else if(t==='nroot'){node.n=mkArr();node.body=mkArr();node.fields=['n','body'];}
  else if(t==='pow'){node.base=mkArr();node.exp=mkArr();node.fields=['base','exp'];}
  else if(t==='logb'){node.base=mkArr();node.body=mkArr();node.fields=['base','body'];}
  else if(t==='deriv'){node.body=mkArr();node.at=mkArr();node.fields=['body','at'];}
  else if(t==='integ'){node.body=mkArr();node.lo=mkArr();node.hi=mkArr();node.fields=['lo','hi','body'];}
  else if(t==='sum'||t==='prod'){node.body=mkArr();node.lo=mkArr();node.hi=mkArr();node.fields=['lo','hi','body'];}
  return node;
}
function tagArrays(arr){
  arr.__id='a'+(uid++);
  for(const node of arr){ if(node.fields){ for(const f of node.fields) tagArrays(node[f]); } }
}

function createEditor(){
  const root=mkArr();
  let cursor={arr:root,i:0};
  const parentInfo=new Map();
  function reindex(){
    parentInfo.clear();
    (function walk(arr){
      for(let k=0;k<arr.length;k++){
        const node=arr[k];
        if(node.fields){
          for(const f of node.fields){
            parentInfo.set(node[f].__id,{parentArr:arr,index:k,field:f,node});
            walk(node[f]);
          }
        }
      }
    })(root);
  }
  reindex();
  function insert(ch,opts){ const n={t:'n',v:ch}; if(opts&&opts.isVar)n.var=true; cursor.arr.splice(cursor.i,0,n); cursor.i++; }
  function insertText(s){ for(const c of s) insert(c); }
  function insertTemplate(type,presetFields){
    const node=newTemplate(type);
    if(presetFields){ for(const k in presetFields){ node[k].push({t:'n',v:presetFields[k]}); } }
    cursor.arr.splice(cursor.i,0,node); cursor.i++;
    reindex();
    let ff=node.fields[0];
    if(presetFields){
      for(const f of node.fields){ if(!presetFields[f]){ ff=f; break; } }
    }
    cursor={arr:node[ff],i:0};
  }
  function insertPowFixedBase(baseStr){
    const node=newTemplate('pow');
    node.base.push({t:'n',v:baseStr});
    cursor.arr.splice(cursor.i,0,node); cursor.i++;
    reindex();
    cursor={arr:node.exp,i:0};
  }
  function insertPow(fixedExp){
    let baseArr=mkArr();
    if(cursor.i>0){
      const prev=cursor.arr[cursor.i-1];
      if(!(prev.t==='n'&&/[0-9.]/.test(prev.v))){
        if(prev.t==='n'&&prev.v===')'){
          let depth=0,j=cursor.i-1;
          for(;j>=0;j--){ const nd=cursor.arr[j];
            if(nd.t==='n'&&nd.v===')')depth++;
            else if(nd.t==='n'&&nd.v==='('){depth--; if(depth===0)break;}
          }
          const taken=cursor.arr.splice(j,cursor.i-j); cursor.i=j; baseArr.push(...taken);
        } else {
          const taken=cursor.arr.splice(cursor.i-1,1); cursor.i--; baseArr.push(...taken);
        }
      } else {
        let j=cursor.i-1;
        while(j>=0&&cursor.arr[j].t==='n'&&/[0-9.]/.test(cursor.arr[j].v)) j--;
        j++;
        const taken=cursor.arr.splice(j,cursor.i-j); cursor.i=j; baseArr.push(...taken);
      }
    }
    const node=newTemplate('pow');
    node.base=baseArr; node.fields=['base','exp'];
    cursor.arr.splice(cursor.i,0,node); cursor.i++;
    reindex();
    if(fixedExp!==undefined){ node.exp.push({t:'n',v:fixedExp}); reindex(); }
    else cursor={arr:node.exp,i:0};
  }
  function backspace(){
    if(cursor.i>0){ cursor.arr.splice(cursor.i-1,1); cursor.i--; reindex(); return; }
    const info=parentInfo.get(cursor.arr.__id);
    if(!info) return;
    cursor={arr:info.parentArr,i:info.index};
  }
  function moveRight(){
    if(cursor.i<cursor.arr.length){
      const node=cursor.arr[cursor.i];
      if(node.fields){ const f=node.fields[0]; cursor={arr:node[f],i:0}; }
      else cursor.i++;
      return;
    }
    const info=parentInfo.get(cursor.arr.__id);
    if(!info) return;
    const fi=info.node.fields.indexOf(info.field);
    if(fi<info.node.fields.length-1){ const nf=info.node.fields[fi+1]; cursor={arr:info.node[nf],i:0}; }
    else cursor={arr:info.parentArr,i:info.index+1};
  }
  function moveLeft(){
    if(cursor.i>0){
      const node=cursor.arr[cursor.i-1];
      if(node.fields){ const f=node.fields[node.fields.length-1]; cursor={arr:node[f],i:node[f].length}; }
      else cursor.i--;
      return;
    }
    const info=parentInfo.get(cursor.arr.__id);
    if(!info) return;
    const fi=info.node.fields.indexOf(info.field);
    if(fi>0){ const pf=info.node.fields[fi-1]; cursor={arr:info.node[pf],i:info.node[pf].length}; }
    else cursor={arr:info.parentArr,i:info.index};
  }
  function moveVert(dir){
    const info=parentInfo.get(cursor.arr.__id);
    if(!info) return;
    const node=info.node;
    if(node.t==='frac'){
      const target=info.field==='num'?'den':'num';
      if((dir<0&&info.field==='den')||(dir>0&&info.field==='num')) cursor={arr:node[target],i:0};
    } else if(node.t==='nroot'){
      const target=info.field==='n'?'body':'n';
      cursor={arr:node[target],i:0};
    }
  }
  function serializeArr(arr){
    let s='';
    for(const node of arr){
      if(node.t==='n') s+=node.v;
      else if(node.t==='frac') s+=`((${serializeArr(node.num)||'0'})/(${serializeArr(node.den)||'1'}))`;
      else if(node.t==='sqrt') s+=`sqrt(${serializeArr(node.body)||'0'})`;
      else if(node.t==='nroot') s+=`nthRoot(${serializeArr(node.body)||'0'},${serializeArr(node.n)||'2'})`;
      else if(node.t==='pow') s+=`((${serializeArr(node.base)||'0'})^(${serializeArr(node.exp)||'0'}))`;
      else if(node.t==='logb') s+=`log(${serializeArr(node.body)||'0'},${serializeArr(node.base)||'10'})`;
      else if(node.t==='deriv') s+=`@@DERIV(${serializeArr(node.body)||'0'};${serializeArr(node.at)||'0'})@@`;
      else if(node.t==='integ') s+=`@@INTEG(${serializeArr(node.body)||'0'};${serializeArr(node.lo)||'0'};${serializeArr(node.hi)||'1'})@@`;
      else if(node.t==='sum') s+=`@@SUM(${serializeArr(node.body)||'0'};${serializeArr(node.lo)||'1'};${serializeArr(node.hi)||'1'})@@`;
      else if(node.t==='prod') s+=`@@PROD(${serializeArr(node.body)||'0'};${serializeArr(node.lo)||'1'};${serializeArr(node.hi)||'1'})@@`;
    }
    return s;
  }
  function serializeDisplayArr(arr){
    let s='';
    for(const node of arr){
      if(node.t==='n') s+=node.v;
      else if(node.t==='frac') s+=`(${serializeDisplayArr(node.num)}/${serializeDisplayArr(node.den)})`;
      else if(node.t==='sqrt') s+=`√(${serializeDisplayArr(node.body)})`;
      else if(node.t==='nroot') s+=`${serializeDisplayArr(node.n)}√(${serializeDisplayArr(node.body)})`;
      else if(node.t==='pow') s+=`${serializeDisplayArr(node.base)}^(${serializeDisplayArr(node.exp)})`;
      else if(node.t==='logb') s+=`log_${serializeDisplayArr(node.base)}(${serializeDisplayArr(node.body)})`;
      else if(node.t==='deriv') s+=`d/dx(${serializeDisplayArr(node.body)})|X=${serializeDisplayArr(node.at)}`;
      else if(node.t==='integ') s+=`∫[${serializeDisplayArr(node.lo)},${serializeDisplayArr(node.hi)}](${serializeDisplayArr(node.body)})dX`;
      else if(node.t==='sum') s+=`Σ(X=${serializeDisplayArr(node.lo)}→${serializeDisplayArr(node.hi)})(${serializeDisplayArr(node.body)})`;
      else if(node.t==='prod') s+=`Π(X=${serializeDisplayArr(node.lo)}→${serializeDisplayArr(node.hi)})(${serializeDisplayArr(node.body)})`;
    }
    return s;
  }
  function usedVars(){
    const set=new Set();
    (function walk(arr){ for(const n of arr){ if(n.t==='n'&&n.var) set.add(n.v); if(n.fields){ for(const f of n.fields) walk(n[f]); } } })(root);
    return [...set];
  }
  return {
    get cursor(){return cursor;}, get root(){return root;},
    insert,insertText,insertTemplate,insertPow,insertPowFixedBase,backspace,moveRight,moveLeft,moveVert,
    serialize:()=>serializeArr(root),
    serializeDisplay:()=>serializeDisplayArr(root),
    usedVars,
    reindex,
    isEmpty:()=>root.length===0,
    clear:()=>{root.length=0;cursor={arr:root,i:0};reindex();},
    setCursor:(a,i)=>{cursor={arr:a,i};},
    loadRoot:(plain)=>{
      const cloned=JSON.parse(JSON.stringify(plain));
      tagArrays(cloned);
      root.length=0; root.push(...cloned);
      cursor={arr:root,i:root.length};
      reindex();
    },
    snapshot:()=>JSON.parse(JSON.stringify(root)),
  };
}

function caretEl(){ const c=document.createElement('span'); c.className='caret'; return c; }
function emptyBox(){ const b=document.createElement('span'); b.className='mempty'; return b; }

function renderArr(arr,isRoot){
  const cur=ed.cursor;
  const row=document.createElement('span'); row.className='mrow';
  if(arr.length===0){
    if(arr===cur.arr) row.appendChild(caretEl());
    if(!isRoot) row.appendChild(emptyBox());
    return row;
  }
  for(let k=0;k<=arr.length;k++){
    if(arr===cur.arr && cur.i===k) row.appendChild(caretEl());
    if(k<arr.length){
      const leaf=renderNode(arr[k]);
      attachClick(leaf, arr, k);
      row.appendChild(leaf);
    }
  }
  return row;
}
function attachClick(el,arr,k){
  el.addEventListener('click',(e)=>{
    e.stopPropagation();
    const rect=el.getBoundingClientRect();
    const before=(e.clientX-rect.left) < rect.width/2;
    ed.setCursor(arr, before?k:k+1);
    renderAll();
  });
}
function renderNode(node){
  if(node.t==='n'){
    const s=document.createElement('span');
    s.textContent=node.v;
    if(node.var) s.className='mvar';
    return s;
  }
  if(node.t==='frac'){
    const w=document.createElement('span'); w.className='mfrac';
    const num=document.createElement('span'); num.className='num'; num.appendChild(renderArr(node.num));
    const bar=document.createElement('span'); bar.className='bar';
    const den=document.createElement('span'); den.className='den'; den.appendChild(renderArr(node.den));
    w.append(num,bar,den); return w;
  }
  if(node.t==='sqrt'){
    const w=document.createElement('span'); w.className='msqrt';
    const rad=document.createElement('span'); rad.className='rad'; rad.textContent='√';
    const body=document.createElement('span'); body.className='body'; body.appendChild(renderArr(node.body));
    w.append(rad,body); return w;
  }
  if(node.t==='nroot'){
    const w=document.createElement('span'); w.className='mnroot';
    const idx=document.createElement('span'); idx.className='idx'; idx.appendChild(renderArr(node.n));
    const rad=document.createElement('span'); rad.className='rad'; rad.textContent='√';
    const body=document.createElement('span'); body.className='body'; body.appendChild(renderArr(node.body));
    w.append(idx,rad,body); return w;
  }
  if(node.t==='pow'){
    const w=document.createElement('span'); w.className='mpow';
    const base=document.createElement('span'); base.appendChild(renderArr(node.base));
    const exp=document.createElement('span'); exp.className='exp'; exp.appendChild(renderArr(node.exp));
    w.append(base,exp); return w;
  }
  if(node.t==='logb'){
    const w=document.createElement('span'); w.className='mlog';
    const lbl=document.createElement('span'); lbl.textContent='log';
    const base=document.createElement('span'); base.className='base'; base.appendChild(renderArr(node.base));
    w.append(lbl,base,'(',renderArr(node.body),')'); return w;
  }
  if(node.t==='deriv'){
    const w=document.createElement('span');
    w.append('d/dx(', renderArr(node.body), ')|ₓ₌', renderArr(node.at)); return w;
  }
  if(node.t==='integ'){
    const w=document.createElement('span');
    w.append('∫[', renderArr(node.lo), ',', renderArr(node.hi), '](', renderArr(node.body), ')dX'); return w;
  }
  if(node.t==='sum'||node.t==='prod'){
    const w=document.createElement('span');
    const sym=node.t==='sum'?'Σ':'Π';
    w.append(sym+'(X=', renderArr(node.lo), '→', renderArr(node.hi), ')(', renderArr(node.body), ')');
    return w;
  }
  const s=document.createElement('span'); return s;
}

/* ================= Preprocess & evaluate ================= */
function preprocess(raw){
  return raw.split('×').join('*').split('÷').join('/').split('π').join('pi')
    .split('∞').join('Infinity').split('%').join('/100');
}
function splitTopLevel(s,sep){
  sep=sep||',';
  let depth=0,parts=[],cur='';
  for(const c of s){
    if(c==='(') depth++;
    if(c===')') depth--;
    if(c===sep && depth===0){ parts.push(cur); cur=''; }
    else cur+=c;
  }
  parts.push(cur);
  return parts;
}
function topLevelEqIndex(s){
  let depth=0;
  for(let k=0;k<s.length;k++){
    if(s[k]==='(') depth++;
    else if(s[k]===')') depth--;
    else if(s[k]==='=' && depth===0) return k;
  }
  return -1;
}
function isComplexLike(x){ return x && typeof x==='object' && x.type==='Complex'; }
function buildScope(overrides){
  const toRad=x=>angleMode==='DEG'?x*Math.PI/180:angleMode==='GRAD'?x*Math.PI/200:x;
  const fromRad=x=>angleMode==='DEG'?x*180/Math.PI:angleMode==='GRAD'?x*200/Math.PI:x;
  const scope={
    sin:x=>isComplexLike(x)?math.sin(x):Math.sin(toRad(x)),
    cos:x=>isComplexLike(x)?math.cos(x):Math.cos(toRad(x)),
    tan:x=>isComplexLike(x)?math.tan(x):Math.tan(toRad(x)),
    asin:x=>isComplexLike(x)?math.asin(x):fromRad(Math.asin(x)),
    acos:x=>isComplexLike(x)?math.acos(x):fromRad(Math.acos(x)),
    atan:x=>isComplexLike(x)?math.atan(x):fromRad(Math.atan(x)),
    ln:x=>math.log(x),
    RanInt:(a,b)=>{ a=Number(a); b=Number(b); return Math.floor(Math.random()*(b-a+1))+a; },
    A:memory.A,B:memory.B,C:memory.C,D:memory.D,E:memory.E,F:memory.F,
    X:memory.X,Y:memory.Y,M:memory.M,
    Ans:ans, PreAns:preAns,
  };
  if(overrides) Object.assign(scope,overrides);
  return scope;
}
function resolveSpecials(s,scope){
  let guard=0;
  const reDeriv=/@@DERIV\(((?:[^@]|@(?!@))*?);((?:[^@]|@(?!@))*?)\)@@/;
  const reSum=/@@SUM\(((?:[^@]|@(?!@))*?);((?:[^@]|@(?!@))*?);((?:[^@]|@(?!@))*?)\)@@/;
  const reProd=/@@PROD\(((?:[^@]|@(?!@))*?);((?:[^@]|@(?!@))*?);((?:[^@]|@(?!@))*?)\)@@/;
  const reInteg=/@@INTEG\(((?:[^@]|@(?!@))*?);((?:[^@]|@(?!@))*?);((?:[^@]|@(?!@))*?)\)@@/;
  while(/@@/.test(s) && guard++<25){
    if(reInteg.test(s)){
      s=s.replace(reInteg,(m,bodyExpr,loExpr,hiExpr)=>{
        const lo=Number(math.evaluate(loExpr,scope)), hi=Number(math.evaluate(hiExpr,scope));
        const N=400; const h=(hi-lo)/N;
        const f=x=>Number(math.evaluate(bodyExpr,Object.assign({},scope,{X:x})));
        let total=f(lo)+f(hi);
        for(let k=1;k<N;k++) total += f(lo+k*h) * (k%2===0?2:4);
        const integral = total*h/3;
        return '('+integral+')';
      });
    } else if(reDeriv.test(s)){
      s=s.replace(reDeriv,(m,bodyExpr,atExpr)=>{
        const atVal=Number(math.evaluate(atExpr,scope));
        const h=1e-6*(Math.abs(atVal)+1);
        const f=x=>Number(math.evaluate(bodyExpr,Object.assign({},scope,{X:x})));
        const d=(f(atVal+h)-f(atVal-h))/(2*h);
        return '('+d+')';
      });
    } else if(reSum.test(s)){
      s=s.replace(reSum,(m,bodyExpr,loExpr,hiExpr)=>{
        const lo=Math.round(Number(math.evaluate(loExpr,scope)));
        const hi=Math.round(Number(math.evaluate(hiExpr,scope)));
        let total=0;
        for(let x=lo;x<=hi;x++) total+=Number(math.evaluate(bodyExpr,Object.assign({},scope,{X:x})));
        return '('+total+')';
      });
    } else if(reProd.test(s)){
      s=s.replace(reProd,(m,bodyExpr,loExpr,hiExpr)=>{
        const lo=Math.round(Number(math.evaluate(loExpr,scope)));
        const hi=Math.round(Number(math.evaluate(hiExpr,scope)));
        let total=1;
        for(let x=lo;x<=hi;x++) total*=Number(math.evaluate(bodyExpr,Object.assign({},scope,{X:x})));
        return '('+total+')';
      });
    } else break;
  }
  return s;
}
function angleUnitSuffix(){ return angleMode==='DEG'?'°':angleMode==='GRAD'?' grad':' rad'; }
function humanizeError(e){
  const m=(e&&e.message)||String(e);
  if(/Undefined symbol/.test(m)) return 'Lỗi: ký hiệu không xác định';
  if(/Unexpected/.test(m) || /Value expected/.test(m) || /Parenthesis/.test(m)) return 'Lỗi cú pháp (Syntax ERROR)';
  if(/division/i.test(m) || /divide/i.test(m)) return 'Lỗi: chia cho 0';
  return 'Math ERROR';
}

function generalEvaluate(raw){
  if(!raw||!raw.trim()) return {error:'Biểu thức trống'};
  let s=preprocess(raw);
  const scope=buildScope();
  try{ s=resolveSpecials(s,scope); }catch(e){ return {error:'Lỗi biểu thức đặc biệt (d/dx, Σ, Π)'}; }

  const trimmed=s.trim();
  let m;
  if((m=/^Pol\((.*)\)$/s.exec(trimmed))){
    try{
      const parts=splitTopLevel(m[1]);
      const x=Number(math.evaluate(parts[0],scope)), y=Number(math.evaluate(parts[1],scope));
      const r=Math.hypot(x,y);
      let th=Math.atan2(y,x);
      th=angleMode==='DEG'?th*180/Math.PI:angleMode==='GRAD'?th*200/Math.PI:th;
      memory.E=r; memory.F=th;
      return {special:true, text:`r = ${fmtNum(r)}    θ = ${fmtNum(th)}${angleUnitSuffix()}`, value:r};
    }catch(e){ return {error:'Lỗi Pol('} ; }
  }
  if((m=/^Rec\((.*)\)$/s.exec(trimmed))){
    try{
      const parts=splitTopLevel(m[1]);
      const r=Number(math.evaluate(parts[0],scope));
      const th=Number(math.evaluate(parts[1],scope));
      const thr=angleMode==='DEG'?th*Math.PI/180:angleMode==='GRAD'?th*Math.PI/200:th;
      const x=r*Math.cos(thr), y=r*Math.sin(thr);
      memory.E=x; memory.F=y;
      return {special:true, text:`x = ${fmtNum(x)}    y = ${fmtNum(y)}`, value:x};
    }catch(e){ return {error:'Lỗi Rec('} ; }
  }

  if(fracAuto && calcMode!=='MATRIX'){
    try{
      const val=mathFrac.evaluate(s,Object.assign({},scope));
      if(val && val.type==='Fraction') return {value:val, isFraction:true};
      if(typeof val==='number') return {value:val};
      if(val && val.type==='Complex') return {value:val, isComplex:true};
      if(val && val.type==='Matrix') return {value:val, isMatrix:true};
    }catch(e){ /* fall through */ }
  }
  try{
    const val=math.evaluate(s,scope);
    if(val && val.type==='Matrix') return {value:val, isMatrix:true};
    if(val && val.type==='Complex') return {value:val, isComplex:true};
    if(typeof val==='boolean') return {value:val?1:0};
    if(val===undefined) return {error:'Biểu thức chưa đầy đủ'};
    return {value:val};
  }catch(e){ return {error:humanizeError(e)}; }
}

/* ================= Formatting ================= */
function trimTrailingZeros(s){
  if(s.indexOf('.')===-1) return s;
  return s.replace(/0+$/,'').replace(/\.$/,'');
}
function fmtNum(x){
  if(x===null||x===undefined) return 'Math ERROR';
  x=Number(x);
  if(Number.isNaN(x)) return 'Math ERROR';
  if(!isFinite(x)) return x>0?'∞':'−∞';
  if(x===0) return '0';
  if(normMode==='NORM'){
    if(Math.abs(x)>=1e10 || Math.abs(x)<1e-9){
      return x.toExponential(6).replace('e+','×10^').replace('e-','×10^−');
    }
    const r=+x.toPrecision(10);
    return trimTrailingZeros(String(r));
  }
  if(normMode.indexOf('FIX')===0){
    const n=parseInt(normMode.slice(3),10);
    return x.toFixed(n);
  }
  if(normMode.indexOf('SCI')===0){
    const n=parseInt(normMode.slice(3),10);
    return x.toExponential(n).replace('e+','×10^').replace('e-','×10^−');
  }
  return trimTrailingZeros(String(+x.toPrecision(10)));
}
function fmtComplex(c){
  const re=c.re, im=c.im;
  if(Math.abs(im)<1e-12) return fmtNum(re);
  if(Math.abs(re)<1e-12) return (im>=0?'':'−')+fmtNum(Math.abs(im))+'i';
  return fmtNum(re)+(im>=0?' + ':' − ')+fmtNum(Math.abs(im))+'i';
}
function fmtFraction(f,mixed){
  try{
    const str=f.toFraction(!!mixed);
    return str;
  }catch(e){ return fmtNum(f.valueOf()); }
}
function fmtMatrix(m){
  const arr=m.toArray();
  return arr.map(row=>{
    if(Array.isArray(row)) return '[ '+row.map(v=>fmtNum(v)).join('  ')+' ]';
    return fmtNum(row);
  }).join('\n');
}
function formatResultObj(res){
  if(res.isFraction){
    if(lastShowDecimal) return fmtNum(res.value.valueOf());
    return fmtFraction(res.value,false);
  }
  if(res.isComplex) return fmtComplex(res.value);
  if(res.isMatrix) return fmtMatrix(res.value);
  return fmtNum(res.value);
}
function extractNumericAns(res){
  if(res.isFraction) return res.value.valueOf();
  if(res.isComplex) return res.value.re;
  if(res.isMatrix) return 0;
  if(typeof res.value==='number') return res.value;
  return Number(res.value)||0;
}

/* ================= SOLVE ================= */
function fOf(exprF,x,scope){ return Number(math.evaluate(exprF,Object.assign({},scope,{X:x}))); }
function fitPoly2(exprF,scope){
  try{
    const f0=fOf(exprF,0,scope), f1=fOf(exprF,1,scope), fm1=fOf(exprF,-1,scope), f2=fOf(exprF,2,scope);
    if([f0,f1,fm1,f2].some(v=>!isFinite(v))) return null;
    const c=f0, a=(f1+fm1)/2-f0, b=(f1-fm1)/2;
    const pred2=a*4+b*2+c;
    if(Math.abs(pred2-f2) > 1e-6*(Math.abs(f2)+1)) return null;
    return {a:niceRound(a),b:niceRound(b),c:niceRound(c)};
  }catch(e){ return null; }
}
function niceRound(x){ const r=Math.round(x*1e8)/1e8; return Object.is(r,-0)?0:r; }
function newtonSolve(exprF,scope,x0){
  let x=x0, steps=[];
  for(let i=0;i<80;i++){
    let fx; try{ fx=fOf(exprF,x,scope); }catch(e){ return {error:'Không tính được tại X='+fmtNum(x)}; }
    if(!isFinite(fx)) return {error:'Biểu thức không xác định hoặc phân kỳ', steps};
    steps.push({i,x,fx});
    if(Math.abs(fx)<1e-10) return {x,steps};
    const h=1e-6*(Math.abs(x)+1);
    const dfx=(fOf(exprF,x+h,scope)-fOf(exprF,x-h,scope))/(2*h);
    if(Math.abs(dfx)<1e-12) return {error:'Đạo hàm ≈ 0 tại điểm này — thử giá trị X ban đầu khác', steps};
    const x1=x-fx/dfx;
    if(!isFinite(x1)) return {error:'Không hội tụ — thử giá trị X ban đầu khác', steps};
    if(Math.abs(x1-x)<1e-12){ steps.push({i:i+1,x:x1,fx:fOf(exprF,x1,scope)}); return {x:x1,steps}; }
    x=x1;
  }
  return {x,steps,warn:'Đạt giới hạn số vòng lặp'};
}
function buildLinSteps(b,c){
  const steps=[];
  steps.push(`Phương trình bậc nhất: ${fmtNum(b)}X + ${fmtNum(c)} = 0`);
  if(Math.abs(b)<1e-9){
    if(Math.abs(c)<1e-9){ steps.push('0 = 0 đúng với mọi X'); return {steps, answer:'Vô số nghiệm (đúng với mọi X)'}; }
    steps.push('0·X = '+fmtNum(-c)+' — vô lý'); return {steps, answer:'Vô nghiệm'};
  }
  steps.push(`X = −(${fmtNum(c)}) / ${fmtNum(b)}`);
  const x=-c/b;
  steps.push(`X = ${fmtNum(x)}`);
  return {steps, answer:'X = '+fmtNum(x), roots:[x]};
}
function buildQuadSteps(a,b,c){
  if(Math.abs(a)<1e-9) return buildLinSteps(b,c);
  const steps=[];
  steps.push(`Phương trình bậc hai: ${fmtNum(a)}X² + ${fmtNum(b)}X + ${fmtNum(c)} = 0`);
  const D=b*b-4*a*c;
  steps.push(`Δ = b² − 4ac = (${fmtNum(b)})² − 4·(${fmtNum(a)})·(${fmtNum(c)}) = ${fmtNum(D)}`);
  if(D>1e-9){
    const sq=Math.sqrt(D);
    const x1=(-b+sq)/(2*a), x2=(-b-sq)/(2*a);
    steps.push(`Δ > 0 ⇒ phương trình có hai nghiệm phân biệt`);
    steps.push(`X₁ = (−b + √Δ) / 2a = (${fmtNum(-b)} + √${fmtNum(D)}) / ${fmtNum(2*a)} = ${fmtNum(x1)}`);
    steps.push(`X₂ = (−b − √Δ) / 2a = ${fmtNum(x2)}`);
    return {steps, answer:`X₁ = ${fmtNum(x1)},  X₂ = ${fmtNum(x2)}`, roots:[x1,x2]};
  } else if(Math.abs(D)<=1e-9){
    const x0=-b/(2*a);
    steps.push('Δ = 0 ⇒ phương trình có nghiệm kép');
    steps.push(`X = −b / 2a = ${fmtNum(-b)} / ${fmtNum(2*a)} = ${fmtNum(x0)}`);
    return {steps, answer:'X = '+fmtNum(x0)+' (nghiệm kép)', roots:[x0]};
  } else {
    const re=-b/(2*a), im=Math.sqrt(-D)/(2*a);
    steps.push('Δ < 0 ⇒ phương trình vô nghiệm thực, có hai nghiệm phức');
    steps.push(`X = (−b ± i√|Δ|) / 2a = ${fmtNum(re)} ± ${fmtNum(Math.abs(im))}i`);
    return {steps, answer:`X₁ = ${fmtNum(re)} + ${fmtNum(Math.abs(im))}i,  X₂ = ${fmtNum(re)} − ${fmtNum(Math.abs(im))}i`};
  }
}
function runSolve(){
  const raw=ed.serialize();
  if(!raw.trim()){ toast('Chưa có biểu thức để giải'); return; }
  const s=preprocess(raw);
  let exprF, isEqn=false;
  const eqIdx=topLevelEqIndex(s);
  if(eqIdx>=0){ exprF=`(${s.slice(0,eqIdx)})-(${s.slice(eqIdx+1)})`; isEqn=true; }
  else exprF=s;
  if(!/X/.test(exprF)){ toast('Không tìm thấy biến X trong biểu thức (dùng phím X)'); return; }
  openModal('SOLVE — Giải phương trình',
    `<p class="desc">Giải theo X từ: <b>${escapeHtml(ed.serializeDisplay())}${isEqn?'':' = 0'}</b></p>
     <div class="row"><div style="flex:1;"><label>Giá trị X ban đầu (dò nghiệm số)</label><input id="solveGuess" type="number" value="0" step="any"></div></div>
     <div class="actions"><button class="btn ghost" id="solveCancel">Đóng</button><button class="btn primary" id="solveGo">Giải</button></div>
     <div id="solveOut"></div>`,
    (root)=>{
      root.querySelector('#solveCancel').addEventListener('click',closeModal);
      root.querySelector('#solveGo').addEventListener('click',()=>{
        const guess=Number(root.querySelector('#solveGuess').value)||0;
        const scope=buildScope();
        const out=root.querySelector('#solveOut');
        const fit=fitPoly2(exprF,scope);
        let html='';
        if(fit){
          const r=buildQuadSteps(fit.a,fit.b,fit.c);
          html+='<div class="steplist">'+r.steps.map((st,i)=>`<div class="stepitem"><b>Bước ${i+1}</b>${escapeHtml(st)}</div>`).join('')+'</div>';
          html+=`<p style="font-weight:700;">Kết quả: ${escapeHtml(r.answer)}</p>`;
          if(r.roots&&r.roots.length){
            memory.X=r.roots[0];
            html+=`<div class="actions"><button class="btn ghost" id="solveSaveX">Lưu X = ${fmtNum(r.roots[0])}</button></div>`;
          }
        } else {
          const r=newtonSolve(exprF,scope,guess);
          if(r.error){ html=`<p style="color:#c94f4f;">${escapeHtml(r.error)}</p>`; }
          else {
            html+='<div class="steplist">'+r.steps.slice(0,10).map((st,i)=>`<div class="stepitem"><b>Lặp ${i}</b>X = ${fmtNum(st.x)}, f(X) = ${fmtNum(st.fx)}</div>`).join('')+'</div>';
            html+=`<p style="font-weight:700;">X ≈ ${fmtNum(r.x)}  (L−R = ${fmtNum(fOf(exprF,r.x,scope))})</p>`;
            memory.X=r.x;
            html+=`<div class="actions"><button class="btn ghost" id="solveSaveX">Lưu X = ${fmtNum(r.x)}</button></div>`;
          }
        }
        out.innerHTML=html;
        const sx=out.querySelector('#solveSaveX');
        if(sx) sx.addEventListener('click',()=>{ toast('Đã lưu vào biến X'); saveState(); });
      });
    });
}

            if(op==='add') R=math.add(math.matrix(A),math.matrix(B));
            else if(op==='sub') R=math.subtract(math.matrix(A),math.matrix(B));
            else if(op==='mul') R=math.multiply(math.matrix(A),math.matrix(B));
            else if(op==='det'){ out.textContent='det(A) = '+fmtNum(math.det(math.matrix(A))); return; }
            else if(op==='inv') R=math.inv(math.matrix(A));
            else if(op==='trn') R=math.transpose(math.matrix(A));
            out.textContent=fmtMatrix(R);
          }catch(e){ out.textContent='Lỗi: '+(e.message||'không thể tính (kiểm tra kích thước ma trận)'); }
        }));
      }
      root.querySelector('#mBuild').addEventListener('click',build);
      build();
    });
}

/* ================= Giải tam giác (Hệ thức lượng) ================= */
function angRad(d){ return d*Math.PI/180; }
function angDeg(r){ return r*180/Math.PI; }
function rnd(x,n){ n=n==null?4:n; if(!isFinite(x)) return String(x); const f=Math.pow(10,n); return Math.round((x+Number.EPSILON)*f)/f; }
function triLawSteps(vals){
  return '<div class="steplist">'+vals.steps.map((s,i)=>`<div class="stepitem"><b>Bước ${i+1}</b>${s}</div>`).join('')+`</div><p style="font-weight:700;">${vals.answer}</p>`;
}
function openTriangleSolver(){
  openModal('Giải tam giác — Hệ thức lượng',

       <div class="choice" data-t="sss">Biết 3 cạnh (c.c.c)<br><small>a, b, c</small></div>
       <div class="choice" data-t="sas">Biết 2 cạnh, góc xen giữa (c.g.c)<br><small>b, c, Â</small></div>
       <div class="choice" data-t="asa">Biết 1 cạnh, 2 góc (g.c.g)<br><small>Â, B̂, c</small></div>
       <div class="choice" data-t="ssa">Biết 2 cạnh, góc đối<br><small>a, b, Â (trường hợp mơ hồ)</small></div>
     </div>
     <p class="desc">Góc nhập theo độ. Quy ước: cạnh a, b, c đối diện lần lượt góc A, B, C.</p>

}
function renderTriForm(root,type){
  const body=root.querySelector('#triBody');
  let html='';
  if(type==='sss') html=coefRow(['a','b','c'],['ta','tb','tc'],[3,4,5]);
  else if(type==='sas') html=coefRow(['b','c','Â (độ)'],['tb','tc','tA'],[5,7,60]);
  else if(type==='asa') html=coefRow(['Â (độ)','B̂ (độ)','c'],['tA','tB','tc'],[45,60,10]);

  html+='<div class="actions"><button class="btn primary" id="triSolve">Giải</button></div><div id="triOut"></div>';

      else if(type==='sas') out=solveTriSAS(g('tb'),g('tc'),g('tA'));
      else if(type==='asa') out=solveTriASA(g('tA'),g('tB'),g('tc'));
      else if(type==='ssa') out=solveTriSSA(g('ta'),g('tb'),g('tA'));

function solveTriSSS(a,b,c){
  if(a<=0||b<=0||c<=0||a+b<=c||b+c<=a||a+c<=b){
    return '<p style="color:#c94f4f;">Ba cạnh không lập thành tam giác (vi phạm bất đẳng thức tam giác).</p>';
  }
  const steps=[];
  const cosA=(b*b+c*c-a*a)/(2*b*c), A=angDeg(Math.acos(Math.max(-1,Math.min(1,cosA))));
  steps.push(`cos A = (b²+c²−a²)/(2bc) = ${rnd(cosA)} ⇒ A ≈ ${rnd(A,2)}°`);
  const cosB=(a*a+c*c-b*b)/(2*a*c), B=angDeg(Math.acos(Math.max(-1,Math.min(1,cosB))));
  steps.push(`cos B = (a²+c²−b²)/(2ac) = ${rnd(cosB)} ⇒ B ≈ ${rnd(B,2)}°`);
  const C=180-A-B;
  steps.push(`C = 180° − A − B ≈ ${rnd(C,2)}°`);
  const s=(a+b+c)/2, S=Math.sqrt(Math.max(0,s*(s-a)*(s-b)*(s-c)));
  steps.push(`Diện tích (công thức Heron): p=(a+b+c)/2=${rnd(s)}; S=√(p(p−a)(p−b)(p−c)) ≈ ${rnd(S)}`);
  const R=a/(2*Math.sin(angRad(A)));
  steps.push(`Bán kính đường tròn ngoại tiếp: R = a/(2sinA) ≈ ${rnd(R)}`);
  return triLawSteps({steps,answer:`A ≈ ${rnd(A,2)}°, B ≈ ${rnd(B,2)}°, C ≈ ${rnd(C,2)}°, S ≈ ${rnd(S)}`});
}
function solveTriSAS(b,c,A){
  if(b<=0||c<=0||A<=0||A>=180) return '<p style="color:#c94f4f;">Số liệu không hợp lệ (cạnh &gt; 0, 0° &lt; Â &lt; 180°).</p>';
  const steps=[];
  const a2=b*b+c*c-2*b*c*Math.cos(angRad(A)), a=Math.sqrt(Math.max(0,a2));
  steps.push(`a² = b² + c² − 2bc·cosA = ${rnd(a2)} ⇒ a ≈ ${rnd(a)}`);
  const cosB=(a*a+c*c-b*b)/(2*a*c), B=angDeg(Math.acos(Math.max(-1,Math.min(1,cosB))));
  steps.push(`cos B = (a²+c²−b²)/(2ac) ⇒ B ≈ ${rnd(B,2)}°`);
  const C=180-A-B;
  steps.push(`C = 180° − A − B ≈ ${rnd(C,2)}°`);
  const S=0.5*b*c*Math.sin(angRad(A));
  steps.push(`Diện tích: S = ½·b·c·sinA ≈ ${rnd(S)}`);
  return triLawSteps({steps,answer:`a ≈ ${rnd(a)}, B ≈ ${rnd(B,2)}°, C ≈ ${rnd(C,2)}°, S ≈ ${rnd(S)}`});
}
function solveTriASA(A,B,c){
  if(A<=0||B<=0||A+B>=180||c<=0) return '<p style="color:#c94f4f;">Số liệu không hợp lệ (Â,B̂ &gt; 0, Â+B̂ &lt; 180°, c &gt; 0).</p>';
  const steps=[];
  const C=180-A-B;
  steps.push(`C = 180° − A − B = ${rnd(C,2)}°`);
  const sinC=Math.sin(angRad(C));
  const a=c*Math.sin(angRad(A))/sinC, b=c*Math.sin(angRad(B))/sinC;
  steps.push(`Định lý sin: a/sinA = b/sinB = c/sinC ⇒ a ≈ ${rnd(a)}, b ≈ ${rnd(b)}`);
  const S=0.5*a*b*Math.sin(angRad(C));
  steps.push(`Diện tích: S = ½·a·b·sinC ≈ ${rnd(S)}`);
  return triLawSteps({steps,answer:`a ≈ ${rnd(a)}, b ≈ ${rnd(b)}, C ≈ ${rnd(C,2)}°, S ≈ ${rnd(S)}`});
}
function solveTriSSA(a,b,A){
  if(a<=0||b<=0||A<=0||A>=180) return '<p style="color:#c94f4f;">Số liệu không hợp lệ.</p>';
  const steps=[];
  const h=b*Math.sin(angRad(A));
  steps.push(`Xét h = b·sinA ≈ ${rnd(h)} để biện luận số nghiệm (so sánh với a).`);
  if(a<h-1e-9){
    steps.push(`a &lt; h ⇒ không tồn tại tam giác thỏa mãn.`);
    return triLawSteps({steps,answer:'Không có tam giác thỏa mãn'});
  }
  if(Math.abs(a-h)<1e-9){
    const B=90, C=180-A-B, c=a*Math.sin(angRad(C))/Math.sin(angRad(A));
    steps.push(`a = h ⇒ đúng 1 tam giác, vuông tại B (B = 90°). C ≈ ${rnd(C,2)}°, c ≈ ${rnd(c)}`);
    return triLawSteps({steps,answer:`B = 90°, C ≈ ${rnd(C,2)}°, c ≈ ${rnd(c)}`});
  }
  const sinB=Math.max(-1,Math.min(1,b*Math.sin(angRad(A))/a));
  if(a<b){
    const B1=angDeg(Math.asin(sinB)), B2=180-B1;
    const parts=[];
    [B1,B2].forEach((B,i)=>{
      const C=180-A-B;
      if(C>1e-9){
        const c=a*Math.sin(angRad(C))/Math.sin(angRad(A));
        parts.push(`Nghiệm ${i+1}: B ≈ ${rnd(B,2)}°, C ≈ ${rnd(C,2)}°, c ≈ ${rnd(c)}`);
      }
    });
    steps.push(`h &lt; a &lt; b ⇒ có 2 tam giác thỏa mãn:<br>`+parts.join('<br>'));
    return triLawSteps({steps,answer:'Có 2 tam giác thỏa mãn (xem các nghiệm ở trên)'});
  }
  const B=angDeg(Math.asin(sinB)), C=180-A-B, c=a*Math.sin(angRad(C))/Math.sin(angRad(A));
  steps.push(`a ≥ b ⇒ đúng 1 tam giác: B ≈ ${rnd(B,2)}°, C ≈ ${rnd(C,2)}°, c ≈ ${rnd(c)}`);
  return triLawSteps({steps,answer:`B ≈ ${rnd(B,2)}°, C ≈ ${rnd(C,2)}°, c ≈ ${rnd(c)}`});
}

/* ================= Phương trình lượng giác cơ bản ================= */
function solveTrigEq(type,m){
  const steps=[];
  if((type==='sin'||type==='cos') && Math.abs(m)>1){
    return {steps:[`|m| = ${rnd(Math.abs(m))} &gt; 1 ⇒ phương trình vô nghiệm.`],answer:'Vô nghiệm'};
  }
  if(type==='sin'){
    const a=angDeg(Math.asin(m));
    steps.push(`sin x = ${m} = sin(${rnd(a,3)}°)`);
    steps.push(`⇒ x = ${rnd(a,3)}° + k360°  hoặc  x = 180° − ${rnd(a,3)}° + k360°,  k ∈ ℤ`);
    return {steps,answer:`x = ${rnd(a,3)}° + k360°  hoặc  x = ${rnd(180-a,3)}° + k360°  (k ∈ ℤ)`};
  }
  if(type==='cos'){
    const a=angDeg(Math.acos(m));
    steps.push(`cos x = ${m} = cos(${rnd(a,3)}°)`);
    steps.push(`⇒ x = ±${rnd(a,3)}° + k360°,  k ∈ ℤ`);
    return {steps,answer:`x = ±${rnd(a,3)}° + k360°  (k ∈ ℤ)`};
  }
  if(type==='tan'){
    const a=angDeg(Math.atan(m));
    steps.push(`tan x = ${m} = tan(${rnd(a,3)}°)`);
    steps.push(`⇒ x = ${rnd(a,3)}° + k180°,  k ∈ ℤ`);
    return {steps,answer:`x = ${rnd(a,3)}° + k180°  (k ∈ ℤ)`};
  }
  if(type==='cot'){
    if(m===0){
      steps.push('cot x = 0 = cot(90°)');
      steps.push('⇒ x = 90° + k180°,  k ∈ ℤ');
      return {steps,answer:'x = 90° + k180°  (k ∈ ℤ)'};
    }
    const a=angDeg(Math.atan(1/m));
    steps.push(`cot x = ${m} ⇒ tan x = ${rnd(1/m)} = tan(${rnd(a,3)}°)`);
    steps.push(`⇒ x = ${rnd(a,3)}° + k180°,  k ∈ ℤ`);
    return {steps,answer:`x = ${rnd(a,3)}° + k180°  (k ∈ ℤ)`};
  }
}

  openModal('Giải phương trình lượng giác cơ bản',

/* ================= Vẽ đồ thị hàm số bậc hai (Oxy) ================= */
function niceStep(range,targetTicks){
  if(!(range>0)) return 1;
  const raw=range/Math.max(1,targetTicks);
  const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const norm=raw/mag;
  let step;
  if(norm<1.5) step=1; else if(norm<3) step=2; else if(norm<7) step=5; else step=10;
  return step*mag;
}
function fmtG(x){ const r=rnd(x,3); return trimTrailingZeros(String(Object.is(r,-0)?0:r)); }
function buildQuadSVG(a,b,c){
  const h=-b/(2*a), k=a*h*h+b*h+c;
  const D=b*b-4*a*c;
  let roots=null;
  if(D>1e-9){ const sq=Math.sqrt(D); roots=[(-b-sq)/(2*a),(-b+sq)/(2*a)].sort((p,q)=>p-q); }
  else if(Math.abs(D)<=1e-9){ roots=[h]; }

  let half = D>1e-9 ? Math.abs(roots[1]-roots[0])/2*1.6+0.75 : Math.max(4,Math.abs(h)*0.6+3.5);
  let minX=h-half, maxX=h+half;
  minX=Math.min(minX,-1); maxX=Math.max(maxX,1);

  const N=120, pts=[];
  let minY=Infinity,maxY=-Infinity;
  for(let i=0;i<=N;i++){
    const x=minX+(maxX-minX)*i/N;
    const y=a*x*x+b*x+c;
    pts.push([x,y]);
    if(y<minY)minY=y; if(y>maxY)maxY=y;
  }
  [k,c,0].forEach(v=>{ if(v<minY)minY=v; if(v>maxY)maxY=v; });
  const padY=(maxY-minY)*0.14||1;
  minY-=padY; maxY+=padY;
  if(minY>-0.3) minY=-0.5;
  if(maxY<0.3) maxY=0.5;

  const W=360,H=280,mL=32,mR=12,mT=14,mB=24;
  const sx=x=>mL+(x-minX)/(maxX-minX)*(W-mL-mR);
  const sy=y=>H-mB-(y-minY)/(maxY-minY)*(H-mT-mB);

  const stepX=niceStep(maxX-minX,7), stepY=niceStep(maxY-minY,6);
  let grid='', xlabels='', ylabels='';
  for(let gx=Math.ceil(minX/stepX)*stepX; gx<=maxX+1e-9; gx+=stepX){
    if(Math.abs(gx)<stepX/1e6){ continue; }
    const px=sx(gx);
    grid+=`<line x1="${px}" y1="${mT}" x2="${px}" y2="${H-mB}" stroke="var(--line)" stroke-width="1"/>`;
    xlabels+=`<text x="${px}" y="${sy(0)+13}" font-size="9" text-anchor="middle" fill="var(--sub)">${fmtG(gx)}</text>`;
  }
  for(let gy=Math.ceil(minY/stepY)*stepY; gy<=maxY+1e-9; gy+=stepY){
    if(Math.abs(gy)<stepY/1e6){ continue; }
    const py=sy(gy);
    grid+=`<line x1="${mL}" y1="${py}" x2="${W-mR}" y2="${py}" stroke="var(--line)" stroke-width="1"/>`;
    ylabels+=`<text x="${sx(0)-5}" y="${py+3}" font-size="9" text-anchor="end" fill="var(--sub)">${fmtG(gy)}</text>`;
  }

  const pathD='M'+pts.map(p=>`${sx(p[0]).toFixed(1)},${sy(p[1]).toFixed(1)}`).join(' L');
  const axisX=`<line x1="${mL}" y1="${sy(0)}" x2="${W-mR}" y2="${sy(0)}" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#arrX)"/>`;
  const axisY=`<line x1="${sx(0)}" y1="${H-mB}" x2="${sx(0)}" y2="${mT}" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#arrY)"/>`;
  const axisLbl=`<text x="${W-mR-2}" y="${sy(0)-5}" font-size="11" text-anchor="end" fill="var(--ink)">x</text><text x="${sx(0)+7}" y="${mT+9}" font-size="11" fill="var(--ink)">y</text><text x="${sx(0)-6}" y="${sy(0)+13}" font-size="9" text-anchor="end" fill="var(--sub)">O</text>`;

  const axisSym=`<line x1="${sx(h)}" y1="${mT}" x2="${sx(h)}" y2="${H-mB}" stroke="var(--accent)" stroke-width="1" stroke-dasharray="4 3" opacity=".55"/>`;

  let dots='';
  const vy = a>0 ? sy(k)-8 : sy(k)+14;
  dots+=`<circle cx="${sx(h)}" cy="${sy(k)}" r="3.2" fill="var(--accent)"/><text x="${sx(h)}" y="${vy}" font-size="10" text-anchor="middle" fill="var(--accent)" font-weight="700">I(${fmtG(h)}; ${fmtG(k)})</text>`;
  if(roots && D>1e-9){
    roots.forEach((r,i)=>{
      dots+=`<circle cx="${sx(r)}" cy="${sy(0)}" r="3" fill="#c94f4f"/><text x="${sx(r)}" y="${sy(0)+ (i===0?16:16)}" font-size="9.5" text-anchor="middle" fill="#c94f4f">${fmtG(r)}</text>`;
    });
  } else if(roots && Math.abs(D)<=1e-9){
    dots+=`<circle cx="${sx(h)}" cy="${sy(0)}" r="3" fill="#c94f4f"/>`;
  }
  if(Math.abs(c)>1e-9 || true){
    dots+=`<circle cx="${sx(0)}" cy="${sy(c)}" r="3" fill="#2e9e6b"/><text x="${sx(0)+6}" y="${sy(c)-5}" font-size="9.5" text-anchor="start" fill="#2e9e6b">(0; ${fmtG(c)})</text>`;
  }

  const svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">
    <defs>
      <marker id="arrX" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--ink)"/></marker>
      <marker id="arrY" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--ink)"/></marker>
    </defs>
    ${grid}${axisSym}${axisX}${axisY}${axisLbl}${xlabels}${ylabels}
    <path d="${pathD}" fill="none" stroke="var(--accent)" stroke-width="2.2"/>
    ${dots}
  </svg>`;

  const info=[];
  info.push(a>0?'a > 0 ⇒ parabol quay bề lõm lên trên, hàm số có giá trị nhỏ nhất':'a < 0 ⇒ parabol quay bề lõm xuống dưới, hàm số có giá trị lớn nhất');
  info.push(`Đỉnh: I(${fmtG(h)}; ${fmtG(k)})  —  ${a>0?'GTNN':'GTLN'} = ${fmtG(k)} tại x = ${fmtG(h)}`);
  info.push(`Trục đối xứng: x = ${fmtG(h)}`);
  info.push(`Δ = b² − 4ac = ${fmtG(D)}`);
  if(D>1e-9) info.push(`Giao Ox: hai điểm (${fmtG(roots[0])}; 0) và (${fmtG(roots[1])}; 0)`);
  else if(Math.abs(D)<=1e-9) info.push(`Giao Ox: tiếp xúc tại (${fmtG(h)}; 0) (nghiệm kép)`);
  else info.push('Giao Ox: không có (Δ < 0, đồ thị không cắt trục hoành)');
  info.push(`Giao Oy: (0; ${fmtG(c)})`);
  return {svg,info};
}

     <div class="actions"><button class="btn primary" id="graphDraw">Vẽ đồ thị</button></div>

function coefRow(labels,ids,vals){
  return `<div class="row">${labels.map((l,i)=>`<div style="flex:1;"><label>${l}</label><input id="${ids[i]}" type="number" step="any" value="${vals?vals[i]:0}"></div>`).join('')}</div>`;
}
function renderEqnForm(root,type){
  const body=root.querySelector('#eqnBody');
  let html='';
  if(type==='lin1') html=coefRow(['a','b'],['ca','cb'],[1,-2]);
  else if(type==='quad1') html=coefRow(['a','b','c'],['ca','cb','cc'],[1,-3,2]);
  else if(type==='lin2') html=coefRow(['a₁','b₁','c₁'],['a1','b1','c1'],[1,1,3])+coefRow(['a₂','b₂','c₂'],['a2','b2','c2'],[1,-1,1]);
  else if(type==='lin3') html=coefRow(['a₁','b₁','c₁','d₁'],['a1','b1','c1','d1'],[1,1,1,6])+coefRow(['a₂','b₂','c₂','d₂'],['a2','b2','c2','d2'],[2,-1,1,3])+coefRow(['a₃','b₃','c₃','d₃'],['a3','b3','c3','d3'],[1,2,-1,2]);
  html+='<div class="actions"><button class="btn primary" id="eqnSolve">Giải</button></div><div id="eqnOut"></div>';
  body.innerHTML=html;
  body.querySelector('#eqnSolve').addEventListener('click',()=>{
    const g=(id)=>Number(body.querySelector('#'+id).value)||0;
    let out='';
    if(type==='lin1'){ const r=buildLinSteps(g('ca'),g('cb')); out=stepsHtml(r); }
    else if(type==='quad1'){ const r=buildQuadSteps(g('ca'),g('cb'),g('cc')); out=stepsHtml(r); }
    else if(type==='lin2'){ out=solveLin2(g('a1'),g('b1'),g('c1'),g('a2'),g('b2'),g('c2')); }
    else if(type==='lin3'){ out=solveLin3(g('a1'),g('b1'),g('c1'),g('d1'),g('a2'),g('b2'),g('c2'),g('d2'),g('a3'),g('b3'),g('c3'),g('d3')); }
    body.querySelector('#eqnOut').innerHTML=out;
  });
}
function stepsHtml(r){
  return '<div class="steplist">'+r.steps.map((s,i)=>`<div class="stepitem"><b>Bước ${i+1}</b>${escapeHtml(s)}</div>`).join('')+`</div><p style="font-weight:700;">Kết quả: ${escapeHtml(r.answer)}</p>`;
}
function solveLin2(a1,b1,c1,a2,b2,c2){
  const D=a1*b2-a2*b1, Dx=c1*b2-c2*b1, Dy=a1*c2-a2*c1;
  const steps=[`D = a₁b₂ − a₂b₁ = (${a1})(${b2}) − (${a2})(${b1}) = ${fmtNum(D)}`];
  if(Math.abs(D)<1e-9){
    if(Math.abs(Dx)<1e-9&&Math.abs(Dy)<1e-9) steps.push('D = Dx = Dy = 0 ⇒ hệ có vô số nghiệm hoặc hai phương trình trùng nhau');
    else steps.push('D = 0 nhưng Dx≠0 hoặc Dy≠0 ⇒ hệ vô nghiệm');
    return stepsHtml({steps,answer:Math.abs(Dx)<1e-9&&Math.abs(Dy)<1e-9?'Vô số nghiệm':'Vô nghiệm'});
  }
  steps.push(`Dx = c₁b₂ − c₂b₁ = ${fmtNum(Dx)},  Dy = a₁c₂ − a₂c₁ = ${fmtNum(Dy)}`);
  const x=Dx/D,y=Dy/D;
  steps.push(`x = Dx/D = ${fmtNum(x)},  y = Dy/D = ${fmtNum(y)}`);
  return stepsHtml({steps,answer:`x = ${fmtNum(x)},  y = ${fmtNum(y)}`});
}
function solveLin3(a1,b1,c1,d1,a2,b2,c2,d2,a3,b3,c3,d3){
  try{
    const M=[[a1,b1,c1],[a2,b2,c2],[a3,b3,c3]];
    const D=math.det(math.matrix(M));
    const steps=[`D = det(A) = ${fmtNum(D)}`];
    if(Math.abs(D)<1e-9){
      return stepsHtml({steps:steps.concat(['D = 0 ⇒ hệ vô nghiệm hoặc vô số nghiệm (không giải được bằng Cramer)']),answer:'Không xác định (D=0)'});
    }
    const Mx=[[d1,b1,c1],[d2,b2,c2],[d3,b3,c3]];
    const My=[[a1,d1,c1],[a2,d2,c2],[a3,d3,c3]];
    const Mz=[[a1,b1,d1],[a2,b2,d2],[a3,b3,d3]];
    const Dx=math.det(math.matrix(Mx)), Dy=math.det(math.matrix(My)), Dz=math.det(math.matrix(Mz));
    const x=Dx/D,y=Dy/D,z=Dz/D;
    steps.push(`Dx = ${fmtNum(Dx)}, Dy = ${fmtNum(Dy)}, Dz = ${fmtNum(Dz)}`);
    steps.push(`x = Dx/D = ${fmtNum(x)},  y = Dy/D = ${fmtNum(y)},  z = Dz/D = ${fmtNum(z)}`);
    return stepsHtml({steps,answer:`x = ${fmtNum(x)}, y = ${fmtNum(y)}, z = ${fmtNum(z)}`});
  }catch(e){ return '<p style="color:#c94f4f;">Lỗi tính định thức.</p>'; }
}

document.addEventListener('keydown',(e)=>{
  const tag=document.activeElement&&document.activeElement.tagName;
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA') return;
  if(modalbg.classList.contains('show')) return;
  const k=e.key;
  if(/^[0-9.]$/.test(k)){ doInsertChar(k); e.preventDefault(); return; }
  if(k==='+'){ doInsertChar('+'); e.preventDefault(); return; }
  if(k==='-'){ doInsertChar('-'); e.preventDefault(); return; }
  if(k==='*'){ doInsertChar('×'); e.preventDefault(); return; }
  if(k==='/'){ doInsertChar('÷'); e.preventDefault(); return; }
  if(k==='('||k===')'){ doInsertChar(k); e.preventDefault(); return; }
  if(k===','){ doInsertChar(','); e.preventDefault(); return; }
  if(k==='^'){ doInsertPow(); e.preventDefault(); return; }
  if(k==='!'){ doInsertChar('!'); e.preventDefault(); return; }
  if(k==='x'||k==='X'){ doInsertChar('X',{isVar:true}); e.preventDefault(); return; }
  if(k==='Backspace'){ mutate(()=>{ if(justEvaluated){ ed.clear(); justEvaluated=false; } else ed.backspace(); }); e.preventDefault(); return; }
  if(k==='Delete'){ mutate(()=>ed.clear()); resultline.textContent='0'; justEvaluated=false; e.preventDefault(); return; }
  if(k==='ArrowLeft'){ ed.moveLeft(); renderAll(); e.preventDefault(); return; }
  if(k==='ArrowRight'){ ed.moveRight(); renderAll(); e.preventDefault(); return; }
  if(k==='ArrowUp'){ ed.moveVert(-1); renderAll(); e.preventDefault(); return; }
  if(k==='ArrowDown'){ ed.moveVert(1); renderAll(); e.preventDefault(); return; }
  if(k==='Enter'||k==='='){ computeAndShow(); e.preventDefault(); return; }
});

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Defender - Bảo Vệ Trái Đất</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- KaTeX Core -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@400;700&display=swap');

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #020617;
            overflow: hidden;
            margin: 0;
            user-select: none;
            height: 100vh;
            color: #f8fafc;
        }

        .space-bg {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.3;
            z-index: 0;
        }

        .atmosphere {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 15vh;
            background: linear-gradient(to top, #1e3a8a 0%, transparent 100%);
            border-top: 2px solid #3b82f6;
            box-shadow: 0 -20px 50px rgba(59, 130, 246, 0.3);
            z-index: 5;
        }

        /* Thiên thạch lớn hơn, rõ nét hơn */
        .meteor { position: absolute; top: -300px; left: 50%; transform: translateX(-50%); width: 95vw; max-width: 95vw; height: 40vh; background: radial-gradient(circle at 30% 30%, rgba(71, 85, 105, 0.9) 0%, rgba(15, 23, 42, 0.95) 100%); border: 5px solid #94a3b8; border-radius: 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(56, 189, 248, 0.2); z-index: 50; transition: top 15s linear; }

        .meteor::before {
            content: '';
            position: absolute;
            inset: 15px;
            background: rgba(0, 0, 0, 0.4); /* Lớp phủ giúp text rõ hơn */
            border-radius: inherit;
            filter: blur(5px);
            z-index: 0;
        }

        .question-container {
            position: relative;
            font-size: 2.8rem; /* Tăng font mặc định */
            color: #ffffff;
            text-align: center;
            padding: 20px;
            width: 95%;
            max-height: 90%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-shadow: 0 4px 8px rgba(0,0,0,0.8);
            font-family: 'Orbitron', sans-serif;
            z-index: 1;
        }

        .cannon-container {
            position: absolute;
            bottom: 8vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .cannon-base {
            width: 100px;
            height: 50px;
            background: #334155;
            border-radius: 50px 50px 0 0;
            border: 3px solid #64748b;
        }

        .cannon-barrel {
            width: 20px;
            height: 60px;
            background: #475569;
            border: 2px solid #94a3b8;
            margin-bottom: -10px;
            transform-origin: bottom center;
            transition: transform 0.2s ease-out;
        }

        .laser-beam {
            position: fixed;
            z-index: 100;
            background: #38bdf8;
            box-shadow: 0 0 15px #38bdf8, 0 0 30px #0ea5e9;
            width: 6px;
            pointer-events: none;
        }

        .options-zone { display: flex; gap: 1vw; z-index: 50; justify-content: space-between; align-items: flex-end; width: 98vw; padding: 0 1vw 2vh 1vw; background: linear-gradient(to top, rgba(2,6,23,0.95), transparent); }

        .option-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform 0.2s; width: 24%; max-width: 24%; }

        .frequency-core {
            width: 65px;
            height: 65px;
            background: #0ea5e9;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            border: 2px solid #38bdf8;
            position: relative;
        }

        .answer-label { background: rgba(15, 23, 42, 0.95); padding: 15px; border-radius: 8px; color: #38bdf8; border: 2px solid #38bdf8; font-size: 1.8rem; text-align: center; width: 100%; font-family: 'Orbitron', sans-serif; transition: all 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; min-height: 100px; }

        .option-item:hover .answer-label {
            background: #38bdf8;
            color: #020617;
            transform: translateY(-5px);
        }

        .stats-hud {
            position: absolute;
            top: 15px;
            width: 95%;
            display: flex;
            justify-content: space-between;
            z-index: 50;
        }

        .stat-card {
            background: rgba(15, 23, 42, 0.85);
            padding: 8px 20px;
            border: 2px solid #38bdf8;
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #result-popup {
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 6rem;
            font-family: 'Orbitron', sans-serif;
            z-index: 200;
            pointer-events: none;
            opacity: 0;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
        }

        .animate-pop { animation: popResult 1.2s forwards; }
        @keyframes popResult {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            20% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            100% { transform: translate(-50%, -55%) scale(0.9); opacity: 0; }
        }

        /* Modals */
        #start-modal, #prompt-modal, #summary-modal {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.98);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            color: white;
            backdrop-blur: 10px;
        }

        #summary-modal { display: none; z-index: 2000; }

        .summary-box {
            background: rgba(15, 23, 42, 0.9);
            border: 3px solid #38bdf8;
            padding: 40px;
            border-radius: 24px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 50px rgba(56, 189, 248, 0.2);
        }

        .tree-container {
            max-height: 40vh;
            overflow-y: auto;
            width: 100%;
            text-align: left;
        }

        .grade-folder { background: #1e293b; margin-bottom: 5px; border-radius: 4px; overflow: hidden; }
        .grade-header { padding: 10px; cursor: pointer; color: #38bdf8; font-weight: bold; background: #0f172a; }
        .grade-content { display: none; padding: 5px; }
        .grade-folder.open .grade-content { display: block; }
        
        .btn-main {
            background: #0ea5e9;
            color: white;
            padding: 15px 30px;
            border-radius: 12px;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            transition: all 0.2s;
            margin-top: 10px;
        }
        .btn-main:hover { background: #38bdf8; transform: scale(1.05); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>

    <!-- MÀN HÌNH BẮT ĐẦU -->
    <div id="start-modal">
        <h1 class="text-6xl font-bold text-sky-400 mb-2" style="font-family: 'Orbitron'; text-shadow: 0 0 20px #0ea5e9;">SPACE DEFENDER</h1>
        <p class="text-xl text-slate-400 mb-8 uppercase tracking-widest">Bảo Vệ Trái Đất Bằng Giải Tích</p>
        
        <div class="flex flex-col md:flex-row gap-6 w-11/12 max-w-5xl h-[65vh] bg-slate-900/50 p-8 rounded-3xl border border-sky-500/30 backdrop-blur-xl">
            <div class="flex-1 flex flex-col items-start">
                <h2 class="text-xl font-bold text-sky-400 mb-4 tracking-wider">📡 KẾT NỐI DỮ LIỆU</h2>
                <input type="file" id="file-upload" accept=".json, .xlsx, .xls" class="mb-4 text-xs text-slate-400 file:bg-sky-600 file:border-0 file:rounded-full file:px-4 file:py-2 file:text-white file:font-bold cursor-pointer">
                <input type="text" id="bank-name" placeholder="Tên chiến dịch (VD: Đạo hàm...)" class="w-full bg-slate-800 border border-sky-500/20 p-3 rounded-xl mb-3 focus:border-sky-400 outline-none">
                <select id="bank-grade" class="w-full bg-slate-800 border border-sky-500/20 p-3 rounded-xl mb-6 outline-none">
                    <option value="12">Khối 12</option><option value="11">Khối 11</option><option value="10">Khối 10</option>
                </select>
                <div class="flex gap-2 w-full mt-auto">
                    <button onclick="startGame(true)" class="flex-1 bg-sky-600 hover:bg-sky-500 py-4 rounded-2xl font-bold text-lg transition-all shadow-lg shadow-sky-900/40">LƯU & KHỞI CHẠY</button>
                    <button onclick="startGame(false)" class="flex-1 border border-sky-600 hover:bg-sky-900/20 py-4 rounded-2xl font-bold text-lg transition-all">CHƠI NGAY</button>
                </div>
                <button onclick="downloadSampleFile()" class="mt-4 text-sky-400 underline text-sm opacity-70 hover:opacity-100">Tải tệp JSON mẫu</button>
                <button onclick="openPromptModal()" class="mt-2 text-sky-300 text-xs italic">✨ Tạo lệnh yêu cầu AI soạn đề</button>
            </div>

            <div class="flex-1 flex flex-col items-start border-l border-sky-900/50 pl-6">
                <h2 class="text-xl font-bold text-sky-400 mb-4 tracking-wider">📂 CHIẾN DỊCH ĐÃ LƯU</h2>
                <div id="tree-container" class="tree-container pr-2 text-sm"></div>
            </div>
        </div>
    </div>

    <!-- MÀN HÌNH TỔNG KẾT -->
    <div id="summary-modal">
        <div class="summary-box">
            <h2 class="text-4xl font-bold text-sky-400 mb-6" style="font-family: 'Orbitron';">BÁO CÁO NHIỆM VỤ</h2>
            <div class="space-y-4 text-2xl mb-8 font-light">
                <p>Nhiệm vụ: <span id="sum-name" class="text-sky-300 font-bold">N/A</span></p>
                <p>Mục tiêu tiêu diệt: <span id="sum-total" class="text-white font-bold">0</span></p>
                <p>Phá hủy thành công: <span id="sum-score" class="text-green-400 font-bold">0</span></p>
                <div class="pt-4 border-t border-sky-900">
                    <p class="text-3xl">TỶ LỆ CHÍNH XÁC</p>
                    <p id="sum-percent" class="text-6xl font-bold text-sky-400 mt-2">0%</p>
                </div>
            </div>
            <div class="flex gap-4">
                <button onclick="startPlay()" class="btn-main flex-1">CHƠI LẠI</button>
                <button onclick="goHome()" class="btn-main flex-1 bg-slate-700 hover:bg-slate-600">THOÁT</button>
            </div>
        </div>
    </div>

    <!-- GIAO DIỆN CHÍNH -->
    <div class="space-bg">
        <div class="stars"></div>
        <div class="atmosphere"></div>

        <div class="stats-hud">
            <div class="flex gap-3">
                <button onclick="goHome()" class="stat-card hover:bg-sky-900/50 transition-all">🏠 MENU</button>
                <div class="stat-card text-xs">
                    <span>ZOOM</span>
                    <div class="flex gap-1 ml-2">
                        <div class="w-6 h-6 bg-sky-600 text-black flex items-center justify-center cursor-pointer font-bold" onclick="changeFontSize(-0.1)">-</div>
                        <div class="w-6 h-6 bg-sky-600 text-black flex items-center justify-center cursor-pointer font-bold" onclick="changeFontSize(0.1)">+</div>
                    </div>
                </div>
            </div>
            <div class="flex gap-3">
                <div class="stat-card text-sky-400">MISSION: <span id="q-num">1</span></div>
                <div class="stat-card text-green-400">SCORE: <span id="score">0</span></div>
            </div>
        </div>

        <div id="meteor" class="meteor">
            <div id="question-display" class="question-container"></div>
        </div>

        <div class="cannon-container">
            <div id="barrel" class="cannon-barrel"></div>
            <div class="cannon-base"></div>
        </div>

        <div class="options-zone" id="options-container"></div>
    </div>

    <div id="result-popup"></div>

    <!-- PROMPT MODAL -->
    <div id="prompt-modal" style="display:none;">
        <div class="bg-slate-900 border border-sky-500/50 p-8 rounded-3xl w-11/12 max-w-2xl text-left">
            <h2 class="text-2xl font-bold text-sky-400 mb-4" style="font-family: 'Orbitron';">AI COMMAND GENERATOR</h2>
            <textarea id="p-result" readonly class="w-full h-48 bg-black p-4 text-sky-300 font-mono text-xs rounded-xl border border-sky-900 mb-4"></textarea>
            <div class="flex gap-4 mb-6">
                <input type="text" id="p-topic" placeholder="Chủ đề (VD: Đạo hàm...)" class="flex-1 bg-slate-800 p-3 rounded-xl outline-none">
                <input type="number" id="p-count" value="10" class="w-20 bg-slate-800 p-3 rounded-xl outline-none">
            </div>
            <div class="flex gap-2">
                <button onclick="generatePrompt()" class="flex-1 bg-sky-600 py-3 rounded-xl font-bold">TẠO LỆNH</button>
                <button onclick="copyPrompt()" class="flex-1 bg-slate-700 py-3 rounded-xl font-bold">SAO CHÉP</button>
                <button onclick="closePromptModal()" class="px-6 bg-red-900/30 text-red-400 rounded-xl">ĐÓNG</button>
            </div>
        </div>
    </div>

    <script>

    function parseExcelToJSON(file, callback) {
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = e.target.result;
                const wb = XLSX.read(data, { type: 'binary' });
                const wsname = wb.SheetNames[0];
                const ws = wb.Sheets[wsname];
                const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });
                
                let questions = [];
                for (let i = 0; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row.length < 6) continue;
                    if (String(row[0]).toLowerCase().includes('câu hỏi') || String(row[1]).toLowerCase().includes('đáp án')) continue;
                    
                    
                        questions.push({
                            q: String(row[0]),
                            opts: [String(row[1]), String(row[2]), String(row[3]), String(row[4])],
                            a: String(row[parseInt(row[5], 10)])
                        });
                        
                }
                callback(null, questions);
            } catch (error) {
                callback(error, null);
            }
        };
        reader.readAsBinaryString(file);
    }
    

        let score = 0, qCount = 0, currentProblem = null, isShooting = false;
        let loadedQuestions = [], currentQuestionIndex = 0, campaignName = "";
        let userFontSizeScale = 1.2; // Tăng tỉ lệ chữ mặc định lên 1.2
        const STORAGE_KEY = 'space_defender_banks';

        let audioCtx = null;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            if (type === 'correct') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'shoot') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else {
                osc.type = 'square'; osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            }
            osc.connect(gain); gain.connect(audioCtx.destination);
        }

        function getBanks() { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
        function saveBanks(b) { localStorage.setItem(STORAGE_KEY, JSON.stringify(b)); }

        function renderTree() {
            const container = document.getElementById('tree-container'), b = getBanks();
            container.innerHTML = '';
            const g = { 10: [], 11: [], 12: [] };
            for (const id in b) g[b[id].grade]?.push(b[id]);
            [12, 11, 10].forEach(grade => {
                if (!g[grade].length) return;
                const folder = document.createElement('div');
                folder.className = 'grade-folder';
                folder.innerHTML = `<div class="grade-header" onclick="this.parentElement.classList.toggle('open')">🚀 Khối ${grade} (${g[grade].length})</div><div class="grade-content p-2"></div>`;
                const content = folder.querySelector('.grade-content');
                g[grade].forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'flex justify-between items-center bg-sky-900/20 p-2 mb-1 rounded hover:bg-sky-500/20 cursor-pointer';
                    row.innerHTML = `<span class="flex-1 truncate" onclick="playBank('${item.id}')">🛰️ ${item.name}</span><span class="text-red-400 font-bold px-2" onclick="delBank('${item.id}', event)">×</span>`;
                    content.appendChild(row);
                });
                container.appendChild(folder);
            });
        }

        function delBank(id, e) { e.stopPropagation(); if(confirm("Xóa chiến dịch này?")){ const b = getBanks(); delete b[id]; saveBanks(b); renderTree(); } }
        function playBank(id) { 
            const b = getBanks(); 
            if(b[id]) { 
                loadedQuestions = b[id].questions; 
                campaignName = b[id].name;
                startPlay(); 
            } 
        }

        function startGame(save) {
            initAudio();
            const f = document.getElementById('file-upload').files[0];
            if (!f) return alert("Vui lòng nạp dữ liệu JSON!");
            if (f.name.endsWith('.xlsx') || f.name.endsWith('.xls')) {
                parseExcelToJSON(f, function(err, parsedData) {
                    if (err) { alert('Lỗi đọc Excel!'); return; }
                    const e = { target: { result: JSON.stringify(parsedData) } };
                    try {
                        let raw = e.target.result.replace(/(?<!\\)\\([a-zA-Z{}%$])/g, '\\\\$1');
                        const parsed = JSON.parse(raw);
                        const name = document.getElementById('bank-name').value || 'Công thức mới';
                        if (shouldSave || save) {
                            const b = getBanksFromLocal ? getBanksFromLocal() : getBanks(); 
                            const id = 'bank_' + Date.now();
                            b[id] = { id, name, grade: document.getElementById('bank-grade').value, questions: parsed };
                            saveBanksToLocal ? saveBanksToLocal(b) : saveBanks(b); renderTree();
                        }
                        loadedQuestions = parsed; 
                        if (typeof currentLessonName !== 'undefined') currentLessonName = name;
                        if (typeof campaignName !== 'undefined') campaignName = name;
                        if (typeof openIntroModal === 'function') openIntroModal();
                        else startPlay();
                    } catch(err) { alert("Lỗi nạp file Excel!"); }
                });
                return;
            }
            const r = new FileReader();
            r.onload = (e) => {
                try {
                    let raw = e.target.result.replace(/(?<!\\)\\([a-zA-Z{}%$])/g, '\\\\$1');
                    const parsed = JSON.parse(raw);
                    const name = document.getElementById('bank-name').value || 'Chiến dịch mới';
                    if (save) {
                        const b = getBanks(), id = 'op_'+Date.now();
                        b[id] = { id, name, grade: document.getElementById('bank-grade').value, questions: parsed };
                        saveBanks(b); renderTree();
                    }
                    loadedQuestions = parsed; 
                    campaignName = name;
                    startPlay();
                } catch(err) { alert("Dữ liệu không đúng cấu trúc!"); }
            };
            r.readAsText(f);
        }

        function startPlay() {
            currentQuestionIndex = 0; score = 0; qCount = 0;
            document.getElementById('score').innerText = 0;
            document.getElementById('start-modal').style.display = 'none';
            document.getElementById('summary-modal').style.display = 'none';
            next();
        }

        function next() {
            if (currentQuestionIndex >= loadedQuestions.length) return showGameOver();
            isShooting = false; qCount++;
            document.getElementById('q-num').innerText = qCount;
            currentProblem = loadedQuestions[currentQuestionIndex++];
            
            const qEl = document.getElementById('question-display');
            renderMathContent(currentProblem.q, qEl, true);
            autoAdjustFontSize(qEl);

            const meteor = document.getElementById('meteor');
            meteor.style.transition = 'none';
            meteor.style.top = '-300px';
            meteor.style.opacity = '1';
            meteor.style.transform = 'translateX(-50%) rotate(0deg) scale(1)';
            
            setTimeout(() => {
                meteor.style.transition = 'top 15s linear'; 
                meteor.style.top = '65vh'; 
            }, 100);

            const container = document.getElementById('options-container');
            container.innerHTML = '';
            [...currentProblem.opts].sort(() => Math.random() - 0.5).forEach(opt => {
                const item = document.createElement('div');
                item.className = 'option-item';
                item.innerHTML = `<div class="frequency-core"><div class="w-full h-1 bg-sky-300 opacity-30"></div></div><div class="answer-label"></div>`;
                const label = item.querySelector('.answer-label');
                label.innerHTML = opt;
                renderMathInElement(label, { delimiters: [{left:'$', right:'$', display:false}], throwOnError: false });
                label.style.fontSize = (1.2 * userFontSizeScale) + 'rem';
                item.onclick = () => shoot(opt, item);
                container.appendChild(item);
            });
        }

        function shoot(ans, el) {
            if (isShooting) return; isShooting = true;
            const correct = ans === currentProblem.a;
            playSound('shoot');

            const meteor = document.getElementById('meteor');
            const barrel = document.getElementById('barrel');
            const mRect = meteor.getBoundingClientRect();
            const bRect = barrel.getBoundingClientRect();

            const targetX = mRect.left + mRect.width / 2;
            const targetY = mRect.top + mRect.height / 2;
            const angle = Math.atan2(targetY - bRect.bottom, targetX - bRect.left);
            const deg = angle * (180 / Math.PI) + 90;
            barrel.style.transform = `rotate(${deg}deg)`;

            const laser = document.createElement('div');
            laser.className = 'laser-beam';
            document.body.appendChild(laser);

            const startX = bRect.left + bRect.width / 2;
            const startY = bRect.top;
            const dist = Math.hypot(targetX - startX, targetY - startY);

            laser.style.left = startX + 'px';
            laser.style.top = startY + 'px';
            laser.style.height = '0px';
            laser.style.transform = `rotate(${deg}deg)`;
            laser.style.transformOrigin = 'top center';

            laser.animate([{ height: '0px' }, { height: dist + 'px' }], { duration: 150 }).onfinish = () => {
                laser.remove();
                if (correct) {
                    meteor.style.transition = 'all 0.4s ease-out';
                    meteor.style.transform = 'translateX(-50%) scale(0) rotate(180deg)';
                    meteor.style.opacity = '0';
                    showResult(true);
                } else {
                    showResult(false);
                }
            };
        }

        function showResult(win) {
            const p = document.getElementById('result-popup');
            p.className = 'animate-pop';
            if (win) {
                playSound('correct'); score++; document.getElementById('score').innerText = score;
                p.innerText = "PHÁ HỦY!"; p.style.color = "#38bdf8";
                setTimeout(next, 1500);
            } else {
                playSound('wrong');
                p.innerText = "THẤT BẠI!"; p.style.color = "#ef4444";
                setTimeout(() => { p.className = ''; isShooting = false; }, 1200);
            }
        }

        function renderMathContent(text, element, isDisplay = false) {
            const clean = text.replace(/```json/g, "").replace(/```/g, "").trim();
            if (/\$|\\\(|\\\[/.test(clean)) {
                element.innerHTML = clean;
                renderMathInElement(element, { delimiters: [{left:'$$', right:'$$', display:true}, {left:'$', right:'$', display:false}], throwOnError: false });
            } else {
                if (/[àáạ]/.test(clean)) element.innerText = clean;
                else { try { katex.render(clean, element, { throwOnError: false, displayMode: isDisplay }); } catch(e) { element.innerText = clean; } }
            }
        }

        function autoAdjustFontSize(el) {
            const base = 2.8; 
            el.style.fontSize = (base * userFontSizeScale) + 'rem';
            requestAnimationFrame(() => {
                let s = base * userFontSizeScale;
                while ((el.scrollHeight > el.clientHeight || el.scrollWidth > el.clientWidth) && s > 0.8) {
                    s -= 0.1; el.style.fontSize = s + 'rem';
                }
            });
        }

        function changeFontSize(d) {
            userFontSizeScale += d;
            if (userFontSizeScale < 0.5) userFontSizeScale = 0.5;
            if (userFontSizeScale > 2.5) userFontSizeScale = 2.5;
            autoAdjustFontSize(document.getElementById('question-display'));
            document.querySelectorAll('.answer-label').forEach(l => l.style.fontSize = (1.2 * userFontSizeScale) + 'rem');
        }

        function goHome() { 
            document.getElementById('start-modal').style.display = 'flex'; 
            document.getElementById('summary-modal').style.display = 'none';
            isShooting = false; 
        }
        
        function showGameOver() {
            document.getElementById('summary-modal').style.display = 'flex';
            document.getElementById('sum-name').innerText = campaignName;
            document.getElementById('sum-total').innerText = loadedQuestions.length;
            document.getElementById('sum-score').innerText = score;
            const percent = Math.round((score / loadedQuestions.length) * 100);
            document.getElementById('sum-percent').innerText = percent + "%";
        }
        
        function openPromptModal() { document.getElementById('prompt-modal').style.display = 'flex'; generatePrompt(); }
        function closePromptModal() { document.getElementById('prompt-modal').style.display = 'none'; }
        function generatePrompt() {
            const t = document.getElementById('p-topic').value || "Giải tích THPT";
            const c = document.getElementById('p-count').value || 10;
            document.getElementById('p-result').value = `Tạo bộ câu hỏi trắc nghiệm JSON mảng chủ đề ${t}, ${c} câu. Định dạng: [{"q":"Câu hỏi ($ cho toán)","a":"đáp án đúng","opts":["đúng","sai1","sai2","sai3"]}]. Trả về JSON nguyên khối.`;
        }
        function copyPrompt() { navigator.clipboard.writeText(document.getElementById('p-result').value); }
        function downloadSampleFile() {
            const s = [{"q":"Đạo hàm của $f(x)=x^3$ là?","a":"$3x^2$","opts":["$3x^2$","$x^2$","$3x$","$x^3$"]}];
            const blob = new Blob([JSON.stringify(s, null, 2)], {type:"application/json"});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "mau_space_defender.json"; a.click();
        }

        
    function downloadSampleExcel() {
        const ws = XLSX.utils.aoa_to_sheet([
            ["Câu hỏi", "Đáp án A", "Đáp án B", "Đáp án C", "Đáp án D", "Cột đúng (1-4)"],
            ["Câu hỏi mẫu: 1 + 1 bằng mấy?", "1", "2", "3", "4", 2]
        ]);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Câu Hỏi");
        XLSX.writeFile(wb, "Mau_Cau_Hoi.xlsx");
    }
    
    window.onload = renderTree;
    </script>
</body>

</head>
<body class="text-white h-screen flex flex-col font-sans select-none">

    <!-- Header -->
    <header class="h-14 bg-darkBg border-b border-slate-800 flex items-center justify-between px-4 shrink-0 z-10 relative shadow-md">
        <div class="flex items-center gap-4">
            <button class="flex items-center gap-2 bg-red-900/30 text-red-400 hover:bg-red-900/50 px-3 py-1.5 rounded text-sm transition-colors border border-red-900/50">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                Đóng
            </button>
            <h1 class="text-lg font-semibold tracking-wide text-cyan-50">Hai Đường Thẳng Vuông Góc - Hình Học 11</h1>
        </div>
        
        <!-- Nút Toàn màn hình -->
        <button id="fullscreen-btn" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded text-sm text-textMuted transition-colors border border-slate-700 group">
            <svg id="fullscreen-icon" class="group-hover:text-white transition-colors" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
            </svg>
            <span id="fullscreen-text" class="group-hover:text-white transition-colors">Toàn màn hình (F)</span>
        </button>
    </header>

    <!-- Main Content Area -->
    <div class="flex flex-1 overflow-hidden relative">
        
        <!-- Sidebar -->
        <aside class="w-[340px] bg-sidebarBg border-r border-slate-800 flex flex-col z-10 shadow-xl shrink-0">
            <!-- Logo Area -->
            <div class="p-4 border-b border-slate-800 flex items-center gap-3">
                <div class="w-10 h-10 rounded-full border-2 border-cyan-500 flex items-center justify-center font-bold text-cyan-500 shadow-[0_0_10px_rgba(6,182,212,0.4)]">
                    KNTT
                </div>
                <div>
                    <div class="font-bold tracking-wider text-sm text-cyan-100">TOÁN 11 - BÀI 22</div>
                    <div class="text-[10px] text-cyan-400/80 uppercase tracking-widest">Góc và khoảng cách</div>
                </div>
            </div>

            <!-- Menu List -->
            <div class="flex-1 overflow-y-auto p-3 space-y-2" id="menu-list">
                <!-- Menu items generated by JS -->
            </div>
        </aside>

        <!-- 3D Viewport & Footer Container -->
        <main class="flex-1 relative flex flex-col">
            <!-- 3D Canvas Container -->
            <div id="canvas-container" class="flex-1 bg-[#070b14] relative cursor-grab active:cursor-grabbing">
                <!-- Three.js renders here -->
            </div>

            <!-- Bottom Information Panel -->
            <div class="h-36 bg-sidebarBg/95 backdrop-blur-md border-t border-slate-700 p-6 flex items-center justify-between z-10 shrink-0 relative">
                <div class="flex-1 pr-6">
                    <h2 class="text-xl font-bold flex items-center gap-2 mb-2 text-cyan-400" id="info-title">
                        <svg class="text-cyan-500" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="4"></line><line x1="4" y1="12" x2="20" y2="12"></line><polyline points="12 16 16 16 16 12"></polyline></svg>
                        <!-- Title dynamically inserted -->
                    </h2>
                    <p class="text-slate-300 text-sm leading-relaxed" id="info-desc">
                        <!-- Description dynamically inserted -->
                    </p>
                </div>
                
                <!-- Formula Box -->
                <div class="bg-[#0f172a] border border-slate-700 rounded-xl px-8 py-4 flex items-center justify-center min-w-[320px] shadow-inner h-full">

    <!-- Application Logic -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>

    <script>
        const menuData = [
            { 
                id: 1, 
                label: "Khái niệm 1", 
                title: "Góc giữa 2 đt cắt nhau", 
                desc: "Góc giữa hai đường thẳng cắt nhau là góc nhỏ nhất trong 4 góc được tạo thành, luôn nhỏ hơn hoặc bằng 90 độ.", 
                formula: "0^\\circ \\le (a, b) \\le 90^\\circ" 
            },
            { 
                id: 2, 
                label: "Khái niệm 2", 
                title: "Góc giữa 2 đt chéo nhau", 
                desc: "Để tìm góc giữa 2 đt chéo nhau a và b, ta lấy điểm O tùy ý, kẻ a' // a và b' // b qua O. Khi đó góc(a, b) = góc(a', b').", 
                formula: "(a, b) = (a', b')" 
            },
            { 
                id: 3, 
                label: "Định nghĩa", 
                title: "Hai đường thẳng vuông góc", 
                desc: "Hai đường thẳng được gọi là vuông góc với nhau nếu góc giữa chúng bằng 90 độ (có thể cắt nhau hoặc chéo nhau).", 
                formula: "a \\perp b \\Leftrightarrow (a, b) = 90^\\circ" 
            },
            { 
                id: 4, 
                label: "Trường hợp", 
                title: "Vuông góc nhưng chéo nhau", 
                desc: "Trong không gian, hai đường thẳng có thể hoàn toàn không chạm vào nhau (chéo nhau) nhưng vẫn vuông góc với nhau.", 
                formula: "a \\perp b \\text{ (chéo nhau)}" 
            },
            { 
                id: 5, 
                label: "Tính chất", 
                title: "Tính chất bắc cầu", 
                desc: "Nếu một đường thẳng vuông góc với một trong hai đường thẳng song song thì nó cũng vuông góc với đường thẳng còn lại.", 
                formula: "a \\parallel b, c \\perp a \\Rightarrow c \\perp b" 
            },
            { 
                id: 6, 
                label: "Ứng dụng", 
                title: "Vuông góc trong Khối 3D", 
                desc: "Trong khối lập phương hoặc khối hộp chữ nhật, có rất nhiều cặp cạnh chéo nhau nhưng lại vuông góc với nhau.", 
                formula: "AB \\perp B'C' \\text{ (trong lập phương)}" 
            }
        ];

        let currentStateId = 1;
        let currentStateGroup = null;

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x070b14, 0.015);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(40, 35, 55); 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const labelRenderer = new THREE.CSS2DRenderer();
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        container.appendChild(labelRenderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Ánh sáng cực mạnh cho màu Neon
        scene.add(new THREE.AmbientLight(0xffffff, 0.95));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(20, 30, 20);
        scene.add(dirLight);

        // Lưới toạ độ nền
        const gridHelper = new THREE.GridHelper(80, 80, 0x1e293b, 0x1e293b);
        gridHelper.position.y = -15;
        scene.add(gridHelper);

        function createLabel(text, extraClass = '') {
            const div = document.createElement('div');
            div.className = `label-3d ${extraClass}`;
            div.innerHTML = text;
            return new THREE.CSS2DObject(div);
        }

        // Tạo điểm sáng 3D
        function createPoint(pos, color = 0xfacc15, size = 0.4, labelTxt = '') {
            const geo = new THREE.SphereGeometry(size, 32, 32);
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.2, metalness: 0.5 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(pos);
            
            if (labelTxt) {
                const label = createLabel(labelTxt, 'label-math');
                label.position.set(0.6, 0.8, 0);
                mesh.add(label);
            }
            return mesh;
        }

        // Đường thẳng khối trụ nét đậm
        function createThickLine(pt1, pt2, color = 0xffffff, thickness = 0.15) {
            const distance = pt1.distanceTo(pt2);
            const geo = new THREE.CylinderGeometry(thickness, thickness, distance, 16);
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3 });
            const cylinder = new THREE.Mesh(geo, mat);
            
            const position = new THREE.Vector3().addVectors(pt1, pt2).multiplyScalar(0.5);
            cylinder.position.copy(position);
            cylinder.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3().subVectors(pt2, pt1).normalize());
            
            return cylinder;
        }

        // Đường nét đứt (tịnh tiến, dóng góc)
        function createDashedLine(pt1, pt2, color = 0x94a3b8) {
            const mat = new THREE.LineDashedMaterial({ color: color, dashSize: 0.8, gapSize: 0.5 });
            const geo = new THREE.BufferGeometry().setFromPoints([pt1, pt2]);
            const line = new THREE.Line(geo, mat);
            line.computeLineDistances();
            return line;
        }

        // Hàm tạo Cung tròn đo góc
        function createArc(origin, v1, v2, radius, color = 0xfacc15) {
            const points = [];
            const normal = new THREE.Vector3().crossVectors(v1, v2).normalize();
            
            // Xử lý góc tránh lỗi
            if (normal.lengthSq() < 0.001) {
                normal.set(0, 1, 0); // Dự phòng nếu 2 vector cùng phương
            }
            
            const angle = v1.angleTo(v2);
            for(let i=0; i<=30; i++) {
                const a = (i/30) * angle;
                const p = v1.clone().normalize().applyAxisAngle(normal, a).multiplyScalar(radius).add(origin);
                points.push(p);
            }
            const geo = new THREE.BufferGeometry().setFromPoints(points);
            const mat = new THREE.LineBasicMaterial({color: color, linewidth: 2});
            return new THREE.Line(geo, mat);
        }

        // Hàm tạo Ký hiệu góc vuông (1 nửa hình vuông)
        function createRightAngle(origin, dir1, dir2, size = 2, color = 0x22d3ee) {
            const p1 = origin.clone().add(dir1.clone().normalize().multiplyScalar(size));
            const p2 = origin.clone().add(dir2.clone().normalize().multiplyScalar(size));
            const pCorner = p1.clone().add(dir2.clone().normalize().multiplyScalar(size)); // Hình bình hành (chữ nhật)
            
            const group = new THREE.Group();
            group.add(createThickLine(p1, pCorner, color, 0.08));
            group.add(createThickLine(p2, pCorner, color, 0.08));
            return group;
        }

        // --- Logic Xây Dựng Các Trạng Thái ---
        function buildState(id) {
            const group = new THREE.Group();
            const EXT = 22; // Chiều dài nét vẽ
            
            const colorA = 0xf87171; // Red 400
            const colorB = 0xa3e635; // Lime 400
            const colorC = 0x60a5fa; // Blue 400
            const colorProj = 0x22d3ee; // Cyan 400

            switch (id) {
                case 1: { // Góc giữa 2 đt cắt nhau
                    const pI = new THREE.Vector3(0, 0, 0);
                    const vA = new THREE.Vector3(1, 0, 0); // Đường a
                    const vB = new THREE.Vector3(1, 0, 1).normalize(); // Đường b chéo 45 độ
                    
                    const a1 = pI.clone().addScaledVector(vA, -EXT);
                    const a2 = pI.clone().addScaledVector(vA, EXT);
                    const b1 = pI.clone().addScaledVector(vB, -EXT);
                    const b2 = pI.clone().addScaledVector(vB, EXT);

                    const lineA = createThickLine(a1, a2, colorA, 0.15);
                    const lineB = createThickLine(b1, b2, colorB, 0.15);
                    const ptI = createPoint(pI, 0xfacc15, 0.4, 'I');

                    // Cung góc nhọn alpha
                    const arc = createArc(pI, vA, vB, 4, 0xfacc15);
                    
                    // Nhãn
                    const lblA = createLabel('a', 'label-math text-red-400'); lblA.position.copy(a2).add(new THREE.Vector3(1,1,0));
                    const lblB = createLabel('b', 'label-math text-lime-400'); lblB.position.copy(b2).add(new THREE.Vector3(1,1,0));
                    const lblAlpha = createLabel('\\alpha', 'label-math text-yellow-400'); lblAlpha.position.set(5, 1, 2);

                    group.add(lineA, lineB, ptI, arc, lblA, lblB, lblAlpha);
                    break;
                }
                case 2: { // Góc 2 đt chéo nhau (Tịnh tiến)
                    // a nằm ngang dưới
                    const pA_center = new THREE.Vector3(0, -10, 5);
                    const vA = new THREE.Vector3(1, 0, 0);
                    const a1 = pA_center.clone().addScaledVector(vA, -EXT);
                    const a2 = pA_center.clone().addScaledVector(vA, EXT);
                    const lineA = createThickLine(a1, a2, colorA, 0.15);

                    // b nằm chéo trên
                    const pB_center = new THREE.Vector3(5, 12, -10);
                    const vB = new THREE.Vector3(1, 0, 1).normalize();
                    const b1 = pB_center.clone().addScaledVector(vB, -EXT);
                    const b2 = pB_center.clone().addScaledVector(vB, EXT);
                    const lineB = createThickLine(b1, b2, colorB, 0.15);

                    // Chọn điểm O trên đường a
                    const pO = pA_center.clone().add(new THREE.Vector3(-5, 0, 0));
                    const ptO = createPoint(pO, 0xfacc15, 0.4, 'O');

                    // Kẻ b' qua O song song b
                    const bp1 = pO.clone().addScaledVector(vB, -EXT);
                    const bp2 = pO.clone().addScaledVector(vB, EXT);
                    const lineBp = createThickLine(bp1, bp2, colorProj, 0.15); // Đường mới kẻ b'

                    // Đường đứt nét minh hoạ phép tịnh tiến từ b sang b'
                    const offset = new THREE.Vector3().subVectors(pO, pB_center);
                    const b1_proj = b1.clone().add(offset);
                    const dashT = createDashedLine(pB_center, pO, 0xffffff);

                    // Vẽ cung góc tại O
                    const arc = createArc(pO, vA, vB, 5, 0xfacc15);

                    // Nhãn
                    const lblA = createLabel('a', 'label-math text-red-400'); lblA.position.copy(a2).add(new THREE.Vector3(1,1,0));
                    const lblB = createLabel('b', 'label-math text-lime-400'); lblB.position.copy(b2).add(new THREE.Vector3(1,1,0));
                    const lblBp = createLabel("b'", 'label-math text-cyan-400'); lblBp.position.copy(bp2).add(new THREE.Vector3(1,1,0));
                    const lblAlpha = createLabel('\\alpha', 'label-math text-yellow-400'); lblAlpha.position.copy(pO).add(new THREE.Vector3(6, 1, 2));

                    group.add(lineA, lineB, lineBp, ptO, dashT, arc, lblA, lblB, lblBp, lblAlpha);
                    break;
                }
                case 3: { // 2 đt vuông góc (Cắt nhau)
                    const pI = new THREE.Vector3(0, 0, 0);
                    const vA = new THREE.Vector3(1, 0, 0); 
                    const vB = new THREE.Vector3(0, 1, 0); 
                    
                    const a1 = pI.clone().addScaledVector(vA, -EXT);
                    const a2 = pI.clone().addScaledVector(vA, EXT);
                    const lineA = createThickLine(a1, a2, colorA, 0.18);
                    
                    const b1 = pI.clone().addScaledVector(vB, -EXT);
                    const b2 = pI.clone().addScaledVector(vB, EXT);
                    const lineB = createThickLine(b1, b2, colorB, 0.18);

                    const ptI = createPoint(pI, 0xfacc15, 0.4, 'I');
                    const rightAngle = createRightAngle(pI, vA, vB, 2.5, colorProj);

                    const lblA = createLabel('a', 'label-math text-red-400'); lblA.position.copy(a2).add(new THREE.Vector3(1,1,0));
                    const lblB = createLabel('b', 'label-math text-lime-400'); lblB.position.copy(b2).add(new THREE.Vector3(1,1,0));

                    group.add(lineA, lineB, ptI, rightAngle, lblA, lblB);
                    break;
                }
                case 4: { // 2 đt vuông góc (Chéo nhau)
                    // a nằm ở y=10
                    const pA_center = new THREE.Vector3(0, 12, 0);
                    const vA = new THREE.Vector3(1, 0, 0);
                    const a1 = pA_center.clone().addScaledVector(vA, -EXT);
                    const a2 = pA_center.clone().addScaledVector(vA, EXT);
                    const lineA = createThickLine(a1, a2, colorA, 0.18);

                    // b nằm ở y=-10, xoay 90 độ theo trục Z
                    const pB_center = new THREE.Vector3(0, -12, 0);
                    const vB = new THREE.Vector3(0, 0, 1);
                    const b1 = pB_center.clone().addScaledVector(vB, -EXT);
                    const b2 = pB_center.clone().addScaledVector(vB, EXT);
                    const lineB = createThickLine(b1, b2, colorB, 0.18);

                    // Tịnh tiến b lên cắt a để chứng minh vuông góc
                    const bp1 = pA_center.clone().addScaledVector(vB, -EXT);
                    const bp2 = pA_center.clone().addScaledVector(vB, EXT);
                    const lineBp = createThickLine(bp1, bp2, colorProj, 0.18);
                    
                    const dashT = createDashedLine(pB_center, pA_center, 0xffffff);
                    const ptI = createPoint(pA_center, 0xfacc15, 0.4, 'O');
                    const rightAngle = createRightAngle(pA_center, vA, vB, 2.5, colorProj);

                    const lblA = createLabel('a', 'label-math text-red-400'); lblA.position.copy(a2).add(new THREE.Vector3(1,1,0));
                    const lblB = createLabel('b', 'label-math text-lime-400'); lblB.position.copy(b2).add(new THREE.Vector3(1,1,0));
                    const lblBp = createLabel("b'", 'label-math text-cyan-400'); lblBp.position.copy(bp2).add(new THREE.Vector3(1,1,0));

                    group.add(lineA, lineB, lineBp, dashT, ptI, rightAngle, lblA, lblB, lblBp);
                    break;
                }
                case 5: { // Tính chất bắc cầu: a//b, c perp a => c perp b
                    // a, b song song
                    const vDir = new THREE.Vector3(1, 0, 0);
                    const pA_center = new THREE.Vector3(0, 0, -10);
                    const pB_center = new THREE.Vector3(0, 0, 10);
                    
                    const lineA = createThickLine(pA_center.clone().addScaledVector(vDir, -EXT), pA_center.clone().addScaledVector(vDir, EXT), colorA, 0.15);
                    const lineB = createThickLine(pB_center.clone().addScaledVector(vDir, -EXT), pB_center.clone().addScaledVector(vDir, EXT), colorA, 0.15); // Cùng màu A vì song song
                    
                    // Đường c vuông góc với a (nằm ngang)
                    const vC = new THREE.Vector3(0, 0, 1);
                    const lineC = createThickLine(pA_center.clone().addScaledVector(vC, -15), pB_center.clone().addScaledVector(vC, 15), colorC, 0.15); // Xuyên qua cả a và b

                    // Giao điểm 
                    const ptI = createPoint(pA_center, 0xfacc15, 0.35, 'I');
                    const ptJ = createPoint(pB_center, 0xfacc15, 0.35, 'J');

                    // Kí hiệu vuông góc ở cả 2 chỗ
                    const ra1 = createRightAngle(pA_center, vDir, vC, 2.5, colorProj);
                    const ra2 = createRightAngle(pB_center, vDir, vC, 2.5, colorProj);

                    const lblA = createLabel('a', 'label-math text-red-400'); lblA.position.set(EXT+1, 1, -10);
                    const lblB = createLabel('b', 'label-math text-red-400'); lblB.position.set(EXT+1, 1, 10);
                    const lblC = createLabel('c', 'label-math text-blue-400'); lblC.position.set(1, 1, 25);

                    group.add(lineA, lineB, lineC, ptI, ptJ, ra1, ra2, lblA, lblB, lblC);
                    break;
                }
                case 6: { // Ứng dụng Khối lập phương
                    const s = 10;
                    // Đỉnh đáy
                    const pA = new THREE.Vector3(-s, -s, s);
                    const pB = new THREE.Vector3(s, -s, s);
                    const pC = new THREE.Vector3(s, -s, -s);
                    const pD = new THREE.Vector3(-s, -s, -s);
                    // Đỉnh nắp
                    const pA_p = new THREE.Vector3(-s, s, s);
                    const pB_p = new THREE.Vector3(s, s, s);
                    const pC_p = new THREE.Vector3(s, s, -s);
                    const pD_p = new THREE.Vector3(-s, s, -s);

                    // Vẽ khung lập phương (xám nhạt đứt nét)
                    const edges = [
                        [pA,pB], [pB,pC], [pC,pD], [pD,pA],
                        [pA_p,pB_p], [pB_p,pC_p], [pC_p,pD_p], [pD_p,pA_p],
                        [pA,pA_p], [pB,pB_p], [pC,pC_p], [pD,pD_p]
                    ];
                    edges.forEach(e => {
                        group.add(createDashedLine(e[0], e[1], 0x475569));
                    });

                    // Làm nổi bật cặp cạnh chéo nhau vuông góc: AB và B'C'
                    const lineAB = createThickLine(pA, pB, colorA, 0.25);
                    const lineB_pC_p = createThickLine(pB_p, pC_p, colorB, 0.25);

                    // Tịnh tiến B'C' xuống BC để thấy vuông góc
                    const lineBC = createThickLine(pB, pC, colorProj, 0.25);
                    
                    const dashTranslate = createDashedLine(pB_p, pB, 0xffffff);
                    const ptB = createPoint(pB, 0xfacc15, 0.4);
                    
                    // Vẽ kí hiệu vuông góc tại B
                    const dirAB = new THREE.Vector3(-1, 0, 0); // B tới A
                    const dirBC = new THREE.Vector3(0, 0, -1); // B tới C
                    const rightAngle = createRightAngle(pB, dirAB, dirBC, 3, colorProj);

                    // Nhãn
                    group.add(createPoint(pA, 0xffffff, 0.2, 'A'));
                    group.add(createPoint(pB, 0xffffff, 0.2, 'B'));
                    group.add(createPoint(pC, 0xffffff, 0.2, 'C'));
                    group.add(createPoint(pB_p, 0xffffff, 0.2, "B'"));
                    group.add(createPoint(pC_p, 0xffffff, 0.2, "C'"));

                    group.add(lineAB, lineB_pC_p, lineBC, dashTranslate, rightAngle);
                    break;
                }
            }
            return group;
        }

        function destroyCSS2DObjects(group) {
            if (!group) return;
            group.traverse(child => {
                if (child.isCSS2DObject && child.element && child.element.parentNode) {
                    child.element.parentNode.removeChild(child.element);
                }
            });
        }

        function update3DScene(id) {
            if (currentStateGroup) {
                destroyCSS2DObjects(currentStateGroup);
                scene.remove(currentStateGroup);
                currentStateGroup = null;
            }
            currentStateGroup = buildState(id);
            scene.add(currentStateGroup);
        }

        function onWindowResize() {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
            labelRenderer.setSize(container.clientWidth, container.clientHeight);
        }
        window.addEventListener('resize', onWindowResize);

        function animate() {
            requestAnimationFrame(animate);
            if (controls) controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        
        window.onload = function() {
            onWindowResize();
            animate();
        };

        const menuListEl = document.getElementById('menu-list');
        const infoTitleEl = document.getElementById('info-title');
        const infoDescEl = document.getElementById('info-desc');
        const mathFormulaEl = document.getElementById('math-formula');

        function renderMenu() {
            menuListEl.innerHTML = '';
            menuData.forEach(item => {
                const btn = document.createElement('button');
                const isActive = item.id === currentStateId;
                
                btn.className = `w-full text-left px-4 py-3 rounded-lg text-sm transition-all duration-200 flex items-center gap-3 border ${
                    isActive 
                    ? 'bg-cyan-900/40 border-cyan-500/50 text-white shadow-[0_0_15px_rgba(6,182,212,0.15)]' 
                    : 'bg-transparent border-transparent text-slate-400 hover:bg-slate-800/50 hover:text-slate-200'
                }`;
                
                btn.innerHTML = `
                    <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs shrink-0 ${
                        isActive ? 'bg-cyan-600 text-white' : 'bg-slate-700 text-slate-300'
                    }">
                        ${item.id}
                    </div>
                    <div class="flex flex-col overflow-hidden">
                        <span class="font-semibold text-[13px] truncate whitespace-nowrap" title="${item.title}">${item.title}</span>
                        <span class="text-[11px] opacity-70 truncate whitespace-nowrap">${item.label}</span>
                    </div>
                `;
                
                btn.onclick = () => changeState(item.id);
                menuListEl.appendChild(btn);
            });
        }

        function updateFooter(id) {
            const data = menuData.find(item => item.id === id);
            if (!data) return;

            const iconHtml = `<svg class="text-cyan-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="4"></line><line x1="4" y1="12" x2="20" y2="12"></line><polyline points="12 16 16 16 16 12"></polyline></svg>`;
            infoTitleEl.innerHTML = iconHtml + ' ' + data.title;
            infoDescEl.textContent = data.desc;

            katex.render(data.formula, mathFormulaEl, {
                throwOnError: false,
                displayMode: true
            });
        }

        function changeState(id) {
            currentStateId = id;
            renderMenu();
            updateFooter(id);
            update3DScene(id);
        }

        renderMenu();
        updateFooter(currentStateId);
        update3DScene(currentStateId);

        // --- Fullscreen Logic ---
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const fullscreenIcon = document.getElementById('fullscreen-icon');
        const fullscreenText = document.getElementById('fullscreen-text');

        function toggleFullScreen() {
            const docElm = document.documentElement;
            if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {  
                if (docElm.requestFullscreen) docElm.requestFullscreen();
                else if (docElm.mozRequestFullScreen) docElm.mozRequestFullScreen();
                else if (docElm.webkitRequestFullScreen) docElm.webkitRequestFullScreen();
                else if (docElm.msRequestFullscreen) docElm.msRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                else if (document.msExitFullscreen) document.msExitFullscreen();
            }
        }

        fullscreenBtn.addEventListener('click', toggleFullScreen);

        const fullscreenEvents = ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'];
        fullscreenEvents.forEach(event => {
            document.addEventListener(event, () => {
                const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
                if (isFullscreen) {
                    fullscreenText.textContent = 'Thu nhỏ (F)';
                    fullscreenIcon.innerHTML = `<path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path>`;
                } else {
                    fullscreenText.textContent = 'Toàn màn hình (F)';
                    fullscreenIcon.innerHTML = `<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>`;
                }
                setTimeout(onWindowResize, 150);
            });
        });

        document.addEventListener('keydown', (event) => {
            if (event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA') return;
            if (event.key === 'f' || event.key === 'F') {
                toggleFullScreen();
            }
        });

    </script>
</body>
</html>

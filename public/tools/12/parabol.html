<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài học Tương tác: Đường Parabol</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- KaTeX for Math Formulas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #f1f5f9; color: #1e293b; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .pointer-events-auto { pointer-events: auto; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.05); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.2); border-radius: 4px; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%; background: #2563eb; cursor: pointer; margin-top: -7px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #cbd5e1; border-radius: 2px; }
        
        /* Chế độ hiển thị toàn màn hình, chữ lớn, nền trắng 100% không mờ */
        .expanded-panel {
            position: fixed !important; top: 50% !important; left: 50% !important; transform: translate(-50%, -50%) !important;
            width: 98vw !important; max-width: 100% !important; height: 96vh !important; max-height: 100vh !important;
            z-index: 100 !important; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25) !important;
            background: #ffffff !important; 
            backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
            display: flex !important; flex-direction: column !important;
        }
        .expanded-panel #info-content { 
            padding: 3rem !important; gap: 2rem !important; 
            overflow-y: auto !important; 
        }
        .expanded-panel #math-formula { font-size: 40px !important; padding: 2rem !important; min-height: 150px !important; overflow-x: auto !important; }
        .expanded-panel #math-result, .expanded-panel #math-result * { font-size: 32px !important; line-height: 1.6 !important; }
        .expanded-panel #math-result { padding: 2rem !important; }
        .expanded-panel h3 { font-size: 36px !important; }
        .expanded-panel h3 svg { width: 36px !important; height: 36px !important; }
        
        .minimized-panel {
            background: transparent !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
            border: none !important; box-shadow: none !important; pointer-events: none;
        }
        .minimized-panel .panel-header { background: transparent !important; border-bottom: none !important; pointer-events: auto; }
        .minimized-panel .panel-title { opacity: 0; pointer-events: none; }
        .minimized-panel #control-footer-hint { display: none !important; }
        .minimized-panel label { text-shadow: 0 0 6px rgba(255,255,255,0.9), 0 0 2px rgba(255,255,255,1) !important; }
        
        .minimized-panel #controls-container { opacity: 0.35; transition: opacity 0.3s ease; pointer-events: auto; }
        .minimized-panel #controls-container:hover { opacity: 1; }
        .minimized-panel input[type=range]::-webkit-slider-runnable-track { background: rgba(203, 213, 225, 0.5) !important; }
        .minimized-panel input[type=range]::-webkit-slider-thumb { background: rgba(37, 99, 235, 0.6) !important; box-shadow: none !important; }
    </style>

    <script>
        window.togglePanel = function(contentId, iconId) {
            const content = document.getElementById(contentId);
            const icon = document.getElementById(iconId);
            content.classList.toggle('hidden');
            icon.classList.toggle('-rotate-90');
        };

        window.toggleExpand = function() {
            const panel = document.getElementById('info-panel');
            const overlay = document.getElementById('expand-overlay');
            const content = document.getElementById('info-content');
            const icon = document.getElementById('info-icon');
            
            if (panel.classList.contains('expanded-panel')) {
                // Click lần 2: Thu nhỏ và Ẩn luôn nội dung
                panel.classList.remove('expanded-panel');
                overlay.classList.add('hidden');
                content.classList.add('hidden');
                icon.classList.add('-rotate-90');
            } else {
                // Click lần 1: Phóng to và Hiện nội dung
                panel.classList.add('expanded-panel');
                overlay.classList.remove('hidden');
                content.classList.remove('hidden');
                icon.classList.remove('-rotate-90');
            }
        };

        window.toggleControlPanel = function() {
            const panel = document.getElementById('bottom-panel');
            const icon = document.getElementById('control-icon');
            panel.classList.toggle('minimized-panel');
            icon.classList.toggle('-rotate-90');
        };

        window.toggleFullScreen = function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.warn(err));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        };

        document.addEventListener('keydown', (event) => {
            if (event.key.toLowerCase() === 'f' && event.target.tagName !== 'INPUT') window.toggleFullScreen();
        });
    </script>
</head>
<body>

    <!-- Application Script -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;
        let objectsGroup = new THREE.Group();
        let currentMode = 1;
        
        // Trạng thái các biến của 5 phần bài học
        const state = {
            m1: { y: 2 },                  // Vấn đề thực tế (Tia sóng di chuyển dọc trục y)
            m2: { p: 4, y: 3 },            // Định nghĩa quỹ tích (Tham số tiêu p và tọa độ điểm M)
            m3: { showElements: 0 },       // Ví dụ 1 (Step by step)
            m4: { step: 0 },               // Ví dụ 2 (Lập PT)
            m5: { w: 2, d: 0.5 }           // Ví dụ 3 (Thiết kế anten: Đường kính w, Độ sâu d)
        };

        const problems = [
            "Các chảo thu sóng vệ tinh, ăng-ten parabol hay đèn pha ô tô đều có mặt cắt hình Parabol. Khi các tia sóng song song chiếu tới mặt chảo, chúng sẽ dội đi đâu? Bí mật toán học nào đằng sau thiết kế này?",
            "Làm thế nào để toán học hóa đường cong đó? Tập hợp các điểm $M$ trong mặt phẳng cách đều một điểm cố định $F$ (Tiêu điểm) và một đường thẳng cố định $\\Delta$ (Đường chuẩn) được gọi là Đường Parabol.",
            "Cho phương trình chính tắc của một đường Parabol $(P)$. Bằng cách nào ta có thể xác định được tham số tiêu $p$, tọa độ Tiêu điểm $F$, và phương trình Đường chuẩn $\\Delta$?",
            "Ngược lại, nếu ta chỉ được cung cấp một vài yếu tố hình học ban đầu (chẳng hạn như tọa độ Tiêu điểm hoặc phương trình Đường chuẩn), làm sao để lập được phương trình chính tắc của Parabol đó?",
            "Một chảo ăng-ten parabol có bề rộng miệng chảo và chiều sâu cho trước. Người kỹ sư cần tính toán đặt bộ thu sóng (nằm tại tiêu điểm $F$) cách đáy chảo bao nhiêu để nhận được tín hiệu mạnh nhất?"
        ];

        const mathFormula = document.getElementById('math-formula');
        const mathResult = document.getElementById('math-result');
        const controlsContainer = document.getElementById('controls-container');

        // --- HÀM VẼ CƠ BẢN ---
        function createTextSprite(text, color, scale=1.0) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 128;
            const context = canvas.getContext('2d');
            context.font = 'Bold 48px "Segoe UI", Arial';
            context.fillStyle = color; context.textAlign = 'center'; context.textBaseline = 'middle';
            context.lineWidth = 6; context.strokeStyle = 'white';
            context.strokeText(text, 128, 64); context.fillText(text, 128, 64);
            const texture = new THREE.CanvasTexture(canvas);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true }));
            sprite.scale.set(scale*2, scale, scale); return sprite;
        }

        function createPoint(pos, color=0xdc2626, size=0.15, label='', offset=new THREE.Vector3(0, 0.4, 0)) {
            if (typeof size === 'string') { label = size; size = 0.15; }
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(size, 16, 16), new THREE.MeshPhongMaterial({ color }));
            mesh.position.copy(pos); objectsGroup.add(mesh);
            if (label) {
                const sprite = createTextSprite(label, '#' + color.toString(16).padStart(6, '0'), 0.8);
                sprite.position.copy(pos).add(offset); objectsGroup.add(sprite);
            }
            return mesh;
        }

        function drawLine(p1, p2, color=0x1e293b, width=3) {
            const radius = width * 0.008; 
            const mesh = new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(p1, p2), 1, radius, 8, false), new THREE.MeshPhongMaterial({ color }));
            objectsGroup.add(mesh); return mesh;
        }

        function drawThickVector(p1, p2, color=0x2563eb, radius=0.04) {
            const group = new THREE.Group();
            const dist = p1.distanceTo(p2);
            if(dist < 0.001) return group;
            const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
            const headLength = radius * 6; const headRadius = radius * 2.5;
            const shaftLength = Math.max(0, dist - headLength);
            if(shaftLength > 0) {
                const mesh = new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(p1, new THREE.Vector3().copy(p1).addScaledVector(dir, shaftLength)), 1, radius, 8, false), new THREE.MeshPhongMaterial({ color }));
                group.add(mesh);
            }
            const headGeom = new THREE.ConeGeometry(headRadius, headLength, 16);
            headGeom.translate(0, headLength/2, 0); 
            const headMesh = new THREE.Mesh(headGeom, new THREE.MeshPhongMaterial({ color }));
            headMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
            headMesh.position.copy(p1).addScaledVector(dir, shaftLength);
            group.add(headMesh);
            objectsGroup.add(group); return group;
        }

        function drawDashed(p1, p2, color=0x94a3b8, radius=0.012) {
            const dist = p1.distanceTo(p2);
            const dashSize = 0.2; const gapSize = 0.15; const step = dashSize + gapSize;
            const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
            for (let d = 0; d < dist; d += step) {
                const start = new THREE.Vector3().copy(p1).addScaledVector(dir, d);
                const currentDash = Math.min(dashSize, dist - d);
                if (currentDash <= 0.001) continue;
                const end = new THREE.Vector3().copy(start).addScaledVector(dir, currentDash);
                objectsGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(start, end), 1, radius, 8, false), new THREE.MeshBasicMaterial({ color })));
            }
        }

        function drawThickCurve(points, color=0x2563eb, radius=0.03) {
            if(points.length < 2) return;
            const curve = new THREE.CatmullRomCurve3(points, false, "chordal");
            const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, points.length * 2, radius, 8, false), new THREE.MeshPhongMaterial({ color }));
            objectsGroup.add(mesh); return mesh;
        }

        function drawStandardAxes(xLen = 10, yLen = 8, originLabel = 'O(0,0)') {
            drawThickVector(new THREE.Vector3(-xLen/3,0,0), new THREE.Vector3(xLen,0,0), 0x94a3b8, 0.02);
            createTextSprite('x', '#64748b', 0.8).position.set(xLen+0.5, -0.5, 0);
            
            drawThickVector(new THREE.Vector3(0,-yLen,0), new THREE.Vector3(0,yLen,0), 0x94a3b8, 0.02);
            createTextSprite('y', '#64748b', 0.8).position.set(-0.5, yLen+0.5, 0);
            
            createPoint(new THREE.Vector3(0,0,0), 0x1e293b, 0.1, originLabel, new THREE.Vector3(-0.6, -0.6, 0));
        }

        function clearAll() {
            while (objectsGroup.children.length > 0) {
                const child = objectsGroup.children[0];
                if (child.geometry) child.geometry.dispose();
                if (child.material) { if (Array.isArray(child.material)) child.material.forEach(m => m.dispose()); else child.material.dispose(); }
                objectsGroup.remove(child);
            }
        }

        function setCameraMode(is3D) {
            if(is3D) {
                camera.position.set(5, 5, 15); controls.enableRotate = true; controls.maxPolarAngle = Math.PI/2;
            } else {
                camera.position.set(2, 0, 16); controls.enableRotate = false;
            }
            controls.target.set(2,0,0); controls.update();
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf8fafc); 
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.up.set(0, 1, 0); 
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; controls.dampingFactor = 0.05;
            
            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(5, 10, 15); scene.add(dirLight);
            
            const gridHelper = new THREE.GridHelper(24, 24, 0xcbd5e1, 0xe2e8f0);
            gridHelper.rotation.x = Math.PI/2; // Lưới Oxy
            scene.add(gridHelper); 
            scene.add(objectsGroup);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            for(let i=1; i<=5; i++) document.getElementById(`btn-mode-${i}`).addEventListener('click', () => switchMode(i));
            switchMode(1);
            animate();
        }

        function updateMath(tex, res) {
            katex.render(tex, mathFormula, { throwOnError: false, displayMode: true });
            mathResult.innerHTML = res.replace(/\$(.*?)\$/g, (m, math) => {
                try { return katex.renderToString(math, { throwOnError: false }); } catch(e) { return m; }
            });
        }
        function buildUI(html) { controlsContainer.innerHTML = html; }

        // --- M1: VẤN ĐỀ THỰC TẾ (Chảo thu sóng vệ tinh) ---
        function renderM1() {
            setCameraMode(false); 
            clearAll();
            
            // Vẽ Parabol y^2 = 2px. Lấy p = 4 => y^2 = 8x => x = y^2 / 8
            const p = 4;
            const F = new THREE.Vector3(p/2, 0, 0); // Tiêu điểm (2,0)
            createPoint(F, 0x1e293b, 'Bộ thu sóng (F)');

            // Vẽ đường cong Parabol
            const archPts = [];
            for (let y = -6; y <= 6; y += 0.2) archPts.push(new THREE.Vector3((y*y)/(2*p), y, 0));
            drawThickCurve(archPts, 0x94a3b8, 0.08); // Mặt chảo

            // Tia sóng tới
            const moveY = state.m1.y;
            const intersectX = (moveY * moveY) / (2*p);
            const M = new THREE.Vector3(intersectX, moveY, 0);
            
            // Vẽ tia sóng song song chiếu tới mặt chảo
            drawThickVector(new THREE.Vector3(12, moveY, 0), M, 0x0ea5e9, 0.04); 
            
            // Vẽ tia dội lại (Phản xạ hội tụ về Tiêu điểm F)
            drawThickVector(M, F, 0xf59e0b, 0.04);
            createPoint(M, 0x0ea5e9, 0.1);

            // Vẽ một vài tia cố định mờ mờ cho đẹp
            const drawStaticRay = (sy) => {
                const sx = (sy*sy)/(2*p);
                const sM = new THREE.Vector3(sx, sy, 0);
                objectsGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(new THREE.Vector3(12, sy, 0), sM), 1, 0.015, 8, false), new THREE.MeshBasicMaterial({color:0xcbd5e1, transparent:true, opacity:0.5})));
                objectsGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(sM, F), 1, 0.015, 8, false), new THREE.MeshBasicMaterial({color:0xfcd34d, transparent:true, opacity:0.5})));
            };
            drawStaticRay(-4); drawStaticRay(4); drawStaticRay(-2); drawStaticRay(2);

            updateMath(`\\text{Thiết kế Parabol}`, 
                `<div class="mb-1 font-bold text-amber-700">Tác dụng hội tụ của Parabol:</div>
                <div class="mb-2">Mọi tia sóng (vệ tinh, ánh sáng mặt trời, âm thanh) bay song song với trục đối xứng của chảo Parabol, sau khi đập vào bề mặt sẽ **bật ngược lại và hội tụ tuyệt đối** tại Tiêu điểm $F$. Ngược lại, nếu đặt bóng đèn ở $F$, các tia sáng sẽ phản xạ tạo thành luồng sáng song song chiếu đi rất xa (đèn pha ô tô).</div>
                <div class="p-3 rounded bg-amber-50 border border-amber-200">
                    <span class="font-bold text-sky-600">👉 Hãy kéo thanh trượt</span> thay đổi vị trí tia sóng tới. Bạn thấy không? Dù đập vào đâu, nó vẫn luôn dội thẳng vào bộ thu sóng (F)!
                </div>`);
        }

        // --- M2: KIẾN THỨC TRỌNG TÂM (Định nghĩa quỹ tích) ---
        function renderM2() {
            setCameraMode(false); 
            clearAll(); drawStandardAxes(10, 8, 'Đỉnh O');
            
            const p = state.m2.p;
            const yM = state.m2.y;
            const xM = (yM * yM) / (2 * p);
            
            // Tiêu điểm F(p/2, 0)
            const F = new THREE.Vector3(p/2, 0, 0);
            createPoint(F, 0xdc2626, `F(${p/2}, 0)`, new THREE.Vector3(0,-0.6,0)); 

            // Đường chuẩn Delta: x = -p/2
            drawLine(new THREE.Vector3(-p/2, -8, 0), new THREE.Vector3(-p/2, 8, 0), 0x059669, 5);
            createTextSprite('Δ', '#059669', 0.8).position.set(-p/2 - 0.5, 7, 0);

            // Vẽ toàn bộ Parabol
            const curvePts = [];
            for (let y = -8; y <= 8; y += 0.2) curvePts.push(new THREE.Vector3((y*y)/(2*p), y, 0));
            drawThickCurve(curvePts, 0x2563eb, 0.04);

            // Điểm M
            const M = new THREE.Vector3(xM, yM, 0);
            createPoint(M, 0x1e293b, 'M(x,y)', new THREE.Vector3(0,0.5,0));

            // Điểm H trên đường chuẩn (hình chiếu của M)
            const H = new THREE.Vector3(-p/2, yM, 0);
            createPoint(H, 0x059669, 'H', new THREE.Vector3(-0.5,0.5,0));

            // Vẽ 2 đoạn bằng nhau MF và MH
            drawLine(F, M, 0xdc2626, 4); 
            drawLine(H, M, 0x059669, 4);

            const MF = M.distanceTo(F); const MH = M.distanceTo(H);

            updateMath(`MF = d(M, \\Delta) \\quad \\Rightarrow \\quad y^2 = 2px`, 
                `<div class="mb-1 font-bold text-blue-700">Định nghĩa Quỹ tích:</div>
                <div class="mb-2">Tập hợp các điểm $M$ sao cho khoảng cách đến Tiêu điểm $F$ luôn bằng khoảng cách đến đường chuẩn $\\Delta$. ($MF = MH$). Biến đổi ta được phương trình chính tắc của Parabol.</div>
                <ul class="list-disc pl-5 space-y-1 mb-3 text-slate-700">
                    <li>Tham số tiêu: $p = ${p}$</li>
                    <li>Tiêu điểm $F\\left(\\frac{p}{2}; 0\\right) = F(${p/2}; 0)$</li>
                    <li>Đường chuẩn $\\Delta: x = -\\frac{p}{2} \\Rightarrow x = ${-p/2}$</li>
                </ul>
                <div class="p-2 rounded bg-blue-50 border border-blue-200">
                    <span class="font-bold text-emerald-700">Đo thực tế:</span> $MF = ${MF.toFixed(2)}$ ; Khoảng cách $MH = ${MH.toFixed(2)}$
                </div>`);
        }

        // --- M3: VÍ DỤ 1 (Tìm các yếu tố) ---
        function renderM3() {
            setCameraMode(false); 
            clearAll(); drawStandardAxes(12, 8, 'O');
            
            // PT: y^2 = 8x => 2p = 8 => p=4. F(2,0). Delta: x = -2.
            const p = 4;
            
            // Vẽ Parabol chuẩn
            const curvePts = [];
            for (let y = -8; y <= 8; y += 0.2) curvePts.push(new THREE.Vector3((y*y)/(2*p), y, 0));
            drawThickCurve(curvePts, 0x94a3b8, 0.04);

            const step = state.m3.showElements;
            let resultText = "Từ phương trình $(P): y^2 = 8x$. Ta đem so sánh với phương trình chuẩn $y^2 = 2px$:";
            
            if (step >= 1) { 
                resultText += "<br><br><span class='font-bold text-amber-600'>1. Tìm tham số tiêu p:</span><br>Ta có $2p = 8 \\Rightarrow \\mathbf{p = 4}$.";
            }
            if (step >= 2) { 
                createPoint(new THREE.Vector3(2,0,0), 0xdc2626, 'F(2,0)', new THREE.Vector3(0,-0.6,0));
                resultText += "<br><br><span class='font-bold text-rose-600'>2. Tọa độ Tiêu điểm F:</span><br>Công thức $F\\left(\\frac{p}{2}; 0\\right) \\Rightarrow \\mathbf{F(2; 0)}$.";
            }
            if (step >= 3) { 
                drawLine(new THREE.Vector3(-2, -8, 0), new THREE.Vector3(-2, 8, 0), 0x059669, 5);
                createTextSprite('Δ: x=-2', '#059669', 0.8).position.set(-2, 7, 0);
                resultText += `<br><br><span class='font-bold text-emerald-600'>3. Phương trình Đường chuẩn $\\Delta$:</span><br>Công thức $\\Delta: x = -\\frac{p}{2} \\Rightarrow \\mathbf{\\Delta: x = -2}$.`;
            }

            updateMath(`(P): y^2 = 8x`, 
                `<div class="mb-1 font-bold text-emerald-700">Ví dụ 1: Trích xuất các yếu tố hình học</div>
                <div class="text-slate-800 leading-relaxed">${resultText}</div>`);
        }

        // --- M4: VÍ DỤ 2 (Lập phương trình) ---
        function renderM4() {
            setCameraMode(false); 
            clearAll(); drawStandardAxes(15, 10, 'O');
            
            const step = state.m4.step;
            let resultText = "<strong>Bài toán:</strong> Lập phương trình chính tắc của Parabol $(P)$ biết tọa độ tiêu điểm $F(3; 0)$.<br><br>";
            
            if (step >= 1) {
                resultText += "- Điểm $F$ nằm trên tia $Ox$ nên $(P)$ có dạng $y^2 = 2px$.<br>";
                createPoint(new THREE.Vector3(3,0,0), 0xdc2626, 'F(3,0)', new THREE.Vector3(0,-0.6,0));
            }
            if (step >= 2) { 
                resultText += "- Tọa độ tiêu điểm là $F\\left(\\frac{p}{2}; 0\\right)$.<br> $\\Rightarrow \\frac{p}{2} = 3 \\Rightarrow \\mathbf{p = 6}$.<br>";
            }
            if (step >= 3) {
                drawLine(new THREE.Vector3(-3, -10, 0), new THREE.Vector3(-3, 10, 0), 0x059669, 5);
                createTextSprite('Δ: x=-3', '#059669', 0.8).position.set(-3, 9, 0);
                resultText += "- Mở rộng: Phương trình đường chuẩn là $\\Delta: x = -3$.<br>";
            }
            if (step >= 4) { 
                resultText += "<br><span class='text-emerald-700 font-bold'>Kết luận: Phương trình chính tắc là $y^2 = 12x$</span>";
                const p = 6;
                const curvePts = [];
                for (let y = -10; y <= 10; y += 0.2) curvePts.push(new THREE.Vector3((y*y)/(2*p), y, 0));
                drawThickCurve(curvePts, 0x2563eb, 0.05); // Vẽ Parabol chốt lại
            }

            updateMath(`\\text{Dạng PT: } y^2 = 2px`, 
                `<div class="mb-1 font-bold text-purple-700">Ví dụ 2: Lập phương trình Parabol</div>
                <div class="text-slate-800 leading-relaxed">${resultText}</div>`);
        }

        // --- M5: VÍ DỤ 3 (Thiết kế Anten) ---
        function renderM5() {
            setCameraMode(false); controls.target.set(1, 0, 0); camera.position.set(1, 0, 8);
            clearAll(); 
            
            // Vẽ 1 nửa hệ trục cho chảo
            drawLine(new THREE.Vector3(-1,0,0), new THREE.Vector3(6,0,0), 0x94a3b8, 2); // Ox (Trục chảo)
            drawLine(new THREE.Vector3(0,-4,0), new THREE.Vector3(0,4,0), 0x94a3b8, 2);  // Oy (Đáy chảo)
            createPoint(new THREE.Vector3(0,0,0), 0x1e293b, 0.08, 'Đáy O');

            const W = state.m5.w; // Bề rộng miệng chảo
            const D = state.m5.d; // Độ sâu đáy chảo
            
            // Điểm mép chảo là M(D, W/2). Thuộc y^2 = 2px => (W/2)^2 = 2pD => p = W^2 / (8D).
            // Tiêu điểm f = p/2 = W^2 / (16D)
            const p = (W * W) / (8 * D);
            const focusX = p / 2;

            // Vẽ Chảo (Parabol)
            const archPts = [];
            for(let y = -W/2; y <= W/2; y += 0.05) archPts.push(new THREE.Vector3((y*y)/(2*p), y, 0));
            drawThickCurve(archPts, 0x2563eb, 0.06);

            // Mép miệng chảo
            createPoint(new THREE.Vector3(D, W/2, 0), 0x1e293b, 0.1, 'Mép trên');
            createPoint(new THREE.Vector3(D, -W/2, 0), 0x1e293b, 0.1, 'Mép dưới');
            drawDashed(new THREE.Vector3(D, W/2, 0), new THREE.Vector3(D, -W/2, 0), 0x94a3b8); // Đường kính miệng
            
            // Bộ thu sóng F
            createPoint(new THREE.Vector3(focusX, 0, 0), 0xdc2626, 0.15, 'Bộ thu (F)', new THREE.Vector3(0, -0.4, 0));

            let ptText = `Gắn hệ trục tọa độ tại đáy chảo. Phương trình mặt cắt chảo là $y^2 = 2px$.<br>`;
            ptText += `<br>Miệng chảo rộng $${W}m$, sâu $${D}m$ $\\Rightarrow$ Điểm mép chảo có tọa độ $M(${D}; ${W/2})$.<br>`;
            ptText += `Thay tọa độ $M$ vào PT: $(${W/2})^2 = 2p \\cdot ${D} \\Rightarrow 2p = ${(W*W/4).toFixed(2)} / ${D} = ${(W*W/(4*D)).toFixed(2)}$.<br>`;
            ptText += `$\\Rightarrow p = ${(W*W/(8*D)).toFixed(2)}$.`;

            updateMath(`y_M^2 = 2p x_M`, 
                `<div class="mb-1 font-bold text-rose-700">Ví dụ 3: Xác định vị trí bộ thu sóng</div>
                <div class="mb-2">Ăng-ten có bề rộng miệng $W = ${W}m$ và bề sâu $D = ${D}m$.</div>
                <div class="p-2 rounded bg-slate-50 border border-slate-200 text-sm text-slate-800">
                    ${ptText}
                    <div class="mt-2 font-bold text-rose-600">Kết luận: Tiêu điểm $F(\\frac{p}{2}; 0)$. Cần đặt bộ thu cách đáy $${focusX.toFixed(3)}m$.</div>
                </div>`);
        }

        function switchMode(mode) {
            currentMode = mode;
            [1,2,3,4,5].forEach(i => {
                const btn = document.getElementById(`btn-mode-${i}`);
                if (i === mode) btn.className = btn.className.replace('bg-opacity-50', 'shadow-md scale-105 z-10 font-bold border-l-8').replace('bg-gray-50', ''); // Active styling
                else btn.className = `w-full text-left px-4 py-3 rounded-lg transition font-semibold text-sm shadow-sm border-l-4 bg-gray-50 bg-opacity-50 hover:bg-gray-100 ${['border-amber-500 text-amber-900', 'border-blue-500 text-blue-900', 'border-emerald-500 text-emerald-900', 'border-purple-500 text-purple-900', 'border-rose-500 text-rose-900'][i-1]}`;
            });

            // Ghi đè Active styling chính xác cho nút được chọn
            const activeBtn = document.getElementById(`btn-mode-${mode}`);
            const colors = ['amber', 'blue', 'emerald', 'purple', 'rose'];
            const c = colors[mode-1];
            activeBtn.className = `w-full text-left px-4 py-3 rounded-lg transition font-bold text-sm shadow-md border-l-8 bg-${c}-100 border-${c}-600 text-${c}-900 scale-105 origin-left`;

            const problemHtml = problems[mode - 1].replace(/\$(.*?)\$/g, (m, math) => {
                try { return katex.renderToString(math, { throwOnError: false }); } catch(e) { return m; }
            });
            document.getElementById('problem-text').innerHTML = problemHtml;

            if(mode === 1) buildUI(`<label class="text-xs font-bold">Kéo để di chuyển tia sóng song song: <span class="text-blue-600">${state.m1.y.toFixed(1)}</span><input type="range" min="-5" max="5" step="0.2" value="${state.m1.y}" oninput="state.m1.y=parseFloat(this.value); renderM1(); this.previousElementSibling.innerText=this.value"></label>`);
            else if(mode === 2) buildUI(`<div class="flex gap-4">
                <label class="text-xs font-bold w-1/2">Độ mở Parabol (Tham số tiêu p): <span class="text-blue-600">${state.m2.p}</span><input type="range" min="2" max="6" step="0.5" value="${state.m2.p}" oninput="state.m2.p=parseFloat(this.value); renderM2(); this.previousElementSibling.innerText=this.value"></label>
                <label class="text-xs font-bold w-1/2">Quét điểm M dọc theo Parabol: <span class="text-blue-600">${state.m2.y}</span><input type="range" min="-7" max="7" step="0.5" value="${state.m2.y}" oninput="state.m2.y=parseFloat(this.value); renderM2(); this.previousElementSibling.innerText=this.value"></label>
            </div>`);
            else if(mode === 3) buildUI(`<label class="text-xs font-bold">Kéo để xem từng bước phân tích: Bước <span class="text-blue-600">${state.m3.showElements}</span>/3<input type="range" min="0" max="3" step="1" value="${state.m3.showElements}" oninput="state.m3.showElements=parseInt(this.value); renderM3(); this.previousElementSibling.innerText=this.value"></label>`);
            else if(mode === 4) buildUI(`<label class="text-xs font-bold">Kéo để Giải bài toán: Bước <span class="text-blue-600">${state.m4.step}</span>/4<input type="range" min="0" max="4" step="1" value="${state.m4.step}" oninput="state.m4.step=parseInt(this.value); renderM4(); this.previousElementSibling.innerText=this.value"></label>`);
            else if(mode === 5) buildUI(`<div class="flex gap-4">
                <label class="text-xs font-bold w-1/2">Bề rộng miệng chảo $W$: <span class="text-blue-600">${state.m5.w}m</span><input type="range" min="1" max="6" step="0.2" value="${state.m5.w}" oninput="state.m5.w=parseFloat(this.value); renderM5(); this.previousElementSibling.innerText=this.value+'m'"></label>
                <label class="text-xs font-bold w-1/2">Độ sâu đáy chảo $D$: <span class="text-blue-600">${state.m5.d}m</span><input type="range" min="0.2" max="2" step="0.1" value="${state.m5.d}" oninput="state.m5.d=parseFloat(this.value); renderM5(); this.previousElementSibling.innerText=this.value+'m'"></label>
            </div>`);

            clearAll(); 
            window[`renderM${mode}`]();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.state = state;
        window.renderM1 = renderM1; window.renderM2 = renderM2; window.renderM3 = renderM3;
        window.renderM4 = renderM4; window.renderM5 = renderM5;

        window.onload = init;
    </script>
</body>
</html>

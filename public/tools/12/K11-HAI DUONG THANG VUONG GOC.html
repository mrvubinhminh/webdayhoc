<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài học: Hai Đường thẳng Vuông góc</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- KaTeX for Math Formulas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #f1f5f9; color: #1e293b; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .pointer-events-auto { pointer-events: auto; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.05); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.2); border-radius: 4px; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%; background: #2563eb; cursor: pointer; margin-top: -7px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #cbd5e1; border-radius: 2px; }
        
        .expanded-panel {
            position: fixed !important; top: 50% !important; left: 50% !important; transform: translate(-50%, -50%) !important;
            width: 98vw !important; max-width: 100% !important; height: 96vh !important; max-height: 100vh !important;
            z-index: 100 !important; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25) !important;
            background: #ffffff !important; 
            backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
            display: flex !important; flex-direction: column !important;
        }
        .expanded-panel #info-content { padding: 3rem !important; gap: 2rem !important; overflow-y: auto !important; }
        .expanded-panel #math-formula { font-size: 40px !important; padding: 2rem !important; min-height: 150px !important; overflow-x: auto !important; }
        .expanded-panel #math-result, .expanded-panel #math-result * { font-size: 32px !important; line-height: 1.6 !important; }
        .expanded-panel #math-result { padding: 2rem !important; }
        .expanded-panel h3 { font-size: 36px !important; }
        .expanded-panel h3 svg { width: 36px !important; height: 36px !important; }
        
        .minimized-panel {
            background: transparent !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
            border: none !important; box-shadow: none !important; pointer-events: none;
        }
        .minimized-panel .panel-header { background: transparent !important; border-bottom: none !important; pointer-events: auto; }
        .minimized-panel .panel-title { opacity: 0; pointer-events: none; }
        .minimized-panel #control-footer-hint { display: none !important; }
        .minimized-panel label { text-shadow: 0 0 6px rgba(255,255,255,0.9), 0 0 2px rgba(255,255,255,1) !important; }
        .minimized-panel #controls-container { opacity: 0.35; transition: opacity 0.3s ease; pointer-events: auto; }
        .minimized-panel #controls-container:hover { opacity: 1; }
        .minimized-panel input[type=range]::-webkit-slider-runnable-track { background: rgba(203, 213, 225, 0.5) !important; }
        .minimized-panel input[type=range]::-webkit-slider-thumb { background: rgba(37, 99, 235, 0.6) !important; box-shadow: none !important; }
    </style>

    <script>
        window.togglePanel = function(contentId, iconId) {
            document.getElementById(contentId).classList.toggle('hidden');
            document.getElementById(iconId).classList.toggle('-rotate-90');
        };

        window.toggleExpand = function() {
            const panel = document.getElementById('info-panel');
            const overlay = document.getElementById('expand-overlay');
            const content = document.getElementById('info-content');
            const icon = document.getElementById('info-icon');
            
            if (panel.classList.contains('expanded-panel')) {
                panel.classList.remove('expanded-panel');
                overlay.classList.add('hidden'); content.classList.add('hidden'); icon.classList.add('-rotate-90');
            } else {
                panel.classList.add('expanded-panel');
                overlay.classList.remove('hidden'); content.classList.remove('hidden'); icon.classList.remove('-rotate-90');
            }
        };

        window.toggleControlPanel = function() {
            document.getElementById('bottom-panel').classList.toggle('minimized-panel');
            document.getElementById('control-icon').classList.toggle('-rotate-90');
        };

        window.toggleFullScreen = function() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(e => console.warn(e));
            else if (document.exitFullscreen) document.exitFullscreen();
        };

        document.addEventListener('keydown', (e) => { if (e.key.toLowerCase() === 'f' && e.target.tagName !== 'INPUT') window.toggleFullScreen(); });
    </script>
</head>
<body>

    <canvas id="drawing-layer" class="absolute top-0 left-0 w-full h-full pointer-events-none z-[5]"></canvas>

    <!-- Application Script -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;
        let objectsGroup = new THREE.Group();
        let currentMode = 1;
        
        let isDrawingMode = false; let drawType = 'pen'; 
        let drawnItems = []; let currentItem = null; let isDrawing = false;
        let drawCanvas, dCtx;

        const state = {
            m1: { t: 0 },                  // Khái niệm: Dịch chuyển d' song song
            m2: { angle: 0 },              // Vuông góc: Xoay đường thẳng b
            m3: { offset: -6 },            // Tính chất: Dịch chuyển đường thẳng c
            m4: { vAngle: 45 },            // Véc tơ: Thay đổi hướng vec v
            m5: { step: 0 },               // Ví dụ 1: Tứ diện đều
            m6: { step: 0 },               // Ví dụ 2: Lập phương
            m7: { rotX: 0, rotZ: 0 },      // Biểu diễn: Xoay góc vuông
            m8: { step: 0 }                // Thực tế: Giác móng nhà 3-4-5
        };

        const problems = [
            "Làm sao để đo góc giữa hai đường thẳng khi chúng <span class='text-red-700 font-bold'>chéo nhau</span> và không hề có điểm chung? Không có gì khó! Chỉ cần dùng phép tịnh tiến để 'bốc' chúng lại gần nhau.",

        const mathFormula = document.getElementById('math-formula');
        const mathResult = document.getElementById('math-result');

        // --- HÀM VẼ CƠ BẢN LÊN 3D ---
        function createTextSprite(text, color, scale=1.0) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 128;
            const context = canvas.getContext('2d');
            context.font = 'Bold 42px "Segoe UI", Arial';
            context.fillStyle = color; context.textAlign = 'center'; context.textBaseline = 'middle';
            context.lineWidth = 6; context.strokeStyle = 'white';
            context.strokeText(text, 128, 64); context.fillText(text, 128, 64);
            const texture = new THREE.CanvasTexture(canvas);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false }));
            sprite.scale.set(scale*2, scale, scale); return sprite;
        }

        function createPoint(pos, color=0xdc2626, size=0.15, label='', offset=new THREE.Vector3(0, 0.4, 0)) {
            if (typeof size === 'string') { label = size; size = 0.15; }
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(size, 16, 16), new THREE.MeshPhongMaterial({ color }));
            mesh.position.copy(pos); objectsGroup.add(mesh);
            if (label) {
                const sprite = createTextSprite(label, '#' + color.toString(16).padStart(6, '0'), 0.8);
                sprite.position.copy(pos).add(offset); objectsGroup.add(sprite);
            }
            return mesh;
        }

        function drawLine(p1, p2, color=0x1e293b, width=2) {
            const radius = width * 0.01; 
            const dist = p1.distanceTo(p2);
            if(dist < 0.001) return null;
            
            const curve = new THREE.LineCurve3(p1, p2);
            const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 1, radius, 8, false), new THREE.MeshPhongMaterial({ color }));
            objectsGroup.add(mesh); 
            
            const dashSize = 0.3; const gapSize = 0.2; const step = dashSize + gapSize;
            const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
            for (let d = 0; d < dist; d += step) {
                const start = new THREE.Vector3().copy(p1).addScaledVector(dir, d);
                const currentDash = Math.min(dashSize, dist - d);
                if (currentDash <= 0.001) continue;
                const end = new THREE.Vector3().copy(start).addScaledVector(dir, currentDash);
                
                const dashMat = new THREE.MeshBasicMaterial({ 
                    color, depthFunc: THREE.GreaterDepth, depthWrite: false, transparent: true, opacity: 0.4 
                });
                objectsGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(start, end), 1, radius, 8, false), dashMat));
            }
            return mesh;
        }

        function drawDashed(p1, p2, color=0x94a3b8, width=1.5) {
            const radius = width * 0.01; const dist = p1.distanceTo(p2);
            if(dist < 0.001) return null; 
            const dashSize = 0.3; const gapSize = 0.2; const step = dashSize + gapSize;
            const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
            for (let d = 0; d < dist; d += step) {
                const start = new THREE.Vector3().copy(p1).addScaledVector(dir, d);
                const currentDash = Math.min(dashSize, dist - d);
                if (currentDash <= 0.001) continue;
                const end = new THREE.Vector3().copy(start).addScaledVector(dir, currentDash);
                objectsGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(start, end), 1, radius, 8, false), new THREE.MeshBasicMaterial({ color, depthTest: false, transparent: true, opacity: 0.6 })));
            }
        }

        function drawThickVector(p1, p2, color=0x94a3b8, radius=0.03) {
            const group = new THREE.Group();
            const dist = p1.distanceTo(p2);
            if(dist < 0.001) return group;
            const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
            const headLength = radius * 6; const headRadius = radius * 2.5;
            const shaftLength = Math.max(0, dist - headLength);
            if(shaftLength > 0) {
                const mesh = new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(p1, new THREE.Vector3().copy(p1).addScaledVector(dir, shaftLength)), 1, radius, 8, false), new THREE.MeshPhongMaterial({ color }));
                group.add(mesh);
            }
            const headGeom = new THREE.ConeGeometry(headRadius, headLength, 16);
            headGeom.translate(0, headLength/2, 0); 
            const headMesh = new THREE.Mesh(headGeom, new THREE.MeshPhongMaterial({ color }));
            headMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
            headMesh.position.copy(p1).addScaledVector(dir, shaftLength);
            group.add(headMesh);
            objectsGroup.add(group); return group;
        }

        function drawAngleArc(O, dirA, dirB, radius, color, labelText='') {
            const v1 = dirA.clone().normalize();
            const v2 = dirB.clone().normalize();
            const angle = v1.angleTo(v2);
            
            if (angle < 0.01) return; // Parallel
            
            const proj = v1.clone().multiplyScalar(v2.dot(v1));
            let vOrtho = v2.clone().sub(proj);
            if (vOrtho.lengthSq() < 0.0001) return; 
            vOrtho.normalize();
            
            const points = [];
            for(let i=0; i<=20; i++) {
                const a = (i/20) * angle;
                const pt = new THREE.Vector3().copy(O)
                    .addScaledVector(v1, radius * Math.cos(a))
                    .addScaledVector(vOrtho, radius * Math.sin(a));
                points.push(pt);
            }
            const geom = new THREE.BufferGeometry().setFromPoints(points);
            const mat = new THREE.LineBasicMaterial({color: color, linewidth: 4, depthTest: false});
            objectsGroup.add(new THREE.Line(geom, mat));

            if(labelText) {
                const midA = angle/2;
                const midP = new THREE.Vector3().copy(O)
                    .addScaledVector(v1, (radius+0.8) * Math.cos(midA))
                    .addScaledVector(vOrtho, (radius+0.8) * Math.sin(midA));
                createTextSprite(labelText, '#'+color.toString(16).padStart(6,'0'), 0.8).position.copy(midP);
            }
        }

        function drawRightAngle(O, dirA, dirB, size, color) {
            const vA = dirA.clone().normalize();
            const vB = dirB.clone().normalize();
            const A = new THREE.Vector3().copy(O).addScaledVector(vA, size);
            const B = new THREE.Vector3().copy(O).addScaledVector(vB, size);
            const C = new THREE.Vector3().copy(A).addScaledVector(vB, size);
            
            // Vẽ hộp vuông nhỏ mờ để nổi bật
            createFace([O, A, C, B], color, 0.4, false);
            drawLine(A, C, color, 3);
            drawLine(B, C, color, 3);
        }

        function drawStandardAxes(xLen = 8, yLen = 8, zLen = 8) {
            drawThickVector(new THREE.Vector3(0,0,0), new THREE.Vector3(xLen,0,0), 0xdc2626, 0.03);
            createTextSprite('x', '#dc2626', 0.8).position.set(xLen+0.5, 0, 0);
            drawThickVector(new THREE.Vector3(0,0,0), new THREE.Vector3(0,yLen,0), 0x059669, 0.03);
            createTextSprite('y', '#059669', 0.8).position.set(0, yLen+0.5, 0);
            drawThickVector(new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,zLen), 0x2563eb, 0.03);
            createTextSprite('z', '#2563eb', 0.8).position.set(0, 0, zLen+0.5);
            createPoint(new THREE.Vector3(0,0,0), 0x1e293b, 0.15, 'O', new THREE.Vector3(-0.5, -0.5, 0));
        }

        function createFace(points, color, opacity=0.5, addOccluder=true) {
            const geom = new THREE.BufferGeometry().setFromPoints(points);
            const indices = [];
            for (let i = 1; i < points.length - 1; i++) indices.push(0, i, i + 1);
            geom.setIndex(indices);
            geom.computeVertexNormals();
            
            if (addOccluder) {
                const occluder = new THREE.Mesh(geom, new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: true, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 }));
                occluder.renderOrder = -1;
                objectsGroup.add(occluder);
            }
            const mesh = new THREE.Mesh(geom, new THREE.MeshPhongMaterial({color, side:THREE.DoubleSide, transparent:true, opacity, depthWrite: false}));
            objectsGroup.add(mesh);
            return mesh;
        }

        function drawBasePlane(w = 16, h = 16, y = 0, color = 0x38bdf8, label = '(P)') {
            const P_A = new THREE.Vector3(-w/2, y, h/2); const P_B = new THREE.Vector3(w/2, y, h/2);
            const P_C = new THREE.Vector3(w/2, y, -h/2); const P_D = new THREE.Vector3(-w/2, y, -h/2);
            createFace([P_A, P_B, P_C, P_D], color, 0.2, false); 
            drawLine(P_A, P_B, color, 1); drawLine(P_B, P_C, color, 1); drawLine(P_C, P_D, color, 1); drawLine(P_D, P_A, color, 1);
            createTextSprite(label, '#' + color.toString(16).padStart(6, '0'), 1).position.set(w/2 - 1, y + 0.5, h/2 - 1);
        }

        function clearAll() {
            while (objectsGroup.children.length > 0) {
                const child = objectsGroup.children[0];
                if (child.geometry) child.geometry.dispose();
                if (child.material) { if (Array.isArray(child.material)) child.material.forEach(m => m.dispose()); else child.material.dispose(); }
                objectsGroup.remove(child);
            }
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf8fafc); 
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(12, 10, 18);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI/2 + 0.1; 
            
            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(10, 20, 15); scene.add(dirLight);
            
            scene.add(objectsGroup);

            drawCanvas = document.getElementById('drawing-layer');
            dCtx = drawCanvas.getContext('2d');
            resizeDrawCanvas();

            drawCanvas.addEventListener('mousedown', handleMouseStart);
            drawCanvas.addEventListener('mousemove', handleMouseMove);
            drawCanvas.addEventListener('mouseup', handleMouseEnd);
            drawCanvas.addEventListener('mouseleave', handleMouseEnd);
            
            drawCanvas.addEventListener('touchstart', handleMouseStart, {passive: false});
            drawCanvas.addEventListener('touchmove', (e) => { if(isDrawingMode) e.preventDefault(); handleMouseMove(e); }, {passive: false});
            drawCanvas.addEventListener('touchend', handleMouseEnd);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                resizeDrawCanvas();
            });

            for(let i=1; i<=8; i++) document.getElementById(`btn-mode-${i}`).addEventListener('click', () => switchMode(i));
            switchMode(1);
            animate();
        }

        function updateMath(tex, res) {
            katex.render(tex, mathFormula, { throwOnError: false, displayMode: true });
            mathResult.innerHTML = res.replace(/\$(.*?)\$/g, (m, math) => {
                try { return katex.renderToString(math, { throwOnError: false }); } catch(e) { return m; }
            });
        }
        function buildUI(html) { controlsContainer.innerHTML = html; }

        // --- M1: Khái niệm Góc ---
        function renderM1() {
            camera.position.set(12, 10, 18); controls.target.set(0, 0, 0);
            clearAll(); drawStandardAxes(8,8,8);
            
            const t = state.m1.t; // 0 to 1
            
            // Đường a (Cố định, dọc trục X)
            const a1 = new THREE.Vector3(-6, 0, 0); const a2 = new THREE.Vector3(6, 0, 0);
            drawLine(a1, a2, 0xdc2626, 6); createTextSprite('a', '#dc2626', 1).position.copy(a2).add(new THREE.Vector3(0,0.5,0));
            
            // Đường b (Chéo nhau, trên cao)
            const b1_orig = new THREE.Vector3(-4, 5, -4); const b2_orig = new THREE.Vector3(4, 5, 4);
            drawDashed(b1_orig, b2_orig, 0x94a3b8, 2); createTextSprite('b', '#94a3b8', 1).position.copy(b2_orig).add(new THREE.Vector3(0,0.5,0));

            // Đường b' (Tịnh tiến)
            const b1_t = new THREE.Vector3(-4, 5*(1-t), -4); const b2_t = new THREE.Vector3(4, 5*(1-t), 4);
            drawLine(b1_t, b2_t, 0x3b82f6, 6); createTextSprite("b'", '#3b82f6', 1).position.copy(b2_t).add(new THREE.Vector3(0,0.5,0));

            if (t > 0 && t < 1) {
                // Mũi tên tịnh tiến
                drawThickVector(b1_orig, b1_t, 0xf59e0b, 0.05);
                drawThickVector(b2_orig, b2_t, 0xf59e0b, 0.05);
            }

            let res = "Để đo góc giữa 2 đường thẳng chéo nhau $a$ và $b$, ta không thể dùng thước đo trực tiếp vì chúng không cắt nhau. Giải pháp là gì?<br>";
            if (t === 1) {
                res += "<br><span class='text-emerald-700 font-bold'>Dùng phép tịnh tiến! Từ điểm O, kẻ đường $b' \\parallel b$. Khi đó góc $(a, b)$ chính là góc nhọn tạo bởi $a$ và $b'$ tại giao điểm O.</span>";
                const dirA = new THREE.Vector3(1,0,0); const dirB = new THREE.Vector3(4,0,4).normalize();
                drawAngleArc(new THREE.Vector3(0,0,0), dirA, dirB, 2, 0x059669, '45°');
            } else {
                res += "<br><span class='text-amber-700 font-bold'>Kéo thanh trượt để di chuyển đường thẳng $b$ (xanh dương) tịnh tiến xuống cắt đường thẳng $a$ (đỏ).</span>";
            }

            updateMath(`\\widehat{(a, b)} = \\widehat{(a, b')}`, 
                `<div class="mb-1 font-bold text-amber-700">Khái niệm: Góc giữa 2 đường thẳng</div>
                <div class="text-slate-800 leading-relaxed text-base">${res}</div>`);
        }

        // --- M2: Định nghĩa Vuông góc ---
        function renderM2() {
            camera.position.set(10, 8, 16); controls.target.set(0, 0, 0);
            clearAll(); drawStandardAxes(8,8,8);
            
            const angle = state.m2.angle * Math.PI/180;
            
            // Đường a dọc X
            drawLine(new THREE.Vector3(-6,0,0), new THREE.Vector3(6,0,0), 0xdc2626, 6);
            createTextSprite('a', '#dc2626', 1).position.set(6.5, 0.5, 0);
            
            // Đường b trên cao H=5, xoay góc angle
            const H = 5;
            const dirB = new THREE.Vector3(Math.cos(angle), 0, Math.sin(angle));
            const b1 = new THREE.Vector3(-dirB.x*6, H, -dirB.z*6);
            const b2 = new THREE.Vector3(dirB.x*6, H, dirB.z*6);
            
            drawLine(b1, b2, 0x3b82f6, 6);
            createTextSprite('b', '#3b82f6', 1).position.copy(b2).add(new THREE.Vector3(0, 0.5, 0));

            // Đường b' bóng mờ
            drawDashed(new THREE.Vector3(-dirB.x*6,0,-dirB.z*6), new THREE.Vector3(dirB.x*6,0,dirB.z*6), 0x94a3b8, 2);

            const isPerp = (state.m2.angle === 90);

            if (isPerp) {
                drawRightAngle(new THREE.Vector3(0,0,0), new THREE.Vector3(1,0,0), new THREE.Vector3(0,0,1), 1.5, 0x059669);
            } else {
                drawAngleArc(new THREE.Vector3(0,0,0), new THREE.Vector3(1,0,0), dirB, 2, 0xf59e0b, `${state.m2.angle}°`);
            }

            updateMath(isPerp ? `\\widehat{(a, b)} = 90^\\circ \\Leftrightarrow a \\perp b` : `\\widehat{(a, b)} = ${state.m2.angle}^\\circ`, 
                `<div class="mb-1 font-bold text-blue-700">Định nghĩa Hai đường Vuông góc</div>
                <div class="mb-2">Trong không gian, hai đường thẳng được gọi là vuông góc với nhau nếu <span class="text-red-700 font-bold">góc giữa chúng bằng $90^\\circ$</span>, bất chấp việc chúng có cắt nhau hay chéo nhau!</div>
                <div class="p-3 rounded ${isPerp ? 'bg-emerald-50 border-emerald-200' : 'bg-blue-50 border-blue-200'} border">
                    <span class="font-bold ${isPerp ? 'text-emerald-700' : 'text-blue-800'}">${isPerp ? '✨ Chuẩn Góc Vuông! Mặc dù $a$ và $b$ lơ lửng chéo nhau, nhưng phương của chúng đã hoàn toàn Vuông Góc.' : 'Kéo thanh trượt xoay đường thẳng $b$ (xanh) cho đến khi góc chiếu (bóng mờ) đạt đúng $90^\\circ$.'}</span>
                </div>`);
        }

        // --- M3: Tính chất Song song & Vuông góc ---
        function renderM3() {
            camera.position.set(12, 10, 18); controls.target.set(0, 0, 0);
            clearAll(); drawStandardAxes(8,8,8);
            
            // Đường a // b
            const a1 = new THREE.Vector3(-6, 0, 4); const a2 = new THREE.Vector3(6, 0, 4);
            const b1 = new THREE.Vector3(-6, 0, -4); const b2 = new THREE.Vector3(6, 0, -4);
            drawLine(a1, a2, 0xdc2626, 5); createTextSprite('a', '#dc2626', 1).position.copy(a2).add(new THREE.Vector3(0.5,0.5,0));
            drawLine(b1, b2, 0x3b82f6, 5); createTextSprite('b', '#3b82f6', 1).position.copy(b2).add(new THREE.Vector3(0.5,0.5,0));
            createFace([a1, a2, b2, b1], 0x94a3b8, 0.2); // (P) mờ

            const offset = state.m3.offset; 
            // Đường c vuông góc với a (cọc đứng)
            const c1 = new THREE.Vector3(offset, -5, 4); const c2 = new THREE.Vector3(offset, 5, 4);
            drawLine(c1, c2, 0x059669, 6); createTextSprite('c', '#059669', 1).position.copy(c2).add(new THREE.Vector3(0,0.5,0));
            drawRightAngle(new THREE.Vector3(offset, 0, 4), new THREE.Vector3(1,0,0), new THREE.Vector3(0,1,0), 1.5, 0xdc2626);

            // Đường c' di chuyển dọc trục Z từ a đến b
            const c_ghost1 = new THREE.Vector3(offset, -5, 4 + offset/10); // Simple trick for animation
            // Thay vì cọc đứng cắt, ta dùng một thanh xà gồ gác ngang vuông góc
            
            clearAll(); drawStandardAxes(8,8,8);
            drawLine(a1, a2, 0xdc2626, 5); createTextSprite('a', '#dc2626', 1).position.copy(a2).add(new THREE.Vector3(0.5,0.5,0));
            drawLine(b1, b2, 0x3b82f6, 5); createTextSprite('b', '#3b82f6', 1).position.copy(b2).add(new THREE.Vector3(0.5,0.5,0));
            createFace([a1, a2, b2, b1], 0x94a3b8, 0.2);
            
            // Thanh c nằm ngang vuông góc a (trục Z)
            const xC = offset; // -6 to 6
            const c_1 = new THREE.Vector3(xC, 0, 7); const c_2 = new THREE.Vector3(xC, 0, -7);
            drawLine(c_1, c_2, 0x059669, 6); createTextSprite('c', '#059669', 1).position.copy(c_1).add(new THREE.Vector3(0.5,0,0));
            
            drawRightAngle(new THREE.Vector3(xC, 0, 4), new THREE.Vector3(1,0,0), new THREE.Vector3(0,0,-1), 1.5, 0xdc2626);

                <div class="p-3 rounded ${isZero ? 'bg-emerald-50 border-emerald-200' : 'bg-purple-50 border-purple-200'} border">

        // --- CÁC HÀM UI ---
        window.toggleMenuWidth = function() {
            const container = document.getElementById('left-menu-container');
            const titleSpan = document.querySelector('#left-menu-title span');
            if (container.classList.contains('md:w-[120px]')) {
                container.classList.remove('md:w-[120px]'); container.classList.add('md:w-[350px]');
                titleSpan.style.opacity = '1'; titleSpan.style.width = 'auto';
            } else {
                container.classList.remove('md:w-[350px]'); container.classList.add('md:w-[120px]');
                titleSpan.style.opacity = '0'; titleSpan.style.width = '0px';
            }
        };

        function resizeDrawCanvas() {
            if(drawCanvas) { drawCanvas.width = window.innerWidth; drawCanvas.height = window.innerHeight; redrawCanvas(); }
        }

        window.toggleDrawingMode = function() {
            isDrawingMode = !isDrawingMode;
            const options = document.getElementById('draw-options');
            const btn = document.getElementById('btn-toggle-draw');
            if (isDrawingMode) {
                options.classList.remove('hidden'); options.classList.add('flex');
                btn.classList.add('bg-blue-50', 'text-blue-600', 'border-blue-300');
                drawCanvas.classList.remove('pointer-events-none'); drawCanvas.classList.add('pointer-events-auto', 'cursor-crosshair');
                controls.enabled = false; 
            } else {
                options.classList.add('hidden'); options.classList.remove('flex');
                btn.classList.remove('bg-blue-50', 'text-blue-600', 'border-blue-300');
                drawCanvas.classList.add('pointer-events-none'); drawCanvas.classList.remove('pointer-events-auto', 'cursor-crosshair');
                controls.enabled = true; 
            }
        };

        window.setDrawType = function(type) {
            drawType = type;
            ['pen', 'solid', 'dashed', 'eraser'].forEach(t => {
                document.getElementById(`btn-${t === 'solid' ? 'line-solid' : (t === 'dashed' ? 'line-dashed' : t)}`).className = type === t ? 'p-1.5 bg-blue-100 text-blue-600 rounded border border-blue-300 transition-colors' : 'p-1.5 hover:bg-slate-100 text-slate-600 rounded border border-transparent transition-colors';
            });
        };

        window.clearDrawing = function() { drawnItems = []; redrawCanvas(); };

        const handleMouseStart = (e) => {
            if(!isDrawingMode) return;
            isDrawing = true;
            const color = document.getElementById('draw-color').value;
            const rect = drawCanvas.getBoundingClientRect();
            const clientX = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const clientY = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            
            if (drawType === 'eraser') currentItem = { type: 'eraser', points: [{x: clientX, y: clientY}] };
            else if (drawType === 'pen') currentItem = { type: 'pen', color, points: [{x: clientX, y: clientY}] };
            else currentItem = { type: 'line', startX: clientX, startY: clientY, endX: clientX, endY: clientY, color, dashed: drawType === 'dashed' };
        };

        const handleMouseMove = (e) => {
            if(!isDrawing || !isDrawingMode) return;
            const rect = drawCanvas.getBoundingClientRect();
            const clientX = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const clientY = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            
            if (drawType === 'eraser' || drawType === 'pen') currentItem.points.push({x: clientX, y: clientY});
            else { currentItem.endX = clientX; currentItem.endY = clientY; }
            redrawCanvas(); drawItem(currentItem); 
        };

        const handleMouseEnd = () => {
            if(!isDrawing || !isDrawingMode) return;
            isDrawing = false;
            if(currentItem) {
                if (currentItem.type === 'line' && (Math.abs(currentItem.startX - currentItem.endX) > 2 || Math.abs(currentItem.startY - currentItem.endY) > 2)) drawnItems.push(currentItem);
                else if ((currentItem.type === 'eraser' || currentItem.type === 'pen') && currentItem.points.length > 1) drawnItems.push(currentItem);
            }
            currentItem = null; redrawCanvas();
        };

        function drawItem(item) {
            if (item.type === 'line') {
                dCtx.globalCompositeOperation = 'source-over';
                dCtx.beginPath(); dCtx.moveTo(item.startX, item.startY); dCtx.lineTo(item.endX, item.endY);
                dCtx.strokeStyle = item.color; dCtx.lineWidth = 4;
                if(item.dashed) dCtx.setLineDash([10, 10]); else dCtx.setLineDash([]);
                dCtx.stroke();
            } else if (item.type === 'pen') {
                dCtx.globalCompositeOperation = 'source-over';
                dCtx.beginPath(); dCtx.moveTo(item.points[0].x, item.points[0].y);
                for(let i=1; i<item.points.length; i++) dCtx.lineTo(item.points[i].x, item.points[i].y);
                dCtx.strokeStyle = item.color; dCtx.lineWidth = 4; dCtx.lineCap = 'round'; dCtx.lineJoin = 'round'; dCtx.setLineDash([]);
                dCtx.stroke();
            } else if (item.type === 'eraser') {
                dCtx.globalCompositeOperation = 'destination-out';
                dCtx.beginPath(); dCtx.moveTo(item.points[0].x, item.points[0].y);
                for(let i=1; i<item.points.length; i++) dCtx.lineTo(item.points[i].x, item.points[i].y);
                dCtx.strokeStyle = 'rgba(0,0,0,1)'; dCtx.lineWidth = 40; dCtx.lineCap = 'round'; dCtx.lineJoin = 'round'; dCtx.setLineDash([]);
                dCtx.stroke(); dCtx.globalCompositeOperation = 'source-over';
            }
        }
        
        function redrawCanvas() {
            dCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            drawnItems.forEach(drawItem);
        }

        function switchMode(mode) {
            currentMode = mode;
            [1,2,3,4,5,6,7,8].forEach(i => {
                const btn = document.getElementById(`btn-mode-${i}`);
                if (i === mode) btn.className = btn.className.replace('bg-opacity-50', 'shadow-md scale-105 z-10 font-bold border-l-8').replace('bg-gray-50', ''); 
                else btn.className = `w-full text-left px-4 py-2.5 rounded-lg transition font-semibold text-sm shadow-sm border-l-4 bg-gray-50 bg-opacity-50 hover:bg-gray-100 truncate overflow-hidden ${['border-amber-500 text-amber-900', 'border-blue-500 text-blue-900', 'border-emerald-500 text-emerald-900', 'border-purple-500 text-purple-900', 'border-teal-500 text-teal-900', 'border-cyan-500 text-cyan-900', 'border-fuchsia-500 text-fuchsia-900', 'border-rose-500 text-rose-900'][i-1]}`;
            });

            const activeBtn = document.getElementById(`btn-mode-${mode}`);
            const colors = ['amber', 'blue', 'emerald', 'purple', 'teal', 'cyan', 'fuchsia', 'rose'];
            activeBtn.className = `w-full text-left px-4 py-2.5 rounded-lg transition font-bold text-sm shadow-md border-l-8 bg-${colors[mode-1]}-100 border-${colors[mode-1]}-600 text-${colors[mode-1]}-900 scale-105 origin-left truncate overflow-hidden`;

            document.getElementById('problem-text').innerHTML = problems[mode - 1].replace(/\$(.*?)\$/g, (m, math) => {
                try { return katex.renderToString(math, { throwOnError: false }); } catch(e) { return m; }
            });

            if(mode === 1) buildUI(`<label class="text-xs font-bold">Kéo đường thẳng $b$ song song tịnh tiến về cắt $a$: <span class="text-blue-600">t = ${state.m1.t.toFixed(1)}</span><input type="range" min="0" max="1" step="0.1" value="${state.m1.t}" oninput="state.m1.t=parseFloat(this.value); renderM1(); this.previousElementSibling.innerText='t = '+this.value"></label>`);
            else if(mode === 2) buildUI(`<label class="text-xs font-bold">Xoay đường thẳng lơ lửng $b$ để kiểm tra góc: <span class="text-blue-600">${state.m2.angle}°</span><input type="range" min="0" max="180" step="5" value="${state.m2.angle}" oninput="state.m2.angle=parseFloat(this.value); renderM2(); this.previousElementSibling.innerText=this.value+'°'"></label>`);
            else if(mode === 3) buildUI(`<label class="text-xs font-bold">Trượt thanh xà gồ vuông góc $c$ dọc theo $a$: <span class="text-blue-600">Vị trí: ${state.m3.offset}</span><input type="range" min="-6" max="6" step="0.5" value="${state.m3.offset}" oninput="state.m3.offset=parseFloat(this.value); renderM3(); this.previousElementSibling.innerText='Vị trí: '+this.value"></label>`);
            else if(mode === 4) buildUI(`<label class="text-xs font-bold">Thay đổi góc của Véc-tơ $\\vec{v}$: <span class="text-blue-600">${state.m4.vAngle}°</span><input type="range" min="0" max="180" step="5" value="${state.m4.vAngle}" oninput="state.m4.vAngle=parseFloat(this.value); renderM4(); this.previousElementSibling.innerText=this.value+'°'"></label>`);
            else if(mode === 5) buildUI(`<label class="text-xs font-bold">Kéo để xem từng bước Chứng minh: Bước <span class="text-blue-600">${state.m5.step}</span>/3<input type="range" min="0" max="3" step="1" value="${state.m5.step}" oninput="state.m5.step=parseInt(this.value); renderM5(); this.previousElementSibling.innerText=this.value"></label>`);
            else if(mode === 6) buildUI(`<label class="text-xs font-bold">Kéo để xem từng bước Chứng minh: Bước <span class="text-blue-600">${state.m6.step}</span>/3<input type="range" min="0" max="3" step="1" value="${state.m6.step}" oninput="state.m6.step=parseInt(this.value); renderM6(); this.previousElementSibling.innerText=this.value"></label>`);
            else if(mode === 7) buildUI(`<div class="flex gap-4"><label class="text-xs font-bold w-1/2">Nghiêng góc chiếu X: <span class="text-blue-600">${state.m7.rotX}°</span><input type="range" min="0" max="60" step="2" value="${state.m7.rotX}" oninput="state.m7.rotX=parseFloat(this.value); renderM7(); this.previousElementSibling.innerText=this.value+'°'"></label><label class="text-xs font-bold w-1/2">Nghiêng góc chiếu Z: <span class="text-blue-600">${state.m7.rotZ}°</span><input type="range" min="0" max="60" step="2" value="${state.m7.rotZ}" oninput="state.m7.rotZ=parseFloat(this.value); renderM7(); this.previousElementSibling.innerText=this.value+'°'"></label></div>`);
            else if(mode === 8) buildUI(`<label class="text-xs font-bold">Thực hành căng dây đo góc tường vuông vức: Bước <span class="text-blue-600">${state.m8.step}</span>/3<input type="range" min="0" max="3" step="1" value="${state.m8.step}" oninput="state.m8.step=parseInt(this.value); renderM8(); this.previousElementSibling.innerText=this.value"></label>`);

            clearAll(); 
            window[`renderM${mode}`]();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.state = state;
        window.renderM1 = renderM1; window.renderM2 = renderM2; window.renderM3 = renderM3;
        window.renderM4 = renderM4; window.renderM5 = renderM5;
        window.renderM6 = renderM6; window.renderM7 = renderM7; window.renderM8 = renderM8;

        window.onload = init;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài học: Góc trong Không gian</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- KaTeX for Math Formulas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #f1f5f9; color: #1e293b; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .pointer-events-auto { pointer-events: auto; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.05); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.2); border-radius: 4px; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%; background: #2563eb; cursor: pointer; margin-top: -7px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #cbd5e1; border-radius: 2px; }
        
        .expanded-panel {
            position: fixed !important; top: 50% !important; left: 50% !important; transform: translate(-50%, -50%) !important;
            width: 98vw !important; max-width: 100% !important; height: 96vh !important; max-height: 100vh !important;
            z-index: 100 !important; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25) !important;
            background: #ffffff !important; 
            backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
            display: flex !important; flex-direction: column !important;
        }
        .expanded-panel #info-content { padding: 3rem !important; gap: 2rem !important; overflow-y: auto !important; }
        .expanded-panel #math-formula { font-size: 40px !important; padding: 2rem !important; min-height: 150px !important; overflow-x: auto !important; }
        .expanded-panel #math-result, .expanded-panel #math-result * { font-size: 32px !important; line-height: 1.6 !important; }
        .expanded-panel #math-result { padding: 2rem !important; }
        .expanded-panel h3 { font-size: 36px !important; }
        .expanded-panel h3 svg { width: 36px !important; height: 36px !important; }
        
        .minimized-panel {
            background: transparent !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
            border: none !important; box-shadow: none !important; pointer-events: none;
        }
        .minimized-panel .panel-header { background: transparent !important; border-bottom: none !important; pointer-events: auto; }
        .minimized-panel .panel-title { opacity: 0; pointer-events: none; }
        .minimized-panel #control-footer-hint { display: none !important; }
        .minimized-panel label { text-shadow: 0 0 6px rgba(255,255,255,0.9), 0 0 2px rgba(255,255,255,1) !important; }
        .minimized-panel #controls-container { opacity: 0.35; transition: opacity 0.3s ease; pointer-events: auto; }
        .minimized-panel #controls-container:hover { opacity: 1; }
        .minimized-panel input[type=range]::-webkit-slider-runnable-track { background: rgba(203, 213, 225, 0.5) !important; }
        .minimized-panel input[type=range]::-webkit-slider-thumb { background: rgba(37, 99, 235, 0.6) !important; box-shadow: none !important; }
        
        /* Ẩn UI khi bấm phím 9 */
        .ui-hidden .hideable-panel { opacity: 0 !important; pointer-events: none !important; }
    </style>

    <script>
        window.togglePanel = function(contentId, iconId) {
            document.getElementById(contentId).classList.toggle('hidden');
            document.getElementById(iconId).classList.toggle('-rotate-90');
        };

        window.toggleExpand = function() {
            const panel = document.getElementById('info-panel');
            const overlay = document.getElementById('expand-overlay');
            const content = document.getElementById('info-content');
            const icon = document.getElementById('info-icon');
            
            if (panel.classList.contains('expanded-panel')) {
                panel.classList.remove('expanded-panel'); overlay.classList.add('hidden'); content.classList.add('hidden'); icon.classList.add('-rotate-90');
            } else {
                panel.classList.add('expanded-panel'); overlay.classList.remove('hidden'); content.classList.remove('hidden'); icon.classList.remove('-rotate-90');
            }
        };

        window.toggleControlPanel = function() {
            document.getElementById('bottom-panel').classList.toggle('minimized-panel');
            document.getElementById('control-icon').classList.toggle('-rotate-90');
        };

        window.toggleFullScreen = function() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(e => console.warn(e));
            else if (document.exitFullscreen) document.exitFullscreen();
        };

        document.addEventListener('keydown', (e) => { 
            if (e.target.tagName === 'INPUT') return;
            const key = e.key.toLowerCase();
            if (key === 'f') window.toggleFullScreen(); 
            if (key >= '1' && key <= '8') { if (window.switchMode) window.switchMode(parseInt(key)); }
            if (key === '0') window.toggleExpand();
            if (key === '9') document.body.classList.toggle('ui-hidden');
        });
    </script>
</head>
<body>
    <div id="canvas-container"></div>
    <canvas id="drawing-layer" class="absolute top-0 left-0 w-full h-full pointer-events-none z-[5]"></canvas>
    
    <div id="ui-layer" class="absolute top-0 left-0 w-full h-full pointer-events-none flex flex-col justify-between p-3 md:p-5 z-10">
        <div id="expand-overlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-40 hidden transition-all duration-300 pointer-events-auto" onclick="toggleExpand()"></div>

        <!-- TOP MIDDLE ROW -->

            <div class="bg-transparent flex flex-col transition-all duration-300 items-center">
                <div class="px-5 py-2 flex justify-center items-center cursor-pointer select-none glass-panel rounded-full shadow-md border border-amber-200/60 hover:bg-white transition-colors" onclick="togglePanel('problem-content', 'problem-icon')">
                    <h2 class="text-base font-bold text-amber-700 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>

                    <svg id="problem-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-500 transition-transform duration-300 -rotate-90 ml-2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </div>
                <div id="problem-content" class="p-2 mt-4 transition-all duration-300 hidden w-full">
                    <div id="problem-text" class="text-lg md:text-xl text-slate-900 leading-relaxed font-bold text-center" style="text-shadow: 0 0 15px rgba(255,255,255,1), 0 0 20px rgba(255,255,255,0.9), 0 0 5px rgba(255,255,255,1);"></div>
                </div>
            </div>
        </div>

        <!-- TOP ROW -->
        <div class="flex flex-col md:flex-row justify-between items-start gap-4 w-full relative mt-12 md:mt-0">
            <!-- Menu Trái -->
            <div id="left-menu-container" class="w-full md:w-[350px] glass-panel rounded-xl pointer-events-auto shrink-0 flex flex-col transition-all duration-300 max-h-[85vh] overflow-hidden flex relative z-10 hideable-panel">

                    <div class="flex items-center gap-1 shrink-0">

                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
                        </button>
                        <svg id="mode-icon" onclick="togglePanel('mode-content', 'mode-icon')" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-500 transition-transform duration-300 cursor-pointer hover:bg-slate-100 rounded"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </div>
                </div>
                
                <div id="mode-content" class="px-4 pb-4 space-y-2 overflow-y-auto hidden-scrollbar">
                    <button id="btn-mode-1" class="w-full text-left px-4 py-2.5 rounded-lg transition font-semibold text-sm shadow-sm border-l-4 border-amber-500 bg-amber-50 text-amber-900">1. Khái niệm: Góc Đường & Mặt</button>
                    <button id="btn-mode-2" class="w-full text-left px-4 py-2.5 rounded-lg transition font-semibold text-sm shadow-sm border-l-4 border-blue-500 bg-blue-50 text-blue-900">2. Phương pháp: Dựng hình chiếu</button>
                    <button id="btn-mode-3" class="w-full text-left px-4 py-2.5 rounded-lg transition font-semibold text-sm shadow-sm border-l-4 border-emerald-500 bg-emerald-50 text-emerald-900">3. Khái niệm: Góc giữa Hai Mặt phẳng</button>
                    <button id="btn-mode-4" class="w-full text-left px-4 py-2.5 rounded-lg transition font-semibold text-sm shadow-sm border-l-4 border-purple-500 bg-purple-50 text-purple-900">4. Khái niệm: Góc Nhị diện</button>
                    <button id="btn-mode-5" class="w-full text-left px-4 py-2.5 rounded-lg transition font-semibold text-sm shadow-sm border-l-4 border-teal-500 bg-teal-50 text-teal-900">5. Ví dụ 1: Góc Cạnh bên và Đáy</button>
                    <button id="btn-mode-6" class="w-full text-left px-4 py-2.5 rounded-lg transition font-semibold text-sm shadow-sm border-l-4 border-cyan-500 bg-cyan-50 text-cyan-900">6. Ví dụ 2: Góc Mặt bên và Đáy</button>
                    <button id="btn-mode-7" class="w-full text-left px-4 py-2.5 rounded-lg transition font-semibold text-sm shadow-sm border-l-4 border-fuchsia-500 bg-fuchsia-50 text-fuchsia-900">7. Ví dụ 3: Góc phẳng Nhị diện chéo</button>
                    <button id="btn-mode-8" class="w-full text-left px-4 py-2.5 rounded-lg transition font-semibold text-sm shadow-sm border-l-4 border-rose-500 bg-rose-50 text-rose-900">8. Thực tế: Góc mở của Laptop</button>
                </div>
            </div>

            <!-- Bảng Công thức Phải -->
            <div id="info-panel" class="w-full md:w-[420px] glass-panel rounded-xl pointer-events-auto shrink-0 flex flex-col transition-all duration-300 relative hideable-panel">
                <div class="p-4 flex justify-between items-center select-none border-b border-slate-100 shrink-0 cursor-pointer" onclick="toggleExpand()" title="Click để phóng to/thu nhỏ">
                    <h3 class="font-bold text-indigo-700 text-lg flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>

                            <svg id="fullscreen-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
                        </button>
                        <button class="text-slate-400 hover:text-blue-600 transition-colors" title="Phóng to bảng">
                            <svg id="expand-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
                        </button>

                </div>

        <!-- BOTTOM ROW -->
        <div class="w-full flex justify-center relative mt-4 z-10 hideable-panel transition-opacity duration-300">
            <div id="bottom-panel" class="w-full md:w-[750px] glass-panel rounded-xl pointer-events-auto flex flex-col transition-all duration-300 shadow-xl border-t-4 border-t-indigo-500">

                        Thao tác Bài học

                    <svg id="control-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-500 transition-transform duration-300"><polyline points="6 9 12 15 18 9"></polyline></svg>

        <!-- Tác giả & Công cụ Vẽ -->
        <div class="absolute bottom-2 left-3 md:bottom-4 md:left-5 z-10 pointer-events-none select-none opacity-60 hideable-panel transition-opacity duration-300">
            <p class="text-[10px] md:text-xs text-slate-500 font-medium tracking-wide">
                Thầy Vũ Tiến Lực<br>Trường THPT Nguyễn Hữu Cảnh - TP Hồ Chí Minh
            </p>
        </div>
        <div class="absolute bottom-2 right-3 md:bottom-4 md:right-5 z-30 pointer-events-auto flex flex-col gap-2 items-end hideable-panel transition-opacity duration-300">
            <div id="draw-options" class="glass-panel p-2 rounded-lg flex-col gap-2 hidden transition-all origin-bottom-right shadow-lg border border-blue-200">
                <div class="flex gap-2 items-center">
                    <button id="btn-pen" class="p-1.5 bg-blue-100 text-blue-600 rounded border border-blue-300 transition-colors" onclick="setDrawType('pen')" title="Bút vẽ tự do"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg></button>

            <button id="btn-toggle-draw" onclick="toggleDrawingMode()" class="w-10 h-10 bg-white rounded-full shadow-lg border border-slate-200 flex items-center justify-center text-slate-600 hover:text-blue-600 hover:border-blue-300 transition-all hover:scale-105" title="Bật/Tắt Vẽ chú thích">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.586 7.586"></path><circle cx="11" cy="11" r="2"></circle></svg>
            </button>
        </div>
    </div>

    <!-- Application Script -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;
        let objectsGroup = new THREE.Group();
        let currentMode = 1;
        
        let isDrawingMode = false; let drawType = 'pen'; 
        let drawnItems = []; let currentItem = null; let isDrawing = false;
        let drawCanvas, dCtx;

        const state = {
            m1: { angle: 45 },             // Khái niệm Đường-Mặt: Xoay đường d
            m2: { step: 0 },               // Phương pháp: Dựng hình chiếu
            m3: { angle: 60 },             // Góc 2 mặt phẳng (0 -> 90)

        const problems = [

        const mathFormula = document.getElementById('math-formula');
        const mathResult = document.getElementById('math-result');

        // --- HÀM VẼ CƠ BẢN LÊN 3D ---
        function createTextSprite(text, color, scale=1.0) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 128;
            const context = canvas.getContext('2d');
            context.font = 'Bold 42px "Segoe UI", Arial';
            context.fillStyle = color; context.textAlign = 'center'; context.textBaseline = 'middle';
            context.lineWidth = 6; context.strokeStyle = 'white';
            context.strokeText(text, 128, 64); context.fillText(text, 128, 64);
            const texture = new THREE.CanvasTexture(canvas);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false }));
            sprite.scale.set(scale*2, scale, scale); return sprite;
        }

        function createPoint(pos, color=0xdc2626, size=0.15, label='', offset=new THREE.Vector3(0, 0.4, 0)) {
            if (typeof size === 'string') { label = size; size = 0.15; }
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(size, 16, 16), new THREE.MeshPhongMaterial({ color }));
            mesh.position.copy(pos); objectsGroup.add(mesh);
            if (label) {
                const sprite = createTextSprite(label, '#' + color.toString(16).padStart(6, '0'), 0.8);
                sprite.position.copy(pos).add(offset); objectsGroup.add(sprite);
            }
            return mesh;
        }

        function drawLine(p1, p2, color=0x1e293b, width=2) {
            const radius = width * 0.01; 
            const dist = p1.distanceTo(p2);
            if(dist < 0.001) return null;
            
            const curve = new THREE.LineCurve3(p1, p2);
            const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 1, radius, 8, false), new THREE.MeshPhongMaterial({ color }));
            objectsGroup.add(mesh); 
            
            const dashSize = 0.3; const gapSize = 0.2; const step = dashSize + gapSize;
            const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
            for (let d = 0; d < dist; d += step) {
                const start = new THREE.Vector3().copy(p1).addScaledVector(dir, d);
                const currentDash = Math.min(dashSize, dist - d);
                if (currentDash <= 0.001) continue;
                const end = new THREE.Vector3().copy(start).addScaledVector(dir, currentDash);
                
                const dashMat = new THREE.MeshBasicMaterial({ 
                    color, depthFunc: THREE.GreaterDepth, depthWrite: false, transparent: true, opacity: 0.4 
                });
                objectsGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(start, end), 1, radius, 8, false), dashMat));
            }
            return mesh;
        }

        function drawDashed(p1, p2, color=0x94a3b8, width=1.5) {
            const radius = width * 0.01; const dist = p1.distanceTo(p2);
            if(dist < 0.001) return null; 
            const dashSize = 0.3; const gapSize = 0.2; const step = dashSize + gapSize;
            const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
            for (let d = 0; d < dist; d += step) {
                const start = new THREE.Vector3().copy(p1).addScaledVector(dir, d);
                const currentDash = Math.min(dashSize, dist - d);
                if (currentDash <= 0.001) continue;
                const end = new THREE.Vector3().copy(start).addScaledVector(dir, currentDash);
                objectsGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(start, end), 1, radius, 8, false), new THREE.MeshBasicMaterial({ color, depthTest: false, transparent: true, opacity: 0.6 })));
            }
        }

        function drawRay(p1, p2, color=0xfcd34d, width=1.5) {
            const radius = width * 0.01; 
            const dist = p1.distanceTo(p2);
            if(dist < 0.001) return null; 
            
            const dashSize = 0.4; const gapSize = 0.2; const step = dashSize + gapSize;
            const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
            for (let d = 0; d < dist; d += step) {
                const start = new THREE.Vector3().copy(p1).addScaledVector(dir, d);
                const currentDash = Math.min(dashSize, dist - d);
                if (currentDash <= 0.001) continue;
                const end = new THREE.Vector3().copy(start).addScaledVector(dir, currentDash);
                objectsGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(start, end), 1, radius, 8, false), new THREE.MeshBasicMaterial({ color, depthTest: false, transparent: true, opacity: 0.6 })));
            }
        }

        function drawThickVector(p1, p2, color=0x94a3b8, radius=0.03) {
            const group = new THREE.Group();
            const dist = p1.distanceTo(p2);
            if(dist < 0.001) return group;
            const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
            const headLength = radius * 6; const headRadius = radius * 2.5;
            const shaftLength = Math.max(0, dist - headLength);
            if(shaftLength > 0) {
                const mesh = new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(p1, new THREE.Vector3().copy(p1).addScaledVector(dir, shaftLength)), 1, radius, 8, false), new THREE.MeshPhongMaterial({ color }));
                group.add(mesh);
            }
            const headGeom = new THREE.ConeGeometry(headRadius, headLength, 16);
            headGeom.translate(0, headLength/2, 0); 
            const headMesh = new THREE.Mesh(headGeom, new THREE.MeshPhongMaterial({ color }));
            headMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
            headMesh.position.copy(p1).addScaledVector(dir, shaftLength);
            group.add(headMesh);
            objectsGroup.add(group); return group;
        }

        function drawAngleArc(O, dirA, dirB, radius, color, labelText='', fill=true) {
            const v1 = dirA.clone().normalize();
            const v2 = dirB.clone().normalize();
            const angle = v1.angleTo(v2);
            
            if (angle < 0.01) return; 
            
            const proj = v1.clone().multiplyScalar(v2.dot(v1));
            let vOrtho = v2.clone().sub(proj);
            if (vOrtho.lengthSq() < 0.0001) return; 
            vOrtho.normalize();
            
            const points = [];
            if(fill) points.push(O.clone());
            for(let i=0; i<=20; i++) {
                const a = (i/20) * angle;
                const pt = new THREE.Vector3().copy(O)
                    .addScaledVector(v1, radius * Math.cos(a))
                    .addScaledVector(vOrtho, radius * Math.sin(a));
                points.push(pt);
            }
            if(fill) {
                points.push(O.clone());
                const geom = new THREE.BufferGeometry().setFromPoints(points);
                const mat = new THREE.MeshBasicMaterial({color: color, transparent:true, opacity:0.3, side: THREE.DoubleSide, depthTest: false});
                const mesh = new THREE.Mesh(geom, mat);
                objectsGroup.add(mesh);
            } else {
                const geom = new THREE.BufferGeometry().setFromPoints(points);
                const mat = new THREE.LineBasicMaterial({color: color, linewidth: 4, depthTest: false});
                objectsGroup.add(new THREE.Line(geom, mat));
            }

            if(labelText) {
                const midA = angle/2;
                const midP = new THREE.Vector3().copy(O)
                    .addScaledVector(v1, (radius+1) * Math.cos(midA))
                    .addScaledVector(vOrtho, (radius+1) * Math.sin(midA));
                createTextSprite(labelText, '#'+color.toString(16).padStart(6,'0'), 0.8).position.copy(midP);
            }
        }

        function drawRightAngle(O, dirA, dirB, size, color) {
            const vA = dirA.clone().normalize();
            const vB = dirB.clone().normalize();
            const A = new THREE.Vector3().copy(O).addScaledVector(vA, size);
            const B = new THREE.Vector3().copy(O).addScaledVector(vB, size);
            const C = new THREE.Vector3().copy(A).addScaledVector(vB, size);
            
            createFace([O, A, C, B], color, 0.4, false);
            drawLine(A, C, color, 3); drawLine(B, C, color, 3);
        }

        function drawStandardAxes(xLen = 8, yLen = 8, zLen = 8) {
            drawThickVector(new THREE.Vector3(0,0,0), new THREE.Vector3(xLen,0,0), 0xdc2626, 0.03);
            createTextSprite('x', '#dc2626', 0.8).position.set(xLen+0.5, 0, 0);
            drawThickVector(new THREE.Vector3(0,0,0), new THREE.Vector3(0,yLen,0), 0x059669, 0.03);
            createTextSprite('y', '#059669', 0.8).position.set(0, yLen+0.5, 0);
            drawThickVector(new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,zLen), 0x2563eb, 0.03);
            createTextSprite('z', '#2563eb', 0.8).position.set(0, 0, zLen+0.5);
            createPoint(new THREE.Vector3(0,0,0), 0x1e293b, 0.15, 'O', new THREE.Vector3(-0.5, -0.5, 0));
        }

        function createFace(points, color, opacity=0.5, addOccluder=true) {
            const geom = new THREE.BufferGeometry().setFromPoints(points);
            const indices = [];
            for (let i = 1; i < points.length - 1; i++) indices.push(0, i, i + 1);
            geom.setIndex(indices);
            geom.computeVertexNormals();
            
            if (addOccluder) {
                const occluder = new THREE.Mesh(geom, new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: true, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 }));
                occluder.renderOrder = -1;
                objectsGroup.add(occluder);
            }
            const mesh = new THREE.Mesh(geom, new THREE.MeshPhongMaterial({color, side:THREE.DoubleSide, transparent:true, opacity, depthWrite: false}));
            objectsGroup.add(mesh);
            return mesh;
        }

        function drawBasePlane(w = 16, h = 16, y = 0, color = 0x38bdf8, label = '(P)', planeAxis = 'y') {
            let P_A, P_B, P_C, P_D;
            if (planeAxis === 'y') {
                P_A = new THREE.Vector3(-w/2, y, h/2); P_B = new THREE.Vector3(w/2, y, h/2);
                P_C = new THREE.Vector3(w/2, y, -h/2); P_D = new THREE.Vector3(-w/2, y, -h/2);
            } else if (planeAxis === 'x') {
                P_A = new THREE.Vector3(y, -w/2, h/2); P_B = new THREE.Vector3(y, w/2, h/2);
                P_C = new THREE.Vector3(y, w/2, -h/2); P_D = new THREE.Vector3(y, -w/2, -h/2);
            } else { // z
                P_A = new THREE.Vector3(-w/2, h/2, y); P_B = new THREE.Vector3(w/2, h/2, y);
                P_C = new THREE.Vector3(w/2, -h/2, y); P_D = new THREE.Vector3(-w/2, -h/2, y);
            }
            createFace([P_A, P_B, P_C, P_D], color, 0.2, false); 
            drawLine(P_A, P_B, color, 1); drawLine(P_B, P_C, color, 1); drawLine(P_C, P_D, color, 1); drawLine(P_D, P_A, color, 1);
            if(label) createTextSprite(label, '#' + color.toString(16).padStart(6, '0'), 1).position.copy(P_B).add(new THREE.Vector3(-1, 0.5, -1));
        }

        function clearAll() {
            while (objectsGroup.children.length > 0) {
                const child = objectsGroup.children[0];
                if (child.geometry) child.geometry.dispose();
                if (child.material) { if (Array.isArray(child.material)) child.material.forEach(m => m.dispose()); else child.material.dispose(); }
                objectsGroup.remove(child);
            }
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf8fafc); 
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(12, 10, 18);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI/2 + 0.1; 
            
            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(10, 20, 15); scene.add(dirLight);
            
            scene.add(objectsGroup);

            drawCanvas = document.getElementById('drawing-layer');
            dCtx = drawCanvas.getContext('2d');
            resizeDrawCanvas();

            drawCanvas.addEventListener('mousedown', handleMouseStart);
            drawCanvas.addEventListener('mousemove', handleMouseMove);
            drawCanvas.addEventListener('mouseup', handleMouseEnd);
            drawCanvas.addEventListener('mouseleave', handleMouseEnd);
            
            drawCanvas.addEventListener('touchstart', handleMouseStart, {passive: false});
            drawCanvas.addEventListener('touchmove', (e) => { if(isDrawingMode) e.preventDefault(); handleMouseMove(e); }, {passive: false});
            drawCanvas.addEventListener('touchend', handleMouseEnd);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                resizeDrawCanvas();
            });

            for(let i=1; i<=8; i++) document.getElementById(`btn-mode-${i}`).addEventListener('click', () => switchMode(i));
            switchMode(1);
            animate();
        }

        function updateMath(tex, res) {
            katex.render(tex, mathFormula, { throwOnError: false, displayMode: true });
            mathResult.innerHTML = res.replace(/\$(.*?)\$/g, (m, math) => {
                try { return katex.renderToString(math, { throwOnError: false }); } catch(e) { return m; }
            });
        }
        function buildUI(html) { controlsContainer.innerHTML = html; }

        // --- M1: Khái niệm Góc Đường & Mặt ---
        function renderM1() {
            camera.position.set(12, 10, 16); controls.target.set(0, 0, 0);
            clearAll(); drawStandardAxes(8,8,8);
            drawBasePlane(16, 16, 0, 0x3b82f6, '(P)');
            
            const theta = state.m1.angle * Math.PI/180;
            const O = new THREE.Vector3(0,0,0);
            const r = 8;
            
            // Đường d xoay
            const M = new THREE.Vector3(r*Math.cos(theta), r*Math.sin(theta), 0);
            const H = new THREE.Vector3(r*Math.cos(theta), 0, 0);
            
            drawLine(O, M, 0xdc2626, 6); createTextSprite('d', '#dc2626', 1).position.copy(M).add(new THREE.Vector3(0, 0.5, 0));
            createPoint(O, 0x1e293b, 0.2, 'O', new THREE.Vector3(-0.6, -0.6, 0));
            
            if (state.m1.angle === 90) {
                // Vuông góc
                drawRightAngle(O, new THREE.Vector3(0,1,0), new THREE.Vector3(1,0,0), 1.5, 0xdc2626);
            } else if (state.m1.angle > 0) {
                createPoint(M, 0x1e293b, 0.2, 'M', new THREE.Vector3(0, 0.6, 0));
                createPoint(H, 0x1e293b, 0.2, "M'", new THREE.Vector3(0, -0.6, 0));
                
                drawDashed(M, H, 0x059669, 3); // Hình chiếu
                drawLine(O, H, 0x059669, 6); // d'
                createTextSprite("d'", '#059669', 1).position.copy(H).add(new THREE.Vector3(0.5, 0.5, 0));
                drawRightAngle(H, new THREE.Vector3(0,1,0), new THREE.Vector3(-1,0,0), 1, 0x059669);
                
                // Vẽ cung góc
                drawAngleArc(O, new THREE.Vector3(1,0,0), new THREE.Vector3().subVectors(M,O), 3, 0xf59e0b, `${state.m1.angle}°`, true);
            } else {
                // Song song / Trùng
                drawLine(new THREE.Vector3(-r, 0, 0), new THREE.Vector3(r, 0, 0), 0xdc2626, 6);
            }

            const isPerp = state.m1.angle === 90;

            updateMath(isPerp ? `\\widehat{(d, (P))} = 90^\\circ` : `\\widehat{(d, (P))} = \\widehat{MOM'} = ${state.m1.angle}^\\circ`, 
                `<div class="mb-1 font-bold text-amber-700">Khái niệm: Góc giữa Đường thẳng và Mặt phẳng</div>
                <div class="mb-2">Góc giữa đường thẳng $d$ và mặt phẳng $(P)$ chính là góc giữa đường thẳng $d$ và <span class="text-red-700 font-bold">hình chiếu vuông góc</span> của nó (đường thẳng $d'$) trên mặt phẳng $(P)$.</div>
                <div class="p-3 rounded bg-amber-50 border border-amber-200">
                    <span class="font-bold text-amber-800">👉 Tương tác:</span> Kéo thanh trượt để thay đổi độ dốc của chiếc thang $d$. Cung màu vàng chính là góc cần tìm. Lưu ý góc này luôn $\\le 90^\\circ$!
                </div>`);
        }

        // --- M2: Cách xác định Góc ---
        function renderM2() {
            camera.position.set(12, 10, 16); controls.target.set(0, 0, 0);
            clearAll(); drawStandardAxes(8,8,8);
            drawBasePlane(16, 16, 0, 0x3b82f6, '(P)');
            
            const step = state.m2.step;
            const O = new THREE.Vector3(0,0,0);
            const M = new THREE.Vector3(6, 6, 0);
            const H = new THREE.Vector3(6, 0, 0);

            drawLine(O, M, 0xdc2626, 6); createTextSprite('d', '#dc2626', 1).position.copy(M).add(new THREE.Vector3(0, 0.5, 0));

            let res = "Để dựng và tính góc giữa đường thẳng $d$ và mặt phẳng $(P)$, ta thực hiện <span class='text-red-700 font-bold'>3 BƯỚC VÀNG</span> sau:<br><br>";

            if (step >= 1) {
                createPoint(O, 0x1e293b, 0.2, 'O', new THREE.Vector3(-0.6, -0.6, 0));
                res += "- Bước 1: Tìm GIAO ĐIỂM của đường thẳng $d$ và mặt phẳng $(P)$ là điểm $O$. Điểm $O$ này sẽ là đỉnh của góc.<br>";
            }
            if (step >= 2) {
                createPoint(M, 0x1e293b, 0.2, 'M', new THREE.Vector3(0, 0.6, 0));
                createPoint(H, 0x1e293b, 0.2, "M'", new THREE.Vector3(0.5, 0, 0));
                drawDashed(M, H, 0x059669, 4);
                drawRightAngle(H, new THREE.Vector3(0,1,0), new THREE.Vector3(-1,0,0), 1, 0x059669);
                res += "- Bước 2: Lấy một điểm $M \\in d$. HẠ ĐƯỜNG VUÔNG GÓC từ $M$ xuống mặt phẳng $(P)$ ta được điểm $M'$.<br>";
            }
            if (step >= 3) {
                drawLine(O, H, 0x059669, 6); createTextSprite("d'", '#059669', 1).position.lerpVectors(O, H, 0.5).add(new THREE.Vector3(0,0.5,0));
                drawAngleArc(O, new THREE.Vector3(1,0,0), new THREE.Vector3(1,1,0).normalize(), 3, 0xf59e0b, `\\phi`, true);
                res += "<br><span class='text-emerald-700 font-bold'>Kết luận: NỐI LẠI! Nối hình chiếu $M'$ về giao điểm $O$, ta được góc cần tìm là $\\widehat{MOM'}$.</span>";
            }

            updateMath(`\\widehat{(d, (P))} = \\widehat{MOM'}`, 
                `<div class="mb-1 font-bold text-blue-700">Phương pháp Dựng góc Đường & Mặt</div>
                <div class="text-slate-800 leading-relaxed text-base">${res}</div>`);
        }

        // --- M3: Khái niệm Góc 2 Mặt phẳng ---
        function renderM3() {
            camera.position.set(12, 10, 18); controls.target.set(0, 0, 0);

        // --- M8: THỰC TẾ (Laptop) ---
        function renderM8() {
            camera.position.set(12, 8, 16); controls.target.set(0, 0, 0);
            clearAll(); 
            
            const angle = state.m8.angle * Math.PI/180;
            
            // Vẽ mặt bàn
            createFace([new THREE.Vector3(-15,0,15), new THREE.Vector3(15,0,15), new THREE.Vector3(15,0,-15), new THREE.Vector3(-15,0,-15)], 0x64748b, 0.4, false);

            // Bàn phím (Base)
            const b_w = 8; const b_d = 6; const b_h = 0.4;
            const baseGeo = new THREE.BoxGeometry(b_w, b_h, b_d);
            const baseMat = new THREE.MeshPhongMaterial({color: 0x94a3b8});
            const base = new THREE.Mesh(baseGeo, baseMat);
            base.position.set(0, b_h/2, 0);
            objectsGroup.add(base);

            // Keyboard details
            const kbGeo = new THREE.PlaneGeometry(b_w - 1, b_d - 2.5);
            const kbMat = new THREE.MeshBasicMaterial({color: 0x1e293b});
            const kb = new THREE.Mesh(kbGeo, kbMat);
            kb.rotation.x = -Math.PI/2; kb.position.set(0, b_h + 0.01, -0.5);
            objectsGroup.add(kb);

            // Trackpad
            const tpGeo = new THREE.PlaneGeometry(2.5, 1.5);
            const tpMat = new THREE.MeshBasicMaterial({color: 0x64748b});
            const tp = new THREE.Mesh(tpGeo, tpMat);
            tp.rotation.x = -Math.PI/2; tp.position.set(0, b_h + 0.01, 2);
            objectsGroup.add(tp);

            // Màn hình (Screen Lid) xoay quanh trục ở mép sau (z = -b_d/2)
            // Dùng Group để set tâm xoay
            const hingeGroup = new THREE.Group();
            hingeGroup.position.set(0, b_h, -b_d/2); // Đặt Hinge ở mép sau
            objectsGroup.add(hingeGroup);

            const lidGeo = new THREE.BoxGeometry(b_w, b_h, b_d);
            const lidMat = new THREE.MeshPhongMaterial({color: 0xcbd5e1});
            const lid = new THREE.Mesh(lidGeo, lidMat);
            // Đẩy lid lùi lên trên (theo local y, z) để khớp với hinge
            lid.position.set(0, b_d/2, 0); 
            
            // Screen details
            const scGeo = new THREE.PlaneGeometry(b_w - 0.5, b_d - 0.5);
            const scMat = new THREE.MeshBasicMaterial({color: 0x0f172a}); // Đen màn hình
            const sc = new THREE.Mesh(scGeo, scMat);
            sc.position.set(0, b_d/2, b_h/2 + 0.01);
            
            hingeGroup.add(lid);
            hingeGroup.add(sc);

            // Rotate hinge (Open angle)
            // 0 độ: gập lại. 90 độ: Đứng. state.m8.angle
            hingeGroup.rotation.x = angle; // Xoay quanh trục X. 
            // Do tọa độ local, góc dương thì nắp ngả ra sau
            
            // Vẽ góc cung minh họa
            const I = new THREE.Vector3(0, b_h, -b_d/2);
            const dirBase = new THREE.Vector3(0, 0, 1);
            // Vector nắp máy tính
            const dirLid = new THREE.Vector3(0, Math.sin(angle), Math.cos(angle)).normalize();

            // Trục bản lề (đường thẳng d)
            drawLine(new THREE.Vector3(-b_w/2, b_h, -b_d/2), new THREE.Vector3(b_w/2, b_h, -b_d/2), 0xdc2626, 4);

            drawAngleArc(I, dirBase, dirLid, 2.5, 0xf59e0b, `${state.m8.angle}°`, true);

            updateMath(`\\text{Góc mở Laptop } = ${state.m8.angle}^\\circ`, 
                `<div class="mb-1 font-bold text-rose-700">Thực tế: Góc mở của Laptop</div>
                <div class="mb-2">Chiếc Laptop yêu quý của bạn chính là một mô hình <span class="text-red-700 font-bold">Góc Nhị diện</span> hoàn hảo nhất. Bản lề là Cạnh nhị diện, bàn phím và màn hình là 2 nửa mặt phẳng!</div>
                <div class="p-3 rounded bg-slate-50 border border-slate-200">
                    <span class="font-bold text-slate-800">👉 Tương tác:</span> Kéo để gập mở màn hình. Bạn thấy không, góc mở của Laptop là góc tạo bởi mép màn hình và mép bàn phím (vì cả 2 mép này đều <span class="text-red-700 font-bold">vuông góc</span> với bản lề).
                </div>`);
        }

        // --- CÁC HÀM UI MỞ RỘNG ---
        window.toggleMenuWidth = function() {
            const container = document.getElementById('left-menu-container');
            const titleSpan = document.querySelector('#left-menu-title span');
            if (container.classList.contains('md:w-[120px]')) {
                container.classList.remove('md:w-[120px]'); container.classList.add('md:w-[350px]');
                titleSpan.style.opacity = '1'; titleSpan.style.width = 'auto';
            } else {
                container.classList.remove('md:w-[350px]'); container.classList.add('md:w-[120px]');
                titleSpan.style.opacity = '0'; titleSpan.style.width = '0px';
            }
        };

        function resizeDrawCanvas() {
            if(drawCanvas) { drawCanvas.width = window.innerWidth; drawCanvas.height = window.innerHeight; redrawCanvas(); }
        }

        window.toggleDrawingMode = function() {
            isDrawingMode = !isDrawingMode;
            const options = document.getElementById('draw-options');
            const btn = document.getElementById('btn-toggle-draw');
            if (isDrawingMode) {
                options.classList.remove('hidden'); options.classList.add('flex');
                btn.classList.add('bg-blue-50', 'text-blue-600', 'border-blue-300');
                drawCanvas.classList.remove('pointer-events-none'); drawCanvas.classList.add('pointer-events-auto', 'cursor-crosshair');
                controls.enabled = false; 
            } else {
                options.classList.add('hidden'); options.classList.remove('flex');
                btn.classList.remove('bg-blue-50', 'text-blue-600', 'border-blue-300');
                drawCanvas.classList.add('pointer-events-none'); drawCanvas.classList.remove('pointer-events-auto', 'cursor-crosshair');
                controls.enabled = true; 
            }
        };

        window.setDrawType = function(type) {
            drawType = type;
            ['pen', 'solid', 'dashed', 'eraser'].forEach(t => {
                document.getElementById(`btn-${t === 'solid' ? 'line-solid' : (t === 'dashed' ? 'line-dashed' : t)}`).className = type === t ? 'p-1.5 bg-blue-100 text-blue-600 rounded border border-blue-300 transition-colors' : 'p-1.5 hover:bg-slate-100 text-slate-600 rounded border border-transparent transition-colors';
            });
        };

        window.clearDrawing = function() { drawnItems = []; redrawCanvas(); };

        const handleMouseStart = (e) => {
            if(!isDrawingMode) return;
            isDrawing = true;
            const color = document.getElementById('draw-color').value;
            const rect = drawCanvas.getBoundingClientRect();
            const clientX = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const clientY = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            
            if (drawType === 'eraser') currentItem = { type: 'eraser', points: [{x: clientX, y: clientY}] };
            else if (drawType === 'pen') currentItem = { type: 'pen', color, points: [{x: clientX, y: clientY}] };
            else currentItem = { type: 'line', startX: clientX, startY: clientY, endX: clientX, endY: clientY, color, dashed: drawType === 'dashed' };
        };

        const handleMouseMove = (e) => {
            if(!isDrawing || !isDrawingMode) return;
            const rect = drawCanvas.getBoundingClientRect();
            const clientX = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const clientY = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            
            if (drawType === 'eraser' || drawType === 'pen') currentItem.points.push({x: clientX, y: clientY});
            else { currentItem.endX = clientX; currentItem.endY = clientY; }
            redrawCanvas(); drawItem(currentItem); 
        };

        const handleMouseEnd = () => {
            if(!isDrawing || !isDrawingMode) return;
            isDrawing = false;
            if(currentItem) {
                if (currentItem.type === 'line' && (Math.abs(currentItem.startX - currentItem.endX) > 2 || Math.abs(currentItem.startY - currentItem.endY) > 2)) drawnItems.push(currentItem);
                else if ((currentItem.type === 'eraser' || currentItem.type === 'pen') && currentItem.points.length > 1) drawnItems.push(currentItem);
            }
            currentItem = null; redrawCanvas();
        };

        function drawItem(item) {
            if (item.type === 'line') {
                dCtx.globalCompositeOperation = 'source-over';
                dCtx.beginPath(); dCtx.moveTo(item.startX, item.startY); dCtx.lineTo(item.endX, item.endY);
                dCtx.strokeStyle = item.color; dCtx.lineWidth = 4;
                if(item.dashed) dCtx.setLineDash([10, 10]); else dCtx.setLineDash([]);
                dCtx.stroke();
            } else if (item.type === 'pen') {
                dCtx.globalCompositeOperation = 'source-over';
                dCtx.beginPath(); dCtx.moveTo(item.points[0].x, item.points[0].y);
                for(let i=1; i<item.points.length; i++) dCtx.lineTo(item.points[i].x, item.points[i].y);
                dCtx.strokeStyle = item.color; dCtx.lineWidth = 4; dCtx.lineCap = 'round'; dCtx.lineJoin = 'round'; dCtx.setLineDash([]);
                dCtx.stroke();
            } else if (item.type === 'eraser') {
                dCtx.globalCompositeOperation = 'destination-out';
                dCtx.beginPath(); dCtx.moveTo(item.points[0].x, item.points[0].y);
                for(let i=1; i<item.points.length; i++) dCtx.lineTo(item.points[i].x, item.points[i].y);
                dCtx.strokeStyle = 'rgba(0,0,0,1)'; dCtx.lineWidth = 40; dCtx.lineCap = 'round'; dCtx.lineJoin = 'round'; dCtx.setLineDash([]);
                dCtx.stroke(); dCtx.globalCompositeOperation = 'source-over';
            }
        }
        
        function redrawCanvas() {
            dCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            drawnItems.forEach(drawItem);
        }

        function switchMode(mode) {
            currentMode = mode;
            [1,2,3,4,5,6,7,8].forEach(i => {
                const btn = document.getElementById(`btn-mode-${i}`);
                if (i === mode) btn.className = btn.className.replace('bg-opacity-50', 'shadow-md scale-105 z-10 font-bold border-l-8').replace('bg-gray-50', ''); 
                else btn.className = `w-full text-left px-4 py-2.5 rounded-lg transition font-semibold text-sm shadow-sm border-l-4 bg-gray-50 bg-opacity-50 hover:bg-gray-100 truncate overflow-hidden ${['border-amber-500 text-amber-900', 'border-blue-500 text-blue-900', 'border-emerald-500 text-emerald-900', 'border-purple-500 text-purple-900', 'border-teal-500 text-teal-900', 'border-cyan-500 text-cyan-900', 'border-fuchsia-500 text-fuchsia-900', 'border-rose-500 text-rose-900'][i-1]}`;
            });

            const activeBtn = document.getElementById(`btn-mode-${mode}`);
            const colors = ['amber', 'blue', 'emerald', 'purple', 'teal', 'cyan', 'fuchsia', 'rose'];
            activeBtn.className = `w-full text-left px-4 py-2.5 rounded-lg transition font-bold text-sm shadow-md border-l-8 bg-${colors[mode-1]}-100 border-${colors[mode-1]}-600 text-${colors[mode-1]}-900 scale-105 origin-left truncate overflow-hidden`;

            document.getElementById('problem-text').innerHTML = problems[mode - 1].replace(/\$(.*?)\$/g, (m, math) => {
                try { return katex.renderToString(math, { throwOnError: false }); } catch(e) { return m; }
            });

            if(mode === 1) buildUI(`<label class="text-xs font-bold">Xoay đường thẳng d ngả xuống mặt (P): <span class="text-blue-600">${state.m1.angle}°</span><input type="range" min="0" max="90" step="2" value="${state.m1.angle}" oninput="state.m1.angle=parseFloat(this.value); renderM1(); this.previousElementSibling.innerText=this.value+'°'"></label>`);
            else if(mode === 2) buildUI(`<label class="text-xs font-bold">Kéo để xem 3 bước Tìm Góc: Bước <span class="text-blue-600">${state.m2.step}</span>/3<input type="range" min="0" max="3" step="1" value="${state.m2.step}" oninput="state.m2.step=parseInt(this.value); renderM2(); this.previousElementSibling.innerText=this.value"></label>`);
            else if(mode === 3) buildUI(`<label class="text-xs font-bold">Xoay mặt phẳng (Q) thành góc tù: <span class="text-blue-600">${state.m3.angle}°</span><input type="range" min="10" max="170" step="2" value="${state.m3.angle}" oninput="state.m3.angle=parseFloat(this.value); renderM3(); this.previousElementSibling.innerText=this.value+'°'"></label>`);
            else if(mode === 4) buildUI(`<label class="text-xs font-bold">Mở rộng Góc Nhị diện: <span class="text-blue-600">${state.m4.angle}°</span><input type="range" min="10" max="170" step="2" value="${state.m4.angle}" oninput="state.m4.angle=parseFloat(this.value); renderM4(); this.previousElementSibling.innerText=this.value+'°'"></label>`);
            else if(mode === 5) buildUI(`<label class="text-xs font-bold">Kéo để xem Dựng hình & Tính toán: Bước <span class="text-blue-600">${state.m5.step}</span>/3<input type="range" min="0" max="3" step="1" value="${state.m5.step}" oninput="state.m5.step=parseInt(this.value); renderM5(); this.previousElementSibling.innerText=this.value"></label>`);
            else if(mode === 6) buildUI(`<label class="text-xs font-bold">Kéo để xem Dựng hình & Tính toán: Bước <span class="text-blue-600">${state.m6.step}</span>/3<input type="range" min="0" max="3" step="1" value="${state.m6.step}" oninput="state.m6.step=parseInt(this.value); renderM6(); this.previousElementSibling.innerText=this.value"></label>`);
            else if(mode === 7) buildUI(`<label class="text-xs font-bold">Kéo để xem Dựng hình & Tính toán: Bước <span class="text-blue-600">${state.m7.step}</span>/3<input type="range" min="0" max="3" step="1" value="${state.m7.step}" oninput="state.m7.step=parseInt(this.value); renderM7(); this.previousElementSibling.innerText=this.value"></label>`);
            else if(mode === 8) buildUI(`<label class="text-xs font-bold">Gập / Mở màn hình Laptop: <span class="text-blue-600">${state.m8.angle}°</span><input type="range" min="0" max="150" step="2" value="${state.m8.angle}" oninput="state.m8.angle=parseFloat(this.value); renderM8(); this.previousElementSibling.innerText=this.value+'°'"></label>`);

            clearAll(); 
            window[`renderM${mode}`]();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.state = state;
        window.renderM1 = renderM1; window.renderM2 = renderM2; window.renderM3 = renderM3;
        window.renderM4 = renderM4; window.renderM5 = renderM5;
        window.renderM6 = renderM6; window.renderM7 = renderM7; window.renderM8 = renderM8;
        window.switchMode = switchMode;

        window.onload = init;
    </script>
</body>
</html>

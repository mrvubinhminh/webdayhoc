<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô phỏng 3D Hình học Không gian Lớp 11</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- KaTeX for Math Formulas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #ffffff; color: #1e293b; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .pointer-events-auto { pointer-events: auto; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.05); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.2); border-radius: 4px; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%; background: #2563eb; cursor: pointer; margin-top: -7px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #cbd5e1; border-radius: 2px; }
        
        /* Styles cho chế độ Phóng to (Fullscreen) */
        .expanded-panel {
            position: fixed !important; top: 50% !important; left: 50% !important; transform: translate(-50%, -50%) !important;
            width: 90vw !important; max-width: 900px !important; height: auto !important; max-height: 90vh !important;
            z-index: 100 !important; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25) !important;
        }
        .expanded-panel #info-content { padding: 2rem !important; gap: 1.5rem !important; }
        .expanded-panel #math-formula { font-size: 2.2rem !important; padding: 2rem !important; min-height: 160px !important; }
        .expanded-panel #math-result { font-size: 1.25rem !important; line-height: 2.2rem !important; padding: 1.5rem !important; }
        .expanded-panel h3 { font-size: 1.5rem !important; }
        
        /* Chế độ thu gọn tối giản cho bảng điều khiển */
        .minimized-panel {
            background: transparent !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
            border: none !important; box-shadow: none !important; pointer-events: none;
        }
        .minimized-panel .panel-header { background: transparent !important; border-bottom: none !important; pointer-events: auto; }
        .minimized-panel .panel-title { opacity: 0; pointer-events: none; }
        .minimized-panel #control-footer-hint { display: none !important; }
        .minimized-panel label { text-shadow: 0 0 6px rgba(255,255,255,0.9), 0 0 2px rgba(255,255,255,1) !important; }
        
        /* Làm trong suốt thanh trượt, bật sáng khi di chuột (hover) */
        .minimized-panel #controls-container { 
            opacity: 0.35; 
            transition: opacity 0.3s ease; 
            pointer-events: auto;
        }
        .minimized-panel #controls-container:hover { 
            opacity: 1; 
        }
        .minimized-panel input[type=range]::-webkit-slider-runnable-track { 
            background: rgba(203, 213, 225, 0.5) !important; 
        }
        .minimized-panel input[type=range]::-webkit-slider-thumb { 
            background: rgba(37, 99, 235, 0.6) !important; 
            box-shadow: none !important; 
        }
    </style>

    <script>
        window.togglePanel = function(contentId, iconId) {
            const content = document.getElementById(contentId);
            const icon = document.getElementById(iconId);
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden'); icon.classList.remove('-rotate-90');
            } else {
                content.classList.add('hidden'); icon.classList.add('-rotate-90');
            }
        };

        window.toggleExpand = function() {
            const panel = document.getElementById('info-panel');
            const overlay = document.getElementById('expand-overlay');
            const icon = document.getElementById('expand-icon');

            if (panel.classList.contains('expanded-panel')) {
                panel.classList.remove('expanded-panel'); overlay.classList.add('hidden');
                icon.innerHTML = '<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>';
            } else {
                panel.classList.add('expanded-panel'); overlay.classList.remove('hidden');
                document.getElementById('info-content').classList.remove('hidden');
                document.getElementById('info-icon').classList.remove('-rotate-90');
                icon.innerHTML = '<path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path>';
            }
        };

        window.toggleControlPanel = function() {
            const panel = document.getElementById('bottom-panel');
            const icon = document.getElementById('control-icon');
            if (panel.classList.contains('minimized-panel')) {
                panel.classList.remove('minimized-panel'); icon.classList.remove('-rotate-90');
            } else {
                panel.classList.add('minimized-panel'); icon.classList.add('-rotate-90');
            }
        };

        // Hàm bật/tắt chế độ Toàn màn hình (Fullscreen)
        window.toggleFullScreen = function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.warn(`Lỗi khi mở toàn màn hình: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        };

        // Lắng nghe sự kiện thay đổi trạng thái toàn màn hình để đổi icon
        document.addEventListener('fullscreenchange', () => {
            const icon = document.getElementById('fullscreen-icon');
            if (document.fullscreenElement) {
                // Biểu tượng Thu nhỏ lại
                icon.innerHTML = '<path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/>';
            } else {
                // Biểu tượng Mở toàn màn hình
                icon.innerHTML = '<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>';
            }
        });

        // Phím tắt F để bật/tắt Toàn màn hình
        document.addEventListener('keydown', (event) => {
            if (event.key.toLowerCase() === 'f' && event.target.tagName !== 'INPUT') {
                window.toggleFullScreen();
            }
        });
    </script>
</head>

    <!-- Application Script -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;
        let objectsGroup = new THREE.Group();
        let pointGroup = new THREE.Group();
        let currentMode = 1;
        
        // State
        const state = {
            m1: { a: 4, h: 5 },
            m2: { a: 4 },
            m3: { a: 4, h: 5 },
            m4: { a: 5, b: 4, h: 5 },
            m5: { z: 2.5 },
            m6: { a: 4, h: 5 },
            m7: { a: 4, h: 5 },
            m8: { a: 4, h: 5 },
            m9: { a: 4, h: 5 },
            m10: { a: 4 }
        };

        const mathFormula = document.getElementById('math-formula');
        const mathResult = document.getElementById('math-result');
        const controlsContainer = document.getElementById('controls-container');

        // --- DRAWING HELPERS ---
        function createTextSprite(text, color, scale=1.2) {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const context = canvas.getContext('2d');
            context.font = 'Bold 48px "Segoe UI", Arial';
            context.fillStyle = color;
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            // Add a slight outline for better visibility
            context.lineWidth = 4;
            context.strokeStyle = 'white';
            context.strokeText(text, 64, 64);
            context.fillText(text, 64, 64);
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture, depthTest: false });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(scale, scale, scale);
            return sprite;
        }

        function createPoint(pos, color=0x1d4ed8, label='', labelOffset=new THREE.Vector3(0.5,0.5,0.5)) {
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), new THREE.MeshPhongMaterial({ color }));
            mesh.position.copy(pos);
            objectsGroup.add(mesh);
            if(label) {
                const sprite = createTextSprite(label, '#' + color.toString(16).padStart(6, '0'));
                sprite.position.copy(pos).add(labelOffset);
                objectsGroup.add(sprite);
            }
            return mesh;
        }

        function drawLine(p1, p2, color=0x1e293b, radius=0.03) {
            const path = new THREE.LineCurve3(p1, p2);
            const mesh = new THREE.Mesh(new THREE.TubeGeometry(path, 1, radius, 8, false), new THREE.MeshPhongMaterial({ color }));
            objectsGroup.add(mesh);
            return mesh;
        }

        // Thay đổi bản chất nét đứt thành các khối trụ 3D với bán kính bằng 1/2 nét liền (0.015)
        function drawDashed(p1, p2, color=0x64748b, radius=0.015) {
            const distance = p1.distanceTo(p2);
            const dashSize = 0.25; // Chiều dài 1 nét đứt
            const gapSize = 0.15;  // Khoảng trống giữa 2 nét đứt
            const step = dashSize + gapSize;
            const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
            
            for (let d = 0; d < distance; d += step) {
                const start = new THREE.Vector3().copy(p1).addScaledVector(dir, d);
                const currentDash = Math.min(dashSize, distance - d);
                if (currentDash <= 0.001) continue;
                
                const end = new THREE.Vector3().copy(start).addScaledVector(dir, currentDash);
                const path = new THREE.LineCurve3(start, end);
                const mesh = new THREE.Mesh(new THREE.TubeGeometry(path, 1, radius, 8, false), new THREE.MeshPhongMaterial({ color }));
                objectsGroup.add(mesh);
            }
        }

        function drawSolid(points, color=0x3b82f6, opacity=0.15) {
            const geom = new THREE.BufferGeometry();
            const vertices = [];
            points.forEach(p => vertices.push(p.x, p.y, p.z));
            geom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            const indices = [];
            for(let i=1; i<points.length-1; i++) { indices.push(0, i, i+1); }
            geom.setIndex(indices);
            geom.computeVertexNormals();
            const mesh = new THREE.Mesh(geom, new THREE.MeshPhongMaterial({ color, transparent: true, opacity, side: THREE.DoubleSide }));
            objectsGroup.add(mesh);
            return mesh;
        }

        function drawAngleArc(pCenter, p1, p2, radius, color=0xdc2626) {
            const v1 = new THREE.Vector3().subVectors(p1, pCenter).normalize();
            const v2 = new THREE.Vector3().subVectors(p2, pCenter).normalize();
            const normal = new THREE.Vector3().crossVectors(v1, v2).normalize();
            if (normal.length() < 0.001) return; // Parallel
            
            const angle = v1.angleTo(v2);
            const curve = new THREE.EllipseCurve(0, 0, radius, radius, 0, angle, false, 0);
            const points = curve.getPoints(30);
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const arc = new THREE.Line(geometry, new THREE.LineBasicMaterial({ color, linewidth: 3, depthTest: false }));
            
            arc.position.copy(pCenter);
            const matrix = new THREE.Matrix4().makeBasis(v1, new THREE.Vector3().crossVectors(normal, v1), normal);
            arc.quaternion.setFromRotationMatrix(matrix);
            objectsGroup.add(arc);
        }

        function clearAll() {
            while (objectsGroup.children.length > 0) {
                const child = objectsGroup.children[0];
                if (child.geometry) child.geometry.dispose();
                if (child.material) {
                    if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
                    else child.material.dispose();
                }
                objectsGroup.remove(child);
            }
        }

        // --- INIT ---
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);
            
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.up.set(0, 0, 1);
            camera.position.set(10, 10, 8);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

        }

        function updateMath(tex, res) {
            // Render phần công thức lớn (display math)
            katex.render(tex, mathFormula, { throwOnError: false, displayMode: true });
            
            // Dò tìm và render tất cả các công thức nội tuyến (inline math) nằm giữa 2 dấu $ trong phần Kết quả
            const renderedRes = res.replace(/\$(.*?)\$/g, (match, mathContent) => {
                try {
                    return katex.renderToString(mathContent, { throwOnError: false });
                } catch (e) {
                    return match; // Nếu lỗi cú pháp KaTeX thì giữ nguyên text
                }
            });
            
            mathResult.innerHTML = renderedRes;
        }

        function buildUI(html) {
            controlsContainer.innerHTML = html;
        }

            const O = new THREE.Vector3(a/2, a/2, 0); // Tâm đáy

            [A,B,C,D,S,O].forEach((p,i) => createPoint(p, 0x1d4ed8, ['A','B','C','D','S','O'][i]));
            drawSolid([S,B,D], 0x3b82f6, 0.3); // (SBD)

            [[A,B],[B,C],[C,D],[D,A],[S,A],[S,B],[S,C],[S,D]].forEach(e => drawLine(e[0], e[1]));
            drawDashed(B, D); drawDashed(A, C); drawDashed(S, O);
            
            // Kẻ AH perp SO
            const SO_vec = new THREE.Vector3().subVectors(S, O);
            const AO_vec = new THREE.Vector3().subVectors(O, A); // Wait, A to O is (a/2, a/2, 0)
            
            const t = A.distanceTo(O)**2 / (A.distanceTo(O)**2 + h**2);
            const H = new THREE.Vector3().lerpVectors(A, S, 0); // wrong logic, H is on SO
            const OS = new THREE.Vector3().subVectors(S,O);
            const OA = new THREE.Vector3().subVectors(A,O);
            const proj = OA.dot(OS) / OS.lengthSq();
            const H_true = new THREE.Vector3().copy(O).addScaledVector(OS, proj); // wait, triangle SAO is right at A.
            
            // In right triangle SAO at A: AH is altitude to hypotenuse SO.
            // H divides SO in ratio AH^2 / ... actually: vector AH = A - H.
            // Distance AH = SA * AO / SO.
            const AO_len = a * Math.sqrt(2) / 2;
            const SO_len = Math.sqrt(h*h + AO_len*AO_len);
            const AH_len = h * AO_len / SO_len;
            
            // Geometric H point:
            const SH_len = h*h / SO_len;
            const H_pt = new THREE.Vector3().copy(S).lerp(O, SH_len / SO_len);
            
            createPoint(H_pt, 0xdc2626, 'H');
            drawDashed(A, H_pt, 0xdc2626); // AH
            
            updateMath(`\\frac{1}{d^2} = \\frac{1}{SA^2} + \\frac{1}{AO^2}`,

                <div>Khoảng cách $d = ${AH_len.toFixed(2)}$</div>`);
            controls.target.copy(new THREE.Vector3(a/2, a/2, h/3));
        }

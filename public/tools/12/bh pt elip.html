<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài học Tương tác: Đường Elip</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- KaTeX for Math Formulas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #f1f5f9; color: #1e293b; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .pointer-events-auto { pointer-events: auto; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.05); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.2); border-radius: 4px; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%; background: #2563eb; cursor: pointer; margin-top: -7px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #cbd5e1; border-radius: 2px; }
        
        .expanded-panel {
            position: fixed !important; top: 50% !important; left: 50% !important; transform: translate(-50%, -50%) !important;
            width: 98vw !important; max-width: 100% !important; height: 96vh !important; max-height: 100vh !important;
            z-index: 100 !important; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25) !important;
            background: #ffffff !important; 
            backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
            display: flex !important; flex-direction: column !important;
        }
        .expanded-panel #info-content { 
            padding: 3rem !important; gap: 2rem !important; 
            overflow-y: auto !important; 
        }
        .expanded-panel #math-formula { font-size: 40px !important; padding: 2rem !important; min-height: 150px !important; overflow-x: auto !important; }
        .expanded-panel #math-result, .expanded-panel #math-result * { font-size: 32px !important; line-height: 1.6 !important; }
        .expanded-panel #math-result { padding: 2rem !important; }
        .expanded-panel h3 { font-size: 36px !important; }
        .expanded-panel h3 svg { width: 36px !important; height: 36px !important; }
        
        .minimized-panel {
            background: transparent !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
            border: none !important; box-shadow: none !important; pointer-events: none;
        }
        .minimized-panel .panel-header { background: transparent !important; border-bottom: none !important; pointer-events: auto; }
        .minimized-panel .panel-title { opacity: 0; pointer-events: none; }
        .minimized-panel #control-footer-hint { display: none !important; }
        .minimized-panel label { text-shadow: 0 0 6px rgba(255,255,255,0.9), 0 0 2px rgba(255,255,255,1) !important; }
        
        .minimized-panel #controls-container { opacity: 0.35; transition: opacity 0.3s ease; pointer-events: auto; }
        .minimized-panel #controls-container:hover { opacity: 1; }
        .minimized-panel input[type=range]::-webkit-slider-runnable-track { background: rgba(203, 213, 225, 0.5) !important; }
        .minimized-panel input[type=range]::-webkit-slider-thumb { background: rgba(37, 99, 235, 0.6) !important; box-shadow: none !important; }
    </style>

    <script>
        window.togglePanel = function(contentId, iconId) {
            const content = document.getElementById(contentId);
            const icon = document.getElementById(iconId);
            content.classList.toggle('hidden');
            icon.classList.toggle('-rotate-90');
        };

        window.toggleExpand = function() {
            const panel = document.getElementById('info-panel');
            const overlay = document.getElementById('expand-overlay');
            const content = document.getElementById('info-content');
            const icon = document.getElementById('info-icon');
            
            if (panel.classList.contains('expanded-panel')) {
                // Click lần 2: Thu nhỏ và Ẩn luôn nội dung
                panel.classList.remove('expanded-panel');
                overlay.classList.add('hidden');
                content.classList.add('hidden');
                icon.classList.add('-rotate-90');
            } else {
                // Click lần 1: Phóng to và Hiện nội dung
                panel.classList.add('expanded-panel');
                overlay.classList.remove('hidden');
                content.classList.remove('hidden');
                icon.classList.remove('-rotate-90');
            }
        };

        window.toggleControlPanel = function() {
            const panel = document.getElementById('bottom-panel');
            const icon = document.getElementById('control-icon');
            panel.classList.toggle('minimized-panel');
            icon.classList.toggle('-rotate-90');
        };

        window.toggleFullScreen = function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.warn(err));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        };

        document.addEventListener('keydown', (event) => {
            if (event.key.toLowerCase() === 'f' && event.target.tagName !== 'INPUT') window.toggleFullScreen();
        });
    </script>
</head>
<body>
    <div id="canvas-container"></div>

    <!-- Application Script -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;
        let objectsGroup = new THREE.Group();
        let currentMode = 1;
        
        // Trạng thái các biến của 5 phần bài học
        const state = {
            m1: { angle: 45 },                  // Vấn đề thực tế (Tia âm thanh)
            m2: { a: 5, c: 3, t: 30 },          // Định nghĩa quỹ tích
            m3: { showElements: 0 },            // Ví dụ 1 (Step)
            m4: { step: 0 },                    // Ví dụ 2 (Lập PT)
            m5: { truckW: 4, truckH: 2.5 }      // Ví dụ 3 (Cổng vòm)
        };

        const problems = [
            "Kiến trúc sư thiết kế một phòng vòm đặc biệt tên là 'Phòng thì thầm'. Hai người đứng ở hai vị trí đặc biệt trong phòng, dù nói rất nhỏ thì người kia vẫn nghe rõ mồn một. Bí mật toán học nào đằng sau thiết kế này?",
            "Làm thế nào để 'vẽ' ra được hình dáng của mặt cắt chiếc phòng thì thầm đó? Tập hợp những điểm thỏa mãn tính chất phản xạ quang học/âm học đặc biệt này được gọi là Đường Elip.",
            "Cho phương trình của một đường Elip $(E)$. Bằng cách nào ta có thể xác định được tất cả các yếu tố cấu thành nên nó như Tiêu điểm, Tiêu cự, Đỉnh, và độ dài các Trục?",
            "Ngược lại, nếu chỉ biết một vài yếu tố hình học ban đầu (chẳng hạn độ dài trục lớn và khoảng cách giữa 2 tiêu điểm), làm sao để ta có thể lập được phương trình chính tắc của nó?",
            "Một chiếc cổng vòm hình bán Elip có bề rộng và chiều cao cho trước. Một chiếc xe tải chở hàng có qua lọt cổng này không? Đây là bài toán kiểm tra điểm có nằm trong Elip cực kì phổ biến."
        ];

        const mathFormula = document.getElementById('math-formula');
        const mathResult = document.getElementById('math-result');
        const controlsContainer = document.getElementById('controls-container');

        // --- HÀM VẼ CƠ BẢN ---
        function createTextSprite(text, color, scale=1.0) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 128;
            const context = canvas.getContext('2d');
            context.font = 'Bold 48px "Segoe UI", Arial';
            context.fillStyle = color; context.textAlign = 'center'; context.textBaseline = 'middle';
            context.lineWidth = 6; context.strokeStyle = 'white';
            context.strokeText(text, 128, 64); context.fillText(text, 128, 64);
            const texture = new THREE.CanvasTexture(canvas);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true }));
            sprite.scale.set(scale*2, scale, scale); return sprite;
        }

        function createPoint(pos, color=0xdc2626, size=0.15, label='', offset=new THREE.Vector3(0, 0.4, 0)) {
            if (typeof size === 'string') { label = size; size = 0.15; }
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(size, 16, 16), new THREE.MeshPhongMaterial({ color }));
            mesh.position.copy(pos); objectsGroup.add(mesh);
            if (label) {
                const sprite = createTextSprite(label, '#' + color.toString(16).padStart(6, '0'), 0.8);
                sprite.position.copy(pos).add(offset); objectsGroup.add(sprite);
            }
            return mesh;
        }

        function drawLine(p1, p2, color=0x1e293b, width=3) {
            const radius = width * 0.008; 
            const mesh = new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(p1, p2), 1, radius, 8, false), new THREE.MeshPhongMaterial({ color }));
            objectsGroup.add(mesh); return mesh;
        }

        function drawThickVector(p1, p2, color=0x2563eb, radius=0.04) {
            const group = new THREE.Group();
            const dist = p1.distanceTo(p2);
            if(dist < 0.001) return group;
            const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
            const headLength = radius * 6; const headRadius = radius * 2.5;
            const shaftLength = Math.max(0, dist - headLength);
            if(shaftLength > 0) {
                const mesh = new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(p1, new THREE.Vector3().copy(p1).addScaledVector(dir, shaftLength)), 1, radius, 8, false), new THREE.MeshPhongMaterial({ color }));
                group.add(mesh);
            }
            const headGeom = new THREE.ConeGeometry(headRadius, headLength, 16);
            headGeom.translate(0, headLength/2, 0); 
            const headMesh = new THREE.Mesh(headGeom, new THREE.MeshPhongMaterial({ color }));
            headMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
            headMesh.position.copy(p1).addScaledVector(dir, shaftLength);
            group.add(headMesh);
            objectsGroup.add(group); return group;
        }

        function drawDashed(p1, p2, color=0x94a3b8, radius=0.012) {
            const dist = p1.distanceTo(p2);
            const dashSize = 0.2; const gapSize = 0.15; const step = dashSize + gapSize;
            const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
            for (let d = 0; d < dist; d += step) {
                const start = new THREE.Vector3().copy(p1).addScaledVector(dir, d);
                const currentDash = Math.min(dashSize, dist - d);
                if (currentDash <= 0.001) continue;
                const end = new THREE.Vector3().copy(start).addScaledVector(dir, currentDash);
                objectsGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(start, end), 1, radius, 8, false), new THREE.MeshBasicMaterial({ color })));
            }
        }

        function drawThickCurve(points, color=0x2563eb, radius=0.03) {
            if(points.length < 2) return;
            const curve = new THREE.CatmullRomCurve3(points, false, "chordal");
            const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, points.length * 2, radius, 8, false), new THREE.MeshPhongMaterial({ color }));
            objectsGroup.add(mesh); return mesh;
        }

        function drawStandardAxes() {
            const len = 10;
            drawThickVector(new THREE.Vector3(-len,0,0), new THREE.Vector3(len,0,0), 0x94a3b8, 0.02);
            createTextSprite('x', '#64748b', 0.8).position.set(len+0.5, -0.5, 0);
            
            drawThickVector(new THREE.Vector3(0,-len,0), new THREE.Vector3(0,len,0), 0x94a3b8, 0.02);
            createTextSprite('y', '#64748b', 0.8).position.set(-0.5, len+0.5, 0);
            
            createPoint(new THREE.Vector3(0,0,0), 0x1e293b, 0.1, 'O', new THREE.Vector3(-0.4, -0.4, 0));
        }

        function clearAll() {
            while (objectsGroup.children.length > 0) {
                const child = objectsGroup.children[0];
                if (child.geometry) child.geometry.dispose();
                if (child.material) { if (Array.isArray(child.material)) child.material.forEach(m => m.dispose()); else child.material.dispose(); }
                objectsGroup.remove(child);
            }
        }

        function setCameraMode(is3D) {
            if(is3D) {
                camera.position.set(0, 4, 15); controls.enableRotate = true; controls.maxPolarAngle = Math.PI/2;
            } else {
                camera.position.set(0, 0, 16); controls.enableRotate = false;
            }
            controls.target.set(0,0,0); controls.update();
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf8fafc); 
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.up.set(0, 1, 0); 
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; controls.dampingFactor = 0.05;
            
            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(5, 10, 15); scene.add(dirLight);
            
            const gridHelper = new THREE.GridHelper(24, 24, 0xcbd5e1, 0xe2e8f0);
            gridHelper.rotation.x = Math.PI/2; // Lưới Oxy
            scene.add(gridHelper); 
            scene.add(objectsGroup);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            for(let i=1; i<=5; i++) document.getElementById(`btn-mode-${i}`).addEventListener('click', () => switchMode(i));
            switchMode(1);
            animate();
        }

        function updateMath(tex, res) {
            katex.render(tex, mathFormula, { throwOnError: false, displayMode: true });
            mathResult.innerHTML = res.replace(/\$(.*?)\$/g, (m, math) => {
                try { return katex.renderToString(math, { throwOnError: false }); } catch(e) { return m; }
            });
        }
        function buildUI(html) { controlsContainer.innerHTML = html; }

        // --- M1: VẤN ĐỀ THỰC TẾ (Phòng thì thầm) ---
        function renderM1() {
            setCameraMode(true); controls.target.set(0, 0, 0); camera.position.set(0, 5, 15);
            clearAll();
            
            const a = 6, b = 4;
            const c = Math.sqrt(a*a - b*b);
            const F1 = new THREE.Vector3(-c, 0, 0); const F2 = new THREE.Vector3(c, 0, 0);
            createPoint(F1, 0x1e293b, 'Người A (F₁)'); createPoint(F2, 0x1e293b, 'Người B (F₂)');

            // Vẽ vòm Elip 3D (nửa trên)
            const archPts = [];
            for (let th = 0; th <= Math.PI; th += 0.05) archPts.push(new THREE.Vector3(a*Math.cos(th), b*Math.sin(th), 0));
            drawThickCurve(archPts, 0x94a3b8, 0.08); // Vòm kiến trúc

            // Dựng một vài vòm phụ mờ mờ tạo cảm giác căn phòng 3D
            const drawFaintArch = (zOffset) => {
                const pts = [];
                for (let th = 0; th <= Math.PI; th += 0.1) pts.push(new THREE.Vector3(a*Math.cos(th), b*Math.sin(th), zOffset));
                objectsGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color:0xcbd5e1, transparent:true, opacity:0.5})));
            };
            drawFaintArch(-2); drawFaintArch(-4); drawFaintArch(2); drawFaintArch(4);

            // Sàn nhà
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(16, 12), new THREE.MeshPhongMaterial({color: 0xe2e8f0, transparent:true, opacity:0.8}));
            floor.rotation.x = -Math.PI/2; objectsGroup.add(floor);

            // Tia âm thanh
            const angle = state.m1.angle * Math.PI/180;
            const M = new THREE.Vector3(a*Math.cos(angle), b*Math.sin(angle), 0);
            createPoint(M, 0xdc2626, 0.1);

            drawThickVector(F1, M, 0xdc2626, 0.04); // Tia tới
            drawThickVector(M, F2, 0x059669, 0.04); // Tia phản xạ

            updateMath(`\\text{Thiết kế: } \\frac{x^2}{a^2} + \\frac{y^2}{b^2} = 1`, 
                `<div class="mb-1 font-bold text-amber-700">Hiện tượng phản xạ kỳ diệu:</div>
                <div class="mb-2">Kiến trúc vòm Elip có một tính chất quang học/âm học hoàn hảo: Mọi tia sóng phát ra từ một Tiêu điểm ($F_1$), sau khi đập vào vòm sẽ **luôn luôn phản xạ và hội tụ** chính xác tại Tiêu điểm thứ hai ($F_2$).</div>
                <div class="p-3 rounded bg-amber-50 border border-amber-200">
                    <span class="font-bold text-rose-600">👉 Hãy kéo thanh trượt</span> để thay đổi hướng phát âm thanh của Người A. Bạn thấy không? Tia sóng (xanh) luôn đập trúng vị trí Người B đứng!
                </div>`);
        }

        // --- M2: KIẾN THỨC TRỌNG TÂM (Định nghĩa quỹ tích) ---
        function renderM2() {
            setCameraMode(false); 
            clearAll(); drawStandardAxes();
            
            const a = state.m2.a; const c = state.m2.c;
            if(c >= a) return; // Ràng buộc c < a
            const b = Math.sqrt(a*a - c*c);
            
            const F1 = new THREE.Vector3(-c, 0, 0); const F2 = new THREE.Vector3(c, 0, 0);
            createPoint(F1, 0xdc2626, 'F₁(-c,0)', new THREE.Vector3(0,-0.6,0)); 
            createPoint(F2, 0xdc2626, 'F₂(c,0)', new THREE.Vector3(0,-0.6,0));

            // Vẽ toàn bộ Elip mờ
            const curve = new THREE.EllipseCurve(0, 0, a, b, 0, 2*Math.PI, false, 0);
            const pts = curve.getPoints(60).map(p => new THREE.Vector3(p.x, p.y, 0));
            drawThickCurve(pts, 0xcbd5e1, 0.03);

            // Điểm M
            const t = state.m2.t * Math.PI/180;
            const M = new THREE.Vector3(a*Math.cos(t), b*Math.sin(t), 0);
            createPoint(M, 0x1e293b, 'M(x,y)', new THREE.Vector3(0,0.5,0));

            // Vẽ dây
            drawLine(F1, M, 0x059669, 4); drawLine(F2, M, 0x059669, 4);

            const MF1 = M.distanceTo(F1); const MF2 = M.distanceTo(F2);

            updateMath(`MF_1 + MF_2 = 2a \\quad \\Rightarrow \\quad \\frac{x^2}{a^2} + \\frac{y^2}{b^2} = 1`, 
                `<div class="mb-1 font-bold text-blue-700">Định nghĩa & Phương trình chính tắc:</div>
                <div class="mb-2">Tập hợp các điểm $M$ sao cho **tổng khoảng cách** đến 2 tiêu điểm cố định $F_1, F_2$ bằng một hằng số $2a$ (với $2a > F_1F_2 = 2c$).</div>
                <ul class="list-disc pl-5 space-y-1 mb-3 text-slate-700">
                    <li>Trục lớn: $2a = ${2*a}$</li>
                    <li>Tiêu cự: $2c = ${2*c}$</li>
                    <li>Bán trục nhỏ: $b = \\sqrt{a^2 - c^2} = ${b.toFixed(2)}$</li>
                </ul>
                <div class="p-2 rounded bg-blue-50 border border-blue-200">
                    <span class="font-bold text-emerald-700">Kiểm chứng:</span> $MF_1 + MF_2 = ${MF1.toFixed(2)} + ${MF2.toFixed(2)} = ${(MF1+MF2).toFixed(1)}$ (Luôn không đổi bằng $2a$)
                </div>`);
        }

        // --- M3: VÍ DỤ 1 (Tìm các yếu tố) ---
        function renderM3() {
            setCameraMode(false); 
            clearAll(); drawStandardAxes();
            
            // PT: x^2/25 + y^2/9 = 1 => a=5, b=3 => c=4
            const a = 5, b = 3, c = 4;
            
            // Vẽ Elip chuẩn
            const curve = new THREE.EllipseCurve(0, 0, a, b, 0, 2*Math.PI, false, 0);
            const pts = curve.getPoints(60).map(p => new THREE.Vector3(p.x, p.y, 0));
            drawThickCurve(pts, 0x2563eb, 0.04);

            const step = state.m3.showElements;
            let resultText = "Từ phương trình $\\frac{x^2}{25} + \\frac{y^2}{9} = 1$, ta dễ dàng xác định được:<br>$\\Rightarrow a^2 = 25 \\Rightarrow a = 5$<br>$\\Rightarrow b^2 = 9 \\Rightarrow b = 3$";
            
            if (step >= 1) { // Hiện trục lớn, đỉnh
                createPoint(new THREE.Vector3(-a,0,0), 0xf59e0b, 'A₁(-5,0)', new THREE.Vector3(0,0.6,0));
                createPoint(new THREE.Vector3(a,0,0), 0xf59e0b, 'A₂(5,0)', new THREE.Vector3(0,0.6,0));
                drawLine(new THREE.Vector3(-a,0,0), new THREE.Vector3(a,0,0), 0xf59e0b, 5);
                resultText += "<br><br><span class='font-bold text-amber-600'>1. Trục lớn và Đỉnh trên Ox:</span><br>- Độ dài trục lớn $2a = 10$.<br>- Tọa độ đỉnh $A_1(-5; 0)$ và $A_2(5; 0)$.";
            }
            if (step >= 2) { // Hiện trục nhỏ, đỉnh
                createPoint(new THREE.Vector3(0,-b,0), 0x8b5cf6, 'B₁(0,-3)', new THREE.Vector3(0.8,0,0));
                createPoint(new THREE.Vector3(0,b,0), 0x8b5cf6, 'B₂(0,3)', new THREE.Vector3(0.8,0,0));
                drawLine(new THREE.Vector3(0,-b,0), new THREE.Vector3(0,b,0), 0x8b5cf6, 5);
                resultText += "<br><br><span class='font-bold text-purple-600'>2. Trục nhỏ và Đỉnh trên Oy:</span><br>- Độ dài trục nhỏ $2b = 6$.<br>- Tọa độ đỉnh $B_1(0; -3)$ và $B_2(0; 3)$.";
            }
            if (step >= 3) { // Hiện tiêu điểm
                createPoint(new THREE.Vector3(-c,0,0), 0xdc2626, 'F₁(-4,0)', new THREE.Vector3(0,-0.6,0));
                createPoint(new THREE.Vector3(c,0,0), 0xdc2626, 'F₂(4,0)', new THREE.Vector3(0,-0.6,0));
                resultText += `<br><br><span class='font-bold text-rose-600'>3. Tiêu điểm và Tiêu cự:</span><br>- Ta có $c^2 = a^2 - b^2 = 25 - 9 = 16 \\Rightarrow c = 4$.<br>- Tiêu cự $2c = 8$. Tiêu điểm $F_1(-4; 0)$ và $F_2(4; 0)$.`;
            }

            updateMath(`(E): \\frac{x^2}{25} + \\frac{y^2}{9} = 1`, 
                `<div class="mb-1 font-bold text-emerald-700">Ví dụ 1: Xác định các yếu tố của Elip</div>
                <div class="text-slate-800 leading-relaxed">${resultText}</div>`);
        }

        // --- M4: VÍ DỤ 2 (Lập phương trình) ---
        function renderM4() {
            setCameraMode(false); 
            clearAll(); drawStandardAxes();
            
            const step = state.m4.step;
            let resultText = "<strong>Bài toán:</strong> Lập phương trình chính tắc của $(E)$ biết độ dài trục lớn bằng $10$, tiêu cự bằng $6$.<br><br>";
            
            if (step >= 1) { // Phân tích a
                resultText += "- Trục lớn $2a = 10 \\Rightarrow \\mathbf{a = 5}$.<br>";
                createPoint(new THREE.Vector3(-5,0,0), 0xf59e0b, 'A₁(-5,0)');
                createPoint(new THREE.Vector3(5,0,0), 0xf59e0b, 'A₂(5,0)');
            }
            if (step >= 2) { // Phân tích c
                resultText += "- Tiêu cự $2c = 6 \\Rightarrow \\mathbf{c = 3}$.<br>";
                createPoint(new THREE.Vector3(-3,0,0), 0xdc2626, 'F₁(-3,0)', new THREE.Vector3(0,-0.6,0));
                createPoint(new THREE.Vector3(3,0,0), 0xdc2626, 'F₂(3,0)', new THREE.Vector3(0,-0.6,0));
            }
            if (step >= 3) { // Tìm b
                resultText += "- Áp dụng hệ thức: $b^2 = a^2 - c^2 = 25 - 9 = 16 \\Rightarrow \\mathbf{b = 4}$.<br>";
                createPoint(new THREE.Vector3(0,-4,0), 0x8b5cf6, 'B₁(0,-4)', new THREE.Vector3(0.8,0,0));
                createPoint(new THREE.Vector3(0,4,0), 0x8b5cf6, 'B₂(0,4)', new THREE.Vector3(0.8,0,0));
            }
            if (step >= 4) { // Kết luận
                resultText += "<br><span class='text-emerald-700 font-bold'>Kết luận: Phương trình là $\\frac{x^2}{25} + \\frac{y^2}{16} = 1$</span>";
                const curve = new THREE.EllipseCurve(0, 0, 5, 4, 0, 2*Math.PI, false, 0);
                const pts = curve.getPoints(60).map(p => new THREE.Vector3(p.x, p.y, 0));
                drawThickCurve(pts, 0x2563eb, 0.05); // Vẽ Elip chốt lại
            }

            updateMath(`\\text{Dạng PT: } \\frac{x^2}{a^2} + \\frac{y^2}{b^2} = 1`, 
                `<div class="mb-1 font-bold text-purple-700">Ví dụ 2: Lập phương trình Elip</div>
                <div class="text-slate-800 leading-relaxed">${resultText}</div>`);
        }

        // --- M5: VÍ DỤ 3 (Bài toán Cổng vòm) ---
        function renderM5() {
            setCameraMode(false); controls.target.set(0, 2, 0); camera.position.set(0, 2, 12);
            clearAll(); 
            
            // Vẽ 1 nửa hệ trục
            drawLine(new THREE.Vector3(-6,0,0), new THREE.Vector3(6,0,0), 0x94a3b8, 2); // Ox
            drawLine(new THREE.Vector3(0,0,0), new THREE.Vector3(0,5,0), 0x94a3b8, 2);   // Oy
            createPoint(new THREE.Vector3(0,0,0), 0x1e293b, 0.1, 'O(0,0)');

            // Cổng vòm a=4, b=3 (Rộng 8, Cao 3)
            const a = 4, b = 3;
            const archPts = [];
            for(let th=0; th<=Math.PI; th+=0.05) archPts.push(new THREE.Vector3(a*Math.cos(th), b*Math.sin(th), 0));
            drawThickCurve(archPts, 0x2563eb, 0.06);

            // Gắn tọa độ
            createPoint(new THREE.Vector3(4,0,0), 0x1e293b, 0.1, '(4,0)', new THREE.Vector3(0,-0.5,0));
            createPoint(new THREE.Vector3(-4,0,0), 0x1e293b, 0.1, '(-4,0)', new THREE.Vector3(0,-0.5,0));
            createPoint(new THREE.Vector3(0,3,0), 0x1e293b, 0.1, '(0,3)', new THREE.Vector3(0.5,0.5,0));

            // Xe tải
            const w = state.m5.truckW, h = state.m5.truckH;
            
            // Vẽ thùng xe
            const shape = new THREE.Shape();
            shape.moveTo(-w/2, 0); shape.lineTo(w/2, 0); shape.lineTo(w/2, h); shape.lineTo(-w/2, h); shape.lineTo(-w/2, 0);
            objectsGroup.add(new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshBasicMaterial({color: 0xf59e0b, transparent:true, opacity:0.6})));
            
            // Cạnh trên của thùng xe cắt x ở W/2
            const checkX = w/2;
            const maxH_at_X = b * Math.sqrt(1 - (checkX*checkX)/(a*a)); // Từ PT y = b*sqrt(1 - x^2/a^2)
            
            const isCrash = h > maxH_at_X;

            createPoint(new THREE.Vector3(checkX, h, 0), isCrash ? 0xdc2626 : 0x059669, 0.15, `(${checkX}, ${h})`);
            drawDashed(new THREE.Vector3(checkX, 0, 0), new THREE.Vector3(checkX, h, 0), 0x94a3b8);

            let ptText = `Gắn hệ trục tọa độ tại chính giữa cổng. Ta có $a=4, b=3$.<br>Phương trình cổng vòm: $\\frac{x^2}{16} + \\frac{y^2}{9} = 1$<br>`;
            ptText += `<br>Bề rộng xe là $${w}m$, suy ra tọa độ mép xe là $x = ${checkX}$.<br>`;
            ptText += `Tại $x = ${checkX}$, chiều cao tối đa cho phép là $y = 3\\sqrt{1 - \\frac{${checkX}^2}{16}} \\approx ${maxH_at_X.toFixed(2)}m$.`;

            updateMath(`\\text{Bài toán Cổng vòm Bán Elip}`, 
                `<div class="mb-1 font-bold text-rose-700">Ví dụ 3: Bài toán Thực tế</div>
                <div class="mb-2">Một cổng vòm hình bán Elip rộng $8m$, cao $3m$. Xe tải chở hàng rộng $${w}m$, cao $${h}m$ có chui qua lọt không?</div>
                <div class="p-2 rounded bg-slate-50 border border-slate-200 text-sm text-slate-800">
                    ${ptText}
                    <div class="mt-2 font-bold ${isCrash ? 'text-rose-600' : 'text-emerald-600'}">Kết luận: Xe cao $${h}m$ $\\Rightarrow$ ${isCrash ? 'SẼ BỊ KẸT!' : 'QUA LỌT AN TOÀN!'}</div>
                </div>`);
        }

        function switchMode(mode) {
            currentMode = mode;
            [1,2,3,4,5].forEach(i => {
                const btn = document.getElementById(`btn-mode-${i}`);
                if (i === mode) btn.className = btn.className.replace('bg-opacity-50', 'shadow-md scale-105 z-10 font-bold border-l-8').replace('bg-gray-50', ''); // Active styling
                else btn.className = `w-full text-left px-4 py-3 rounded-lg transition font-semibold text-sm shadow-sm border-l-4 bg-gray-50 bg-opacity-50 hover:bg-gray-100 ${['border-amber-500 text-amber-900', 'border-blue-500 text-blue-900', 'border-emerald-500 text-emerald-900', 'border-purple-500 text-purple-900', 'border-rose-500 text-rose-900'][i-1]}`;
            });

            // Ghi đè Active styling chính xác cho nút được chọn
            const activeBtn = document.getElementById(`btn-mode-${mode}`);
            const colors = ['amber', 'blue', 'emerald', 'purple', 'rose'];
            const c = colors[mode-1];
            activeBtn.className = `w-full text-left px-4 py-3 rounded-lg transition font-bold text-sm shadow-md border-l-8 bg-${c}-100 border-${c}-600 text-${c}-900 scale-105 origin-left`;

            const problemHtml = problems[mode - 1].replace(/\$(.*?)\$/g, (m, math) => {
                try { return katex.renderToString(math, { throwOnError: false }); } catch(e) { return m; }
            });
            document.getElementById('problem-text').innerHTML = problemHtml;

            if(mode === 1) buildUI(`<label class="text-xs font-bold">Kéo để đổi hướng người nói: <span class="text-blue-600">${state.m1.angle}°</span><input type="range" min="0" max="180" step="5" value="${state.m1.angle}" oninput="state.m1.angle=parseFloat(this.value); renderM1(); this.previousElementSibling.innerText=this.value+'°'"></label>`);
            else if(mode === 2) buildUI(`<div class="flex gap-4">
                <label class="text-xs font-bold w-1/3">Trục lớn a: <span class="text-blue-600">${state.m2.a}</span><input type="range" min="3" max="8" step="0.5" value="${state.m2.a}" oninput="if(parseFloat(this.value)<=state.m2.c) this.value=state.m2.c+0.5; state.m2.a=parseFloat(this.value); renderM2(); this.previousElementSibling.innerText=this.value"></label>
                <label class="text-xs font-bold w-1/3">Tiêu cự c: <span class="text-blue-600">${state.m2.c}</span><input type="range" min="1" max="7" step="0.5" value="${state.m2.c}" oninput="if(parseFloat(this.value)>=state.m2.a) this.value=state.m2.a-0.5; state.m2.c=parseFloat(this.value); renderM2(); this.previousElementSibling.innerText=this.value"></label>
                <label class="text-xs font-bold w-1/3">Quét điểm M: <span class="text-blue-600">${state.m2.t}°</span><input type="range" min="0" max="360" step="5" value="${state.m2.t}" oninput="state.m2.t=parseFloat(this.value); renderM2(); this.previousElementSibling.innerText=this.value+'°'"></label>
            </div>`);
            else if(mode === 3) buildUI(`<label class="text-xs font-bold">Kéo để xem từng bước phân tích: Bước <span class="text-blue-600">${state.m3.showElements}</span>/3<input type="range" min="0" max="3" step="1" value="${state.m3.showElements}" oninput="state.m3.showElements=parseInt(this.value); renderM3(); this.previousElementSibling.innerText=this.value"></label>`);
            else if(mode === 4) buildUI(`<label class="text-xs font-bold">Kéo để Giải bài toán: Bước <span class="text-blue-600">${state.m4.step}</span>/4<input type="range" min="0" max="4" step="1" value="${state.m4.step}" oninput="state.m4.step=parseInt(this.value); renderM4(); this.previousElementSibling.innerText=this.value"></label>`);
            else if(mode === 5) buildUI(`<div class="flex gap-4">
                <label class="text-xs font-bold w-1/2">Bề rộng xe tải $w$: <span class="text-blue-600">${state.m5.truckW}m</span><input type="range" min="1" max="7.8" step="0.2" value="${state.m5.truckW}" oninput="state.m5.truckW=parseFloat(this.value); renderM5(); this.previousElementSibling.innerText=this.value+'m'"></label>
                <label class="text-xs font-bold w-1/2">Chiều cao xe $h$: <span class="text-blue-600">${state.m5.truckH}m</span><input type="range" min="1" max="4" step="0.1" value="${state.m5.truckH}" oninput="state.m5.truckH=parseFloat(this.value); renderM5(); this.previousElementSibling.innerText=this.value+'m'"></label>
            </div>`);

            clearAll(); 
            window[`renderM${mode}`]();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.state = state;
        window.renderM1 = renderM1; window.renderM2 = renderM2; window.renderM3 = renderM3;
        window.renderM4 = renderM4; window.renderM5 = renderM5;

        window.onload = init;
    </script>
</body>
</html>

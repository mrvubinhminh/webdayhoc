<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài học: Phép chiếu Song song</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- KaTeX for Math Formulas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #f1f5f9; color: #1e293b; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .pointer-events-auto { pointer-events: auto; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.05); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.2); border-radius: 4px; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%; background: #2563eb; cursor: pointer; margin-top: -7px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #cbd5e1; border-radius: 2px; }
        
        /* Chế độ hiển thị toàn màn hình, chữ lớn, nền trắng 100% không mờ */
        .expanded-panel {
            position: fixed !important; top: 50% !important; left: 50% !important; transform: translate(-50%, -50%) !important;
            width: 98vw !important; max-width: 100% !important; height: 96vh !important; max-height: 100vh !important;
            z-index: 100 !important; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25) !important;
            background: #ffffff !important; 
            backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
            display: flex !important; flex-direction: column !important;
        }
        .expanded-panel #info-content { 
            padding: 3rem !important; gap: 2rem !important; 
            overflow-y: auto !important; 
        }
        .expanded-panel #math-formula { font-size: 40px !important; padding: 2rem !important; min-height: 150px !important; overflow-x: auto !important; }
        .expanded-panel #math-result, .expanded-panel #math-result * { font-size: 32px !important; line-height: 1.6 !important; }
        .expanded-panel #math-result { padding: 2rem !important; }
        .expanded-panel h3 { font-size: 36px !important; }
        .expanded-panel h3 svg { width: 36px !important; height: 36px !important; }
        
        .minimized-panel {
            background: transparent !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
            border: none !important; box-shadow: none !important; pointer-events: none;
        }
        .minimized-panel .panel-header { background: transparent !important; border-bottom: none !important; pointer-events: auto; }
        .minimized-panel .panel-title { opacity: 0; pointer-events: none; }
        .minimized-panel #control-footer-hint { display: none !important; }
        .minimized-panel label { text-shadow: 0 0 6px rgba(255,255,255,0.9), 0 0 2px rgba(255,255,255,1) !important; }
        
        .minimized-panel #controls-container { opacity: 0.35; transition: opacity 0.3s ease; pointer-events: auto; }
        .minimized-panel #controls-container:hover { opacity: 1; }
        .minimized-panel input[type=range]::-webkit-slider-runnable-track { background: rgba(203, 213, 225, 0.5) !important; }
        .minimized-panel input[type=range]::-webkit-slider-thumb { background: rgba(37, 99, 235, 0.6) !important; box-shadow: none !important; }
    </style>

    <script>
        window.togglePanel = function(contentId, iconId) {
            const content = document.getElementById(contentId);
            const icon = document.getElementById(iconId);
            content.classList.toggle('hidden');
            icon.classList.toggle('-rotate-90');
        };

        window.toggleExpand = function() {
            const panel = document.getElementById('info-panel');
            const overlay = document.getElementById('expand-overlay');
            const content = document.getElementById('info-content');
            const icon = document.getElementById('info-icon');
            
            if (panel.classList.contains('expanded-panel')) {
                panel.classList.remove('expanded-panel');
                overlay.classList.add('hidden');
                content.classList.add('hidden');
                icon.classList.add('-rotate-90');
            } else {
                panel.classList.add('expanded-panel');
                overlay.classList.remove('hidden');
                content.classList.remove('hidden');
                icon.classList.remove('-rotate-90');
            }
        };

        window.toggleControlPanel = function() {
            const panel = document.getElementById('bottom-panel');
            const icon = document.getElementById('control-icon');
            panel.classList.toggle('minimized-panel');
            icon.classList.toggle('-rotate-90');
        };

        window.toggleFullScreen = function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.warn(err));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        };

        document.addEventListener('keydown', (event) => {
            if (event.key.toLowerCase() === 'f' && event.target.tagName !== 'INPUT') window.toggleFullScreen();
        });
    </script>
</head>
<body>

    <!-- Application Script -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;
        let objectsGroup = new THREE.Group();
        let currentMode = 1;
        
        // Biến toàn cục cho công cụ vẽ
        let isDrawingMode = false;
        let drawType = 'pen'; 
        let drawnItems = [];
        let currentItem = null;
        let isDrawing = false;
        let drawCanvas, dCtx;

        // Trạng thái các biến của 8 phần bài học
        const state = {
            m1: { angle: 45 },             // Khái niệm: Thay đổi phương chiếu l (góc)
            m2: { k: 0.5 },                // Tính chất 1: Vị trí M trên đoạn AB
            m3: { rot: 0 },                // Tính chất 2: Xoay phương chiếu
            m4: { k: 0.3 },                // Tính chất 3: Điểm M chia tỉ lệ

        // --- HÀM VẼ CƠ BẢN LÊN 3D ---
        function createTextSprite(text, color, scale=1.0) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 128;
            const context = canvas.getContext('2d');
            context.font = 'Bold 42px "Segoe UI", Arial';
            context.fillStyle = color; context.textAlign = 'center'; context.textBaseline = 'middle';
            context.lineWidth = 6; context.strokeStyle = 'white';
            context.strokeText(text, 128, 64); context.fillText(text, 128, 64);
            const texture = new THREE.CanvasTexture(canvas);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false }));
            sprite.scale.set(scale*2, scale, scale); return sprite;
        }

        function createPoint(pos, color=0xdc2626, size=0.15, label='', offset=new THREE.Vector3(0, 0.4, 0)) {
            if (typeof size === 'string') { label = size; size = 0.15; }
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(size, 16, 16), new THREE.MeshPhongMaterial({ color }));
            mesh.position.copy(pos); objectsGroup.add(mesh);
            if (label) {
                const sprite = createTextSprite(label, '#' + color.toString(16).padStart(6, '0'), 0.8);
                sprite.position.copy(pos).add(offset); objectsGroup.add(sprite);
            }
            return mesh;
        }

        function drawLine(p1, p2, color=0x1e293b, width=2) {
            const radius = width * 0.01; 
            const dist = p1.distanceTo(p2);
            if(dist < 0.001) return null;
            
            const curve = new THREE.LineCurve3(p1, p2);
            const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 1, radius, 8, false), new THREE.MeshPhongMaterial({ color }));
            objectsGroup.add(mesh); 
            
            const dashSize = 0.3; const gapSize = 0.2; const step = dashSize + gapSize;
            const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
            for (let d = 0; d < dist; d += step) {
                const start = new THREE.Vector3().copy(p1).addScaledVector(dir, d);
                const currentDash = Math.min(dashSize, dist - d);
                if (currentDash <= 0.001) continue;
                const end = new THREE.Vector3().copy(start).addScaledVector(dir, currentDash);
                
                const dashMat = new THREE.MeshBasicMaterial({ 
                    color, 
                    depthFunc: THREE.GreaterDepth, 
                    depthWrite: false, 
                    transparent: true, 
                    opacity: 0.4 
                });
                objectsGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(start, end), 1, radius, 8, false), dashMat));
            }
            return mesh;
        }

        // Tia chiếu (luôn hiển thị rõ, mờ đi chút để phân biệt)
        function drawRay(p1, p2, color=0xfcd34d, width=1.5) {
            const radius = width * 0.01; 
            const dist = p1.distanceTo(p2);
            if(dist < 0.001) return null; 
            
            const dashSize = 0.4; const gapSize = 0.2; const step = dashSize + gapSize;
            const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
            for (let d = 0; d < dist; d += step) {
                const start = new THREE.Vector3().copy(p1).addScaledVector(dir, d);
                const currentDash = Math.min(dashSize, dist - d);
                if (currentDash <= 0.001) continue;
                const end = new THREE.Vector3().copy(start).addScaledVector(dir, currentDash);
                objectsGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(start, end), 1, radius, 8, false), new THREE.MeshBasicMaterial({ color, depthTest: false, transparent: true, opacity: 0.6 })));
            }
        }

        function drawThickVector(p1, p2, color=0x94a3b8, radius=0.02) {
            const group = new THREE.Group();
            const dist = p1.distanceTo(p2);
            if(dist < 0.001) return group;
            const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
            const headLength = radius * 6; const headRadius = radius * 2.5;
            const shaftLength = Math.max(0, dist - headLength);
            if(shaftLength > 0) {
                const mesh = new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(p1, new THREE.Vector3().copy(p1).addScaledVector(dir, shaftLength)), 1, radius, 8, false), new THREE.MeshPhongMaterial({ color }));
                group.add(mesh);
            }
            const headGeom = new THREE.ConeGeometry(headRadius, headLength, 16);
            headGeom.translate(0, headLength/2, 0); 
            const headMesh = new THREE.Mesh(headGeom, new THREE.MeshPhongMaterial({ color }));
            headMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
            headMesh.position.copy(p1).addScaledVector(dir, shaftLength);
            group.add(headMesh);
            objectsGroup.add(group); return group;
        }

        function drawStandardAxes(xLen = 10, yLen = 10, zLen = 10) {
            drawThickVector(new THREE.Vector3(0,0,0), new THREE.Vector3(xLen,0,0), 0xdc2626, 0.03);
            createTextSprite('x', '#dc2626', 0.8).position.set(xLen+0.5, 0, 0);
            drawThickVector(new THREE.Vector3(0,0,0), new THREE.Vector3(0,yLen,0), 0x059669, 0.03);
            createTextSprite('y', '#059669', 0.8).position.set(0, yLen+0.5, 0);
            drawThickVector(new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,zLen), 0x2563eb, 0.03);
            createTextSprite('z', '#2563eb', 0.8).position.set(0, 0, zLen+0.5);
            createPoint(new THREE.Vector3(0,0,0), 0x1e293b, 0.1, 'O', new THREE.Vector3(-0.6, -0.6, 0));
        }

        function createFace(points, color, opacity=0.5, addOccluder=true) {
            const geom = new THREE.BufferGeometry().setFromPoints(points);
            const indices = [];
            for (let i = 1; i < points.length - 1; i++) {
                indices.push(0, i, i + 1);
            }
            geom.setIndex(indices);
            geom.computeVertexNormals();
            
            if (addOccluder) {
                const occluderMat = new THREE.MeshBasicMaterial({
                    colorWrite: false, depthWrite: true, side: THREE.DoubleSide,
                    polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1
                });
                const occluder = new THREE.Mesh(geom, occluderMat);
                occluder.renderOrder = -1;
                objectsGroup.add(occluder);
            }

            const mesh = new THREE.Mesh(geom, new THREE.MeshPhongMaterial({color, side:THREE.DoubleSide, transparent:true, opacity, depthWrite: false}));
            objectsGroup.add(mesh);
            return mesh;
        }

        function drawBasePlane(w = 16, h = 16, y = 0, color = 0x38bdf8, label = '(P)') {
            const P_A = new THREE.Vector3(-w/2, y, h/2);
            const P_B = new THREE.Vector3(w/2, y, h/2);
            const P_C = new THREE.Vector3(w/2, y, -h/2);
            const P_D = new THREE.Vector3(-w/2, y, -h/2);
            createFace([P_A, P_B, P_C, P_D], color, 0.2, false); 
            
            drawLine(P_A, P_B, color, 1); drawLine(P_B, P_C, color, 1); 
            drawLine(P_C, P_D, color, 1); drawLine(P_D, P_A, color, 1);
            createTextSprite(label, '#' + color.toString(16).padStart(6, '0'), 1).position.set(w/2 - 1, y + 0.5, h/2 - 1);
        }

        // --- HÀM TÍNH TOÁN PHÉP CHIẾU ---
        // Chiếu điểm M xuống mp y=0 theo vector lVec
        function projectPoint(M, lVec) {
            if (Math.abs(lVec.y) < 0.0001) return new THREE.Vector3(M.x, 0, M.z); // Tránh chia cho 0
            const t = -M.y / lVec.y;
            return new THREE.Vector3(M.x + t * lVec.x, 0, M.z + t * lVec.z);
        }

        function clearAll() {
            while (objectsGroup.children.length > 0) {
                const child = objectsGroup.children[0];
                if (child.geometry) child.geometry.dispose();
                if (child.material) { if (Array.isArray(child.material)) child.material.forEach(m => m.dispose()); else child.material.dispose(); }
                objectsGroup.remove(child);
            }
        }

        function init() {
            scene = new THREE.Scene();

        function updateMath(tex, res) {
            katex.render(tex, mathFormula, { throwOnError: false, displayMode: true });
            mathResult.innerHTML = res.replace(/\$(.*?)\$/g, (m, math) => {
                try { return katex.renderToString(math, { throwOnError: false }); } catch(e) { return m; }
            });
        }
        function buildUI(html) { controlsContainer.innerHTML = html; }

        // --- M1: Khái niệm Phép chiếu song song ---
        function renderM1() {
            camera.position.set(12, 10, 18); controls.target.set(0, 0, 0);
            clearAll(); drawStandardAxes(8,8,8);
            drawBasePlane(16, 16, 0, 0x3b82f6, '(P)');
            
            // Vector chiếu lVec

            // Một điểm M và hình chiếu M'
            const M = new THREE.Vector3(2, 6, 2);

            // Cho một vật thể (đoạn AB)

                `<div class="mb-1 font-bold text-amber-700">Khái niệm Phép chiếu song song:</div>
                <div class="mb-2">Cho mặt phẳng $(P)$ và đường thẳng $l$ cắt $(P)$. Phép biến hình biến mỗi điểm $M$ thành điểm $M'$ sao cho $MM' \\parallel l$ (hoặc $M \\in l$) và $M' \\in (P)$ gọi là <span class="text-red-700 font-bold">Phép chiếu song song</span>.</div>
                <div class="p-3 rounded bg-amber-50 border border-amber-200">
                    <span class="font-bold text-amber-800">👉 Trải nghiệm:</span> Kéo thanh trượt để thay đổi góc chiếu của vector $l$ (như thay đổi góc mặt trời). Bóng màu đỏ trên mặt đất sẽ chạy theo!
                </div>`);
        }

        // --- M2: Tính chất 1 (Bảo toàn thẳng hàng) ---
        function renderM2() {
            camera.position.set(10, 8, 16); controls.target.set(0, 0, 0);

        // --- M3: Tính chất 2 (Bảo toàn song song) ---
        function renderM3() {

        // --- M4: Tính chất 3 (Bảo toàn tỉ số) ---
        function renderM4() {
            camera.position.set(10, 8, 16); controls.target.set(0, 0, 0);

            const B = new THREE.Vector3(4, 4, 4);

        // --- M5: Hình biểu diễn (Đường tròn -> Elip) ---
        function renderM5() {

            drawRay(circlePts[32], shadowPts[32], 0xfcd34d, 1);
            drawRay(circlePts[48], shadowPts[48], 0xfcd34d, 1);

            createPoint(center, 0x1e293b, 0.2, 'O'); createPoint(centerP, 0xdc2626, 0.2, "O'");

                <div class="mb-2">Hình chiếu song song của một Đường tròn lên một mặt phẳng (không song song với nó) luôn là một <span class="text-red-700 font-bold">đường Elip</span>. Điểm tâm $O$ biến thành tâm $O'$ của Elip.</div>
                <div class="p-3 rounded bg-teal-50 border border-teal-200">
                    <span class="font-bold text-teal-800">👉 Góc chiếu:</span> Kéo thanh trượt để thay đổi độ xiên của góc chiếu. Càng xiên, bóng Elip càng bị kéo dẹt!

            const Ap = projectPoint(A, lVec); const Bp = projectPoint(B, lVec); const Cp = projectPoint(C, lVec);
            const Gp = projectPoint(G, lVec);

            let res = "<strong>Bài toán:</strong> Cho $\\Delta ABC$ có trọng tâm $G$. Tìm hình chiếu của tam giác và trọng tâm qua phép chiếu song song.<br><br>";

            if (step >= 1) {
                createPoint(Ap, 0xdc2626, 0.15, "A'"); createPoint(Bp, 0xdc2626, 0.15, "B'"); createPoint(Cp, 0xdc2626, 0.15, "C'");
                drawLine(Ap, Bp, 0xdc2626, 4); drawLine(Bp, Cp, 0xdc2626, 4); drawLine(Cp, Ap, 0xdc2626, 4);
                createFace([Ap, Bp, Cp], 0xdc2626, 0.3);
                drawRay(A, Ap, 0xfcd34d, 1); drawRay(B, Bp, 0xfcd34d, 1); drawRay(C, Cp, 0xfcd34d, 1);
                res += "- Bước 1: Chiếu 3 đỉnh xuống $(P)$, ta được $\\Delta A'B'C'$. Tính chất: <span class='text-red-700 font-bold'>Bóng của 1 tam giác là 1 tam giác</span>.<br>";
            }
            if (step >= 2) {
                createPoint(G, 0x059669, 0.2, 'G', new THREE.Vector3(0, 0.6, 0));
                const M = new THREE.Vector3().lerpVectors(B, C, 0.5);
                drawLine(A, M, 0x059669, 2); // Trung tuyến
                
                createPoint(Gp, 0x059669, 0.2, "G'", new THREE.Vector3(0, 0.6, 0));
                const Mp = projectPoint(M, lVec);
                drawLine(Ap, Mp, 0x059669, 3);
                drawRay(G, Gp, 0xfcd34d, 2);
                res += "- Bước 2: Bảo toàn tỉ số $\\Rightarrow$ Trung điểm $M$ của $BC$ chiếu thành trung điểm $M'$ của $B'C'$. Do đó $G'$ nằm trên $A'M'$ và $\\frac{A'G'}{A'M'} = \\frac{AG}{AM} = \\frac{2}{3}$.<br>";
            }
            if (step >= 3) {
                res += "<br><span class='text-emerald-700 font-bold'>Kết luận: Hình chiếu trọng tâm $G$ chính là Trọng tâm $G'$ của tam giác hình chiếu.</span>";
            }

            updateMath(`G \\text{ là trọng tâm } \\Delta ABC \\Rightarrow G' \\text{ là trọng tâm } \\Delta A'B'C'`, 
                `<div class="mb-1 font-bold text-cyan-700">Ví dụ 1: Hình chiếu của Tam giác</div>
                <div class="text-slate-800 leading-relaxed text-base">${res}</div>`);
        }

        // --- M7: VÍ DỤ 2 (Dựng bóng Khối hộp / Hình lập phương) ---
        function renderM7() {
            camera.position.set(15, 12, 20); controls.target.set(0, 0, 0);
            clearAll(); drawStandardAxes(8,8,8);
            drawBasePlane(20, 20, 0, 0x3b82f6, '(P)');
            
            const ax = state.m7.angleX * Math.PI/180;
            const az = state.m7.angleZ * Math.PI/180;
            // Vector hướng chiếu phức tạp một chút để tạo bóng đa dạng
            const lVec = new THREE.Vector3(Math.sin(ax), -1, Math.sin(az)).normalize();

            // Khối hộp (Z nâng lên để ko chạm đất)
            const s = 3; const H = 5;
            const A = new THREE.Vector3(-s, H, s); const B = new THREE.Vector3(s, H, s);
            const C = new THREE.Vector3(s, H, -s); const D = new THREE.Vector3(-s, H, -s);
            const A2 = new THREE.Vector3(-s, H+s*2, s); const B2 = new THREE.Vector3(s, H+s*2, s);
            const C2 = new THREE.Vector3(s, H+s*2, -s); const D2 = new THREE.Vector3(-s, H+s*2, -s);

            const pts = [A, B, C, D, A2, B2, C2, D2];
            
            // Vẽ khối lập phương
            createFace([A, B, C, D], 0x94a3b8, 0.6); createFace([A2, B2, C2, D2], 0x94a3b8, 0.6);
            createFace([A, B, B2, A2], 0x94a3b8, 0.6); createFace([B, C, C2, B2], 0x94a3b8, 0.6);
            createFace([C, D, D2, C2], 0x94a3b8, 0.6); createFace([D, A, A2, D2], 0x94a3b8, 0.6);
            
            // Viền lập phương
            const eCol = 0x1e293b;
            drawLine(A, B, eCol, 2); drawLine(B, C, eCol, 2); drawLine(C, D, eCol, 2); drawLine(D, A, eCol, 2);
            drawLine(A2, B2, eCol, 2); drawLine(B2, C2, eCol, 2); drawLine(C2, D2, eCol, 2); drawLine(D2, A2, eCol, 2);
            drawLine(A, A2, eCol, 2); drawLine(B, B2, eCol, 2); drawLine(C, C2, eCol, 2); drawLine(D, D2, eCol, 2);

            // Lấy hình chiếu của 8 đỉnh
            const projPts = pts.map(p => projectPoint(p, lVec));
            
            // Thuật toán bọc lồi (Convex Hull 2D) nhanh để vẽ mép bóng đổ cho đẹp
            // Chiếu 3D xuống 2D plane (x, z)
            const hull2D = computeConvexHull(projPts.map(p => ({x: p.x, y: p.z, orig: p})));
            
            // Vẽ bóng đa giác
            const shadowFacePts = hull2D.map(h => h.orig);
            createFace(shadowFacePts, 0xdc2626, 0.5, false); // Không occluder
            
            // Viền bóng
            for(let i=0; i<shadowFacePts.length; i++) {
                drawLine(shadowFacePts[i], shadowFacePts[(i+1)%shadowFacePts.length], 0xdc2626, 5);
            }

            // Tia chiếu 8 đỉnh
            for(let i=0; i<8; i++) drawRay(pts[i], projPts[i], 0xfcd34d, 0.8);

            updateMath(`\\text{Hình lập phương } \\rightarrow \\text{ Đa giác}`, 
                `<div class="mb-1 font-bold text-fuchsia-700">Ví dụ 2: Dựng bóng Khối hộp</div>
                <div class="mb-2">Bóng của khối lập phương là một đa giác lồi. Tuỳ thuộc vào góc chiếu, cái bóng này có thể là một hình vuông, hình bình hành, hoặc thường thấy nhất là một <span class="text-red-700 font-bold">Lục giác</span>!</div>
                <div class="p-3 rounded bg-fuchsia-50 border border-fuchsia-200">
                    <span class="font-bold text-fuchsia-800">👉 Tương tác:</span> Dùng thanh trượt chéo để tuỳ biến phương chiếu $X$ và $Z$. Quan sát cái bóng hình Lục giác màu đỏ dưới đất biến dạng thành các cấu trúc kỳ thú!
                </div>`);
        }

        // Hàm hỗ trợ tìm bao lồi 2D
        function computeConvexHull(points) {
            points.sort((a, b) => a.x === b.x ? a.y - b.y : a.x - b.x);
            const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
            const lower = [];
            for (let p of points) {
                while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
                lower.push(p);
            }
            const upper = [];
            for (let i = points.length - 1; i >= 0; i--) {
                let p = points[i];
                while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
                upper.push(p);
            }
            upper.pop(); lower.pop();
            return lower.concat(upper);
        }

        // --- M8: THỰC TẾ (Bóng nắng Toà nhà) ---
        function renderM8() {
            camera.position.set(15, 12, 20); controls.target.set(0, 0, 0);
            clearAll(); 
            
            // Mặt đất
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshPhongMaterial({color: 0x10b981, side:THREE.DoubleSide}));
            ground.rotation.x = -Math.PI/2; objectsGroup.add(ground);
            
            const t = state.m8.time; // 6h to 18h
            // Tính góc mặt trời dựa trên giờ (t). 6h = -90 độ, 12h = 0 độ, 18h = 90 độ (theo trục X)
            // Ta dùng góc theo mặt phẳng xy. Góc cao (elevation) là parabol.
            // Để đơn giản: 
            const angle = (t - 12) * 15 * Math.PI/180; // Trưa t=12 => 0 độ thẳng đứng
            // lVec đi xuống.
            let lVec = new THREE.Vector3(Math.sin(angle), -Math.cos(angle), 0.2).normalize();
            if (t <= 6 || t >= 18) lVec = new THREE.Vector3(Math.sin(angle), -0.05, 0.2).normalize(); // Bóng cực dài khi sáng sớm/chiều muộn

            // Vẽ Mặt trời
            const sunDist = 20;
            const sunPos = new THREE.Vector3().copy(lVec).multiplyScalar(-sunDist);
            const sun = new THREE.Mesh(new THREE.SphereGeometry(1.5, 16, 16), new THREE.MeshBasicMaterial({color: 0xfcd34d}));
            sun.position.copy(sunPos); objectsGroup.add(sun);
            createTextSprite(`${t} Giờ`, '#d97706', 1.5).position.copy(sunPos).add(new THREE.Vector3(0, 2, 0));

            drawRay(sunPos, new THREE.Vector3(0,0,0), 0xfcd34d, 1.5);

            // Toà nhà
            const bw = 4, bl = 4, bh = 8;
            const pts = [
                new THREE.Vector3(-bw, 0, -bl), new THREE.Vector3(bw, 0, -bl),
                new THREE.Vector3(bw, 0, bl), new THREE.Vector3(-bw, 0, bl),
                new THREE.Vector3(-bw, bh, -bl), new THREE.Vector3(bw, bh, -bl),
                new THREE.Vector3(bw, bh, bl), new THREE.Vector3(-bw, bh, bl)
            ];

            // Tường
            createFace([pts[0], pts[1], pts[5], pts[4]], 0x94a3b8, 1.0);
            createFace([pts[1], pts[2], pts[6], pts[5]], 0xcbd5e1, 1.0);
            createFace([pts[2], pts[3], pts[7], pts[6]], 0x94a3b8, 1.0);
            createFace([pts[3], pts[0], pts[4], pts[7]], 0xcbd5e1, 1.0);
            createFace([pts[4], pts[5], pts[6], pts[7]], 0x64748b, 1.0); // Nóc

            // Lưới toà nhà
            const eCol = 0x1e293b;
            drawLine(pts[0], pts[1], eCol, 2); drawLine(pts[1], pts[2], eCol, 2); drawLine(pts[2], pts[3], eCol, 2); drawLine(pts[3], pts[0], eCol, 2);
            drawLine(pts[4], pts[5], eCol, 2); drawLine(pts[5], pts[6], eCol, 2); drawLine(pts[6], pts[7], eCol, 2); drawLine(pts[7], pts[4], eCol, 2);
            drawLine(pts[0], pts[4], eCol, 2); drawLine(pts[1], pts[5], eCol, 2); drawLine(pts[2], pts[6], eCol, 2); drawLine(pts[3], pts[7], eCol, 2);

            // Vẽ Bóng đổ (Shadow)
            const projPts = pts.map(p => projectPoint(p, lVec));
            const hull2D = computeConvexHull(projPts.map(p => ({x: p.x, y: p.z, orig: p})));
            const shadowFacePts = hull2D.map(h => h.orig);
            // Đẩy bóng lên 0.05 để ko chìm vào cỏ
            shadowFacePts.forEach(p => p.y = 0.05);

            createFace(shadowFacePts, 0x1e293b, 0.6, false); // Bóng đen mờ

            updateMath(`l_{\\text{sun}} = (\\sin \\alpha, -\\cos \\alpha, \\dots)`, 
                `<div class="mb-1 font-bold text-rose-700">Ứng dụng: Thiết kế & Chống nóng Toà nhà</div>
                <div class="mb-2">Trong kỹ thuật xây dựng và quy hoạch, người ta ứng dụng phép chiếu song song để mô phỏng chính xác cái bóng của các toà cao ốc theo từng múi giờ trong ngày.</div>

        // --- CÁC HÀM UI MỞ RỘNG (THU GỌN MENU & CÔNG CỤ VẼ) ---
        window.toggleMenuWidth = function() {
            const container = document.getElementById('left-menu-container');
            const titleSpan = document.querySelector('#left-menu-title span');
            const isShrunk = container.classList.contains('md:w-[120px]');
            
            if (isShrunk) {
                container.classList.remove('md:w-[120px]');
                container.classList.add('md:w-[350px]');
                titleSpan.style.opacity = '1';
                titleSpan.style.width = 'auto';
            } else {
                container.classList.remove('md:w-[350px]');
                container.classList.add('md:w-[120px]');
                titleSpan.style.opacity = '0';
                titleSpan.style.width = '0px';
            }
        };

        function resizeDrawCanvas() {
            if(drawCanvas) {
                drawCanvas.width = window.innerWidth;
                drawCanvas.height = window.innerHeight;
                redrawCanvas();
            }
        }

        window.toggleDrawingMode = function() {
            isDrawingMode = !isDrawingMode;
            const options = document.getElementById('draw-options');
            const btn = document.getElementById('btn-toggle-draw');
            
            if (isDrawingMode) {
                options.classList.remove('hidden');
                options.classList.add('flex');
                btn.classList.add('bg-blue-50', 'text-blue-600', 'border-blue-300');
                drawCanvas.classList.remove('pointer-events-none');
                drawCanvas.classList.add('pointer-events-auto', 'cursor-crosshair');
                controls.enabled = false; 
            } else {
                options.classList.add('hidden');
                options.classList.remove('flex');
                btn.classList.remove('bg-blue-50', 'text-blue-600', 'border-blue-300');
                drawCanvas.classList.add('pointer-events-none');
                drawCanvas.classList.remove('pointer-events-auto', 'cursor-crosshair');
                controls.enabled = true; 
            }
        };

        window.setDrawType = function(type) {
            drawType = type;
            document.getElementById('btn-pen').className = type === 'pen' ? 'p-1.5 bg-blue-100 text-blue-600 rounded border border-blue-300 transition-colors' : 'p-1.5 hover:bg-slate-100 text-slate-600 rounded border border-transparent transition-colors';
            document.getElementById('btn-line-solid').className = type === 'solid' ? 'p-1.5 bg-blue-100 text-blue-600 rounded border border-blue-300 transition-colors' : 'p-1.5 hover:bg-slate-100 text-slate-600 rounded border border-transparent transition-colors';
            document.getElementById('btn-line-dashed').className = type === 'dashed' ? 'p-1.5 bg-blue-100 text-blue-600 rounded border border-blue-300 transition-colors' : 'p-1.5 hover:bg-slate-100 text-slate-600 rounded border border-transparent transition-colors';
            document.getElementById('btn-eraser').className = type === 'eraser' ? 'p-1.5 bg-blue-100 text-blue-600 rounded border border-blue-300 transition-colors' : 'p-1.5 hover:bg-slate-100 text-slate-600 rounded border border-transparent transition-colors';
        };

        window.clearDrawing = function() {
            drawnItems = [];
            redrawCanvas();
        };

        const handleMouseStart = (e) => {
            if(!isDrawingMode) return;
            isDrawing = true;
            const color = document.getElementById('draw-color').value;
            const rect = drawCanvas.getBoundingClientRect();
            const clientX = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const clientY = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            
            if (drawType === 'eraser') {
                currentItem = { type: 'eraser', points: [{x: clientX, y: clientY}] };
            } else if (drawType === 'pen') {
                currentItem = { type: 'pen', color: color, points: [{x: clientX, y: clientY}] };
            } else {
                currentItem = { type: 'line', startX: clientX, startY: clientY, endX: clientX, endY: clientY, color, dashed: drawType === 'dashed' };
            }
        };

        const handleMouseMove = (e) => {
            if(!isDrawing || !isDrawingMode) return;
            const rect = drawCanvas.getBoundingClientRect();
            const clientX = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const clientY = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            
            if (drawType === 'eraser' || drawType === 'pen') {
                currentItem.points.push({x: clientX, y: clientY});
            } else {
                currentItem.endX = clientX;
                currentItem.endY = clientY;
            }
            redrawCanvas();
            drawItem(currentItem); 
        };

        const handleMouseEnd = () => {
            if(!isDrawing || !isDrawingMode) return;
            isDrawing = false;
            if(currentItem) {
                if (currentItem.type === 'line' && (Math.abs(currentItem.startX - currentItem.endX) > 2 || Math.abs(currentItem.startY - currentItem.endY) > 2)) {
                    drawnItems.push(currentItem);
                } else if ((currentItem.type === 'eraser' || currentItem.type === 'pen') && currentItem.points.length > 1) {
                    drawnItems.push(currentItem);
                }
            }
            currentItem = null;
            redrawCanvas();
        };

        function drawItem(item) {
            if (item.type === 'line') {
                dCtx.globalCompositeOperation = 'source-over';
                dCtx.beginPath();
                dCtx.moveTo(item.startX, item.startY);
                dCtx.lineTo(item.endX, item.endY);
                dCtx.strokeStyle = item.color;
                dCtx.lineWidth = 4;
                if(item.dashed) dCtx.setLineDash([10, 10]);
                else dCtx.setLineDash([]);
                dCtx.stroke();
            } else if (item.type === 'pen') {
                dCtx.globalCompositeOperation = 'source-over';
                dCtx.beginPath();
                dCtx.moveTo(item.points[0].x, item.points[0].y);
                for(let i=1; i<item.points.length; i++) {
                    dCtx.lineTo(item.points[i].x, item.points[i].y);
                }
                dCtx.strokeStyle = item.color;
                dCtx.lineWidth = 4;
                dCtx.lineCap = 'round';
                dCtx.lineJoin = 'round';
                dCtx.setLineDash([]);
                dCtx.stroke();
            } else if (item.type === 'eraser') {
                dCtx.globalCompositeOperation = 'destination-out';
                dCtx.beginPath();
                dCtx.moveTo(item.points[0].x, item.points[0].y);
                for(let i=1; i<item.points.length; i++) {
                    dCtx.lineTo(item.points[i].x, item.points[i].y);
                }
                dCtx.strokeStyle = 'rgba(0,0,0,1)';
                dCtx.lineWidth = 40; 
                dCtx.lineCap = 'round';
                dCtx.lineJoin = 'round';
                dCtx.setLineDash([]);
                dCtx.stroke();
                dCtx.globalCompositeOperation = 'source-over';
            }
        }
        
        function redrawCanvas() {
            dCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            drawnItems.forEach(drawItem);
        }

        function switchMode(mode) {
            currentMode = mode;
            [1,2,3,4,5,6,7,8].forEach(i => {
                const btn = document.getElementById(`btn-mode-${i}`);
                if (i === mode) btn.className = btn.className.replace('bg-opacity-50', 'shadow-md scale-105 z-10 font-bold border-l-8').replace('bg-gray-50', ''); 
                else btn.className = `w-full text-left px-4 py-2.5 rounded-lg transition font-semibold text-sm shadow-sm border-l-4 bg-gray-50 bg-opacity-50 hover:bg-gray-100 truncate overflow-hidden ${['border-amber-500 text-amber-900', 'border-blue-500 text-blue-900', 'border-emerald-500 text-emerald-900', 'border-purple-500 text-purple-900', 'border-teal-500 text-teal-900', 'border-cyan-500 text-cyan-900', 'border-fuchsia-500 text-fuchsia-900', 'border-rose-500 text-rose-900'][i-1]}`;
            });

            const activeBtn = document.getElementById(`btn-mode-${mode}`);
            const colors = ['amber', 'blue', 'emerald', 'purple', 'teal', 'cyan', 'fuchsia', 'rose'];
            const c = colors[mode-1];
            activeBtn.className = `w-full text-left px-4 py-2.5 rounded-lg transition font-bold text-sm shadow-md border-l-8 bg-${c}-100 border-${c}-600 text-${c}-900 scale-105 origin-left truncate overflow-hidden`;

            const problemHtml = problems[mode - 1].replace(/\$(.*?)\$/g, (m, math) => {
                try { return katex.renderToString(math, { throwOnError: false }); } catch(e) { return m; }
            });
            document.getElementById('problem-text').innerHTML = problemHtml;

            if(mode === 1) buildUI(`<label class="text-xs font-bold">Thay đổi góc chiếu của Tia sáng $l$: <span class="text-blue-600">${state.m1.angle}°</span><input type="range" min="-60" max="60" step="2" value="${state.m1.angle}" oninput="state.m1.angle=parseFloat(this.value); renderM1(); this.previousElementSibling.innerText=this.value+'°'"></label>`);
            else if(mode === 2) buildUI(`<label class="text-xs font-bold">Kéo điểm M dọc theo đoạn thẳng AB: <span class="text-blue-600">tỉ lệ ${state.m2.k.toFixed(2)}</span><input type="range" min="0.1" max="0.9" step="0.05" value="${state.m2.k}" oninput="state.m2.k=parseFloat(this.value); renderM2(); this.previousElementSibling.innerText='tỉ lệ '+this.value"></label>`);
            else if(mode === 3) buildUI(`<label class="text-xs font-bold">Xoay để thay đổi phương của tia chiếu $l$: <span class="text-blue-600">${state.m3.rot}°</span><input type="range" min="-90" max="90" step="5" value="${state.m3.rot}" oninput="state.m3.rot=parseFloat(this.value); renderM3(); this.previousElementSibling.innerText=this.value+'°'"></label>`);
            else if(mode === 4) buildUI(`<label class="text-xs font-bold">Dịch chuyển điểm chia tỉ lệ M: <span class="text-blue-600">AM/MB = ${(state.m4.k / (1-state.m4.k)).toFixed(2)}</span><input type="range" min="0.2" max="0.8" step="0.1" value="${state.m4.k}" oninput="state.m4.k=parseFloat(this.value); renderM4(); this.previousElementSibling.innerText='AM/MB = '+(this.value / (1-this.value)).toFixed(2)"></label>`);
            else if(mode === 5) buildUI(`<label class="text-xs font-bold">Tăng góc xiên để kéo dẹt đường Elip: <span class="text-blue-600">${state.m5.angle}°</span><input type="range" min="0" max="60" step="2" value="${state.m5.angle}" oninput="state.m5.angle=parseFloat(this.value); renderM5(); this.previousElementSibling.innerText=this.value+'°'"></label>`);
            else if(mode === 6) buildUI(`<label class="text-xs font-bold">Kéo để xem từng bước Dựng hình: Bước <span class="text-blue-600">${state.m6.step}</span>/3<input type="range" min="0" max="3" step="1" value="${state.m6.step}" oninput="state.m6.step=parseInt(this.value); renderM6(); this.previousElementSibling.innerText=this.value"></label>`);
            else if(mode === 7) buildUI(`<div class="flex gap-4"><label class="text-xs font-bold w-1/2">Góc chiếu Ox: <span class="text-blue-600">${state.m7.angleX}°</span><input type="range" min="-60" max="60" step="5" value="${state.m7.angleX}" oninput="state.m7.angleX=parseFloat(this.value); renderM7(); this.previousElementSibling.innerText=this.value+'°'"></label><label class="text-xs font-bold w-1/2">Góc chiếu Oz: <span class="text-blue-600">${state.m7.angleZ}°</span><input type="range" min="-60" max="60" step="5" value="${state.m7.angleZ}" oninput="state.m7.angleZ=parseFloat(this.value); renderM7(); this.previousElementSibling.innerText=this.value+'°'"></label></div>`);
            else if(mode === 8) buildUI(`<label class="text-xs font-bold">Mô phỏng thời gian Mặt trời mọc lặn: <span class="text-blue-600">${state.m8.time} Giờ</span><input type="range" min="6" max="18" step="1" value="${state.m8.time}" oninput="state.m8.time=parseInt(this.value); renderM8(); this.previousElementSibling.innerText=this.value+' Giờ'"></label>`);

            clearAll(); 
            window[`renderM${mode}`]();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.state = state;
        window.renderM1 = renderM1; window.renderM2 = renderM2; window.renderM3 = renderM3;
        window.renderM4 = renderM4; window.renderM5 = renderM5;
        window.renderM6 = renderM6; window.renderM7 = renderM7; window.renderM8 = renderM8;

        window.onload = init;
    </script>
</body>
</html>

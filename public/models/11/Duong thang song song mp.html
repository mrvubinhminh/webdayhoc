<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô Phỏng 3D - Đường Thẳng Song Song Mặt Phẳng (Toán 11)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        sidebarBg: '#1e293b',
                        panelBg: '#1e293b',
                        accentColor: '#6366f1', // Indigo 500
                        accentHover: '#4f46e5', // Indigo 600
                        textMuted: '#94a3b8'
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- KaTeX for Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        body { margin: 0; overflow: hidden; background-color: #0f172a; }
        
        .label-3d {
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-weight: bold;
            font-size: 18px;
            text-shadow: 0px 0px 5px rgba(0,0,0,1), 0px 0px 2px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        
        .label-math {
            color: #c084fc; /* Purple 400 for math labels */
            font-family: 'Times New Roman', Times, serif; 
            font-style: italic;
            font-size: 22px;
        }
    </style>
</head>
<body class="text-white h-screen flex flex-col font-sans select-none">

    <!-- Header -->
    <header class="h-14 bg-darkBg border-b border-slate-800 flex items-center justify-between px-4 shrink-0 z-10 relative shadow-md">
        <div class="flex items-center gap-4">
            <button class="flex items-center gap-2 bg-red-900/30 text-red-400 hover:bg-red-900/50 px-3 py-1.5 rounded text-sm transition-colors border border-red-900/50">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                Đóng
            </button>
            <h1 class="text-lg font-semibold tracking-wide text-indigo-100">Đường Thẳng Song Song Với Mặt Phẳng</h1>
        </div>
        
        <!-- Nút Toàn màn hình -->
        <button id="fullscreen-btn" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded text-sm text-textMuted transition-colors border border-slate-700 group">
            <svg id="fullscreen-icon" class="group-hover:text-white transition-colors" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
            </svg>
            <span id="fullscreen-text" class="group-hover:text-white transition-colors">Toàn màn hình (F)</span>
        </button>
    </header>

    <!-- Main Content Area -->
    <div class="flex flex-1 overflow-hidden relative">
        
        <!-- Sidebar -->
        <aside class="w-[340px] bg-sidebarBg border-r border-slate-800 flex flex-col z-10 shadow-xl shrink-0">
            <!-- Logo Area -->
            <div class="p-4 border-b border-slate-800 flex items-center gap-3">
                <div class="w-10 h-10 rounded-full border-2 border-indigo-500 flex items-center justify-center font-bold text-indigo-500 shadow-[0_0_10px_rgba(99,102,241,0.4)]">
                    KNTT
                </div>
                <div>
                    <div class="font-bold tracking-wider text-sm text-indigo-100">TOÁN 11 - BÀI 12</div>
                    <div class="text-[10px] text-indigo-400/80 uppercase tracking-widest">Đường thẳng & Mặt phẳng</div>
                </div>
            </div>

            <!-- Menu List -->
            <div class="flex-1 overflow-y-auto p-3 space-y-2" id="menu-list">
                <!-- Menu items generated by JS -->
            </div>
        </aside>

        <!-- 3D Viewport & Footer Container -->
        <main class="flex-1 relative flex flex-col">
            <!-- 3D Canvas Container -->
            <div id="canvas-container" class="flex-1 bg-[#0a0f1d] relative cursor-grab active:cursor-grabbing">
                <!-- Three.js renders here -->
            </div>

            <!-- Bottom Information Panel -->
            <div class="h-36 bg-sidebarBg/95 backdrop-blur-md border-t border-slate-700 p-6 flex items-center justify-between z-10 shrink-0 relative">
                <div class="flex-1 pr-6">
                    <h2 class="text-xl font-bold flex items-center gap-2 mb-2 text-indigo-400" id="info-title">
                        <svg class="text-indigo-500" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                        <!-- Title dynamically inserted -->
                    </h2>
                    <p class="text-slate-300 text-sm leading-relaxed" id="info-desc">
                        <!-- Description dynamically inserted -->
                    </p>
                </div>
                
                <!-- Formula Box -->
                <div class="bg-[#0f172a] border border-slate-700 rounded-xl px-8 py-4 flex items-center justify-center min-w-[300px] shadow-inner h-full">
                    <div id="math-formula" class="text-indigo-300 text-xl font-serif">
                        <!-- KaTeX Formula dynamically inserted -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Application Logic -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>

    <script>
        const menuData = [
            { 
                id: 1, 
                label: "Vị trí 1", 
                title: "Đường thẳng nằm trong mặt phẳng", 
                desc: "Đường thẳng d có từ hai điểm chung trở lên với mặt phẳng (P), khi đó mọi điểm của d đều thuộc (P).", 
                formula: "d \\subset (P)" 
            },
            { 
                id: 2, 
                label: "Vị trí 2", 
                title: "Đường thẳng cắt mặt phẳng", 
                desc: "Đường thẳng d và mặt phẳng (P) có duy nhất một điểm chung I.", 
                formula: "d \\cap (P) = \\{I\\}" 
            },
            { 
                id: 3, 
                label: "Vị trí 3", 
                title: "Đường thẳng song song mặt phẳng", 
                desc: "Đường thẳng d và mặt phẳng (P) hoàn toàn không có bất kỳ điểm chung nào.", 
                formula: "d \\parallel (P)" 
            },
            { 
                id: 4, 
                label: "Định lí 1", 
                title: "Điều kiện để đường thẳng song song mp", 
                desc: "Nếu đường thẳng a không nằm trong mặt phẳng (P) và song song với một đường thẳng b nằm trong (P) thì a song song với (P).", 
                formula: "a \\not\\subset (P), b \\subset (P), a \\parallel b \\Rightarrow a \\parallel (P)" 
            },
            { 
                id: 5, 
                label: "Định lí 2", 
                title: "Giao tuyến của 2 mặt phẳng", 
                desc: "Cho đường thẳng a song song mặt phẳng (P). Nếu (Q) chứa a và cắt (P) theo giao tuyến b thì b song song với a.", 
                formula: "a \\parallel (P), a \\subset (Q), (P) \\cap (Q) = b \\Rightarrow a \\parallel b" 
            },
            { 
                id: 6, 
                label: "Hệ quả", 
                title: "Giao tuyến song song", 
                desc: "Nếu hai mặt phẳng phân biệt cùng song song với một đường thẳng a thì giao tuyến của chúng (nếu có) cũng song song với a.", 
                formula: "\\Delta = (P) \\cap (Q), a \\parallel (P), a \\parallel (Q) \\Rightarrow a \\parallel \\Delta" 
            }
        ];

        let currentStateId = 1;
        let currentStateGroup = null;

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a0f1d, 0.015);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(35, 30, 45); // Góc nhìn đẹp bao quát

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const labelRenderer = new THREE.CSS2DRenderer();
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        container.appendChild(labelRenderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.1; // Hạn chế nhìn từ dưới đáy quá nhiều

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(15, 25, 20);
        scene.add(dirLight);

        // Lưới toạ độ nền
        const gridHelper = new THREE.GridHelper(80, 80, 0x1e293b, 0x1e293b);
        gridHelper.position.y = -10;
        scene.add(gridHelper);

        function createLabel(text, extraClass = '') {
            const div = document.createElement('div');
            div.className = `label-3d ${extraClass}`;
            div.innerHTML = text;
            return new THREE.CSS2DObject(div);
        }

        function createPoint(pos, color = 0xfacc15, size = 0.35, labelTxt = '') {
            const geo = new THREE.SphereGeometry(size, 32, 32);
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.2, metalness: 0.5 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(pos);
            
            if (labelTxt) {
                const label = createLabel(labelTxt, 'label-math');
                label.position.set(0.6, 0.8, 0);
                mesh.add(label);
            }
            return mesh;
        }

        // Đường thẳng khối trụ (Nét đậm rõ ràng)
        function createThickLine(pt1, pt2, color = 0xef4444, thickness = 0.15) {
            const distance = pt1.distanceTo(pt2);
            const geo = new THREE.CylinderGeometry(thickness, thickness, distance, 16);
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3 });
            const cylinder = new THREE.Mesh(geo, mat);
            
            const position = new THREE.Vector3().addVectors(pt1, pt2).multiplyScalar(0.5);
            cylinder.position.copy(position);
            cylinder.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3().subVectors(pt2, pt1).normalize());
            
            return cylinder;
        }

        // Đường nét đứt
        function createDashedLine(pt1, pt2, color = 0x94a3b8) {
            const mat = new THREE.LineDashedMaterial({ color: color, dashSize: 0.8, gapSize: 0.5 });
            const geo = new THREE.BufferGeometry().setFromPoints([pt1, pt2]);
            const line = new THREE.Line(geo, mat);
            line.computeLineDistances();
            return line;
        }
        
        // Mặt phẳng (Polygon Custom để tùy biến dễ hơn)
        function createCustomPlane(p1, p2, p3, p4, color, labelTxt, labelPos, opacity = 0.3) {
            const group = new THREE.Group();
            const geo = new THREE.BufferGeometry();
            const vertices = new Float32Array([
                p1.x, p1.y, p1.z,  p2.x, p2.y, p2.z,  p3.x, p3.y, p3.z,
                p3.x, p3.y, p3.z,  p4.x, p4.y, p4.z,  p1.x, p1.y, p1.z
            ]);
            geo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            geo.computeVertexNormals();

            // Mặt phẳng bên trong
            const mat = new THREE.MeshPhysicalMaterial({ color: color, transparent: true, opacity: opacity, side: THREE.DoubleSide, depthWrite: false });
            const mesh = new THREE.Mesh(geo, mat);

            // Viền mặt phẳng nổi bật
            const edges = new THREE.EdgesGeometry(geo);
            const edgeMat = new THREE.LineBasicMaterial({ color: color, linewidth: 2 });
            const outline = new THREE.LineSegments(edges, edgeMat);

            group.add(mesh, outline);
            if (labelTxt && labelPos) {
                const lbl = createLabel(labelTxt, 'label-math');
                lbl.position.copy(labelPos);
                group.add(lbl);
            }
            return group;
        }

        // Tạo Mặt Phẳng Nằm Ngang Nhanh
        function createHorizontalPlane(y, size, color, labelTxt) {
            const half = size / 2;
            const p1 = new THREE.Vector3(-half, y, -half);
            const p2 = new THREE.Vector3(half, y, -half);
            const p3 = new THREE.Vector3(half, y, half);
            const p4 = new THREE.Vector3(-half, y, half);
            const lblPos = new THREE.Vector3(half - 5, y + 0.5, half - 5);
            return createCustomPlane(p1, p2, p3, p4, color, labelTxt, lblPos, 0.35);
        }

        function buildState(id) {
            const group = new THREE.Group();
            const EXT = 28; // Chiều dài mở rộng đường thẳng
            
            switch (id) {
                case 1: { // d nằm trong (P)
                    const plane = createHorizontalPlane(0, 45, 0x3b82f6, '(P)'); // Xanh Blue
                    
                    const p1 = new THREE.Vector3(-EXT, 0, -8);
                    const p2 = new THREE.Vector3(EXT, 0, 8);
                    const lineD = createThickLine(p1, p2, 0xef4444, 0.15); // Đỏ
                    
                    const lblD = createLabel('d', 'label-math text-red-400');
                    lblD.position.copy(p2).add(new THREE.Vector3(0, 1, 0));

                    // Điểm chung mô phỏng
                    const ptA = createPoint(new THREE.Vector3(-10, 0, -3.2), 0xfacc15, 0.4, 'A');
                    const ptB = createPoint(new THREE.Vector3(10, 0, 3.2), 0xfacc15, 0.4, 'B');

                    group.add(plane, lineD, lblD, ptA, ptB);
                    break;
                }
                case 2: { // d cắt (P)
                    const plane = createHorizontalPlane(0, 45, 0x3b82f6, '(P)');
                    
                    // Đường thẳng chéo qua
                    const p1 = new THREE.Vector3(-20, 20, -15);
                    const p2 = new THREE.Vector3(20, -20, 15);
                    const lineD = createThickLine(p1, p2, 0xef4444, 0.15);
                    
                    const lblD = createLabel('d', 'label-math text-red-400');
                    lblD.position.copy(p1).add(new THREE.Vector3(0, 1, 0));

                    // Giao điểm I
                    const pI = new THREE.Vector3(0, 0, 0); 
                    const ptI = createPoint(pI, 0xfacc15, 0.45, 'I');

                    group.add(plane, lineD, lblD, ptI);
                    break;
                }
                case 3: { // d song song (P)
                    const plane = createHorizontalPlane(0, 45, 0x3b82f6, '(P)');
                    
                    // Đường thẳng nổi bên trên mặt phẳng
                    const height = 12;
                    const p1 = new THREE.Vector3(-EXT, height, -10);
                    const p2 = new THREE.Vector3(EXT, height, 10);
                    const lineD = createThickLine(p1, p2, 0xef4444, 0.15);
                    
                    const lblD = createLabel('d', 'label-math text-red-400');
                    lblD.position.copy(p2).add(new THREE.Vector3(0, 1, 0));

                    group.add(plane, lineD, lblD);
                    break;
                }
                case 4: { // Định lí 1: a // b, b thuộc P => a // P
                    const plane = createHorizontalPlane(0, 45, 0x3b82f6, '(P)');
                    
                    // b nằm trong P
                    const b1 = new THREE.Vector3(-EXT, 0, 5);
                    const b2 = new THREE.Vector3(EXT, 0, 5);
                    const lineB = createThickLine(b1, b2, 0x10b981, 0.15); // Xanh lá
                    const lblB = createLabel('b', 'label-math text-emerald-400');
                    lblB.position.copy(b2).add(new THREE.Vector3(0, 1, 0));

                    // a lơ lửng song song với b
                    const a1 = new THREE.Vector3(-EXT, 12, 5);
                    const a2 = new THREE.Vector3(EXT, 12, 5);
                    const lineA = createThickLine(a1, a2, 0xef4444, 0.15); // Đỏ
                    const lblA = createLabel('a', 'label-math text-red-400');
                    lblA.position.copy(a2).add(new THREE.Vector3(0, 1, 0));

                    group.add(plane, lineA, lineB, lblA, lblB);
                    break;
                }
                case 5: { // Định lí 2: a // P, a thuộc Q, Q giao P = b => a // b
                    // (P) nằm ngang
                    const p1 = new THREE.Vector3(-25, 0, -25);
                    const p2 = new THREE.Vector3(25, 0, -25);
                    const p3 = new THREE.Vector3(25, 0, 25);
                    const p4 = new THREE.Vector3(-25, 0, 25);
                    const planeP = createCustomPlane(p1, p2, p3, p4, 0x3b82f6, '(P)', new THREE.Vector3(20, 0.5, 20), 0.3);

                    // (Q) nằm nghiêng cắt (P)
                    const q1 = new THREE.Vector3(-25, 18, -12);
                    const q2 = new THREE.Vector3(25, 18, -12);
                    const q3 = new THREE.Vector3(25, -12, 18);
                    const q4 = new THREE.Vector3(-25, -12, 18);
                    const planeQ = createCustomPlane(q1, q2, q3, q4, 0xec4899, '(Q)', new THREE.Vector3(20, 18, -12), 0.25); // Màu Hồng

                    // Giao tuyến b nằm ở y=0. Giải PT ta có z = 6
                    const b1 = new THREE.Vector3(-EXT, 0, 6);
                    const b2 = new THREE.Vector3(EXT, 0, 6);
                    const lineB = createThickLine(b1, b2, 0x10b981, 0.15); // Xanh lá
                    const lblB = createLabel('b', 'label-math text-emerald-400');
                    lblB.position.copy(b2).add(new THREE.Vector3(0, 1, 0));

                    // Đường a thuộc (Q) và song song (P) => a có y hằng số, giả sử y=12 => z=-6
                    const a1 = new THREE.Vector3(-EXT, 12, -6);
                    const a2 = new THREE.Vector3(EXT, 12, -6);
                    const lineA = createThickLine(a1, a2, 0xef4444, 0.15); // Đỏ
                    const lblA = createLabel('a', 'label-math text-red-400');
                    lblA.position.copy(a2).add(new THREE.Vector3(0, 1, 0));

                    group.add(planeP, planeQ, lineA, lineB, lblA, lblB);
                    break;
                }
                case 6: { // Hệ quả: 2 mặt phẳng song song đt a => giao tuyến // a
                    // Xây dựng (P) và (Q) như mái lều cắt nhau tại đỉnh (Giao tuyến Delta)
                    
                    const peakY = 10;
                    // (P) bên trái
                    const p1 = new THREE.Vector3(-20, -5, -25);
                    const p2 = new THREE.Vector3(-20, -5, 25);
                    const p3 = new THREE.Vector3(0, peakY, 25);
                    const p4 = new THREE.Vector3(0, peakY, -25);
                    const planeP = createCustomPlane(p1, p2, p3, p4, 0x3b82f6, '(P)', new THREE.Vector3(-15, -4, 20), 0.3);

                    // (Q) bên phải
                    const q1 = new THREE.Vector3(20, -5, -25);
                    const q2 = new THREE.Vector3(20, -5, 25);
                    const q3 = new THREE.Vector3(0, peakY, 25);
                    const q4 = new THREE.Vector3(0, peakY, -25);
                    const planeQ = createCustomPlane(q1, q2, q3, q4, 0xec4899, '(Q)', new THREE.Vector3(15, -4, 20), 0.3);

                    // Giao tuyến Delta tại đỉnh lều
                    const d1 = new THREE.Vector3(0, peakY, -EXT);
                    const d2 = new THREE.Vector3(0, peakY, EXT);
                    const lineDelta = createThickLine(d1, d2, 0x14b8a6, 0.15); // Teal
                    const lblDelta = createLabel('\\Delta', 'label-math text-teal-400');
                    lblDelta.position.copy(d2).add(new THREE.Vector3(0, 1, 0));

                    // Đường a lơ lửng trên không, song song với 2 mặt (tức là song song Delta)
                    const a1 = new THREE.Vector3(0, 22, -EXT);
                    const a2 = new THREE.Vector3(0, 22, EXT);
                    const lineA = createThickLine(a1, a2, 0xef4444, 0.15); // Đỏ
                    const lblA = createLabel('a', 'label-math text-red-400');
                    lblA.position.copy(a2).add(new THREE.Vector3(0, 1, 0));

                    // Thêm đường gióng đứt nét giữa a và Delta để người xem dễ định vị không gian
                    const dashA = createDashedLine(new THREE.Vector3(0, peakY, 0), new THREE.Vector3(0, 22, 0), 0x94a3b8);

                    group.add(planeP, planeQ, lineDelta, lineA, lblDelta, lblA, dashA);
                    break;
                }
            }
            return group;
        }

        function destroyCSS2DObjects(group) {
            if (!group) return;
            group.traverse(child => {
                if (child.isCSS2DObject && child.element && child.element.parentNode) {
                    child.element.parentNode.removeChild(child.element);
                }
            });
        }

        function update3DScene(id) {
            if (currentStateGroup) {
                destroyCSS2DObjects(currentStateGroup);
                scene.remove(currentStateGroup);
                currentStateGroup = null;
            }

            currentStateGroup = buildState(id);
            scene.add(currentStateGroup);
        }

        function onWindowResize() {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
            labelRenderer.setSize(container.clientWidth, container.clientHeight);
        }
        window.addEventListener('resize', onWindowResize);

        function animate() {
            requestAnimationFrame(animate);
            if (controls) controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        
        window.onload = function() {
            onWindowResize();
            animate();
        };

        const menuListEl = document.getElementById('menu-list');
        const infoTitleEl = document.getElementById('info-title');
        const infoDescEl = document.getElementById('info-desc');
        const mathFormulaEl = document.getElementById('math-formula');

        function renderMenu() {
            menuListEl.innerHTML = '';
            menuData.forEach(item => {
                const btn = document.createElement('button');
                const isActive = item.id === currentStateId;
                
                btn.className = `w-full text-left px-4 py-3 rounded-lg text-sm transition-all duration-200 flex items-center gap-3 border ${
                    isActive 
                    ? 'bg-indigo-900/50 border-indigo-500/50 text-white shadow-[0_0_15px_rgba(99,102,241,0.2)]' 
                    : 'bg-transparent border-transparent text-slate-400 hover:bg-slate-800/50 hover:text-slate-200'
                }`;
                
                btn.innerHTML = `
                    <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs shrink-0 ${
                        isActive ? 'bg-indigo-600 text-white shadow-inner' : 'bg-slate-700 text-slate-300'
                    }">
                        ${item.id}
                    </div>
                    <div class="flex flex-col overflow-hidden">
                        <span class="font-semibold text-[13px] truncate whitespace-nowrap" title="${item.title}">${item.title}</span>
                        <span class="text-[11px] opacity-70 truncate whitespace-nowrap">${item.label}</span>
                    </div>
                `;
                
                btn.onclick = () => changeState(item.id);
                menuListEl.appendChild(btn);
            });
        }

        function updateFooter(id) {
            const data = menuData.find(item => item.id === id);
            if (!data) return;

            const iconHtml = `<svg class="text-indigo-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>`;
            infoTitleEl.innerHTML = iconHtml + ' ' + data.title;
            infoDescEl.textContent = data.desc;

            katex.render(data.formula, mathFormulaEl, {
                throwOnError: false,
                displayMode: true
            });
        }

        function changeState(id) {
            currentStateId = id;
            renderMenu();
            updateFooter(id);
            update3DScene(id);
        }

        // Khởi tạo ban đầu
        renderMenu();
        updateFooter(currentStateId);
        update3DScene(currentStateId);

        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const fullscreenIcon = document.getElementById('fullscreen-icon');
        const fullscreenText = document.getElementById('fullscreen-text');

        function toggleFullScreen() {
            if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {  
                const docElm = document.documentElement;
                if (docElm.requestFullscreen) docElm.requestFullscreen();
                else if (docElm.mozRequestFullScreen) docElm.mozRequestFullScreen();
                else if (docElm.webkitRequestFullScreen) docElm.webkitRequestFullScreen();
                else if (docElm.msRequestFullscreen) docElm.msRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                else if (document.msExitFullscreen) document.msExitFullscreen();
            }
        }

        fullscreenBtn.addEventListener('click', toggleFullScreen);

        // Lắng nghe sự kiện để đổi Icon và Text
        const fullscreenEvents = ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'];
        fullscreenEvents.forEach(event => {
            document.addEventListener(event, () => {
                const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
                if (isFullscreen) {
                    fullscreenText.textContent = 'Thu nhỏ (F)';
                    fullscreenIcon.innerHTML = `<path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path>`;
                } else {
                    fullscreenText.textContent = 'Toàn màn hình (F)';
                    fullscreenIcon.innerHTML = `<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>`;
                }
                setTimeout(onWindowResize, 150);
            });
        });

        // Phím tắt F
        document.addEventListener('keydown', (event) => {
            if (event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA') return;
            if (event.key === 'f' || event.key === 'F') {
                toggleFullScreen();
            }
        });

    </script>
</body>
</html>

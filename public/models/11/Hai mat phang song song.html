<body class="text-white h-screen flex flex-col font-sans select-none">

    <header class="h-14 bg-darkBg border-b border-slate-800 flex items-center justify-between px-4 shrink-0 z-10 relative shadow-md">
        <div class="flex items-center gap-4">
            <button class="flex items-center gap-2 bg-red-900/30 text-red-400 hover:bg-red-900/50 px-3 py-1.5 rounded text-sm transition-colors border border-red-900/50">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                Đóng

        <button id="fullscreen-btn" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded text-sm text-textMuted transition-colors border border-slate-700 group">

                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>

    <div class="flex flex-1 overflow-hidden relative">
        
        <!-- Sidebar -->
        <aside class="w-[340px] bg-sidebarBg border-r border-slate-800 flex flex-col z-10 shadow-xl shrink-0">
            <div class="p-4 border-b border-slate-800 flex items-center gap-3">
                <div class="w-10 h-10 rounded-full border-2 border-teal-500 flex items-center justify-center font-bold text-teal-500 shadow-[0_0_10px_rgba(20,184,166,0.4)]">
                    KNTT

                <div>
                    <div class="font-bold tracking-wider text-sm text-teal-100">TOÁN 11 - BÀI 13</div>

        <!-- 3D Viewport & Footer Container -->
        <main class="flex-1 relative flex flex-col">

                    <h2 class="text-xl font-bold flex items-center gap-2 mb-2 text-teal-400" id="info-title">
                        <svg class="text-teal-500" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>

    <script>
        const menuData = [
            { 
                id: 1, 
                label: "Vị trí 1", 
                title: "Hai mặt phẳng song song", 
                desc: "Hai mặt phẳng (P) và (Q) hoàn toàn không có bất kỳ điểm chung nào.", 
                formula: "(P) \\parallel (Q) \\Leftrightarrow (P) \\cap (Q) = \\emptyset" 
            },
            { 
                id: 2, 
                label: "Vị trí 2", 
                title: "Hai mặt phẳng cắt nhau", 
                desc: "Hai mặt phẳng (P) và (Q) có một đường thẳng chung duy nhất gọi là giao tuyến d.", 
                formula: "(P) \\cap (Q) = d" 
            },
            { 
                id: 3, 
                label: "Vị trí 3", 
                title: "Hai mặt phẳng trùng nhau", 
                desc: "Hai mặt phẳng (P) và (Q) có từ ba điểm chung không thẳng hàng trở lên, khi đó chúng là một.", 
                formula: "(P) \\equiv (Q)" 
            },
            { 
                id: 4, 
                label: "Định lí 1", 
                title: "Điều kiện hai mp song song", 
                desc: "Nếu mp (P) chứa hai đường thẳng cắt nhau a, b và cùng song song với mp (Q) thì (P) // (Q).", 
                formula: "a, b \\subset (P), a \\cap b = I, a \\parallel (Q), b \\parallel (Q) \\Rightarrow (P) \\parallel (Q)" 
            },
            { 
                id: 5, 
                label: "Tính chất 1", 
                title: "Qua một điểm ngoài mặt phẳng", 
                desc: "Qua một điểm M nằm ngoài mặt phẳng (P) có một và chỉ một mặt phẳng (Q) song song với (P).", 
                formula: "M \\notin (P) \\Rightarrow \\exists ! (Q) \\ni M: (Q) \\parallel (P)" 
            },
            { 
                id: 6, 
                label: "Tính chất 2", 
                title: "Giao tuyến của mặt phẳng thứ 3", 
                desc: "Nếu hai mặt phẳng song song bị cắt bởi mặt phẳng thứ ba thì hai giao tuyến đó song song với nhau.", 
                formula: "(P) \\parallel (Q), (R) \\cap (P) = a, (R) \\cap (Q) = b \\Rightarrow a \\parallel b" 
            },
            { 
                id: 7, 
                label: "Định lí 2", 
                title: "Định lí Thalès trong không gian", 
                desc: "Ba mặt phẳng đôi một song song chắn trên hai cát tuyến bất kì những đoạn thẳng tương ứng tỉ lệ.", 
                formula: "\\frac{AB}{A'B'} = \\frac{BC}{B'C'} = \\frac{AC}{A'C'}" 
            }
        ];

        let currentStateId = 1;
        let currentStateGroup = null;

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x091118, 0.015);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(45, 35, 55);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const labelRenderer = new THREE.CSS2DRenderer();
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        container.appendChild(labelRenderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Tăng cường độ ánh sáng để làm nổi bật các màu neon
        scene.add(new THREE.AmbientLight(0xffffff, 0.95));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(20, 30, 20);
        scene.add(dirLight);

        const gridHelper = new THREE.GridHelper(80, 80, 0x1e293b, 0x1e293b);
        gridHelper.position.y = -15;
        scene.add(gridHelper);

        function createLabel(text, extraClass = '') {
            const div = document.createElement('div');
            div.className = `label-3d ${extraClass}`;
            div.innerHTML = text;
            return new THREE.CSS2DObject(div);
        }

        function createPoint(pos, color = 0xfacc15, size = 0.4, labelTxt = '') {
            const geo = new THREE.SphereGeometry(size, 32, 32);
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.2, metalness: 0.5 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(pos);
            
            if (labelTxt) {
                const label = createLabel(labelTxt, 'label-math');
                label.position.set(0.6, 0.8, 0);
                mesh.add(label);
            }
            return mesh;
        }

        function createThickLine(pt1, pt2, color = 0xffffff, thickness = 0.15) {
            const distance = pt1.distanceTo(pt2);
            const geo = new THREE.CylinderGeometry(thickness, thickness, distance, 16);
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3 });
            const cylinder = new THREE.Mesh(geo, mat);
            
            const position = new THREE.Vector3().addVectors(pt1, pt2).multiplyScalar(0.5);
            cylinder.position.copy(position);
            cylinder.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3().subVectors(pt2, pt1).normalize());
            
            return cylinder;
        }

        function createHorizontalPlane(y, size, color, labelTxt, labelPos = null, opacity = 0.4) {
            const group = new THREE.Group();
            const half = size / 2;
            const geo = new THREE.BufferGeometry();
            const vertices = new Float32Array([
                -half, y, -half,   half, y, -half,   half, y, half,
                half, y, half,    -half, y, half,   -half, y, -half
            ]);
            geo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            geo.computeVertexNormals();

            const mat = new THREE.MeshPhysicalMaterial({ color: color, transparent: true, opacity: opacity, side: THREE.DoubleSide, depthWrite: false, clearcoat: 0.3 });
            const mesh = new THREE.Mesh(geo, mat);

            const edges = new THREE.EdgesGeometry(geo);
            const edgeMat = new THREE.LineBasicMaterial({ color: color, linewidth: 2 });
            const outline = new THREE.LineSegments(edges, edgeMat);

            group.add(mesh, outline);
            if (labelTxt) {
                const lbl = createLabel(labelTxt, 'label-math text-white');
                lbl.position.copy(labelPos || new THREE.Vector3(half - 8, y + 0.5, half - 8));
                group.add(lbl);
            }
            return group;
        }

        function createCustomPlane(p1, p2, p3, p4, color, labelTxt, labelPos, opacity = 0.4) {
            const group = new THREE.Group();
            const geo = new THREE.BufferGeometry();
            const vertices = new Float32Array([
                p1.x, p1.y, p1.z,  p2.x, p2.y, p2.z,  p3.x, p3.y, p3.z,
                p3.x, p3.y, p3.z,  p4.x, p4.y, p4.z,  p1.x, p1.y, p1.z
            ]);
            geo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            geo.computeVertexNormals();

            const mat = new THREE.MeshPhysicalMaterial({ color: color, transparent: true, opacity: opacity, side: THREE.DoubleSide, depthWrite: false, clearcoat: 0.3 });
            const mesh = new THREE.Mesh(geo, mat);

            const edges = new THREE.EdgesGeometry(geo);
            const edgeMat = new THREE.LineBasicMaterial({ color: color, linewidth: 2 });
            const outline = new THREE.LineSegments(edges, edgeMat);

            group.add(mesh, outline);
            if (labelTxt && labelPos) {
                const lbl = createLabel(labelTxt, 'label-math text-white');
                lbl.position.copy(labelPos);
                group.add(lbl);
            }
            return group;
        }

        function createDashedLine(pt1, pt2, color = 0x94a3b8) {
            const mat = new THREE.LineDashedMaterial({ color: color, dashSize: 0.8, gapSize: 0.5 });
            const geo = new THREE.BufferGeometry().setFromPoints([pt1, pt2]);
            const line = new THREE.Line(geo, mat);
            line.computeLineDistances();
            return line;
        }

        function buildState(id) {
            const group = new THREE.Group();
            const SIZE = 45; 
            
            // Định nghĩa các màu Neon tương phản cao
            const colorQ = 0x2dd4bf; // Teal 400 (Xanh lơ sáng)
            const colorP = 0xc084fc; // Purple 400 (Tím sáng)
            const colorR = 0xf472b6; // Pink 400 (Hồng sáng)
            const colorB = 0x60a5fa; // Blue 400 (Xanh dương sáng)

            switch (id) {
                case 1: { // Hai mặt phẳng song song
                    const planeQ = createHorizontalPlane(-8, SIZE, colorQ, '(Q)');
                    const planeP = createHorizontalPlane(8, SIZE, colorP, '(P)');
                    group.add(planeP, planeQ);
                    break;
                }
                case 2: { // Hai mặt phẳng cắt nhau
                    const planeQ = createHorizontalPlane(0, SIZE, colorQ, '(Q)');
                    
                    // Mặt P nghiêng
                    const p1 = new THREE.Vector3(-SIZE/2, 15, -SIZE/2);
                    const p2 = new THREE.Vector3(SIZE/2, 15, -SIZE/2);
                    const p3 = new THREE.Vector3(SIZE/2, -15, SIZE/2);
                    const p4 = new THREE.Vector3(-SIZE/2, -15, SIZE/2);
                    const planeP = createCustomPlane(p1, p2, p3, p4, colorP, '(P)', new THREE.Vector3(15, 16, -15), 0.45);

                    // Giao tuyến d (z=0, y=0)
                    const d1 = new THREE.Vector3(-SIZE/2 - 5, 0, 0);
                    const d2 = new THREE.Vector3(SIZE/2 + 5, 0, 0);
                    const lineD = createThickLine(d1, d2, 0xffffff, 0.15);
                    const lblD = createLabel('d', 'label-math text-white');
                    lblD.position.copy(d2).add(new THREE.Vector3(0, 1, 0));

                    group.add(planeQ, planeP, lineD, lblD);
                    break;
                }
                case 3: { // Hai mặt phẳng trùng nhau
                    // Vẽ 1 mặt phẳng nhưng nhãn chứa cả P và Q
                    const planePQ = createHorizontalPlane(0, SIZE, colorB, '(P) ≡ (Q)', new THREE.Vector3(12, 1, 12), 0.4);
                    
                    // Thêm vài điểm chung không thẳng hàng
                    const ptA = createPoint(new THREE.Vector3(-10, 0, 10), 0xfde047, 0.4, 'A');
                    const ptB = createPoint(new THREE.Vector3(5, 0, -8), 0xfde047, 0.4, 'B');
                    const ptC = createPoint(new THREE.Vector3(12, 0, 8), 0xfde047, 0.4, 'C');

                    group.add(planePQ, ptA, ptB, ptC);
                    break;
                }
                case 4: { // Định lí 1: Điều kiện song song
                    const planeQ = createHorizontalPlane(-8, SIZE, colorQ, '(Q)');
                    const planeP = createHorizontalPlane(8, SIZE, colorP, '(P)');
                    
                    // Hai đường thẳng a, b trong (P) cắt nhau tại I
                    const a1 = new THREE.Vector3(-15, 8, -12);
                    const a2 = new THREE.Vector3(15, 8, 12);
                    const lineA = createThickLine(a1, a2, 0xf87171, 0.15); // Đỏ cam sáng
                    const lblA = createLabel('a', 'label-math text-red-300');
                    lblA.position.copy(a2).add(new THREE.Vector3(1, 1, 0));

                    const b1 = new THREE.Vector3(-15, 8, 12);
                    const b2 = new THREE.Vector3(15, 8, -12);
                    const lineB = createThickLine(b1, b2, 0xa3e635, 0.15); // Xanh đọt chuối sáng
                    const lblB = createLabel('b', 'label-math text-lime-300');
                    lblB.position.copy(b2).add(new THREE.Vector3(1, 1, 0));

                    const ptI = createPoint(new THREE.Vector3(0, 8, 0), 0xfde047, 0.4, 'I');

                    group.add(planeP, planeQ, lineA, lineB, lblA, lblB, ptI);
                    break;
                }
                case 5: { // Tính chất 1: Qua 1 điểm ngoài mp
                    const planeP = createHorizontalPlane(-6, SIZE, colorP, '(P)');
                    
                    // Điểm M
                    const pM = new THREE.Vector3(5, 10, -5);
                    const ptM = createPoint(pM, 0xfde047, 0.45, 'M');

                    // Mặt phẳng Q qua M
                    const planeQ = createHorizontalPlane(10, SIZE, colorQ, '(Q)');

                    group.add(planeP, ptM, planeQ);
                    break;
                }
                case 6: { // Tính chất 2: Giao tuyến mp thứ 3
                    const planeP = createHorizontalPlane(-8, SIZE, colorP, '(P)');
                    const planeQ = createHorizontalPlane(8, SIZE, colorQ, '(Q)');
                    
                    // Mặt (R) cắt chéo. Kéo dài để cắt đẹp
                    const r1 = new THREE.Vector3(-25, -15, -15);
                    const r2 = new THREE.Vector3(25, -15, 5);
                    const r3 = new THREE.Vector3(25, 15, 15);
                    const r4 = new THREE.Vector3(-25, 15, -5);
                    const planeR = createCustomPlane(r1, r2, r3, r4, colorR, '(R)', new THREE.Vector3(15, 16, 12), 0.35); // Pink

                    // Giao tuyến a trên (P) y=-8
                    const a1 = new THREE.Vector3(-25, -8, -8);
                    const a2 = new THREE.Vector3(25, -8, 12);
                    const lineA = createThickLine(a1, a2, 0xffffff, 0.18);
                    const lblA = createLabel('a', 'label-math text-white');
                    lblA.position.copy(a2).add(new THREE.Vector3(1,1,0));

                    // Giao tuyến b trên (Q) y=8
                    const b1 = new THREE.Vector3(-25, 8, -2.66);
                    const b2 = new THREE.Vector3(25, 8, 17.33); 
                    const lineB = createThickLine(b1, b2, 0xffffff, 0.18);
                    const lblB = createLabel('b', 'label-math text-white');
                    lblB.position.copy(b2).add(new THREE.Vector3(1,1,0));

                    group.add(planeP, planeQ, planeR, lineA, lineB, lblA, lblB);
                    break;
                }
                case 7: { // Định lí 2: Thales trong không gian
                    const planeP = createHorizontalPlane(-12, SIZE, colorP, '(P)');
                    const planeQ = createHorizontalPlane(0, SIZE, colorB, '(Q)');
                    const planeR = createHorizontalPlane(12, SIZE, colorQ, '(R)');

                    // Cát tuyến d
                    const pA = new THREE.Vector3(-15, -12, -8);
                    const pB = new THREE.Vector3(-8, 0, 0);
                    const pC = new THREE.Vector3(-1, 12, 8);
                    // Kéo dài d
                    const lineD = createThickLine(new THREE.Vector3(-18, -17.1, -11.4), new THREE.Vector3(2, 17.1, 11.4), 0xf87171, 0.12);
                    const lblD = createLabel('d', 'label-math text-red-300'); lblD.position.set(-18, -16, -11);

                    // Cát tuyến d'
                    const pA_p = new THREE.Vector3(15, -12, 10);
                    const pB_p = new THREE.Vector3(8, 0, 3);
                    const pC_p = new THREE.Vector3(1, 12, -4);
                    // Kéo dài d'
                    const lineDp = createThickLine(new THREE.Vector3(18, -17.1, 13), new THREE.Vector3(-2, 17.1, -7), 0xfb923c, 0.12);
                    const lblDp = createLabel("d'", 'label-math text-orange-300'); lblDp.position.set(18, -16, 13);

                    // Điểm
                    const ptA = createPoint(pA, 0xfde047, 0.4, 'A');
                    const ptB = createPoint(pB, 0xfde047, 0.4, 'B');
                    const ptC = createPoint(pC, 0xfde047, 0.4, 'C');
                    const ptA_p = createPoint(pA_p, 0xfde047, 0.4, "A'");
                    const ptB_p = createPoint(pB_p, 0xfde047, 0.4, "B'");
                    const ptC_p = createPoint(pC_p, 0xfde047, 0.4, "C'");

                    // Thêm các đường đứt nét nối các điểm tương ứng nằm trên 3 mặt phẳng
                    const dashAA = createDashedLine(pA, pA_p, 0xffffff);
                    const dashBB = createDashedLine(pB, pB_p, 0xffffff);
                    const dashCC = createDashedLine(pC, pC_p, 0xffffff);

                    // Làm nổi bật các đoạn thẳng tỉ lệ bằng các màu sắc cặp đôi và nét dày hơn
                    const segAB = createThickLine(pA, pB, 0xef4444, 0.2); // Đỏ đậm cho cặp AB, A'B'
                    const segBC = createThickLine(pB, pC, 0x3b82f6, 0.2); // Xanh dương cho cặp BC, B'C'
                    const segA_pB_p = createThickLine(pA_p, pB_p, 0xef4444, 0.2); 
                    const segB_pC_p = createThickLine(pB_p, pC_p, 0x3b82f6, 0.2); 

                    group.add(planeP, planeQ, planeR, lineD, lineDp, lblD, lblDp, ptA, ptB, ptC, ptA_p, ptB_p, ptC_p, dashAA, dashBB, dashCC, segAB, segBC, segA_pB_p, segB_pC_p);
                    break;
                }
            }
            return group;
        }

        function destroyCSS2DObjects(group) {
            if (!group) return;
            group.traverse(child => {
                if (child.isCSS2DObject && child.element && child.element.parentNode) {
                    child.element.parentNode.removeChild(child.element);
                }
            });
        }

        function update3DScene(id) {
            if (currentStateGroup) {
                destroyCSS2DObjects(currentStateGroup);
                scene.remove(currentStateGroup);
                currentStateGroup = null;
            }
            currentStateGroup = buildState(id);
            scene.add(currentStateGroup);
        }

        function onWindowResize() {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
            labelRenderer.setSize(container.clientWidth, container.clientHeight);
        }
        window.addEventListener('resize', onWindowResize);

        function animate() {
            requestAnimationFrame(animate);
            if (controls) controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        
        window.onload = function() {
            onWindowResize();
            animate();
        };

        const menuListEl = document.getElementById('menu-list');
        const infoTitleEl = document.getElementById('info-title');
        const infoDescEl = document.getElementById('info-desc');
        const mathFormulaEl = document.getElementById('math-formula');

        function renderMenu() {
            menuListEl.innerHTML = '';
            menuData.forEach(item => {
                const btn = document.createElement('button');
                const isActive = item.id === currentStateId;
                
                btn.className = `w-full text-left px-4 py-3 rounded-lg text-sm transition-all duration-200 flex items-center gap-3 border ${
                    isActive 
                    ? 'bg-teal-900/40 border-teal-500/50 text-white shadow-[0_0_15px_rgba(20,184,166,0.15)]' 
                    : 'bg-transparent border-transparent text-slate-400 hover:bg-slate-800/50 hover:text-slate-200'
                }`;
                
                btn.innerHTML = `
                    <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs shrink-0 ${
                        isActive ? 'bg-teal-600 text-white' : 'bg-slate-700 text-slate-300'
                    }">
                        ${item.id}
                    </div>
                    <div class="flex flex-col overflow-hidden">
                        <span class="font-semibold text-[13px] truncate whitespace-nowrap" title="${item.title}">${item.title}</span>
                        <span class="text-[11px] opacity-70 truncate whitespace-nowrap">${item.label}</span>
                    </div>
                `;
                
                btn.onclick = () => changeState(item.id);
                menuListEl.appendChild(btn);
            });
        }

        function updateFooter(id) {
            const data = menuData.find(item => item.id === id);
            if (!data) return;

            const iconHtml = `<svg class="text-teal-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>`;
            infoTitleEl.innerHTML = iconHtml + ' ' + data.title;
            infoDescEl.textContent = data.desc;

            katex.render(data.formula, mathFormulaEl, {
                throwOnError: false,
                displayMode: true
            });
        }

        function changeState(id) {
            currentStateId = id;
            renderMenu();
            updateFooter(id);
            update3DScene(id);
        }

        renderMenu();
        updateFooter(currentStateId);
        update3DScene(currentStateId);

        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const fullscreenIcon = document.getElementById('fullscreen-icon');
        const fullscreenText = document.getElementById('fullscreen-text');

        function toggleFullScreen() {
            if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {  
                const docElm = document.documentElement;
                if (docElm.requestFullscreen) docElm.requestFullscreen();
                else if (docElm.mozRequestFullScreen) docElm.mozRequestFullScreen();
                else if (docElm.webkitRequestFullScreen) docElm.webkitRequestFullScreen();
                else if (docElm.msRequestFullscreen) docElm.msRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                else if (document.msExitFullscreen) document.msExitFullscreen();
            }
        }

        fullscreenBtn.addEventListener('click', toggleFullScreen);

        const fullscreenEvents = ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'];
        fullscreenEvents.forEach(event => {
            document.addEventListener(event, () => {
                const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
                if (isFullscreen) {
                    fullscreenText.textContent = 'Thu nhỏ (F)';
                    fullscreenIcon.innerHTML = `<path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path>`;
                } else {
                    fullscreenText.textContent = 'Toàn màn hình (F)';
                    fullscreenIcon.innerHTML = `<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>`;
                }
                setTimeout(onWindowResize, 150);
            });
        });

        document.addEventListener('keydown', (event) => {
            if (event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA') return;
            if (event.key === 'f' || event.key === 'F') {
                toggleFullScreen();
            }
        });

    </script>
</body>
</html>

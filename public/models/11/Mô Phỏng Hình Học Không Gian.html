    <!-- Main Content Area -->

    <!-- Application Logic -->
    <!-- Sử dụng thư viện qua thẻ script để tránh lỗi CORS/Module -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>

    <script>
        // --- Data Definitions ---
        const menuData = [
            { 
                id: 1, 
                label: "Tính chất 1", 
                title: "Đường thẳng qua hai điểm", 
                desc: "Có một và chỉ một đường thẳng đi qua hai điểm phân biệt.", 
                formula: "A \\neq B \\Rightarrow \\exists ! \\ d: \\ A, B \\in d" 
            },
            { 
                id: 2, 
                label: "Tính chất 2", 
                title: "Mặt phẳng qua ba điểm", 
                desc: "Có một và chỉ một mặt phẳng đi qua ba điểm không thẳng hàng.", 
                formula: "\\exists ! \\ (P): \\ A, B, C \\in (P)" 
            },
            { 
                id: 3, 
                label: "Tính chất 3", 
                title: "Đường thẳng chứa trong mặt phẳng", 
                desc: "Nếu một đường thẳng có hai điểm chung phân biệt với một mặt phẳng thì mọi điểm của đường thẳng đều thuộc mặt phẳng đó.", 
                formula: "A, B \\in d \\ \\wedge \\ A, B \\in (P) \\Rightarrow d \\subset (P)" 
            },
            { 
                id: 4, 
                label: "Tính chất 4", 
                title: "Tồn tại không gian", 
                desc: "Tồn tại bốn điểm không cùng nằm trên một mặt phẳng (Tạo thành một tứ diện).", 
                formula: "A, B, C, D \\ \\text{không đồng phẳng}" 
            },
            { 
                id: 5, 
                label: "Tính chất 5", 
                title: "Giao tuyến của hai mặt phẳng", 
                desc: "Nếu hai mặt phẳng phân biệt có một điểm chung thì chúng có một đường thẳng chung duy nhất chứa tất cả các điểm chung của hai mặt phẳng đó.", 
                formula: "(P) \\cap (Q) = d" 
            },
            { 
                id: 6, 
                label: "Tính chất 6", 
                title: "Hình học phẳng trong mặt phẳng", 
                desc: "Trên mỗi mặt phẳng, các kết quả đã biết trong hình học phẳng đều đúng (Ví dụ: Hai đường thẳng chéo nhau, cắt nhau, định lí Talet, ...).", 
                formula: "\\text{Định lí Phẳng áp dụng trên } (P)" 
            }
        ];

        let currentStateId = 1; // Khởi tạo với Tiên đề 1
        let currentStateGroup = null;

        // --- Three.js Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a1120, 0.02);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(25, 20, 30); // Góc nhìn chéo để quan sát không gian tốt nhất

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const labelRenderer = new THREE.CSS2DRenderer();
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        container.appendChild(labelRenderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
        directionalLight.position.set(10, 20, 15);
        scene.add(directionalLight);

        // --- Lưới toạ độ ---
        const gridHelper = new THREE.GridHelper(50, 50, 0x1e293b, 0x1e293b);
        gridHelper.position.y = -5; // Đẩy lưới xuống thấp
        scene.add(gridHelper);

        // --- Các hàm hỗ trợ dựng hình (Nét đậm, màu sắc tương phản) ---
        
        function createLabel(text, extraClass = '') {
            const div = document.createElement('div');
            div.className = `label-3d ${extraClass}`;
            div.innerHTML = text;
            return new THREE.CSS2DObject(div);
        }

        function createPoint(pos, color = 0xfacc15, size = 0.3, labelTxt = '') { // Đổi size mặc định từ 0.6 -> 0.3
            const geo = new THREE.SphereGeometry(size, 32, 32);
            // Dùng MeshStandardMaterial để điểm trông có độ khối, bắt sáng
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.2, metalness: 0.5 }); 
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(pos);
            
            if (labelTxt) {
                const label = createLabel(labelTxt, 'label-math');
                label.position.set(0.6, 0.8, 0); // Kéo nhãn lại gần điểm hơn do điểm đã nhỏ đi
                mesh.add(label);
            }
            return mesh;
        }

        // Tạo đường thẳng rất đậm
        function createThickLine(pt1, pt2, color = 0xef4444, thickness = 0.1) { // Đổi độ dày mặc định từ 0.4 -> 0.1
            // Thay vì dùng LineBasicMaterial (bị giới hạn độ dày 1px trên nhiều trình duyệt),
            // ta dùng Cylinder để mô phỏng một đường thẳng siêu đậm.
            const distance = pt1.distanceTo(pt2);
            const geo = new THREE.CylinderGeometry(thickness, thickness, distance, 16);
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3 });
            const cylinder = new THREE.Mesh(geo, mat);
            
            // Xoay cylinder cho nối đúng 2 điểm
            const position = new THREE.Vector3().addVectors(pt1, pt2).multiplyScalar(0.5);
            cylinder.position.copy(position);
            cylinder.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3().subVectors(pt2, pt1).normalize());
            
            return cylinder;
        }
        
        // Tạo mặt phẳng nổi bật
        function createPlane(size, color, labelTxt, opacity = 0.4) {
            const group = new THREE.Group();
            
            const geo = new THREE.PlaneGeometry(size, size);
            const mat = new THREE.MeshPhysicalMaterial({
                color: color,
                transparent: true,
                opacity: opacity,
                side: THREE.DoubleSide,
                roughness: 0.1,
                metalness: 0.2,
                clearcoat: 0.5
            });
            const plane = new THREE.Mesh(geo, mat);
            plane.rotation.x = -Math.PI / 2; // Nằm ngang theo trục y
            
            // Viền mặt phẳng thật đậm
            const edges = new THREE.EdgesGeometry(geo);
            const edgeMat = new THREE.LineBasicMaterial({ color: color, linewidth: 3 });
            const outline = new THREE.LineSegments(edges, edgeMat);
            outline.rotation.x = -Math.PI / 2;

            group.add(plane);
            group.add(outline);
            
            if (labelTxt) {
                const label = createLabel(labelTxt, 'label-math');
                // Gắn nhãn ở một góc của mặt phẳng
                label.position.set(size/2 - 2, 0.5, size/2 - 2); 
                group.add(label);
            }
            return group;
        }

        // --- Logic Xây Dựng 6 Trạng Thái Tiên Đề ---
        function buildState(id) {
            const group = new THREE.Group();
            
            switch (id) {
                case 1: { // TC 1: 1 đường thẳng qua 2 điểm
                    const pA = new THREE.Vector3(-10, 0, 5);
                    const pB = new THREE.Vector3(10, 5, -5);
                    
                    const ptA = createPoint(pA, 0xfacc15, 0.3, 'A');
                    const ptB = createPoint(pB, 0xfacc15, 0.3, 'B');
                    
                    // Kéo dài đường thẳng ra xa hai đầu một chút để thấy d là đường thẳng, không phải đoạn thẳng
                    const dir = new THREE.Vector3().subVectors(pB, pA).normalize();
                    const extA = new THREE.Vector3().copy(pA).addScaledVector(dir, -18); // Kéo dài ra
                    const extB = new THREE.Vector3().copy(pB).addScaledVector(dir, 18);
                    
                    const line = createThickLine(extA, extB, 0xef4444, 0.1); // Nét thanh hơn
                    const labelD = createLabel('d', 'label-math text-red-400');
                    labelD.position.copy(extB).add(new THREE.Vector3(0, 1, 0));

                    group.add(ptA, ptB, line, labelD);
                    break;
                }
                case 2: { // TC 2: 1 mặt phẳng qua 3 điểm không thẳng hàng
                    const pA = new THREE.Vector3(-8, 0, 8);
                    const pB = new THREE.Vector3(8, 0, 6);
                    const pC = new THREE.Vector3(0, 0, -8);
                    
                    // Đổi sang màu xanh lam sẫm và giảm opacity để làm nền tương phản mạnh cho các điểm
                    const plane = createPlane(45, 0x1e3a8a, '(P)', 0.35); 
                    
                    // Tăng kích thước điểm từ 0.3 lên 0.45 để nổi khối rõ ràng hơn
                    const ptA = createPoint(pA, 0xfacc15, 0.45, 'A');
                    const ptB = createPoint(pB, 0xfacc15, 0.45, 'B');
                    const ptC = createPoint(pC, 0xfacc15, 0.45, 'C');
                    
                    // Thay thế tam giác mờ bằng các đường khối trụ 3D (nét mảnh, màu vàng nhạt) để nối 3 điểm sắc nét
                    const edgeAB = createThickLine(pA, pB, 0xfcd34d, 0.05);
                    const edgeBC = createThickLine(pB, pC, 0xfcd34d, 0.05);
                    const edgeCA = createThickLine(pC, pA, 0xfcd34d, 0.05);

                    group.add(plane, ptA, ptB, ptC, edgeAB, edgeBC, edgeCA);
                    break;
                }
                case 3: { // TC 3: Nếu d có 2 điểm thuộc (P) thì d nằm trong (P)
                    const plane = createPlane(45, 0x3b82f6, '(P)', 0.4); // Mở rộng mặt phẳng từ 25 -> 45
                    
                    const pA = new THREE.Vector3(-10, 0, 5);
                    const pB = new THREE.Vector3(8, 0, -6);
                    
                    const ptA = createPoint(pA, 0xfacc15, 0.3, 'A');
                    const ptB = createPoint(pB, 0xfacc15, 0.3, 'B');
                    
                    const dir = new THREE.Vector3().subVectors(pB, pA).normalize();
                    const extA = new THREE.Vector3().copy(pA).addScaledVector(dir, -15); // Kéo dài đường thẳng
                    const extB = new THREE.Vector3().copy(pB).addScaledVector(dir, 15);
                    
                    const line = createThickLine(extA, extB, 0xef4444, 0.1);
                    
                    const labelD = createLabel('d', 'label-math text-red-400');
                    labelD.position.copy(extB).add(new THREE.Vector3(1, 1, 0));

                    group.add(plane, ptA, ptB, line, labelD);
                    break;
                }
                case 4: { // TC 4: Tồn tại 4 điểm không đồng phẳng (Tứ diện)
                    const pA = new THREE.Vector3(0, 12, 0); // Đỉnh
                    const pB = new THREE.Vector3(-8, 0, 8); // Đáy 1
                    const pC = new THREE.Vector3(8, 0, 6);  // Đáy 2
                    const pD = new THREE.Vector3(0, 0, -10); // Đáy 3
                    
                    // Mặt đáy (mặt phẳng chứa B, C, D)
                    const plane = createPlane(45, 0x64748b, '(Q)', 0.3); // Mở rộng mặt đáy

                    const ptA = createPoint(pA, 0xec4899, 0.4, 'A'); // Điểm thanh mảnh hơn
                    const ptB = createPoint(pB, 0xfacc15, 0.3, 'B');
                    const ptC = createPoint(pC, 0xfacc15, 0.3, 'C');
                    const ptD = createPoint(pD, 0xfacc15, 0.3, 'D');

                    // Các cạnh tứ diện (Nét thanh mảnh)
                    const edgeAB = createThickLine(pA, pB, 0x94a3b8, 0.08); // Cạnh nhỏ đi
                    const edgeAC = createThickLine(pA, pC, 0x94a3b8, 0.08);
                    const edgeAD = createThickLine(pA, pD, 0x94a3b8, 0.08);
                    
                    const edgeBC = createThickLine(pB, pC, 0x334155, 0.08);
                    const edgeCD = createThickLine(pC, pD, 0x334155, 0.08); 
                    const edgeDB = createThickLine(pD, pB, 0x334155, 0.08);

                    group.add(plane, ptA, ptB, ptC, ptD, edgeAB, edgeAC, edgeAD, edgeBC, edgeCD, edgeDB);
                    break;
                }
                case 5: { // TC 5: 2 mặt phẳng cắt nhau sinh ra 1 đường thẳng
                    // Mặt (P) nằm ngang
                    const planeP = createPlane(45, 0x14b8a6, '(P)', 0.4); // Mở rộng mặt P
                    
                    // Mặt (Q) nằm nghiêng
                    const groupQ = new THREE.Group();
                    const planeQGeo = new THREE.PlaneGeometry(45, 45); // Mở rộng mặt Q
                    const planeQMat = new THREE.MeshPhysicalMaterial({color: 0xec4899, transparent: true, opacity: 0.4, side: THREE.DoubleSide});
                    const planeQ = new THREE.Mesh(planeQGeo, planeQMat);
                    
                    const edgesQ = new THREE.EdgesGeometry(planeQGeo);
                    const edgeMatQ = new THREE.LineBasicMaterial({ color: 0xec4899, linewidth: 2 });
                    const outlineQ = new THREE.LineSegments(edgesQ, edgeMatQ);
                    
                    groupQ.add(planeQ, outlineQ);
                    groupQ.rotation.x = Math.PI / 4; // Nghiêng mặt Q 45 độ
                    
                    const labelQ = createLabel('(Q)', 'label-math text-pink-400');
                    labelQ.position.set(18, 18, -5); // Đẩy nhãn ra xa hơn
                    groupQ.add(labelQ);

                    // Điểm chung M
                    const ptM = createPoint(new THREE.Vector3(0,0,0), 0xfacc15, 0.3, 'M');

                    // Giao tuyến d (Chính là trục X)
                    const extA = new THREE.Vector3(-25, 0, 0); // Kéo dài đường giao tuyến
                    const extB = new THREE.Vector3(25, 0, 0);
                    const line = createThickLine(extA, extB, 0xffffff, 0.1); 
                    
                    const labelD = createLabel('d', 'label-math text-white');
                    labelD.position.copy(extB).add(new THREE.Vector3(0, 1, 0));

                    group.add(planeP, groupQ, ptM, line, labelD);
                    break;
                }
                case 6: { // TC 6: Hình phẳng trong không gian (Hai đường thẳng cắt nhau trong (P))
                    const plane = createPlane(45, 0x8b5cf6, '(P)', 0.4); // Mở rộng mặt P
                    
                    const pCross = new THREE.Vector3(0, 0, 0);
                    
                    // Đường d1
                    const p1A = new THREE.Vector3(-18, 0, -12); // Kéo dài ra xa
                    const p1B = new THREE.Vector3(18, 0, 12);
                    const line1 = createThickLine(p1A, p1B, 0xef4444, 0.1);
                    const lbl1 = createLabel('a', 'label-math text-red-400');
                    lbl1.position.copy(p1B).add(new THREE.Vector3(1, 1, 0));

                    // Đường d2
                    const p2A = new THREE.Vector3(-15, 0, 15);
                    const p2B = new THREE.Vector3(15, 0, -15);
                    const line2 = createThickLine(p2A, p2B, 0x3b82f6, 0.1);
                    const lbl2 = createLabel('b', 'label-math text-blue-400');
                    lbl2.position.copy(p2B).add(new THREE.Vector3(1, 1, 0));

                    // Giao điểm
                    const ptM = createPoint(pCross, 0xfacc15, 0.3, 'I');

                    group.add(plane, line1, line2, lbl1, lbl2, ptM);
                    break;
                }
            }
            return group;
        }

        // --- Core Functions ---
        
        // Hủy triệt để các nhãn CSS2D để không bị rác (Lỗi cũ)
        function destroyCSS2DObjects(group) {
            if (!group) return;
            group.traverse(child => {
                if (child.isCSS2DObject && child.element && child.element.parentNode) {
                    child.element.parentNode.removeChild(child.element);
                }
            });
        }

        function update3DScene(id) {
            // Xóa state cũ
            if (currentStateGroup) {
                destroyCSS2DObjects(currentStateGroup);
                scene.remove(currentStateGroup);
                currentStateGroup = null;
            }

            // Sinh và thêm state mới
            currentStateGroup = buildState(id);
            scene.add(currentStateGroup);
        }

        // --- Window Resize Handling & Animation Loop ---
        function onWindowResize() {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
            labelRenderer.setSize(container.clientWidth, container.clientHeight);
        }
        window.addEventListener('resize', onWindowResize);

        function animate() {
            requestAnimationFrame(animate);
            if (controls) controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        
        window.onload = function() {
            onWindowResize();
            animate();
        };

        // --- UI Logic ---
        const menuListEl = document.getElementById('menu-list');
        const infoTitleEl = document.getElementById('info-title');
        const infoDescEl = document.getElementById('info-desc');
        const mathFormulaEl = document.getElementById('math-formula');

        function renderMenu() {
            menuListEl.innerHTML = '';
            menuData.forEach(item => {
                const btn = document.createElement('button');
                const isActive = item.id === currentStateId;
                
                btn.className = `w-full text-left px-4 py-3 rounded-lg text-sm transition-all duration-200 flex items-center gap-3 border ${
                    isActive 
                    ? 'bg-emerald-900/40 border-emerald-500/50 text-white shadow-[0_0_15px_rgba(16,185,129,0.15)]' 
                    : 'bg-transparent border-transparent text-slate-400 hover:bg-slate-800/50 hover:text-slate-200'
                }`;
                
                btn.innerHTML = `
                    <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs shrink-0 ${
                        isActive ? 'bg-emerald-600 text-white' : 'bg-slate-700 text-slate-300'
                    }">
                        TC${item.id}
                    </div>
                    <div class="flex flex-col">
                        <span class="font-semibold text-[13px] truncate">${item.label}</span>
                        <span class="text-[11px] opacity-70 truncate">${item.title}</span>
                    </div>
                `;
                
                btn.onclick = () => changeState(item.id);
                menuListEl.appendChild(btn);
            });
        }

        function updateFooter(id) {
            const data = menuData.find(item => item.id === id);
            if (!data) return;

            const iconHtml = `<svg class="text-emerald-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>`;
            infoTitleEl.innerHTML = iconHtml + ' ' + data.title;
            infoDescEl.textContent = data.desc;

            katex.render(data.formula, mathFormulaEl, {
                throwOnError: false,
                displayMode: true
            });
        }

        function changeState(id) {
            currentStateId = id;
            renderMenu();
            updateFooter(id);
            update3DScene(id);
        }

        // --- Initialization ---
        renderMenu();
        updateFooter(currentStateId);
        update3DScene(currentStateId);

        // --- Logic Toàn Màn Hình (Fullscreen) ---
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const fullscreenIcon = document.getElementById('fullscreen-icon');
        const fullscreenText = document.getElementById('fullscreen-text');

        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                // Bật toàn màn hình cho toàn bộ thẻ HTML
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Lỗi khi bật toàn màn hình: ${err.message}`);
                });
            } else {
                // Thoát toàn màn hình
                document.exitFullscreen();
            }
        });

        // Lắng nghe sự kiện thay đổi trạng thái fullscreen để đổi icon và text
        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                fullscreenText.textContent = 'Thu nhỏ';
                fullscreenIcon.innerHTML = `<path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path>`;
            } else {
                fullscreenText.textContent = 'Toàn màn hình';
                fullscreenIcon.innerHTML = `<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>`;
            }
            // Gọi lại hàm resize để canvas cập nhật kích thước chuẩn xác
            setTimeout(onWindowResize, 100);
        });

    </script>
</body>
</html>

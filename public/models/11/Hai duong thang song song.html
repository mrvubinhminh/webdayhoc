<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô Phỏng 3D - Hai Đường Thẳng Song Song (Toán 11)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        sidebarBg: '#1e293b',
                        panelBg: '#1e293b',
                        accentBlue: '#3b82f6',
                        accentBlueHover: '#2563eb',
                        textMuted: '#94a3b8'
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- KaTeX for Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        body { margin: 0; overflow: hidden; background-color: #0f172a; }
        
        .label-3d {
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-weight: bold;
            font-size: 18px;
            text-shadow: 0px 0px 5px rgba(0,0,0,1), 0px 0px 2px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        
        .label-math {
            color: #facc15; 
            font-family: 'Times New Roman', Times, serif; 
            font-style: italic;
            font-size: 20px;
        }
    </style>
</head>
<body class="text-white h-screen flex flex-col font-sans select-none">

    <!-- Header -->
    <header class="h-14 bg-darkBg border-b border-slate-800 flex items-center justify-between px-4 shrink-0 z-10 relative shadow-md">
        <div class="flex items-center gap-4">
            <button class="flex items-center gap-2 bg-red-900/30 text-red-400 hover:bg-red-900/50 px-3 py-1.5 rounded text-sm transition-colors border border-red-900/50">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                Đóng
            </button>
            <h1 class="text-lg font-semibold tracking-wide">Hai Đường Thẳng Song Song - Hình Học 11</h1>
        </div>
        
        <!-- Nút Toàn màn hình -->
        <button id="fullscreen-btn" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded text-sm text-textMuted transition-colors border border-slate-700">
            <svg id="fullscreen-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
            </svg>
            <span id="fullscreen-text">Toàn màn hình</span>
        </button>
    </header>

    <!-- Main Content Area -->
    <div class="flex flex-1 overflow-hidden relative">
        
        <!-- Sidebar -->
        <aside class="w-80 bg-sidebarBg border-r border-slate-800 flex flex-col z-10 shadow-xl shrink-0">
            <!-- Logo Area -->
            <div class="p-4 border-b border-slate-800 flex items-center gap-3">
                <div class="w-10 h-10 rounded-full border-2 border-amber-500 flex items-center justify-center font-bold text-amber-500 shadow-[0_0_10px_rgba(245,158,11,0.3)]">
                    KNTT
                </div>
                <div>
                    <div class="font-bold tracking-wider text-sm">TOÁN 11 - BÀI 11</div>
                    <div class="text-[10px] text-textMuted uppercase tracking-widest">Đường thẳng song song</div>
                </div>
            </div>

            <!-- Menu List -->
            <div class="flex-1 overflow-y-auto p-3 space-y-2" id="menu-list">
                <!-- Menu items generated by JS -->
            </div>
        </aside>

        <!-- 3D Viewport & Footer Container -->
        <main class="flex-1 relative flex flex-col">
            <!-- 3D Canvas Container -->
            <div id="canvas-container" class="flex-1 bg-[#0a1120] relative cursor-grab active:cursor-grabbing">
                <!-- Three.js renders here -->
            </div>

            <!-- Bottom Information Panel -->
            <div class="h-36 bg-sidebarBg/95 backdrop-blur-md border-t border-slate-700 p-6 flex items-center justify-between z-10 shrink-0 relative">
                <div class="flex-1 pr-6">
                    <h2 class="text-xl font-bold flex items-center gap-2 mb-2 text-amber-400" id="info-title">
                        <svg class="text-amber-500" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="9" x2="20" y2="9"></line><line x1="4" y1="15" x2="20" y2="15"></line></svg>
                        <!-- Title dynamically inserted -->
                    </h2>
                    <p class="text-slate-300 text-sm leading-relaxed" id="info-desc">
                        <!-- Description dynamically inserted -->
                    </p>
                </div>
                
                <!-- Formula Box -->
                <div class="bg-[#0f172a] border border-slate-700 rounded-xl px-8 py-4 flex items-center justify-center min-w-[280px] shadow-inner h-full">
                    <div id="math-formula" class="text-amber-400 text-xl font-serif">
                        <!-- KaTeX Formula dynamically inserted -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Application Logic -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>

    <script>
        const menuData = [
            { 
                id: 1, 
                label: "Vị trí 1", 
                title: "Hai đường thẳng song song", 
                desc: "Hai đường thẳng cùng nằm trong một mặt phẳng (đồng phẳng) và không có điểm chung.", 
                formula: "a \\subset (P), b \\subset (P), a \\cap b = \\emptyset \\Rightarrow a \\parallel b" 
            },
            { 
                id: 2, 
                label: "Vị trí 2", 
                title: "Hai đường thẳng cắt nhau", 
                desc: "Hai đường thẳng cùng nằm trong một mặt phẳng và có đúng một điểm chung.", 
                formula: "a \\subset (P), b \\subset (P), a \\cap b = \\{I\\}" 
            },
            { 
                id: 3, 
                label: "Vị trí 3", 
                title: "Hai đường thẳng trùng nhau", 
                desc: "Hai đường thẳng cùng nằm trong một mặt phẳng và có vô số điểm chung.", 
                formula: "a \\equiv b" 
            },
            { 
                id: 4, 
                label: "Vị trí 4", 
                title: "Hai đường thẳng chéo nhau", 
                desc: "Hai đường thẳng không cùng nằm trong bất kì mặt phẳng nào.", 
                formula: "a, b \\text{ chéo nhau}" 
            },
            { 
                id: 5, 
                label: "Tiên đề", 
                title: "Tiên đề Ơ-clit trong không gian", 
                desc: "Qua một điểm nằm ngoài một đường thẳng, có một và chỉ một đường thẳng song song với đường thẳng đó.", 
                formula: "M \\notin d \\Rightarrow \\exists! \\ d' \\ni M: d' \\parallel d" 
            },
            { 
                id: 6, 
                label: "Định lí 1", 
                title: "Tính chất bắc cầu", 
                desc: "Hai đường thẳng phân biệt cùng song song với đường thẳng thứ ba thì song song với nhau.", 
                formula: "a \\parallel c \\ \\wedge \\ b \\parallel c \\Rightarrow a \\parallel b" 
            },
            { 
                id: 7, 
                label: "Định lí 2 (Phần 1)", 
                title: "Giao tuyến 3 mặt phẳng (Song song)", 
                desc: "Nếu 3 mặt phẳng đôi một cắt nhau theo 3 giao tuyến phân biệt thì 3 giao tuyến ấy đôi một song song.", 
                formula: "a \\parallel b \\parallel c" 
            },
            { 
                id: 8, 
                label: "Định lí 2 (Phần 2)", 
                title: "Giao tuyến 3 mặt phẳng (Đồng quy)", 
                desc: "Nếu 3 mặt phẳng đôi một cắt nhau theo 3 giao tuyến phân biệt thì 3 giao tuyến ấy đồng quy tại một điểm.", 
                formula: "a \\cap b \\cap c = \\{I\\}" 
            }
        ];

        let currentStateId = 1;
        let currentStateGroup = null;

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a1120, 0.015);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(30, 25, 40);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const labelRenderer = new THREE.CSS2DRenderer();
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        container.appendChild(labelRenderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Ánh sáng
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(10, 20, 15);
        scene.add(dirLight);

        // Lưới toạ độ nền
        const gridHelper = new THREE.GridHelper(60, 60, 0x1e293b, 0x1e293b);
        gridHelper.position.y = -10;
        scene.add(gridHelper);

        function createLabel(text, extraClass = '') {
            const div = document.createElement('div');
            div.className = `label-3d ${extraClass}`;
            div.innerHTML = text;
            return new THREE.CSS2DObject(div);
        }

        // Tạo điểm nhỏ, rõ nét
        function createPoint(pos, color = 0xfacc15, size = 0.3, labelTxt = '') {
            const geo = new THREE.SphereGeometry(size, 32, 32);
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.2, metalness: 0.5 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(pos);
            
            if (labelTxt) {
                const label = createLabel(labelTxt, 'label-math');
                label.position.set(0.6, 0.8, 0);
                mesh.add(label);
            }
            return mesh;
        }

        // Đường thẳng khối trụ (Nét mảnh nhưng rõ)
        function createThickLine(pt1, pt2, color = 0xef4444, thickness = 0.1) {
            const distance = pt1.distanceTo(pt2);
            const geo = new THREE.CylinderGeometry(thickness, thickness, distance, 16);
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3 });
            const cylinder = new THREE.Mesh(geo, mat);
            
            const position = new THREE.Vector3().addVectors(pt1, pt2).multiplyScalar(0.5);
            cylinder.position.copy(position);
            cylinder.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3().subVectors(pt2, pt1).normalize());
            
            return cylinder;
        }

        // Đường nét đứt (thường dùng gióng toạ độ)
        function createDashedLine(pt1, pt2, color = 0x94a3b8) {
            const mat = new THREE.LineDashedMaterial({ color: color, dashSize: 0.8, gapSize: 0.4 });
            const geo = new THREE.BufferGeometry().setFromPoints([pt1, pt2]);
            const line = new THREE.Line(geo, mat);
            line.computeLineDistances();
            return line;
        }
        
        // Mặt phẳng tiêu chuẩn (ngang)
        function createPlane(size, color, labelTxt, opacity = 0.3) {
            const group = new THREE.Group();
            const geo = new THREE.PlaneGeometry(size, size);
            const mat = new THREE.MeshPhysicalMaterial({ color: color, transparent: true, opacity: opacity, side: THREE.DoubleSide, roughness: 0.1, depthWrite: false });
            const plane = new THREE.Mesh(geo, mat);
            plane.rotation.x = -Math.PI / 2;
            
            const edges = new THREE.EdgesGeometry(geo);
            const edgeMat = new THREE.LineBasicMaterial({ color: color, linewidth: 2 });
            const outline = new THREE.LineSegments(edges, edgeMat);
            outline.rotation.x = -Math.PI / 2;

            group.add(plane, outline);
            if (labelTxt) {
                const label = createLabel(labelTxt, 'label-math');
                label.position.set(size/2 - 3, 0.5, size/2 - 3); 
                group.add(label);
            }
            return group;
        }

        // Mặt phẳng tùy chỉnh bằng 4 đỉnh (Polygon)
        function createCustomPlane(p1, p2, p3, p4, color, labelTxt, labelPos, opacity = 0.3) {
            const group = new THREE.Group();
            const geo = new THREE.BufferGeometry();
            const vertices = new Float32Array([
                p1.x, p1.y, p1.z,  p2.x, p2.y, p2.z,  p3.x, p3.y, p3.z,
                p3.x, p3.y, p3.z,  p4.x, p4.y, p4.z,  p1.x, p1.y, p1.z
            ]);
            geo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            geo.computeVertexNormals();

            const mat = new THREE.MeshPhysicalMaterial({ color: color, transparent: true, opacity: opacity, side: THREE.DoubleSide, depthWrite: false });
            const mesh = new THREE.Mesh(geo, mat);

            const edges = new THREE.EdgesGeometry(geo);
            const edgeMat = new THREE.LineBasicMaterial({ color: color, linewidth: 2 });
            const outline = new THREE.LineSegments(edges, edgeMat);

            group.add(mesh, outline);
            if (labelTxt && labelPos) {
                const lbl = createLabel(labelTxt, 'label-math');
                lbl.position.copy(labelPos);
                group.add(lbl);
            }
            return group;
        }

        function buildState(id) {
            const group = new THREE.Group();
            const EXT = 25; // Chiều dài mở rộng của đường thẳng
            
            switch (id) {
                case 1: { // Hai đường thẳng song song
                    const plane = createPlane(45, 0x1e3a8a, '(P)', 0.35); // Nền xanh sẫm
                    
                    const a1 = new THREE.Vector3(-EXT, 0, -6);
                    const a2 = new THREE.Vector3(EXT, 0, -6);
                    const b1 = new THREE.Vector3(-EXT, 0, 6);
                    const b2 = new THREE.Vector3(EXT, 0, 6);

                    const lineA = createThickLine(a1, a2, 0xef4444, 0.12);
                    const lineB = createThickLine(b1, b2, 0x3b82f6, 0.12);

                    const lblA = createLabel('a', 'label-math text-red-400');
                    lblA.position.copy(a2).add(new THREE.Vector3(0, 1, -1));
                    const lblB = createLabel('b', 'label-math text-blue-400');
                    lblB.position.copy(b2).add(new THREE.Vector3(0, 1, 1));

                    group.add(plane, lineA, lineB, lblA, lblB);
                    break;
                }
                case 2: { // Hai đường thẳng cắt nhau
                    const plane = createPlane(45, 0x1e3a8a, '(P)', 0.35); 
                    
                    const a1 = new THREE.Vector3(-20, 0, -15);
                    const a2 = new THREE.Vector3(20, 0, 15);
                    const lineA = createThickLine(a1, a2, 0xef4444, 0.12);
                    
                    const b1 = new THREE.Vector3(-20, 0, 15);
                    const b2 = new THREE.Vector3(20, 0, -15);
                    const lineB = createThickLine(b1, b2, 0x3b82f6, 0.12);
                    
                    const pI = new THREE.Vector3(0, 0, 0); 
                    const ptI = createPoint(pI, 0xfacc15, 0.3, 'I');

                    const lblA = createLabel('a', 'label-math text-red-400');
                    lblA.position.copy(a2).add(new THREE.Vector3(1, 1, 0));
                    const lblB = createLabel('b', 'label-math text-blue-400');
                    lblB.position.copy(b2).add(new THREE.Vector3(1, 1, 0));

                    group.add(plane, lineA, lineB, ptI, lblA, lblB);
                    break;
                }
                case 3: { // Hai đường thẳng trùng nhau
                    const plane = createPlane(45, 0x1e3a8a, '(P)', 0.35); 
                    
                    const a1 = new THREE.Vector3(-EXT, 0, 0);
                    const a2 = new THREE.Vector3(EXT, 0, 0);
                    // Đường nét to hơn, màu tím hồng để tượng trưng 2 đường lồng vào nhau
                    const lineAB = createThickLine(a1, a2, 0xec4899, 0.2); 
                    
                    const lblA = createLabel('a', 'label-math text-red-400');
                    lblA.position.set(-10, 1.5, 0);
                    const lblB = createLabel('b', 'label-math text-blue-400');
                    lblB.position.set(10, 1.5, 0);

                    group.add(plane, lineAB, lblA, lblB);
                    break;
                }
                case 4: { // Hai đường thẳng chéo nhau
                    const plane = createPlane(45, 0x0f766e, '(P)', 0.3); // Nền xanh ngọc
                    
                    // Đường a nằm trên (P)
                    const a1 = new THREE.Vector3(-EXT, 0, -5);
                    const a2 = new THREE.Vector3(EXT, 0, -5);
                    const lineA = createThickLine(a1, a2, 0xef4444, 0.12);
                    
                    // Đường b xuyên qua (P) tại I
                    const pI = new THREE.Vector3(0, 0, 8); // Điểm I thuộc (P) nhưng không thuộc a
                    const b1 = new THREE.Vector3(-10, 15, -2); // Chéo hẳn lên
                    const b2 = new THREE.Vector3(10, -15, 18); // Chéo hẳn xuống
                    const lineB = createThickLine(b1, b2, 0x3b82f6, 0.12);
                    
                    const ptI = createPoint(pI, 0xfacc15, 0.3, 'I');

                    const lblA = createLabel('a', 'label-math text-red-400');
                    lblA.position.copy(a2).add(new THREE.Vector3(0, 1, -1));
                    const lblB = createLabel('b', 'label-math text-blue-400');
                    lblB.position.copy(b1).add(new THREE.Vector3(0, 1, 1));

                    group.add(plane, lineA, lineB, ptI, lblA, lblB);
                    break;
                }
                case 5: { // Tiên đề Ơ-clit
                    // d
                    const d1 = new THREE.Vector3(-EXT, -5, 0);
                    const d2 = new THREE.Vector3(EXT, -5, 0);
                    const lineD = createThickLine(d1, d2, 0x94a3b8, 0.12); // Xám
                    
                    // Điểm M
                    const pM = new THREE.Vector3(5, 8, 0);
                    const ptM = createPoint(pM, 0xfacc15, 0.35, 'M');

                    // d' qua M song song d
                    const dp1 = new THREE.Vector3(-EXT, 8, 0);
                    const dp2 = new THREE.Vector3(EXT, 8, 0);
                    const lineDP = createThickLine(dp1, dp2, 0xf59e0b, 0.15); // Vàng cam nổi bật

                    // Gióng khoảng cách
                    const pH = new THREE.Vector3(5, -5, 0); // Hình chiếu của M lên d
                    const dashH = createDashedLine(pM, pH, 0x64748b);
                    const ptH = createPoint(pH, 0xffffff, 0.2);

                    const lblD = createLabel('d', 'label-math text-slate-400');
                    lblD.position.copy(d2).add(new THREE.Vector3(0, 1, 0));
                    const lblDP = createLabel('d\'', 'label-math text-amber-400');
                    lblDP.position.copy(dp2).add(new THREE.Vector3(0, 1, 0));

                    group.add(lineD, lineDP, ptM, ptH, dashH, lblD, lblDP);
                    break;
                }
                case 6: { // Tính chất bắc cầu
                    const a1 = new THREE.Vector3(-EXT, 10, -5);
                    const a2 = new THREE.Vector3(EXT, 10, -5);
                    const lineA = createThickLine(a1, a2, 0xef4444, 0.12);
                    
                    const c1 = new THREE.Vector3(-EXT, 0, 5);
                    const c2 = new THREE.Vector3(EXT, 0, 5);
                    const lineC = createThickLine(c1, c2, 0x10b981, 0.12); // Đường c ở giữa (Xanh lá)

                    const b1 = new THREE.Vector3(-EXT, -10, -5);
                    const b2 = new THREE.Vector3(EXT, -10, -5);
                    const lineB = createThickLine(b1, b2, 0x3b82f6, 0.12);

                    const lblA = createLabel('a', 'label-math text-red-400');
                    lblA.position.copy(a2).add(new THREE.Vector3(0, 1, 0));
                    const lblC = createLabel('c', 'label-math text-emerald-400');
                    lblC.position.copy(c2).add(new THREE.Vector3(0, 1, 0));
                    const lblB = createLabel('b', 'label-math text-blue-400');
                    lblB.position.copy(b2).add(new THREE.Vector3(0, 1, 0));

                    group.add(lineA, lineB, lineC, lblA, lblB, lblC);
                    break;
                }
                case 7: { // Giao tuyến 3 mặt phẳng (Song song) - Khối lăng trụ
                    // Đỉnh
                    const top1 = new THREE.Vector3(-20, 10, 0);
                    const top2 = new THREE.Vector3(20, 10, 0);
                    // Đáy trái
                    const bl1 = new THREE.Vector3(-20, -8, -12);
                    const bl2 = new THREE.Vector3(20, -8, -12);
                    // Đáy phải
                    const br1 = new THREE.Vector3(-20, -8, 12);
                    const br2 = new THREE.Vector3(20, -8, 12);

                    // 3 Mặt phẳng
                    const planeP = createCustomPlane(top1, top2, bl2, bl1, 0xec4899, '(P)', new THREE.Vector3(0, 0, -8), 0.25);
                    const planeQ = createCustomPlane(top1, top2, br2, br1, 0x3b82f6, '(Q)', new THREE.Vector3(0, 0, 8), 0.25);
                    const planeR = createCustomPlane(bl1, bl2, br2, br1, 0x14b8a6, '(R)', new THREE.Vector3(15, -8, 0), 0.25);

                    // 3 Giao tuyến (Kéo dài ra)
                    const extT1 = new THREE.Vector3(-EXT, 10, 0); const extT2 = new THREE.Vector3(EXT, 10, 0);
                    const extL1 = new THREE.Vector3(-EXT, -8, -12); const extL2 = new THREE.Vector3(EXT, -8, -12);
                    const extR1 = new THREE.Vector3(-EXT, -8, 12); const extR2 = new THREE.Vector3(EXT, -8, 12);

                    const lineA = createThickLine(extT1, extT2, 0xffffff, 0.15); // a (Trắng)
                    const lineB = createThickLine(extL1, extL2, 0xffffff, 0.15); // b
                    const lineC = createThickLine(extR1, extR2, 0xffffff, 0.15); // c

                    const lblA = createLabel('a', 'label-math text-white'); lblA.position.copy(extT2).add(new THREE.Vector3(0,1,0));
                    const lblB = createLabel('b', 'label-math text-white'); lblB.position.copy(extL2).add(new THREE.Vector3(0,1,0));
                    const lblC = createLabel('c', 'label-math text-white'); lblC.position.copy(extR2).add(new THREE.Vector3(0,1,0));

                    group.add(planeP, planeQ, planeR, lineA, lineB, lineC, lblA, lblB, lblC);
                    break;
                }
                case 8: { // Giao tuyến 3 mặt phẳng (Đồng quy) - Góc phần tư
                    const size = 20;
                    // Plane xy (Z=0) - Blue
                    const p1 = createCustomPlane(new THREE.Vector3(-size, -size, 0), new THREE.Vector3(size, -size, 0), new THREE.Vector3(size, size, 0), new THREE.Vector3(-size, size, 0), 0x3b82f6, '(P)', new THREE.Vector3(10, 15, 0), 0.3);
                    // Plane yz (X=0) - Pink
                    const p2 = createCustomPlane(new THREE.Vector3(0, -size, -size), new THREE.Vector3(0, size, -size), new THREE.Vector3(0, size, size), new THREE.Vector3(0, -size, size), 0xec4899, '(Q)', new THREE.Vector3(0, 15, 10), 0.3);
                    // Plane zx (Y=0) - Teal
                    const p3 = createCustomPlane(new THREE.Vector3(-size, 0, -size), new THREE.Vector3(size, 0, -size), new THREE.Vector3(size, 0, size), new THREE.Vector3(-size, 0, size), 0x14b8a6, '(R)', new THREE.Vector3(15, 0, 10), 0.3);

                    // 3 Giao tuyến (Các trục tọa độ)
                    const lineA = createThickLine(new THREE.Vector3(-EXT, 0, 0), new THREE.Vector3(EXT, 0, 0), 0xffffff, 0.15); // Trục X
                    const lineB = createThickLine(new THREE.Vector3(0, -EXT, 0), new THREE.Vector3(0, EXT, 0), 0xffffff, 0.15); // Trục Y
                    const lineC = createThickLine(new THREE.Vector3(0, 0, -EXT), new THREE.Vector3(0, 0, EXT), 0xffffff, 0.15); // Trục Z

                    // Điểm đồng quy I
                    const ptI = createPoint(new THREE.Vector3(0,0,0), 0xfacc15, 0.4, 'I');

                    const lblA = createLabel('a', 'label-math text-white'); lblA.position.set(EXT, 1, 0);
                    const lblB = createLabel('b', 'label-math text-white'); lblB.position.set(1, EXT, 0);
                    const lblC = createLabel('c', 'label-math text-white'); lblC.position.set(0, 1, EXT);

                    group.add(p1, p2, p3, lineA, lineB, lineC, ptI, lblA, lblB, lblC);
                    break;
                }
            }
            return group;
        }

        function destroyCSS2DObjects(group) {
            if (!group) return;
            group.traverse(child => {
                if (child.isCSS2DObject && child.element && child.element.parentNode) {
                    child.element.parentNode.removeChild(child.element);
                }
            });
        }

        function update3DScene(id) {
            if (currentStateGroup) {
                destroyCSS2DObjects(currentStateGroup);
                scene.remove(currentStateGroup);
                currentStateGroup = null;
            }

            currentStateGroup = buildState(id);
            scene.add(currentStateGroup);
        }

        function onWindowResize() {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
            labelRenderer.setSize(container.clientWidth, container.clientHeight);
        }
        window.addEventListener('resize', onWindowResize);

        function animate() {
            requestAnimationFrame(animate);
            if (controls) controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        
        window.onload = function() {
            onWindowResize();
            animate();
        };

        const menuListEl = document.getElementById('menu-list');
        const infoTitleEl = document.getElementById('info-title');
        const infoDescEl = document.getElementById('info-desc');
        const mathFormulaEl = document.getElementById('math-formula');

        function renderMenu() {
            menuListEl.innerHTML = '';
            menuData.forEach(item => {
                const btn = document.createElement('button');
                const isActive = item.id === currentStateId;
                
                btn.className = `w-full text-left px-4 py-3 rounded-lg text-sm transition-all duration-200 flex items-center gap-3 border ${
                    isActive 
                    ? 'bg-amber-900/40 border-amber-500/50 text-white shadow-[0_0_15px_rgba(245,158,11,0.15)]' 
                    : 'bg-transparent border-transparent text-slate-400 hover:bg-slate-800/50 hover:text-slate-200'
                }`;
                
                btn.innerHTML = `
                    <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs shrink-0 ${
                        isActive ? 'bg-amber-600 text-white' : 'bg-slate-700 text-slate-300'
                    }">
                        ${item.id}
                    </div>
                    <div class="flex flex-col">
                        <span class="font-semibold text-[13px] truncate">${item.label}</span>
                        <span class="text-[11px] opacity-70 truncate">${item.title}</span>
                    </div>
                `;
                
                btn.onclick = () => changeState(item.id);
                menuListEl.appendChild(btn);
            });
        }

        function updateFooter(id) {
            const data = menuData.find(item => item.id === id);
            if (!data) return;

            const iconHtml = `<svg class="text-amber-500" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="9" x2="20" y2="9"></line><line x1="4" y1="15" x2="20" y2="15"></line></svg>`;
            infoTitleEl.innerHTML = iconHtml + ' ' + data.title;
            infoDescEl.textContent = data.desc;

            katex.render(data.formula, mathFormulaEl, {
                throwOnError: false,
                displayMode: true
            });
        }

        function changeState(id) {
            currentStateId = id;
            renderMenu();
            updateFooter(id);
            update3DScene(id);
        }

        // Khởi tạo ban đầu
        renderMenu();
        updateFooter(currentStateId);
        update3DScene(currentStateId);

        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const fullscreenIcon = document.getElementById('fullscreen-icon');
        const fullscreenText = document.getElementById('fullscreen-text');

        function toggleFullScreen() {
            if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement ) {  
                // Kích hoạt toàn màn hình (Hỗ trợ nhiều trình duyệt)
                const docElm = document.documentElement;
                if (docElm.requestFullscreen) {
                    docElm.requestFullscreen();
                } else if (docElm.mozRequestFullScreen) {
                    docElm.mozRequestFullScreen(); // Firefox
                } else if (docElm.webkitRequestFullScreen) {
                    docElm.webkitRequestFullScreen(); // Chrome, Safari
                } else if (docElm.msRequestFullscreen) {
                    docElm.msRequestFullscreen(); // IE11
                }
            } else {
                // Thoát toàn màn hình
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }

        fullscreenBtn.addEventListener('click', toggleFullScreen);

        // Lắng nghe sự kiện để đổi Icon và Text (Hỗ trợ nhiều trình duyệt)
        const fullscreenEvents = ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'];
        
        fullscreenEvents.forEach(event => {
            document.addEventListener(event, () => {
                const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
                
                if (isFullscreen) {
                    fullscreenText.textContent = 'Thu nhỏ';
                    fullscreenIcon.innerHTML = `<path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path>`;
                } else {
                    fullscreenText.textContent = 'Toàn màn hình';
                    fullscreenIcon.innerHTML = `<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>`;
                }
                
                // Đảm bảo Canvas Three.js resize lại sau 1 khoảng trễ ngắn (để CSS kịp render)
                setTimeout(onWindowResize, 150);
            });
        });

        // Phím tắt F cho toàn màn hình
        document.addEventListener('keydown', (event) => {
            // Không kích hoạt nếu đang gõ vào thẻ input/textarea (phòng ngừa cho tương lai)
            if (event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA') return;

            if (event.key === 'f' || event.key === 'F') {
                toggleFullScreen();
            }
        });

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài học Tương tác: Mở đầu Hình học Không gian</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- KaTeX for Math Formulas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #f1f5f9; color: #1e293b; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .pointer-events-auto { pointer-events: auto; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.05); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.2); border-radius: 4px; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%; background: #2563eb; cursor: pointer; margin-top: -7px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #cbd5e1; border-radius: 2px; }
        
        /* Chế độ hiển thị toàn màn hình, chữ lớn, nền trắng 100% không mờ */
        .expanded-panel {
            position: fixed !important; top: 50% !important; left: 50% !important; transform: translate(-50%, -50%) !important;
            width: 98vw !important; max-width: 100% !important; height: 96vh !important; max-height: 100vh !important;
            z-index: 100 !important; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25) !important;
            background: #ffffff !important; 
            backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
            display: flex !important; flex-direction: column !important;
        }
        .expanded-panel #info-content { 
            padding: 3rem !important; gap: 2rem !important; 
            overflow-y: auto !important; 
        }
        .expanded-panel #math-formula { font-size: 40px !important; padding: 2rem !important; min-height: 150px !important; overflow-x: auto !important; }
        .expanded-panel #math-result, .expanded-panel #math-result * { font-size: 32px !important; line-height: 1.6 !important; }
        .expanded-panel #math-result { padding: 2rem !important; }
        .expanded-panel h3 { font-size: 36px !important; }
        .expanded-panel h3 svg { width: 36px !important; height: 36px !important; }
        
        .minimized-panel {
            background: transparent !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
            border: none !important; box-shadow: none !important; pointer-events: none;
        }
        .minimized-panel .panel-header { background: transparent !important; border-bottom: none !important; pointer-events: auto; }
        .minimized-panel .panel-title { opacity: 0; pointer-events: none; }
        .minimized-panel #control-footer-hint { display: none !important; }
        .minimized-panel label { text-shadow: 0 0 6px rgba(255,255,255,0.9), 0 0 2px rgba(255,255,255,1) !important; }
        
        .minimized-panel #controls-container { opacity: 0.35; transition: opacity 0.3s ease; pointer-events: auto; }
        .minimized-panel #controls-container:hover { opacity: 1; }
        .minimized-panel input[type=range]::-webkit-slider-runnable-track { background: rgba(203, 213, 225, 0.5) !important; }
        .minimized-panel input[type=range]::-webkit-slider-thumb { background: rgba(37, 99, 235, 0.6) !important; box-shadow: none !important; }
    </style>

    <script>
        window.togglePanel = function(contentId, iconId) {
            const content = document.getElementById(contentId);
            const icon = document.getElementById(iconId);
            content.classList.toggle('hidden');
            icon.classList.toggle('-rotate-90');
        };

        window.toggleExpand = function() {
            const panel = document.getElementById('info-panel');
            const overlay = document.getElementById('expand-overlay');
            const content = document.getElementById('info-content');
            const icon = document.getElementById('info-icon');
            
            if (panel.classList.contains('expanded-panel')) {
                panel.classList.remove('expanded-panel');
                overlay.classList.add('hidden');
                content.classList.add('hidden');
                icon.classList.add('-rotate-90');
            } else {
                panel.classList.add('expanded-panel');
                overlay.classList.remove('hidden');
                content.classList.remove('hidden');
                icon.classList.remove('-rotate-90');
            }
        };

        window.toggleControlPanel = function() {
            const panel = document.getElementById('bottom-panel');
            const icon = document.getElementById('control-icon');
            panel.classList.toggle('minimized-panel');
            icon.classList.toggle('-rotate-90');
        };

        window.toggleFullScreen = function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.warn(err));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        };

        document.addEventListener('keydown', (event) => {
            if (event.key.toLowerCase() === 'f' && event.target.tagName !== 'INPUT') window.toggleFullScreen();
        });
    </script>
</head>
<body>

    <!-- Application Script -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;
        let objectsGroup = new THREE.Group();
        let currentMode = 1;
        
        // Trạng thái các biến của 5 phần bài học
        const state = {
            m1: { dip: 0 },                  // Vấn đề thực tế (Độ lõm của mặt đất làm kênh ghế 4 chân)
            m2: { c_pos: 0 },                // Tiên đề 1,2,3 (Kéo điểm C để tạo và di chuyển mặt phẳng)
            m3: { rotate: 0 },               // Tiên đề 4,5 (Xoay mặt phẳng giao nhau)
            m4: { step: 0 },                 // Ví dụ 1 (Tìm giao tuyến - Step by step)
            m5: { step: 0 }                  // Ví dụ 2 (Tìm giao điểm - Step by step)
        };

        const problems = [
            "Tại sao những chiếc giá đỡ máy ảnh hay ghế đẩu nhỏ luôn có 3 chân, và chúng luôn đứng vững trên mọi địa hình gồ ghề? Trong khi đó, chiếc bàn 4 chân lại rất hay bị kênh và cần phải chêm giấy? Bí mật nằm ở <span class='text-red-700 font-bold'>Tiên đề hình học</span> cơ bản nhất!",
            "<span class='text-red-700 font-bold'>Hệ thống 3 Tiên đề đầu tiên</span> giúp ta xác định sự tồn tại vững chắc của một mặt phẳng trong không gian. Nó giải thích vì sao 3 điểm tạo nên nền tảng vững chắc nhất cho mọi công trình kiến trúc.",
            "Nếu chỉ có 3 điểm, ta chỉ tạo ra được 1 mặt phẳng đơn điệu (như tờ giấy). Nhưng nếu có <span class='text-red-700 font-bold'>điểm thứ 4 nằm ngoài mặt phẳng</span> đó, một không gian 3 chiều thực sự (Hình Chóp/Tứ diện) sẽ được mở ra. Và khi các mặt phẳng cắt nhau, chúng tạo ra thứ gì?",
            "Bài toán kinh điển nhất của Hình học Không gian: <span class='text-red-700 font-bold'>Tìm Giao tuyến của hai mặt phẳng</span>. Để tìm được đường thẳng giao nhau này, ta chỉ cần vận dụng Tiên đề 5: Tìm đúng 2 điểm chung phân biệt của hai mặt phẳng đó.",
            "Một dạng toán quan trọng không kém: <span class='text-red-700 font-bold'>Tìm Giao điểm của đường thẳng và mặt phẳng</span>. Mẹo giải bài này là gì? Hãy mượn một mặt phẳng phụ chứa đường thẳng đó, rồi tìm giao tuyến!"
        ];

        const mathFormula = document.getElementById('math-formula');
        const mathResult = document.getElementById('math-result');
        const controlsContainer = document.getElementById('controls-container');

        // --- HÀM VẼ CƠ BẢN ---
        function createTextSprite(text, color, scale=1.0) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 128;
            const context = canvas.getContext('2d');
            context.font = 'Bold 42px "Segoe UI", Arial';
            context.fillStyle = color; context.textAlign = 'center'; context.textBaseline = 'middle';
            context.lineWidth = 6; context.strokeStyle = 'white';
            context.strokeText(text, 128, 64); context.fillText(text, 128, 64);
            const texture = new THREE.CanvasTexture(canvas);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false }));
            sprite.scale.set(scale*2, scale, scale); return sprite;
        }

        function createPoint(pos, color=0xdc2626, size=0.15, label='', offset=new THREE.Vector3(0, 0.4, 0)) {
            if (typeof size === 'string') { label = size; size = 0.15; }
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(size, 16, 16), new THREE.MeshPhongMaterial({ color }));
            mesh.position.copy(pos); objectsGroup.add(mesh);
            if (label) {
                const sprite = createTextSprite(label, '#' + color.toString(16).padStart(6, '0'), 0.8);
                sprite.position.copy(pos).add(offset); objectsGroup.add(sprite);
            }
            return mesh;
        }

        function drawLine(p1, p2, color=0x1e293b, width=3) {
            const radius = width * 0.01; 
            const dist = p1.distanceTo(p2);
            if(dist < 0.001) return null;
            const mesh = new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(p1, p2), 1, radius, 8, false), new THREE.MeshPhongMaterial({ color }));
            objectsGroup.add(mesh); return mesh;
        }

        function drawDashed(p1, p2, color=0x94a3b8, width=1.5) {
            const radius = width * 0.01; // Đồng bộ cách tính độ dày giống nét liền
            const dist = p1.distanceTo(p2);
            if(dist < 0.001) return null; // Chốt chặn chống lỗi đồ họa
            
            const dashSize = 0.3; const gapSize = 0.2; const step = dashSize + gapSize;
            const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
            for (let d = 0; d < dist; d += step) {
                const start = new THREE.Vector3().copy(p1).addScaledVector(dir, d);
                const currentDash = Math.min(dashSize, dist - d);
                if (currentDash <= 0.001) continue;
                const end = new THREE.Vector3().copy(start).addScaledVector(dir, currentDash);
                objectsGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(start, end), 1, radius, 8, false), new THREE.MeshBasicMaterial({ color })));
            }
        }

        // Bổ sung hàm vẽ mũi tên Vector để tạo Hệ trục tọa độ Oxyz
        function drawThickVector(p1, p2, color=0x94a3b8, radius=0.02) {
            const group = new THREE.Group();
            const dist = p1.distanceTo(p2);
            if(dist < 0.001) return group;
            const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
            const headLength = radius * 6; const headRadius = radius * 2.5;
            const shaftLength = Math.max(0, dist - headLength);
            if(shaftLength > 0) {
                const mesh = new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(p1, new THREE.Vector3().copy(p1).addScaledVector(dir, shaftLength)), 1, radius, 8, false), new THREE.MeshPhongMaterial({ color }));
                group.add(mesh);
            }
            const headGeom = new THREE.ConeGeometry(headRadius, headLength, 16);
            headGeom.translate(0, headLength/2, 0); 
            const headMesh = new THREE.Mesh(headGeom, new THREE.MeshPhongMaterial({ color }));
            headMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
            headMesh.position.copy(p1).addScaledVector(dir, shaftLength);
            group.add(headMesh);
            objectsGroup.add(group); return group;
        }

        // Bổ sung hàm dựng Hệ trục tọa độ Oxyz
        function drawStandardAxes(xLen = 10, yLen = 10, zLen = 10) {
            // Trục Ox: Màu Đỏ
            drawThickVector(new THREE.Vector3(0,0,0), new THREE.Vector3(xLen,0,0), 0xdc2626, 0.03);
            createTextSprite('x', '#dc2626', 0.8).position.set(xLen+0.5, 0, 0);
            
            // Trục Oy: Màu Xanh lá
            drawThickVector(new THREE.Vector3(0,0,0), new THREE.Vector3(0,yLen,0), 0x059669, 0.03);
            createTextSprite('y', '#059669', 0.8).position.set(0, yLen+0.5, 0);
            
            // Trục Oz: Màu Xanh dương
            drawThickVector(new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,zLen), 0x2563eb, 0.03);
            createTextSprite('z', '#2563eb', 0.8).position.set(0, 0, zLen+0.5);
            
            createPoint(new THREE.Vector3(0,0,0), 0x1e293b, 0.1, 'O', new THREE.Vector3(-0.6, -0.6, 0));
        }

        function createFace(points, color, opacity=0.5) {
            const geom = new THREE.BufferGeometry().setFromPoints(points);
            // Assuming points form a simple convex polygon, triangulate it
            const indices = [];
            for (let i = 1; i < points.length - 1; i++) {
                indices.push(0, i, i + 1);
            }
            geom.setIndex(indices);
            geom.computeVertexNormals();
            const mesh = new THREE.Mesh(geom, new THREE.MeshPhongMaterial({color, side:THREE.DoubleSide, transparent:true, opacity}));
            objectsGroup.add(mesh);
            return mesh;
        }

        function clearAll() {
            while (objectsGroup.children.length > 0) {
                const child = objectsGroup.children[0];
                if (child.geometry) child.geometry.dispose();
                if (child.material) { if (Array.isArray(child.material)) child.material.forEach(m => m.dispose()); else child.material.dispose(); }
                objectsGroup.remove(child);
            }
        }

        function init() {
            scene = new THREE.Scene();

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; controls.dampingFactor = 0.05;

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(10, 20, 15); scene.add(dirLight);

                camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();

            });

            for(let i=1; i<=5; i++) document.getElementById(`btn-mode-${i}`).addEventListener('click', () => switchMode(i));

            createPoint(A, 0x1e293b, 'A'); createPoint(B, 0x1e293b, 'B'); createPoint(C, 0x1e293b, 'C');

            drawLine(A, B, 0x1e293b, 2); drawLine(B, C, 0x1e293b, 2);

            // Góc xoay của mặt thứ 2 (ABC) vs mặt quay quanh BC
            const angle = state.m3.rotate * Math.PI/180;
            
            // Điểm D' quay quanh BC.

            const hinge = new THREE.Vector3().lerpVectors(B, C, 0.5); // Tâm xoay tạm
            const axis = new THREE.Vector3().subVectors(C, B).normalize();

            // Khởi tạo D nằm trên mặt đáy (phẳng) -> D_flat
            // D_flat sao cho tam giác BCD_flat có kích thước y hệt BCD.

            const group = new THREE.Group();
            // Dựng mặt BCD trong group
            const D_local = new THREE.Vector3(0, 6, 0); // Vị trí lúc angle = 90 độ (approx)
            // Thay vì tính phức tạp, gán cứng điểm D quay quanh trục BC.
            
            const matrix = new THREE.Matrix4().makeRotationAxis(axis, angle);
            const vecD = new THREE.Vector3().subVectors(D, B); // Vector B->D

            createFace([B, C, D_rot], 0xf59e0b, 0.5); // Mặt xoay (Màu vàng)

            updateMath(`(SAB) \\cap (SCD) = SE`, 
                `<div class="mb-1 font-bold text-blue-700">Ví dụ 1: Tìm Giao Tuyến (Mặt $\\cap$ Mặt)</div>
                <div class="text-slate-800 leading-relaxed text-base">${resultText}</div>`);
        }

        // --- M5: VÍ DỤ 2 (Tìm Giao Điểm) ---
        function renderM5() {
            camera.position.set(12, 10, 18); controls.target.set(0, 2, 0);
            clearAll(); 
            drawStandardAxes(10, 10, 10); // Thêm hệ trục Oxyz
            
            const step = state.m5.step;
            
            // Hình chóp S.ABCD
            const A = new THREE.Vector3(-3, 0, 3);
            const B = new THREE.Vector3(3, 0, 3);
            const C = new THREE.Vector3(3, 0, -3);
            const D = new THREE.Vector3(-3, 0, -3);
            const S = new THREE.Vector3(0, 8, 0);

            // Đường thẳng d qua M(trên SA) và N(trên SD)
            const M = new THREE.Vector3().lerpVectors(S, A, 0.4); // Gần S hơn
            const N = new THREE.Vector3().lerpVectors(S, D, 0.8); // Gần D hơn
            
            createPoint(S, 0x1e293b, 'S', new THREE.Vector3(0, 0.6, 0));
            createPoint(A, 0x1e293b, 'A'); createPoint(B, 0x1e293b, 'B'); createPoint(C, 0x1e293b, 'C'); createPoint(D, 0x1e293b, 'D');
            
            createFace([A, B, C, D], 0x94a3b8, 0.3); // Đáy ABCD
            drawLine(S, A, 0x1e293b, 2); drawLine(S, B, 0x1e293b, 2); drawLine(S, C, 0x1e293b, 2); drawLine(S, D, 0x1e293b, 2);
            drawLine(A, B, 0x1e293b, 2); drawLine(B, C, 0x1e293b, 2); drawDashed(C, D, 0x1e293b, 2); drawDashed(A, D, 0x1e293b, 2);

            createPoint(M, 0x0ea5e9, 'M', new THREE.Vector3(-0.5, 0.5, 0));
            createPoint(N, 0x0ea5e9, 'N', new THREE.Vector3(0.5, 0.5, 0));
            drawLine(M, N, 0x0ea5e9, 3); // Đường thẳng MN

            let resultText = "<strong>Bài toán:</strong> Cho $M \\in SA$, $N \\in SD$ (với $MN$ không song song $AD$). Tìm giao điểm của đường thẳng $MN$ và mặt phẳng đáy $(ABCD)$.<br><br>";

            // Tìm giao điểm K của MN và AD.
            // AD đi qua (-3,0,3) vector (0,0,-1). MN vector = N - M.
            // M = ( -1.2, 4.8, 1.2 ). N = ( -2.4, 1.6, -2.4 ).
            // Giải tay: Trong mặt phẳng (SAD), kéo dài MN và AD cắt nhau tại K. Tính chính xác để M, N, K thẳng hàng:
            const K = new THREE.Vector3(-3, 0, -4.2); 

            if (step >= 1) {
                createFace([S, A, D], 0xf59e0b, 0.4); // Mp phụ (SAD)
                resultText += "- Bước 1: Mượn mặt phẳng phụ. Dễ thấy $MN$ nằm trọn trong mặt phẳng bên $(SAD)$.<br>";
                resultText += "Ta đi tìm giao tuyến của $(SAD)$ và mặt đáy $(ABCD)$ $\\Rightarrow$ <span class='text-red-700 font-bold'>Chính là cạnh $AD$.</span><br>";
            }
            if (step >= 2) {
                drawDashed(D, K, 0x1e293b, 2); // Kéo dài AD
                drawDashed(N, K, 0x0ea5e9, 3); // Kéo dài MN
                
                resultText += "- Bước 2: Trong mặt phẳng $(SAD)$, vì $MN$ không song song với $AD$ nên chúng sẽ cắt nhau. Kéo dài $MN$ cắt $AD$ tại $K$.<br>";
            }
            if (step >= 3) {
                createPoint(K, 0xdc2626, 0.3); // Highlight bự lên
                resultText += "<br><span class='text-emerald-700 font-bold'>Kết luận: Vì $K \\in AD \\subset (ABCD)$. Nên $K$ chính là giao điểm cần tìm: $K = MN \\cap (ABCD)$.</span>";
            }

            updateMath(`MN \\cap (ABCD) = K`, 
                `<div class="mb-1 font-bold text-purple-700">Ví dụ 2: Tìm Giao Điểm (Đường $\\cap$ Mặt)</div>
                <div class="text-slate-800 leading-relaxed text-base">${resultText}</div>`);
        }

        function switchMode(mode) {
            currentMode = mode;
            [1,2,3,4,5].forEach(i => {
                const btn = document.getElementById(`btn-mode-${i}`);
                if (i === mode) btn.className = btn.className.replace('bg-opacity-50', 'shadow-md scale-105 z-10 font-bold border-l-8').replace('bg-gray-50', ''); 
                else btn.className = `w-full text-left px-4 py-3 rounded-lg transition font-semibold text-sm shadow-sm border-l-4 bg-gray-50 bg-opacity-50 hover:bg-gray-100 ${['border-amber-500 text-amber-900', 'border-blue-500 text-blue-900', 'border-emerald-500 text-emerald-900', 'border-purple-500 text-purple-900', 'border-rose-500 text-rose-900'][i-1]}`;
            });

            const activeBtn = document.getElementById(`btn-mode-${mode}`);
            const colors = ['amber', 'blue', 'emerald', 'purple', 'rose'];
            const c = colors[mode-1];
            activeBtn.className = `w-full text-left px-4 py-3 rounded-lg transition font-bold text-sm shadow-md border-l-8 bg-${c}-100 border-${c}-600 text-${c}-900 scale-105 origin-left`;

            const problemHtml = problems[mode - 1].replace(/\$(.*?)\$/g, (m, math) => {
                try { return katex.renderToString(math, { throwOnError: false }); } catch(e) { return m; }
            });
            document.getElementById('problem-text').innerHTML = problemHtml;

            if(mode === 1) buildUI(`<label class="text-xs font-bold">Kéo để tạo Đất lún (Độ sâu h): <span class="text-blue-600">${state.m1.dip.toFixed(1)}</span><input type="range" min="-1.5" max="0" step="0.1" value="${state.m1.dip}" oninput="state.m1.dip=parseFloat(this.value); renderM1(); this.previousElementSibling.innerText=this.value"></label>`);
            else if(mode === 2) buildUI(`<label class="text-xs font-bold">Kéo để di chuyển vị trí điểm C: <span class="text-blue-600">${state.m2.c_pos.toFixed(1)}</span><input type="range" min="-4" max="4" step="0.5" value="${state.m2.c_pos}" oninput="state.m2.c_pos=parseFloat(this.value); renderM2(); this.previousElementSibling.innerText=this.value"></label>`);
            else if(mode === 3) buildUI(`<label class="text-xs font-bold">Kéo điểm D' lật lên Không gian 3D (Góc quay): <span class="text-blue-600">${state.m3.rotate}°</span><input type="range" min="0" max="90" step="2" value="${state.m3.rotate}" oninput="state.m3.rotate=parseFloat(this.value); renderM3(); this.previousElementSibling.innerText=this.value+'°'"></label>`);
            else if(mode === 4) buildUI(`<label class="text-xs font-bold">Kéo để xem từng bước Dựng hình: Bước <span class="text-blue-600">${state.m4.step}</span>/3<input type="range" min="0" max="3" step="1" value="${state.m4.step}" oninput="state.m4.step=parseInt(this.value); renderM4(); this.previousElementSibling.innerText=this.value"></label>`);
            else if(mode === 5) buildUI(`<label class="text-xs font-bold">Kéo để xem từng bước Dựng hình: Bước <span class="text-blue-600">${state.m5.step}</span>/3<input type="range" min="0" max="3" step="1" value="${state.m5.step}" oninput="state.m5.step=parseInt(this.value); renderM5(); this.previousElementSibling.innerText=this.value"></label>`);

            clearAll(); 
            window[`renderM${mode}`]();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.state = state;
        window.renderM1 = renderM1; window.renderM2 = renderM2; window.renderM3 = renderM3;
        window.renderM4 = renderM4; window.renderM5 = renderM5;

        window.onload = init;
    </script>
</body>
</html>

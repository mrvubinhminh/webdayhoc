<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô phỏng 3D Hình học Không gian Nâng cao</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- KaTeX for Math Formulas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #ffffff; color: #1e293b; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .pointer-events-auto { pointer-events: auto; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.05); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.2); border-radius: 4px; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%; background: #2563eb; cursor: pointer; margin-top: -7px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #cbd5e1; border-radius: 2px; }
        
        .expanded-panel {
            position: fixed !important; top: 50% !important; left: 50% !important; transform: translate(-50%, -50%) !important;
            width: 90vw !important; max-width: 900px !important; height: auto !important; max-height: 90vh !important;
            z-index: 100 !important; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25) !important;
        }
        .expanded-panel #info-content { padding: 2rem !important; gap: 1.5rem !important; }
        .expanded-panel #math-formula { font-size: 2.2rem !important; padding: 2rem !important; min-height: 160px !important; }
        .expanded-panel #math-result { font-size: 1.25rem !important; line-height: 2.2rem !important; padding: 1.5rem !important; }
        .expanded-panel h3 { font-size: 1.5rem !important; }
        
        .minimized-panel {
            background: transparent !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
            border: none !important; box-shadow: none !important; pointer-events: none;
        }
        .minimized-panel .panel-header { background: transparent !important; border-bottom: none !important; pointer-events: auto; }
        .minimized-panel .panel-title { opacity: 0; pointer-events: none; }
        .minimized-panel #control-footer-hint { display: none !important; }
        .minimized-panel label { text-shadow: 0 0 6px rgba(255,255,255,0.9), 0 0 2px rgba(255,255,255,1) !important; }
        
        .minimized-panel #controls-container { opacity: 0.35; transition: opacity 0.3s ease; pointer-events: auto; }
        .minimized-panel #controls-container:hover { opacity: 1; }
        .minimized-panel input[type=range]::-webkit-slider-runnable-track { background: rgba(203, 213, 225, 0.5) !important; }
        .minimized-panel input[type=range]::-webkit-slider-thumb { background: rgba(37, 99, 235, 0.6) !important; box-shadow: none !important; }
    </style>

    <script>
        window.togglePanel = function(contentId, iconId) {
            const content = document.getElementById(contentId);
            const icon = document.getElementById(iconId);
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden'); icon.classList.remove('-rotate-90');
            } else {
                content.classList.add('hidden'); icon.classList.add('-rotate-90');
            }
        };

        window.toggleExpand = function() {
            const panel = document.getElementById('info-panel');
            const overlay = document.getElementById('expand-overlay');
            const icon = document.getElementById('expand-icon');

            if (panel.classList.contains('expanded-panel')) {
                panel.classList.remove('expanded-panel'); overlay.classList.add('hidden');
                icon.innerHTML = '<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>';
            } else {
                panel.classList.add('expanded-panel'); overlay.classList.remove('hidden');
                document.getElementById('info-content').classList.remove('hidden');
                document.getElementById('info-icon').classList.remove('-rotate-90');
                icon.innerHTML = '<path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path>';
            }
        };

        window.toggleControlPanel = function() {
            const panel = document.getElementById('bottom-panel');
            const icon = document.getElementById('control-icon');
            if (panel.classList.contains('minimized-panel')) {
                panel.classList.remove('minimized-panel'); icon.classList.remove('-rotate-90');
            } else {
                panel.classList.add('minimized-panel'); icon.classList.add('-rotate-90');
            }
        };

        window.toggleFullScreen = function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.warn(err));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        };

        document.addEventListener('fullscreenchange', () => {
            const icon = document.getElementById('fullscreen-icon');
            if (document.fullscreenElement) {
                icon.innerHTML = '<path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/>';
            } else {
                icon.innerHTML = '<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>';
            }
        });

        document.addEventListener('keydown', (event) => {
            if (event.key.toLowerCase() === 'f' && event.target.tagName !== 'INPUT') window.toggleFullScreen();
        });
    </script>
</head>

                <div class="p-4 flex justify-between items-center select-none border-b border-slate-100">

                    <div class="flex items-center gap-3">

                        Bảng điều khiển thông số

                    <svg id="control-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-500 transition-transform duration-300 -rotate-90"><polyline points="6 9 12 15 18 9"></polyline></svg>

    <!-- Application Script -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;
        let objectsGroup = new THREE.Group();
        let dynamicMesh = null;
        let currentMode = 1;
        
        // State
        const state = {
            m1: { a: 4, h: 5 },
            m2: { r: 4, h: 6 },
            m3: { r1: 2, r2: 4, h: 5, angle: 360 },
            m4: { a: 6 },
            m5: { r: 2.5 }, // H=8, R=5 (fixed)
            m6: { R: 4, r: 1.5, angle: 360 },
            m7: { dX: 2, dZ: 3 },
            m8: { k1: 0.5, k2: 0.6, k3: 0.7 },
            m9: { t: 0 },
            m10: { a: 1, h: 4, angle: 360 }
        };

        const mathFormula = document.getElementById('math-formula');
        const mathResult = document.getElementById('math-result');
        const controlsContainer = document.getElementById('controls-container');

        // --- DRAWING HELPERS ---
        function createPoint(pos, color=0x1d4ed8, label='', offset=new THREE.Vector3(0.3,0.3,0.3)) {
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), new THREE.MeshPhongMaterial({ color }));
            mesh.position.copy(pos);
            objectsGroup.add(mesh);
            return mesh;
        }

        function drawLine(p1, p2, color=0x1e293b, radius=0.03) {
            const path = new THREE.LineCurve3(p1, p2);
            const mesh = new THREE.Mesh(new THREE.TubeGeometry(path, 1, radius, 8, false), new THREE.MeshPhongMaterial({ color }));
            objectsGroup.add(mesh);
            return mesh;
        }

        function drawDashed(p1, p2, color=0x64748b, radius=0.015) {
            const distance = p1.distanceTo(p2);
            const dashSize = 0.3; const gapSize = 0.2; const step = dashSize + gapSize;
            const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
            for (let d = 0; d < distance; d += step) {
                const start = new THREE.Vector3().copy(p1).addScaledVector(dir, d);
                const currentDash = Math.min(dashSize, distance - d);
                if (currentDash <= 0.001) continue;
                const end = new THREE.Vector3().copy(start).addScaledVector(dir, currentDash);
                const path = new THREE.LineCurve3(start, end);
                const mesh = new THREE.Mesh(new THREE.TubeGeometry(path, 1, radius, 8, false), new THREE.MeshBasicMaterial({ color }));
                objectsGroup.add(mesh);
            }
        }

        function drawSolid(points, color=0x3b82f6, opacity=0.3) {
            const geom = new THREE.BufferGeometry();
            const vertices = [];
            points.forEach(p => vertices.push(p.x, p.y, p.z));
            geom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            const indices = [];
            for(let i=1; i<points.length-1; i++) { indices.push(0, i, i+1); }
            geom.setIndex(indices);
            geom.computeVertexNormals();
            const mat = new THREE.MeshPhongMaterial({ color, transparent: true, opacity, side: THREE.DoubleSide });
            const mesh = new THREE.Mesh(geom, mat);
            objectsGroup.add(mesh);
            return mesh;
        }

        function createParametricSurface(uSteps, vSteps, func, color, opacity=0.8, side=THREE.DoubleSide) {
            const geom = new THREE.BufferGeometry();
            const vertices = [];
            const indices = [];
            for (let j = 0; j <= vSteps; j++) {
                const v = j / vSteps;
                for (let i = 0; i <= uSteps; i++) {
                    const p = func(i / uSteps, v);
                    vertices.push(p.x, p.y, p.z);
                }
            }
            for (let j = 0; j < vSteps; j++) {
                for (let i = 0; i < uSteps; i++) {
                    const a = i + (uSteps + 1) * j;
                    const b = i + (uSteps + 1) * (j + 1);
                    const c = (i + 1) + (uSteps + 1) * (j + 1);
                    const d = (i + 1) + (uSteps + 1) * j;
                    indices.push(a, b, d); indices.push(b, c, d);
                }
            }
            geom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geom.setIndex(indices);
            geom.computeVertexNormals();
            return new THREE.Mesh(geom, new THREE.MeshPhongMaterial({ color, side, transparent: opacity<1, opacity, shininess: 80 }));
        }

        function updateParametricSurface(mesh, uSteps, vSteps, func) {
            const positions = mesh.geometry.attributes.position.array;
            let idx = 0;
            for (let j = 0; j <= vSteps; j++) {
                const v = j / vSteps;
                for (let i = 0; i <= uSteps; i++) {
                    const p = func(i/uSteps, v);
                    positions[idx++] = p.x; positions[idx++] = p.y; positions[idx++] = p.z;
                }
            }
            mesh.geometry.attributes.position.needsUpdate = true;
            mesh.geometry.computeVertexNormals();
        }

        function clearAll() {
            while (objectsGroup.children.length > 0) {
                const child = objectsGroup.children[0];
                if (child.geometry) child.geometry.dispose();
                if (child.material) {
                    if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
                    else child.material.dispose();
                }
                objectsGroup.remove(child);
            }
            dynamicMesh = null;
        }

        // --- INIT ---
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.up.set(0, 0, 1);
            camera.position.set(12, -14, 10);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; controls.dampingFactor = 0.05;
            
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, -20, 20);
            scene.add(dirLight);
            
            const gridHelper = new THREE.GridHelper(20, 20, 0x94a3b8, 0xe2e8f0);
            gridHelper.rotation.x = Math.PI / 2;
            scene.add(gridHelper);

            scene.add(objectsGroup);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            for(let i=1; i<=10; i++) {
                document.getElementById(`btn-mode-${i}`).addEventListener('click', () => switchMode(i));
            }

            switchMode(1);
            animate();
        }

        function updateMath(tex, res) {
            katex.render(tex, mathFormula, { throwOnError: false, displayMode: true });
            const renderedRes = res.replace(/\$(.*?)\$/g, (m, math) => {
                try { return katex.renderToString(math, { throwOnError: false }); } catch(e) { return m; }
            });
            mathResult.innerHTML = renderedRes;
        }

        function buildUI(html) { controlsContainer.innerHTML = html; }

        // --- 1. Ngoại tiếp chóp đều ---
        function renderM1() {
            clearAll();
            const a = state.m1.a, h = state.m1.h;
            const A = new THREE.Vector3(-a/2, -a/2, 0), B = new THREE.Vector3(a/2, -a/2, 0);
            const C = new THREE.Vector3(a/2, a/2, 0), D = new THREE.Vector3(-a/2, a/2, 0), S = new THREE.Vector3(0,0,h);
            const O = new THREE.Vector3(0,0,0);
            
            [A,B,C,D,S,O].forEach(p => createPoint(p, 0x059669));
            drawSolid([A,B,C,D], 0x10b981, 0.2);
            [[A,B],[B,C],[C,D],[D,A],[S,A],[S,B],[S,C],[S,D]].forEach(e => drawLine(e[0], e[1], 0x1e293b, 0.02));
            drawDashed(S, O, 0xdc2626); // Trục
            
            const r_z = ( (a*a/2) + h*h ) / (2*h);
            const R = h - r_z; // Khoảng cách từ đỉnh S(0,0,h) tới tâm I(0,0,r_z) là h - r_z = R
            const I = new THREE.Vector3(0,0,r_z);
            
            createPoint(I, 0xdc2626); // Tâm I
            
            // Vẽ mp trung trực của SA
            const M = new THREE.Vector3().lerpVectors(S,A,0.5); // Trung điểm SA
            drawDashed(I, M, 0xd97706); 
            createPoint(M, 0xd97706);

            const sphere = new THREE.Mesh(new THREE.SphereGeometry(R, 32, 32), new THREE.MeshPhongMaterial({color: 0x3b82f6, transparent:true, opacity: 0.15}));
            sphere.position.copy(I);
            objectsGroup.add(sphere);

            updateMath(`R = \\frac{\\text{cạnh bên}^2}{2 \\cdot h_{chóp}} = \\frac{l^2}{2h}`, 
                `<div>Tâm $I$ là giao điểm của trục đáy và mp trung trực của cạnh bên.</div>
                <div>Bán kính $R = ${(R).toFixed(2)}$. Tâm $I$ cách đáy một khoảng $z_I = ${(r_z).toFixed(2)}$</div>`);
        }

        // --- 2. Nội tiếp Hình nón ---
        function renderM2() {
            clearAll();
            const r = state.m2.r, h = state.m2.h;

            drawDashed(S, new THREE.Vector3(0,0,0), 0xd97706);

            updateMath(`R_{in} = \\frac{r \\cdot h}{r + l}`, 
                `<div>Bản chất là bán kính đường tròn nội tiếp tam giác cân mặt cắt.</div>

                <div>Cạnh khối bát diện $c = \\frac{a\\sqrt{2}}{2} = ${edgeOct.toFixed(2)}$</div>`);
        }

        // --- 5. Cực trị Trụ trong Nón ---
        function renderM5() {

            const cone = new THREE.Mesh(new THREE.ConeGeometry(R, H, 64), new THREE.MeshPhongMaterial({color: 0x10b981, transparent:true, opacity: 0.15}));

                ${isMax ? `<div>Đạt Max khi $r = \\frac{2}{3}R \\approx ${maxR.toFixed(2)}$</div>` : ''}`);

        // --- 6. Hình xuyến ---
        function renderM6() {
            clearAll();
            const R = state.m6.R, r = state.m6.r, angle = state.m6.angle * Math.PI/180;
            
            const torus = new THREE.Mesh(new THREE.TorusGeometry(R, r, 32, 64, angle), new THREE.MeshPhongMaterial({color: 0xf59e0b, transparent:true, opacity:0.8, side: THREE.DoubleSide}));

            const pts = [];
            for(let i=0; i<=32; i++) {

            const S = (2*Math.PI*R) * (2*Math.PI*r);

            updateMath(`V = (\\pi r^2)(2\\pi R) = 2\\pi^2 R r^2`, 
                `<div>Quay một hình tròn bán kính $r=${r}$ quanh trục cách tâm nó đoạn $R=${R}$.</div>
                <div>Thể tích khối xuyến $V = ${V.toFixed(1)}$</div>`);
        }

            clearAll();

            const P1 = new THREE.Vector3(-4, -dZ, dZ); // Outside

            planeZ.position.set(0,0,h/2);
            // Translate plane to contain P1
            // objectsGroup.add(planeZ); // Hard to align exactly without math.

            // Simpler: Aux plane is (S, P1, P2). Cuts base at line L.
            const baseDir = new THREE.Vector3(dir.x, dir.y, 0).normalize();
            const L1 = new THREE.Vector3().copy(P1); L1.z = 0;
            const L2 = new THREE.Vector3().copy(P2); L2.z = 0;
            
            drawDashed(L1, L2, 0x059669); // Giao tuyến với đáy
            drawLine(P1, P2, 0xdc2626, 0.04); // Line d
            
            // Triangle section S-L1-L2
            drawSolid([S, L1, L2], 0xf59e0b, 0.3);
            drawLine(S, L1, 0xd97706, 0.02); drawLine(S, L2, 0xd97706, 0.02);

            updateMath(`d \\subset (\\alpha) \\Rightarrow \\text{Giao điểm } I = d \\cap \\text{Giao tuyến}`,

                <div>Mp phụ cắt các mặt chóp tạo ra các giao tuyến, từ đó cắt $d$ sinh ra giao điểm.</div>`);

        // --- 8. Tỷ số thể tích ---
        function renderM8() {

        // --- 9. Trải phẳng chóp đều ---
        function renderM9() {
            clearAll();
            const a = 4, h = 4, t = state.m9.t;
            const l = Math.sqrt((a/2)**2 + h**2);
            const alpha = Math.atan2(h, a/2); // Góc nhị diện

            const A = new THREE.Vector3(-a/2, -a/2, 0), B = new THREE.Vector3(a/2, -a/2, 0);
            const C = new THREE.Vector3(a/2, a/2, 0), D = new THREE.Vector3(-a/2, a/2, 0);
            drawSolid([A,B,C,D], 0x10b981, 0.8);

            // Hàm tạo mặt bên quay quanh cạnh đáy
            const createFace = (p1, p2, cx, cy, rotZ) => {
                const currentAngle = alpha * (1 - t);
                const s_local = new THREE.Vector3(0, -a/2 - l*Math.cos(currentAngle), l*Math.sin(currentAngle));
                const s_world = s_local.applyAxisAngle(new THREE.Vector3(0,0,1), rotZ);
                
                const geom = new THREE.BufferGeometry().setFromPoints([p1, p2, s_world]);
                geom.setIndex([0,1,2]); geom.computeVertexNormals();
                const mesh = new THREE.Mesh(geom, new THREE.MeshPhongMaterial({color: 0x3b82f6, transparent:true, opacity:0.8, side:THREE.DoubleSide}));
                objectsGroup.add(mesh);
                drawLine(p1, s_world, 0x1e293b, 0.02); drawLine(p2, s_world, 0x1e293b, 0.02);
                return s_world; // Return Apex to draw path
            };

            createFace(A, B, 0, -a/2, 0);
            createFace(B, C, a/2, 0, Math.PI/2);
            createFace(C, D, 0, a/2, Math.PI);
            createFace(D, A, -a/2, 0, -Math.PI/2);

            updateMath(`\\text{Trải phẳng biến quỹ đạo 3D thành 2D}`, 
                `<div>Quá trình trải phẳng gập các mặt bên xuống mp đáy: ${(t*100).toFixed(0)}%.</div>
                <div>Được sử dụng trong bài toán **Con kiến bò** qua các mặt của hình chóp để tìm đường đi ngắn nhất.</div>`);
        }

        // --- 10. Thể tích Oy ---
        function getM10Func(u, v) {
            const a = state.m10.a, h = state.m10.h, angleMax = state.m10.angle * Math.PI/180;
            // Quay y = a*x^2 quanh Oy => x = sqrt(y/a). y chạy từ 0 đến h (u thuộc 0..1 => y = u*h)
            const y = u * h;
            const x = Math.sqrt(y / a);
            const theta = v * angleMax;
            return new THREE.Vector3(x * Math.cos(theta), x * Math.sin(theta), y);
        }
        function renderM10() {
            if(!dynamicMesh) {
                clearAll(); 
                drawLine(new THREE.Vector3(0,0,-2), new THREE.Vector3(0,0,state.m10.h + 2), 0x1d4ed8, 0.05); // Trục Z (Oy)
                dynamicMesh = createParametricSurface(30, 60, getM10Func, 0xec4899, 0.7);
                objectsGroup.add(dynamicMesh);
            } else { updateParametricSurface(dynamicMesh, 30, 60, getM10Func); }

            const a = state.m10.a, h = state.m10.h;
            const vol = Math.PI * h * h / (2 * a);
            
            // Vẽ đường curve
            const geom = new THREE.BufferGeometry();
            const pts = [];
            for(let i=0; i<=30; i++) {
                const y = (i/30)*h;

            objectsGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({color: 0x831843, linewidth: 4})));

            updateMath(`V_{Oy} = \\pi \\int_0^h x^2 dy = \\pi \\int_0^h \\frac{y}{a} dy`, 
                `<div>Quay đường cong $y = ${a}x^2 \\Rightarrow x^2 = y / ${a}$ quanh trục dọc.</div>
                <div class="mt-2 text-rose-600 font-bold">Thể tích $V = ${vol.toFixed(2)}$</div>`);
        }

                <label class="text-xs font-bold w-1/3">Đáy lớn r2: <span class="text-blue-600">${state.m3.r2}</span><input type="range" min="2" max="6" step="0.5" value="${state.m3.r2}" oninput="state.m3.r2=parseFloat(this.value); renderM3(); this.previousElementSibling.innerText=this.value"></label>
                <label class="text-xs font-bold w-1/3">Góc xoay: <span class="text-blue-600">${state.m3.angle}°</span><input type="range" min="10" max="360" step="1" value="${state.m3.angle}" oninput="state.m3.angle=parseFloat(this.value); renderM3(); this.previousElementSibling.innerText=this.value+'°'"></label>
            </div>`);
            else if(mode === 4) buildUI(`<label class="text-xs font-bold">Cạnh lập phương a: <span class="text-blue-600">${state.m4.a}</span><input type="range" min="2" max="8" step="0.5" value="${state.m4.a}" oninput="state.m4.a=parseFloat(this.value); renderM4(); this.previousElementSibling.innerText=this.value"></label>`);
            else if(mode === 5) buildUI(`<label class="text-xs font-bold">Kéo biến thiên bán kính Trụ r: <span class="text-blue-600">${state.m5.r}</span><input type="range" min="0" max="5" step="0.1" value="${state.m5.r}" oninput="state.m5.r=parseFloat(this.value); renderM5(); this.previousElementSibling.innerText=this.value"></label>`);
            else if(mode === 6) buildUI(`<div class="flex gap-4">
                <label class="text-xs font-bold w-1/3">Bán kính xoay R: <span class="text-blue-600">${state.m6.R}</span><input type="range" min="2" max="6" step="0.5" value="${state.m6.R}" oninput="state.m6.R=parseFloat(this.value); renderM6(); this.previousElementSibling.innerText=this.value"></label>
                <label class="text-xs font-bold w-1/3">Bán kính ống r: <span class="text-blue-600">${state.m6.r}</span><input type="range" min="0.5" max="3" step="0.1" value="${state.m6.r}" oninput="state.m6.r=parseFloat(this.value); renderM6(); this.previousElementSibling.innerText=this.value"></label>
                <label class="text-xs font-bold w-1/3">Góc xoay: <span class="text-blue-600">${state.m6.angle}°</span><input type="range" min="10" max="360" step="1" value="${state.m6.angle}" oninput="state.m6.angle=parseFloat(this.value); renderM6(); this.previousElementSibling.innerText=this.value+'°'"></label>
            </div>`);
            else if(mode === 7) buildUI(`<div class="flex gap-4">
                <label class="text-xs font-bold w-1/2">Vị trí điểm M: <span class="text-blue-600">${state.m7.dX}</span><input type="range" min="-3" max="3" step="0.5" value="${state.m7.dX}" oninput="state.m7.dX=parseFloat(this.value); renderM7(); this.previousElementSibling.innerText=this.value"></label>
                <label class="text-xs font-bold w-1/2">Độ cao điểm N: <span class="text-blue-600">${state.m7.dZ}</span><input type="range" min="1" max="6" step="0.5" value="${state.m7.dZ}" oninput="state.m7.dZ=parseFloat(this.value); renderM7(); this.previousElementSibling.innerText=this.value"></label>
            </div>`);
            else if(mode === 8) buildUI(`<div class="flex gap-4">
                <label class="text-xs font-bold w-1/3">k1 (trên SA): <span class="text-blue-600">${state.m8.k1}</span><input type="range" min="0.1" max="1" step="0.1" value="${state.m8.k1}" oninput="state.m8.k1=parseFloat(this.value); renderM8(); this.previousElementSibling.innerText=this.value"></label>
                <label class="text-xs font-bold w-1/3">k2 (trên SB): <span class="text-blue-600">${state.m8.k2}</span><input type="range" min="0.1" max="1" step="0.1" value="${state.m8.k2}" oninput="state.m8.k2=parseFloat(this.value); renderM8(); this.previousElementSibling.innerText=this.value"></label>
                <label class="text-xs font-bold w-1/3">k3 (trên SC): <span class="text-blue-600">${state.m8.k3}</span><input type="range" min="0.1" max="1" step="0.1" value="${state.m8.k3}" oninput="state.m8.k3=parseFloat(this.value); renderM8(); this.previousElementSibling.innerText=this.value"></label>
            </div>`);
            else if(mode === 9) buildUI(`<label class="text-xs font-bold">Kéo để Trải phẳng chóp: <span class="text-blue-600">0%</span><input type="range" min="0" max="1" step="0.01" value="${state.m9.t}" oninput="state.m9.t=parseFloat(this.value); renderM9(); this.previousElementSibling.innerText=Math.round(this.value*100)+'%'"></label>`);
            else if(mode === 10) buildUI(`<div class="flex gap-4">
                <label class="text-xs font-bold w-1/2">Hệ số a (y = ax²): <span class="text-blue-600">${state.m10.a}</span><input type="range" min="0.1" max="2" step="0.1" value="${state.m10.a}" oninput="state.m10.a=parseFloat(this.value); renderM10(); this.previousElementSibling.innerText=this.value"></label>
                <label class="text-xs font-bold w-1/2">Góc xoay: <span class="text-blue-600">${state.m10.angle}°</span><input type="range" min="10" max="360" step="1" value="${state.m10.angle}" oninput="state.m10.angle=parseFloat(this.value); renderM10(); this.previousElementSibling.innerText=this.value+'°'"></label>
            </div>`);

            clearAll(); 
            window[`renderM${mode}`]();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.state = state;
        window.renderM1 = renderM1; window.renderM2 = renderM2; window.renderM3 = renderM3;
        window.renderM4 = renderM4; window.renderM5 = renderM5; window.renderM6 = renderM6;
        window.renderM7 = renderM7; window.renderM8 = renderM8; window.renderM9 = renderM9;
        window.renderM10 = renderM10;

        window.onload = init;
    </script>
</body>
</html>

<!DOCTYPE html>

<head>

            "imports": {

    <style>
        body { margin: 0; overflow: hidden; background-color: #f1f5f9; color: #1e293b; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .pointer-events-auto { pointer-events: auto; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.05); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.2); border-radius: 4px; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%; background: #2563eb; cursor: pointer; margin-top: -7px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #cbd5e1; border-radius: 2px; }
        
        /* Chế độ hiển thị toàn màn hình, chữ lớn, nền trắng 100% không mờ */
        .expanded-panel {
            position: fixed !important; top: 50% !important; left: 50% !important; transform: translate(-50%, -50%) !important;
            width: 98vw !important; max-width: 100% !important; height: 96vh !important; max-height: 100vh !important;
            z-index: 100 !important; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25) !important;
            background: #ffffff !important; 
            backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
            display: flex !important; flex-direction: column !important;
        }
        .expanded-panel #info-content { 
            padding: 3rem !important; gap: 2rem !important; 
            overflow-y: auto !important; 
        }
        .expanded-panel #math-formula { font-size: 40px !important; padding: 2rem !important; min-height: 150px !important; overflow-x: auto !important; }
        .expanded-panel #math-result, .expanded-panel #math-result * { font-size: 32px !important; line-height: 1.6 !important; }
        .expanded-panel #math-result { padding: 2rem !important; }
        .expanded-panel h3 { font-size: 36px !important; }
        .expanded-panel h3 svg { width: 36px !important; height: 36px !important; }
        
        .minimized-panel {
            background: transparent !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
            border: none !important; box-shadow: none !important; pointer-events: none;
        }
        .minimized-panel .panel-header { background: transparent !important; border-bottom: none !important; pointer-events: auto; }
        .minimized-panel .panel-title { opacity: 0; pointer-events: none; }
        .minimized-panel #control-footer-hint { display: none !important; }
        .minimized-panel label { text-shadow: 0 0 6px rgba(255,255,255,0.9), 0 0 2px rgba(255,255,255,1) !important; }
        
        .minimized-panel #controls-container { opacity: 0.35; transition: opacity 0.3s ease; pointer-events: auto; }
        .minimized-panel #controls-container:hover { opacity: 1; }
        .minimized-panel input[type=range]::-webkit-slider-runnable-track { background: rgba(203, 213, 225, 0.5) !important; }
        .minimized-panel input[type=range]::-webkit-slider-thumb { background: rgba(37, 99, 235, 0.6) !important; box-shadow: none !important; }
    </style>

    <script>
        window.togglePanel = function(contentId, iconId) {
            const content = document.getElementById(contentId);
            const icon = document.getElementById(iconId);
            content.classList.toggle('hidden');
            icon.classList.toggle('-rotate-90');
        };

        window.toggleExpand = function() {
            const panel = document.getElementById('info-panel');
            const overlay = document.getElementById('expand-overlay');
            const content = document.getElementById('info-content');
            const icon = document.getElementById('info-icon');
            
            if (panel.classList.contains('expanded-panel')) {
                panel.classList.remove('expanded-panel');
                overlay.classList.add('hidden');
                content.classList.add('hidden');
                icon.classList.add('-rotate-90');
            } else {
                panel.classList.add('expanded-panel');
                overlay.classList.remove('hidden');
                content.classList.remove('hidden');
                icon.classList.remove('-rotate-90');
            }
        };

        window.toggleControlPanel = function() {
            const panel = document.getElementById('bottom-panel');
            const icon = document.getElementById('control-icon');
            panel.classList.toggle('minimized-panel');
            icon.classList.toggle('-rotate-90');
        };

        window.toggleFullScreen = function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.warn(err));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        };

        document.addEventListener('keydown', (event) => {
            if (event.key.toLowerCase() === 'f' && event.target.tagName !== 'INPUT') window.toggleFullScreen();
        });
    </script>
</head>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;
        let objectsGroup = new THREE.Group();
        let currentMode = 1;
        
        // Trạng thái các biến của 8 phần bài học
        const state = {
            m1: { angle: 30 },               // Vị trí: Cắt/Nằm trong
            m2: { h: 3 },                    // Vị trí: Song song
            m3: { d_pos: -3 },               // Định lý 1
            m4: { q_angle: 45 },             // Định lý 2
            m5: { step: 0 },                 // Ví dụ 1 (CMR Song song)
            m6: { step: 0 },                 // Ví dụ 2 (Tìm giao tuyến)
            m7: { step: 0 },                 // Ví dụ 3 (Tìm thiết diện - Step by step)
            m8: { t: -8 }                    // Ứng dụng thực tế (Flycam)
        };

        const problems = [
            "Trong không gian 3 chiều rộng lớn, một đường thẳng và một mặt phẳng có thể có bao nhiêu điểm chung? Hãy thử cầm một cây bút và đâm xuyên qua một tờ giấy, bạn sẽ tìm ra câu trả lời!",
            "Nếu ta nhấc cây bút lên cao, giữ cho nó hoàn toàn thăng bằng và không bao giờ chạm vào tờ giấy trải trên mặt bàn. Trường hợp đặc biệt này được gọi là gì trong toán học?",
            "Làm sao để biết chắc chắn một thanh xà gồ trên mái nhà đã được lắp <span class='text-red-700 font-bold'>song song</span> với mặt sàn mà không cần phải kéo dài vô tận để kiểm tra? Chỉ cần dùng một đường thẳng 'mồi'!",
            "Nếu một mặt phẳng chứa đường thẳng $d$ (đã song song với mặt đất), và nó vô tình cắt ngang mặt đất. Vậy đường ranh giới giao cắt đó có hình thù như thế nào và có liên quan gì đến $d$ không?",
            "Làm sao để vận dụng Định lý 1 vào bài tập thực tế? Đây là dạng toán kinh điển nhất: Chứng minh một đường thẳng lơ lửng lại <span class='text-red-700 font-bold'>song song</span> với một mặt phẳng cho trước bằng cách mượn 'đường trung bình'.",
            "Mở rộng bài toán tìm giao tuyến: Chuyện gì sẽ xảy ra nếu ta cần tìm giao tuyến của 2 mặt phẳng, nhưng xui xẻo thay, chúng lại chứa 2 đường thẳng <span class='text-red-700 font-bold'>song song</span> với nhau và không bao giờ cắt nhau?",
            "Bài toán lấy điểm 9, 10: Cho mặt phẳng $(\\alpha)$ song song với 2 cạnh của tứ diện. Khi đó $(\\alpha)$ sẽ chém tứ diện thành một <span class='text-red-700 font-bold'>Thiết diện</span>. Hãy quan sát hình thù của thiết diện này thay đổi ra sao!",
            "Để quay được những thước phim ổn định từ trên cao, Flycam cần duy trì một độ cao không đổi so với cánh đồng phẳng bên dưới. Làm thế nào để thiết lập quỹ đạo bay <span class='text-red-700 font-bold'>song song với mặt đất</span> cho chiếc Flycam này?"
        ];

        const mathFormula = document.getElementById('math-formula');
        const mathResult = document.getElementById('math-result');
        const controlsContainer = document.getElementById('controls-container');

        // --- HÀM VẼ CƠ BẢN ---
        function createTextSprite(text, color, scale=1.0) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 128;
            const context = canvas.getContext('2d');
            context.font = 'Bold 42px "Segoe UI", Arial';
            context.fillStyle = color; context.textAlign = 'center'; context.textBaseline = 'middle';
            context.lineWidth = 6; context.strokeStyle = 'white';
            context.strokeText(text, 128, 64); context.fillText(text, 128, 64);
            const texture = new THREE.CanvasTexture(canvas);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false }));
            sprite.scale.set(scale*2, scale, scale); return sprite;
        }

        function createPoint(pos, color=0xdc2626, size=0.15, label='', offset=new THREE.Vector3(0, 0.4, 0)) {
            if (typeof size === 'string') { label = size; size = 0.15; }
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(size, 16, 16), new THREE.MeshPhongMaterial({ color }));
            mesh.position.copy(pos); objectsGroup.add(mesh);
            if (label) {
                const sprite = createTextSprite(label, '#' + color.toString(16).padStart(6, '0'), 0.8);
                sprite.position.copy(pos).add(offset); objectsGroup.add(sprite);
            }
            return mesh;
        }

        function drawLine(p1, p2, color=0x1e293b, width=2) {
            const radius = width * 0.01; 
            const dist = p1.distanceTo(p2);
            if(dist < 0.001) return null;
            
            const curve = new THREE.LineCurve3(p1, p2);

            // Nét liền (hiển thị khi nằm phía trước mặt phẳng)
            const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 1, radius, 8, false), new THREE.MeshPhongMaterial({ color }));
            objectsGroup.add(mesh); 
            
            // Nét đứt tự động (Chỉ hiển thị khi bị che khuất ở phía sau)
            const dashSize = 0.3; const gapSize = 0.2; const step = dashSize + gapSize;
            const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
            for (let d = 0; d < dist; d += step) {
                const start = new THREE.Vector3().copy(p1).addScaledVector(dir, d);
                const currentDash = Math.min(dashSize, dist - d);
                if (currentDash <= 0.001) continue;
                const end = new THREE.Vector3().copy(start).addScaledVector(dir, currentDash);
                
                const dashMat = new THREE.MeshBasicMaterial({ 
                    color, 
                    depthFunc: THREE.GreaterDepth, // Yêu cầu chỉ render nếu nằm SAU mặt phẳng
                    depthWrite: false, 
                    transparent: true, 
                    opacity: 0.4 
                });
                objectsGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(start, end), 1, radius, 8, false), dashMat));
            }
            return mesh;
        }

        function drawDashed(p1, p2, color=0x94a3b8, width=1.5) {
            const radius = width * 0.01; 
            const dist = p1.distanceTo(p2);
            if(dist < 0.001) return null; 
            
            const dashSize = 0.3; const gapSize = 0.2; const step = dashSize + gapSize;
            const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
            for (let d = 0; d < dist; d += step) {
                const start = new THREE.Vector3().copy(p1).addScaledVector(dir, d);
                const currentDash = Math.min(dashSize, dist - d);
                if (currentDash <= 0.001) continue;
                const end = new THREE.Vector3().copy(start).addScaledVector(dir, currentDash);
                // Các đường gióng phụ, đường quỹ đạo sẽ luôn hiển thị xuyên thấu (depthTest: false)
                objectsGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(start, end), 1, radius, 8, false), new THREE.MeshBasicMaterial({ color, depthTest: false, transparent: true, opacity: 0.6 })));
            }
        }

        function drawThickVector(p1, p2, color=0x94a3b8, radius=0.02) {
            const group = new THREE.Group();
            const dist = p1.distanceTo(p2);
            if(dist < 0.001) return group;
            const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
            const headLength = radius * 6; const headRadius = radius * 2.5;
            const shaftLength = Math.max(0, dist - headLength);
            if(shaftLength > 0) {
                const mesh = new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(p1, new THREE.Vector3().copy(p1).addScaledVector(dir, shaftLength)), 1, radius, 8, false), new THREE.MeshPhongMaterial({ color }));
                group.add(mesh);
            }
            const headGeom = new THREE.ConeGeometry(headRadius, headLength, 16);
            headGeom.translate(0, headLength/2, 0); 
            const headMesh = new THREE.Mesh(headGeom, new THREE.MeshPhongMaterial({ color }));
            headMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
            headMesh.position.copy(p1).addScaledVector(dir, shaftLength);
            group.add(headMesh);
            objectsGroup.add(group); return group;
        }

        function drawStandardAxes(xLen = 10, yLen = 10, zLen = 10) {
            drawThickVector(new THREE.Vector3(0,0,0), new THREE.Vector3(xLen,0,0), 0xdc2626, 0.03);
            createTextSprite('x', '#dc2626', 0.8).position.set(xLen+0.5, 0, 0);
            
            drawThickVector(new THREE.Vector3(0,0,0), new THREE.Vector3(0,yLen,0), 0x059669, 0.03);
            createTextSprite('y', '#059669', 0.8).position.set(0, yLen+0.5, 0);
            
            drawThickVector(new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,zLen), 0x2563eb, 0.03);
            createTextSprite('z', '#2563eb', 0.8).position.set(0, 0, zLen+0.5);
            
            createPoint(new THREE.Vector3(0,0,0), 0x1e293b, 0.1, 'O', new THREE.Vector3(-0.6, -0.6, 0));
        }

        function createFace(points, color, opacity=0.5) {
            const geom = new THREE.BufferGeometry().setFromPoints(points);
            const indices = [];
            for (let i = 1; i < points.length - 1; i++) {
                indices.push(0, i, i + 1);
            }
            geom.setIndex(indices);
            geom.computeVertexNormals();
            
            // Mặt chắn tàng hình: Đẩy lùi hệ số Z một chút (PolygonOffset) để không gây xung đột với viền
            const occluderMat = new THREE.MeshBasicMaterial({
                colorWrite: false, 
                depthWrite: true, 
                side: THREE.DoubleSide,
                polygonOffset: true,
                polygonOffsetFactor: 1,
                polygonOffsetUnits: 1
            });
            const occluder = new THREE.Mesh(geom, occluderMat);
            occluder.renderOrder = -1; // Ưu tiên vẽ trước
            objectsGroup.add(occluder);

            // Mặt màu trong suốt hiển thị bình thường
            const mesh = new THREE.Mesh(geom, new THREE.MeshPhongMaterial({color, side:THREE.DoubleSide, transparent:true, opacity, depthWrite: false}));
            objectsGroup.add(mesh);
            return mesh;
        }

        function clearAll() {
            while (objectsGroup.children.length > 0) {
                const child = objectsGroup.children[0];
                if (child.geometry) child.geometry.dispose();
                if (child.material) { if (Array.isArray(child.material)) child.material.forEach(m => m.dispose()); else child.material.dispose(); }
                objectsGroup.remove(child);
            }
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf8fafc); 
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(12, 10, 18);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI/2 + 0.1; 
            
            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(10, 20, 15); scene.add(dirLight);
            
            scene.add(objectsGroup);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            for(let i=1; i<=8; i++) document.getElementById(`btn-mode-${i}`).addEventListener('click', () => switchMode(i));
            switchMode(1);
            animate();
        }

        function updateMath(tex, res) {
            katex.render(tex, mathFormula, { throwOnError: false, displayMode: true });
            mathResult.innerHTML = res.replace(/\$(.*?)\$/g, (m, math) => {
                try { return katex.renderToString(math, { throwOnError: false }); } catch(e) { return m; }
            });
        }
        function buildUI(html) { controlsContainer.innerHTML = html; }

        // Vẽ Mặt phẳng chuẩn (P) ngang
        function drawBasePlane(w = 12, h = 12, y = 0, color = 0x38bdf8) {
            const P_A = new THREE.Vector3(-w/2, y, h/2);
            const P_B = new THREE.Vector3(w/2, y, h/2);
            const P_C = new THREE.Vector3(w/2, y, -h/2);
            const P_D = new THREE.Vector3(-w/2, y, -h/2);
            createFace([P_A, P_B, P_C, P_D], color, 0.3);
            
            drawLine(P_A, P_B, color, 1); drawLine(P_B, P_C, color, 1); 
            drawLine(P_C, P_D, color, 1); drawLine(P_D, P_A, color, 1);
            createTextSprite('(P)', '#' + color.toString(16).padStart(6, '0'), 1).position.set(w/2 - 1, y + 0.2, h/2 - 1);
        }

        // --- M1: Vị trí Cắt nhau & Nằm trong ---
        function renderM1() {
            camera.position.set(10, 8, 15); controls.target.set(0, 0, 0);
            clearAll(); drawStandardAxes(8,8,8);

            const p_top = new THREE.Vector3().copy(M).addScaledVector(dirD, 7);
            const p_bot = new THREE.Vector3().copy(M).addScaledVector(dirD, -7);

            if (angle === 0) {
                drawLine(p_bot, p_top, 0xdc2626, 5); 
                createTextSprite('d', '#dc2626', 1).position.copy(p_top).add(new THREE.Vector3(0, 0.5, 0));
                createPoint(M, 0x1e293b, 0.2, 'M', new THREE.Vector3(0, -0.6, 0));
                createPoint(new THREE.Vector3(4,0,0), 0x1e293b, 0.2, 'N', new THREE.Vector3(0, -0.6, 0));
            } else {
                drawLine(M, p_top, 0xdc2626, 5); 
                drawDashed(M, p_bot, 0xdc2626, 5); 
                createTextSprite('d', '#dc2626', 1).position.copy(p_top).add(new THREE.Vector3(0, 0.5, 0));
                createPoint(M, 0x1e293b, 0.2, 'M (Giao điểm)', new THREE.Vector3(0, -0.6, 0));
            }

            const isInside = angle === 0;

            updateMath(isInside ? `d \\subset (P)` : `d \\cap (P) = \\{M\\}`, 
                `<div class="mb-1 font-bold text-amber-700">Vị trí tương đối có Điểm chung:</div>
                <div class="mb-2">Một đường thẳng $d$ và một mặt phẳng $(P)$ có thể có 1 điểm chung duy nhất (Cắt nhau) hoặc có vô số điểm chung (Đường thẳng nằm trọn trong mặt phẳng).</div>
                <div class="p-3 rounded ${isInside ? 'bg-indigo-50 border-indigo-200' : 'bg-rose-50 border-rose-200'} border">
                    <span class="font-bold ${isInside ? 'text-indigo-600' : 'text-rose-700'}">${isInside ? '✅ Đã hạ gục! Đường thẳng d đang <span class="text-red-700 font-bold">NẰM TRONG</span> mặt phẳng (P).' : '⚠️ Đường thẳng d đang <span class="text-red-700 font-bold">CẮT XUYÊN QUA</span> mặt phẳng tại 1 điểm duy nhất M.'}</span>
                </div>`);
        }

        // --- M2: Vị trí Song song ---
        function renderM2() {
            camera.position.set(10, 6, 16); controls.target.set(0, 3, 0);
            clearAll(); drawStandardAxes(8,8,8);
            drawBasePlane(14, 14, 0, 0x3b82f6);
            
            const h = state.m2.h;

            const p2 = new THREE.Vector3(7, h, 2);

                createPoint(new THREE.Vector3(0, 0, 2), 0x1e293b, 0.15, 'H', new THREE.Vector3(0.5, 0, 0));
                createPoint(new THREE.Vector3(0, h, 2), 0x1e293b, 0.15, 'K', new THREE.Vector3(0.5, 0.5, 0));
            }

            updateMath(isParallel ? `d \\parallel (P) \\Leftrightarrow d \\cap (P) = \\emptyset` : `d \\subset (P)`, 
                `<div class="mb-1 font-bold text-blue-700">Vị trí tương đối: Song song</div>
                <div class="mb-2">Khi đường thẳng $d$ và mặt phẳng $(P)$ <span class="text-red-700 font-bold">hoàn toàn không có điểm chung nào</span>, dù kéo dài đến vô tận, ta nói đường thẳng $d$ song song với mặt phẳng $(P)$.</div>
                <div class="p-3 rounded ${isParallel ? 'bg-emerald-50 border-emerald-200' : 'bg-slate-50 border-slate-200'} border">
                    <span class="font-bold ${isParallel ? 'text-emerald-700' : 'text-slate-600'}">${isParallel ? `✅ Đường thẳng d cách mặt phẳng một khoảng $h = ${h}m$ không đổi $\\Rightarrow$ <span class="text-red-700 font-bold">SONG SONG</span>` : '⚠️ Chạm đất! Đường thẳng d quay về vị trí Nằm trong (P).'}</span>
                </div>`);
        }

        // --- M3: Định lý 1 (Dấu hiệu Nhận biết) ---
        function renderM3() {
            camera.position.set(10, 8, 15); controls.target.set(0, 2, 0);
            clearAll(); drawStandardAxes(8,8,8);
            drawBasePlane(14, 14, 0, 0x3b82f6);
            
            const dp1 = new THREE.Vector3(-6, 0, -4);
            const dp2 = new THREE.Vector3(6, 0, 4);
            drawLine(dp1, dp2, 0x059669, 5); 
            createTextSprite("d'", '#059669', 1).position.copy(dp2).add(new THREE.Vector3(0.5, 0, 0));

            const offset = state.m3.d_pos; 
            const H = 5; 
            const d1 = new THREE.Vector3(-6 + offset, H, -4);
            const d2 = new THREE.Vector3(6 + offset, H, 4);
            drawLine(d1, d2, 0xdc2626, 5); 
            createTextSprite("d", '#dc2626', 1).position.copy(d2).add(new THREE.Vector3(0.5, 0.5, 0));

            createFace([d1, d2, dp2, dp1], 0xfcd34d, 0.2);

                <div class="mb-2">Nếu đường thẳng $d$ không nằm trong $(P)$ và nó <span class="text-red-700 font-bold">song song với MỘT đường thẳng $d'$</span> bất kỳ nằm trong $(P)$ thì ta kết luận luôn $d \\parallel (P)$.</div>
                <div class="p-3 rounded ${isAligned ? 'bg-emerald-50 border-emerald-200' : 'bg-amber-50 border-amber-200'} border">
                    <span class="font-bold ${isAligned ? 'text-emerald-700' : 'text-amber-700'}">${isAligned ? '✨ Hoàn hảo! $d$ đã nằm thẳng tắp song song phía trên $d\'$. Suy ra $d \\parallel (P)$.' : 'Hãy di chuyển đường thẳng $d$ (đỏ) chiếu thẳng góc xuống $d\'$ (xanh)!'}</span>
                </div>`);
        }

        // --- M4: Định lý 2 (Tính chất Giao tuyến) ---
        function renderM4() {
            camera.position.set(12, 10, 16); controls.target.set(0, 0, 0);
            clearAll(); drawStandardAxes(8,8,8);
            drawBasePlane(16, 16, 0, 0x3b82f6); 
            
            const H = 4; 
            const d1 = new THREE.Vector3(-8, H, 0);
            const d2 = new THREE.Vector3(8, H, 0);
            drawLine(d1, d2, 0xdc2626, 5); 
            createTextSprite("d", '#dc2626', 1).position.copy(d2).add(new THREE.Vector3(0.5, 0.5, 0));

            const alpha = state.m4.q_angle * Math.PI/180;
            const w = H / Math.tan(alpha);
            
            const dt1 = new THREE.Vector3(-8, 0, w);
            const dt2 = new THREE.Vector3(8, 0, w);
            drawLine(dt1, dt2, 0x8b5cf6, 5); 
            createTextSprite("Δ", '#8b5cf6', 1.2).position.copy(dt2).add(new THREE.Vector3(0.5, 0.5, 0));

            createFace([d1, d2, dt2, dt1], 0xf59e0b, 0.5); 
            createTextSprite('(Q)', '#d97706', 1).position.copy(d2).lerp(dt2, 0.5).add(new THREE.Vector3(1, 0.5, 0));

            updateMath(`\\begin{cases} d \\parallel (P) \\\\ d \\subset (Q) \\\\ (P) \\cap (Q) = \\Delta \\end{cases} \\Rightarrow \\Delta \\parallel d`, 
                `<div class="mb-1 font-bold text-purple-700">Định lý 2: Tính chất Giao tuyến</div>
                <div class="mb-2">Cho đường thẳng $d \\parallel (P)$. Nếu một mặt phẳng $(Q)$ bất kỳ <span class="text-red-700 font-bold">chứa $d$</span> và cắt ngang mặt phẳng $(P)$ tạo ra giao tuyến $\\Delta$, thì $\\Delta$ chắc chắn phải song song với $d$.</div>
                <div class="p-3 rounded bg-purple-50 border border-purple-200">
                    <span class="font-bold text-purple-800">👉 Xoay mặt phẳng (Q):</span> Dù (Q) có nghiêng ngả cỡ nào, đường ranh giới giao cắt $\\Delta$ (tím) trượt trên sàn nhà vẫn luôn <span class="text-red-700 font-bold">song song một cách hoàn hảo</span> với thanh xà gồ $d$ (đỏ)!
                </div>`);
        }

        // --- M5: VÍ DỤ 1 (Chứng minh Đường song song Mặt) ---
        function renderM5() {
            camera.position.set(10, 8, 16); controls.target.set(0, 2, 0);
            clearAll(); 
            
            const step = state.m5.step;
            
            // Tứ diện ABCD
            const A = new THREE.Vector3(0, 8, 0);
            const B = new THREE.Vector3(-4, 0, 4);
            const C = new THREE.Vector3(5, 0, 4);
            const D = new THREE.Vector3(1, 0, -4);
            
            // M, N là trung điểm AB, AC
            const M = new THREE.Vector3().lerpVectors(A, B, 0.5);
            const N = new THREE.Vector3().lerpVectors(A, C, 0.5);

            createPoint(A, 0x1e293b, 'A', new THREE.Vector3(0, 0.6, 0));
            createPoint(B, 0x1e293b, 'B', new THREE.Vector3(-0.6, -0.4, 0));
            createPoint(C, 0x1e293b, 'C', new THREE.Vector3(0.6, -0.4, 0));
            createPoint(D, 0x1e293b, 'D');

            // Vẽ Tứ diện (Áp dụng drawLine cho mọi cạnh, hệ thống sẽ tự lo phần khuất)
            drawLine(A, B, 0x1e293b, 2); drawLine(A, C, 0x1e293b, 2); drawLine(A, D, 0x1e293b, 2);
            drawLine(B, C, 0x1e293b, 2); drawLine(B, D, 0x1e293b, 2); drawLine(C, D, 0x1e293b, 2);
            
            let res = "<strong>Bài toán:</strong> Cho tứ diện $ABCD$. Gọi $M, N$ lần lượt là trung điểm của $AB, AC$. Chứng minh $MN \\parallel (BCD)$.<br><br>";

            if (step >= 1) {
                createPoint(M, 0x059669, 'M', new THREE.Vector3(-0.6, 0.4, 0));
                createPoint(N, 0x059669, 'N', new THREE.Vector3(0.6, 0.4, 0));
                drawLine(M, N, 0xdc2626, 5); // Đỏ
                drawLine(B, C, 0x059669, 5); // Xanh
                res += "- Bước 1: Xét $\\Delta ABC$, $MN$ là đường trung bình $\\Rightarrow \\mathbf{MN \\parallel BC}$.<br>";
            }
            if (step >= 2) {
                createFace([B, C, D], 0x3b82f6, 0.4); // Highlight mặt đáy (BCD)
                res += "- Bước 2: Ta lại có cạnh $BC$ nằm trọn trong mặt phẳng đáy $\\Rightarrow \\mathbf{BC \\subset (BCD)}$.<br>";
            }
            if (step >= 3) {
                createFace([A, M, N], 0xf59e0b, 0.3); // Highlight AMN
                res += "<br><span class='text-emerald-700 font-bold'>Kết luận: Áp dụng Định lý 1 $\\Rightarrow MN \\parallel (BCD)$.</span>";
            }

            updateMath(`MN \\parallel BC \\subset (BCD) \\Rightarrow MN \\parallel (BCD)`, 
                `<div class="mb-1 font-bold text-teal-700">Ví dụ 1: Chứng minh Đường song song Mặt</div>
                <div class="text-slate-800 leading-relaxed text-base">${res}</div>`);
        }

        // --- M6: VÍ DỤ 2 (Tìm giao tuyến chứa 2 đường song song) ---
        function renderM6() {
            camera.position.set(12, 10, 18); controls.target.set(0, 2, 0);
            clearAll(); drawStandardAxes(10, 10, 10);
            
            const step = state.m6.step;
            
            // Hình chóp S.ABCD đáy hình bình hành
            const A = new THREE.Vector3(-4, 0, 4);
            const B = new THREE.Vector3(4, 0, 4);
            const C = new THREE.Vector3(6, 0, -4);
            const D = new THREE.Vector3(-2, 0, -4);
            const S = new THREE.Vector3(0, 8, 0);

            createPoint(S, 0x1e293b, 'S', new THREE.Vector3(0, 0.6, 0));
            createPoint(A, 0x1e293b, 'A'); createPoint(B, 0x1e293b, 'B');
            createPoint(C, 0x1e293b, 'C'); createPoint(D, 0x1e293b, 'D');

            // Vẽ Chóp (Bỏ drawDashed tĩnh, dùng drawLine động)
            createFace([A, B, C, D], 0x94a3b8, 0.3); // Đáy
            drawLine(S, A, 0x1e293b, 2); drawLine(S, B, 0x1e293b, 2); drawLine(S, C, 0x1e293b, 2); drawLine(S, D, 0x1e293b, 2);
            drawLine(A, B, 0x1e293b, 2); drawLine(B, C, 0x1e293b, 2); drawLine(C, D, 0x1e293b, 2); drawLine(A, D, 0x1e293b, 2);

            let res = "<strong>Bài toán:</strong> Cho hình chóp $S.ABCD$ có đáy là hình bình hành. Tìm giao tuyến của $(SAB)$ và $(SCD)$.<br><br>";

            if (step >= 1) {
                createFace([S, A, B], 0x3b82f6, 0.4); // Mp SAB xanh
                createFace([S, C, D], 0xf59e0b, 0.4); // Mp SCD vàng
                createPoint(S, 0xdc2626, 0.3); // Highlight S
                res += "- Bước 1: Dễ thấy $S \\in (SAB)$ và $S \\in (SCD) \\Rightarrow$ <span class='text-red-700 font-bold'>$S$ là điểm chung.</span><br>";
            }
            if (step >= 2) {
                drawLine(A, B, 0x059669, 5); // Đậm cạnh AB xanh lá
                drawLine(C, D, 0x059669, 5); // Đậm cạnh CD xanh lá
                res += "- Bước 2: Mặt phẳng $(SAB)$ chứa $AB$, mặt $(SCD)$ chứa $CD$. Vì $ABCD$ là hình bình hành nên $\\mathbf{AB \\parallel CD}$.<br>";
                res += "Hai mặt phẳng chứa 2 đường thẳng song song thì giao tuyến của chúng <span class='text-red-700 font-bold'>cũng phải song song</span> với 2 đường thẳng đó.<br>";
            }
            if (step >= 3) {
                const Sx1 = new THREE.Vector3(-8, 8, 0);
                const Sx2 = new THREE.Vector3(8, 8, 0);
                drawLine(Sx1, Sx2, 0xdc2626, 5); // Giao tuyến Sx màu đỏ
                createTextSprite('Sx', '#dc2626', 1).position.copy(Sx2).add(new THREE.Vector3(0.5, 0.5, 0));
                res += "<br><span class='text-emerald-700 font-bold'>Kết luận: Giao tuyến là đường thẳng $Sx$ đi qua $S$ và song song với $AB, CD$.</span>";
            }

            updateMath(`(SAB) \\cap (SCD) = Sx \\parallel AB \\parallel CD`, 
                `<div class="mb-1 font-bold text-cyan-700">Ví dụ 2: Tìm Giao Tuyến Đặc Biệt</div>
                <div class="text-slate-800 leading-relaxed text-base">${res}</div>`);
        }

        // --- M7: VÍ DỤ 3 (Tìm thiết diện) ---
        function renderM7() {
            camera.position.set(10, 8, 18); controls.target.set(0, 2, 0);
            clearAll(); drawStandardAxes(10, 10, 10);
            
            const step = state.m7.step; 
            const k = 0.5; // Cố định điểm M ở giữa để minh họa quá trình nở rộng của mặt phẳng
            
            // Tứ diện ABCD
            const A = new THREE.Vector3(0, 8, 0);
            const B = new THREE.Vector3(-5, 0, 5);
            const C = new THREE.Vector3(5, 0, 5);
            const D = new THREE.Vector3(1, 0, -5);
            
            createPoint(A, 0x1e293b, 'A', new THREE.Vector3(0, 0.6, 0));
            createPoint(B, 0x1e293b, 'B'); createPoint(C, 0x1e293b, 'C'); createPoint(D, 0x1e293b, 'D');

            // Cạnh đa diện dùng nét động
            drawLine(A, B, 0x1e293b, 2); drawLine(A, C, 0x1e293b, 2); drawLine(A, D, 0x1e293b, 2);
            drawLine(B, C, 0x1e293b, 2); drawLine(B, D, 0x1e293b, 2); drawLine(C, D, 0x1e293b, 2);
            
            const M = new THREE.Vector3().copy(A).multiplyScalar(1-k).add(new THREE.Vector3().copy(B).multiplyScalar(k));
            const N = new THREE.Vector3().copy(C).multiplyScalar(1-k).add(new THREE.Vector3().copy(B).multiplyScalar(k));
            const P = new THREE.Vector3().copy(C).multiplyScalar(1-k).add(new THREE.Vector3().copy(D).multiplyScalar(k));
            const Q = new THREE.Vector3().copy(A).multiplyScalar(1-k).add(new THREE.Vector3().copy(D).multiplyScalar(k));

            createPoint(M, 0xdc2626, 0.15, 'M', new THREE.Vector3(-0.6, 0, 0));

            let res = "<strong>Bài toán:</strong> Cho tứ diện $ABCD$. Dựng mặt phẳng $(P)$ qua $M \\in AB$ sao cho $(P)$ song song với $AC$ (xanh) và $BD$ (vàng). Thiết diện có hình gì?<br><br>";

            if (step === 0) {
                createFace([M, C, D], 0xef4444, 0.4); 
                drawLine(M, C, 0xef4444, 3); drawLine(M, D, 0xef4444, 3);
                res += "- Bước 0: Bắt đầu từ $M$, nếu ta cắt tứ diện bằng một mặt phẳng ngẫu nhiên (chẳng hạn mp $MCD$), thiết diện ban đầu chỉ là một <span class='text-red-700 font-bold'>Hình Tam Giác</span>.<br>";
            }
            if (step >= 1) {
                drawLine(A, C, 0x3b82f6, 4); // AC Xanh dương
                createPoint(N, 0xdc2626, 0.15, 'N', new THREE.Vector3(0.6, -0.4, 0));
                drawLine(M, N, 0x3b82f6, 4); // MN // AC (Xanh dương)
                
                res += "- Bước 1: Do $(P) \\parallel AC \\Rightarrow$ $(P)$ cắt mặt $(ABC)$ theo giao tuyến $MN \\parallel AC$.<br>";
                if (step === 1) {
                    createFace([M, N, D], 0xef4444, 0.4);
                    drawLine(N, D, 0xef4444, 3); drawLine(M, D, 0xef4444, 3);
                    res += "Giả sử mặt phẳng lúc này đi qua D, thiết diện vẫn chỉ là một <span class='text-red-700 font-bold'>Hình Tam Giác</span> $MND$.<br>";
                }
            }
            if (step >= 2) {
                drawLine(B, D, 0xf59e0b, 4); // BD Vàng
                createPoint(Q, 0xdc2626, 0.15, 'Q', new THREE.Vector3(-0.6, 0, 0));
                drawLine(M, Q, 0xf59e0b, 4); // MQ // BD (Vàng)
                
                res += "- Bước 2: Do $(P) \\parallel BD \\Rightarrow$ cắt mặt $(ABD)$ theo $MQ \\parallel BD$. Mặt phẳng $(P)$ đã được định hình chính là $(MNQ)$.<br>";
                if (step === 2) {
                    createFace([M, N, Q], 0xef4444, 0.4);
                    drawLine(N, Q, 0xef4444, 3);
                    res += "Tuy nhiên, đa số học sinh thường dừng lại ở đây và nhầm tưởng thiết diện là <span class='text-red-700 font-bold'>Hình Tam Giác</span> $MNQ$.<br>";
                }
            }
            if (step >= 3) {
                createPoint(P, 0xdc2626, 0.15, 'P', new THREE.Vector3(0.6, 0, 0));
                drawLine(N, P, 0xf59e0b, 4); // NP // BD (Vàng)
                
                res += "- Bước 3: Thực chất mặt phẳng $(P)$ còn trải rộng và cắt cả mặt đáy $(BCD)$. Giao tuyến phải qua $N$ và song song $BD \\Rightarrow NP \\parallel BD$.<br>";
                if (step === 3) {
                    createFace([M, N, P, Q], 0xef4444, 0.4);
                    drawLine(P, Q, 0xef4444, 3); // Cạnh cuối khép kín
                }
            }
            if (step >= 4) {
                drawLine(P, Q, 0x3b82f6, 4); // PQ // AC (Xanh dương)
                createFace([M, N, P, Q], 0xdc2626, 0.4); // Mặt phẳng P đổi sang Đỏ hoàn chỉnh
                
                res += "<br><span class='text-emerald-700 font-bold'>Kết luận: Thiết diện hoàn chỉnh mở rộng thành Tứ giác $MNPQ$. Do có 2 cặp cạnh đối song song nên nó là một HÌNH BÌNH HÀNH!</span>";
            }

            updateMath(`(P) \\parallel AC, BD \\Rightarrow MNPQ \\text{ là Hình Bình Hành}`, 
                `<div class="mb-1 font-bold text-fuchsia-700">Ví dụ 3: Quá trình Hình thành Thiết diện</div>
                <div class="text-slate-800 leading-relaxed text-base">${res}</div>`);
        }

        // --- M8: ỨNG DỤNG THỰC TẾ (Quỹ đạo Flycam) ---
        function renderM8() {
            camera.position.set(10, 10, 18); controls.target.set(0, 2, 0);
            clearAll(); 
            
            const fieldSize = 20;
            const field = new THREE.Mesh(new THREE.PlaneGeometry(fieldSize, fieldSize), new THREE.MeshPhongMaterial({color: 0x10b981, side:THREE.DoubleSide}));
            field.rotation.x = -Math.PI/2; objectsGroup.add(field);

            const road1 = new THREE.Vector3(-10, 0.02, 3);
            const road2 = new THREE.Vector3(10, 0.02, 3);
            drawLine(road1, road2, 0xf8fafc, 6); 
            createTextSprite("Đường thẳng mồi d'", '#f8fafc', 0.8).position.copy(road2).add(new THREE.Vector3(-2, 0.5, 0));

            const H = 6; 
            const d1 = new THREE.Vector3(-10, H, 3);
            const d2 = new THREE.Vector3(10, H, 3);
            drawDashed(d1, d2, 0xdc2626, 3); 

            const t = state.m8.t; 
            const dronePos = new THREE.Vector3(t, H, 3);
            
            const droneGeo = new THREE.BoxGeometry(1.5, 0.5, 1.5);
            const drone = new THREE.Mesh(droneGeo, new THREE.MeshPhongMaterial({color: 0x1e293b}));
            drone.position.copy(dronePos); objectsGroup.add(drone);
            createTextSprite("🚁 Flycam", '#1e293b', 1).position.copy(dronePos).add(new THREE.Vector3(0, 1, 0));

            const shadowPos = new THREE.Vector3(t, 0, 3);
            drawDashed(dronePos, shadowPos, 0x0ea5e9, 2); 
            createPoint(shadowPos, 0x0ea5e9, 0.2);
            createTextSprite(`h = ${H}m`, '#0ea5e9', 1).position.copy(dronePos).lerp(shadowPos, 0.5).add(new THREE.Vector3(1, 0, 0));

            updateMath(`\\text{Quỹ đạo bay } d \\parallel \\text{Mặt đất } (P)`, 
                `<div class="mb-1 font-bold text-rose-700">Ứng dụng: Thiết lập Quỹ đạo bay ổn định</div>
                <div class="mb-2">Trong làm phim hoặc khảo sát, Flycam cần bay một đường thẳng <span class="text-red-700 font-bold">duy trì một độ cao không đổi</span> so với mặt đất (nghĩa là bay song song mặt đất).</div>
                <div class="p-3 rounded bg-slate-50 border border-slate-200">
                    <span class="font-bold text-slate-800">Giải pháp của kỹ sư:</span> Áp dụng <span class="text-red-700 font-bold">Định lý 1</span>. Chỉ cần vạch một đường thẳng $d'$ trên mặt sân, sau đó set cho Flycam bay theo đường $d$ <span class="text-red-700 font-bold">song song</span> với vạch mồi $d'$ đó. Kết quả là Flycam sẽ tự động bay song song với toàn bộ mặt sân $(P)$!
                </div>`);
        }

        function switchMode(mode) {
            currentMode = mode;
            [1,2,3,4,5,6,7,8].forEach(i => {
                const btn = document.getElementById(`btn-mode-${i}`);
                if (i === mode) btn.className = btn.className.replace('bg-opacity-50', 'shadow-md scale-105 z-10 font-bold border-l-8').replace('bg-gray-50', ''); 
                else btn.className = `w-full text-left px-4 py-2.5 rounded-lg transition font-semibold text-sm shadow-sm border-l-4 bg-gray-50 bg-opacity-50 hover:bg-gray-100 ${['border-amber-500 text-amber-900', 'border-blue-500 text-blue-900', 'border-emerald-500 text-emerald-900', 'border-purple-500 text-purple-900', 'border-teal-500 text-teal-900', 'border-cyan-500 text-cyan-900', 'border-fuchsia-500 text-fuchsia-900', 'border-rose-500 text-rose-900'][i-1]}`;
            });

            const activeBtn = document.getElementById(`btn-mode-${mode}`);
            const colors = ['amber', 'blue', 'emerald', 'purple', 'teal', 'cyan', 'fuchsia', 'rose'];
            const c = colors[mode-1];
            activeBtn.className = `w-full text-left px-4 py-2.5 rounded-lg transition font-bold text-sm shadow-md border-l-8 bg-${c}-100 border-${c}-600 text-${c}-900 scale-105 origin-left`;

            const problemHtml = problems[mode - 1].replace(/\$(.*?)\$/g, (m, math) => {
                try { return katex.renderToString(math, { throwOnError: false }); } catch(e) { return m; }
            });
            document.getElementById('problem-text').innerHTML = problemHtml;

            if(mode === 1) buildUI(`<label class="text-xs font-bold">Thay đổi góc nghiêng của d: <span class="text-blue-600">${state.m1.angle}°</span><input type="range" min="0" max="90" step="2" value="${state.m1.angle}" oninput="state.m1.angle=parseFloat(this.value); renderM1(); this.previousElementSibling.innerText=this.value+'°'"></label>`);
            else if(mode === 2) buildUI(`<label class="text-xs font-bold">Kéo d nâng lên hạ xuống (Khoảng cách h): <span class="text-blue-600">${state.m2.h.toFixed(1)}m</span><input type="range" min="0" max="8" step="0.5" value="${state.m2.h}" oninput="state.m2.h=parseFloat(this.value); renderM2(); this.previousElementSibling.innerText=this.value+'m'"></label>`);
            else if(mode === 3) buildUI(`<label class="text-xs font-bold">Kéo d (đỏ) chiếu thẳng với d' (xanh): <span class="text-blue-600">Độ lệch: ${state.m3.d_pos}</span><input type="range" min="-5" max="5" step="0.5" value="${state.m3.d_pos}" oninput="state.m3.d_pos=parseFloat(this.value); renderM3(); this.previousElementSibling.innerText='Độ lệch: '+this.value"></label>`);
            else if(mode === 4) buildUI(`<label class="text-xs font-bold">Xoay mặt phẳng (Q) quanh thanh d: Góc <span class="text-blue-600">${state.m4.q_angle}°</span><input type="range" min="20" max="80" step="2" value="${state.m4.q_angle}" oninput="state.m4.q_angle=parseFloat(this.value); renderM4(); this.previousElementSibling.innerText=this.value+'°'"></label>`);
            else if(mode === 5) buildUI(`<label class="text-xs font-bold">Kéo để xem từng bước Chứng minh: Bước <span class="text-blue-600">${state.m5.step}</span>/3<input type="range" min="0" max="3" step="1" value="${state.m5.step}" oninput="state.m5.step=parseInt(this.value); renderM5(); this.previousElementSibling.innerText=this.value"></label>`);
            else if(mode === 6) buildUI(`<label class="text-xs font-bold">Kéo để xem từng bước Dựng hình: Bước <span class="text-blue-600">${state.m6.step}</span>/3<input type="range" min="0" max="3" step="1" value="${state.m6.step}" oninput="state.m6.step=parseInt(this.value); renderM6(); this.previousElementSibling.innerText=this.value"></label>`);
            else if(mode === 7) buildUI(`<label class="text-xs font-bold">Kéo để xem quá trình nở rộng Thiết diện: Bước <span class="text-blue-600">${state.m7.step}</span>/4<input type="range" min="0" max="4" step="1" value="${state.m7.step}" oninput="state.m7.step=parseInt(this.value); renderM7(); this.previousElementSibling.innerText=this.value"></label>`);
            else if(mode === 8) buildUI(`<label class="text-xs font-bold">Vận hành Flycam dọc theo quỹ đạo d: <span class="text-blue-600">Vị trí t = ${state.m8.t}</span><input type="range" min="-8" max="8" step="0.5" value="${state.m8.t}" oninput="state.m8.t=parseFloat(this.value); renderM8(); this.previousElementSibling.innerText='Vị trí t = '+this.value"></label>`);

            clearAll(); 
            window[`renderM${mode}`]();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.state = state;
        window.renderM1 = renderM1; window.renderM2 = renderM2; window.renderM3 = renderM3;
        window.renderM4 = renderM4; window.renderM5 = renderM5;
        window.renderM6 = renderM6; window.renderM7 = renderM7; window.renderM8 = renderM8;

        window.onload = init;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô phỏng Đại số & Giải tích - THPT</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- KaTeX for Math Formulas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #f8fafc; color: #1e293b; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .pointer-events-auto { pointer-events: auto; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.05); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.2); border-radius: 4px; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%; background: #2563eb; cursor: pointer; margin-top: -7px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #cbd5e1; border-radius: 2px; }
        
        .expanded-panel {
            position: fixed !important; top: 50% !important; left: 50% !important; transform: translate(-50%, -50%) !important;
            width: 90vw !important; max-width: 900px !important; height: auto !important; max-height: 90vh !important;
            z-index: 100 !important; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25) !important;
        }
        .expanded-panel #info-content { padding: 2rem !important; gap: 1.5rem !important; }
        .expanded-panel #math-formula { font-size: 2.2rem !important; padding: 2rem !important; min-height: 160px !important; }
        .expanded-panel #math-result { font-size: 1.25rem !important; line-height: 2.2rem !important; padding: 1.5rem !important; }
        .expanded-panel h3 { font-size: 1.5rem !important; }
        
        .minimized-panel {
            background: transparent !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
            border: none !important; box-shadow: none !important; pointer-events: none;
        }
        .minimized-panel .panel-header { background: transparent !important; border-bottom: none !important; pointer-events: auto; }
        .minimized-panel .panel-title { opacity: 0; pointer-events: none; }
        .minimized-panel #control-footer-hint { display: none !important; }
        .minimized-panel label { text-shadow: 0 0 6px rgba(255,255,255,0.9), 0 0 2px rgba(255,255,255,1) !important; }
        
        .minimized-panel #controls-container { opacity: 0.35; transition: opacity 0.3s ease; pointer-events: auto; }
        .minimized-panel #controls-container:hover { opacity: 1; }
        .minimized-panel input[type=range]::-webkit-slider-runnable-track { background: rgba(203, 213, 225, 0.5) !important; }
        .minimized-panel input[type=range]::-webkit-slider-thumb { background: rgba(37, 99, 235, 0.6) !important; box-shadow: none !important; }
    </style>

    <script>
        window.togglePanel = function(contentId, iconId) {
            const content = document.getElementById(contentId);
            const icon = document.getElementById(iconId);
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden'); icon.classList.remove('-rotate-90');
            } else {
                content.classList.add('hidden'); icon.classList.add('-rotate-90');
            }
        };

        window.toggleExpand = function() {
            const panel = document.getElementById('info-panel');
            const overlay = document.getElementById('expand-overlay');
            const icon = document.getElementById('expand-icon');

            if (panel.classList.contains('expanded-panel')) {
                panel.classList.remove('expanded-panel'); overlay.classList.add('hidden');
                icon.innerHTML = '<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>';
            } else {
                panel.classList.add('expanded-panel'); overlay.classList.remove('hidden');
                document.getElementById('info-content').classList.remove('hidden');
                document.getElementById('info-icon').classList.remove('-rotate-90');
                icon.innerHTML = '<path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path>';
            }
        };

        window.toggleControlPanel = function() {
            const panel = document.getElementById('bottom-panel');
            const icon = document.getElementById('control-icon');
            if (panel.classList.contains('minimized-panel')) {
                panel.classList.remove('minimized-panel'); icon.classList.remove('-rotate-90');
            } else {
                panel.classList.add('minimized-panel'); icon.classList.add('-rotate-90');
            }
        };

        window.toggleFullScreen = function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.warn(err));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        };

        document.addEventListener('keydown', (event) => {
            if (event.key.toLowerCase() === 'f' && event.target.tagName !== 'INPUT') window.toggleFullScreen();
        });
    </script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-layer" class="absolute top-0 left-0 w-full h-full pointer-events-none flex flex-col justify-between p-3 md:p-5 z-10">
        <div id="expand-overlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-40 hidden transition-all duration-300 pointer-events-auto" onclick="toggleExpand()"></div>

        <!-- TOP ROW -->
        <div class="flex flex-col md:flex-row justify-between items-start gap-4 w-full relative">
            <!-- Menu Trái -->
            <div class="w-full md:w-[350px] glass-panel rounded-xl pointer-events-auto shrink-0 flex flex-col transition-all duration-300 max-h-[85vh] overflow-hidden flex">
                <div class="p-4 flex justify-between items-center cursor-pointer select-none shrink-0" onclick="togglePanel('mode-content', 'mode-icon')">
                    <h1 class="text-lg font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-700 to-indigo-600 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-600"><path d="M4 3v18h18"/><path d="M18 9l-5 5-4-4-5 5"/></svg>
                        Đại số & Giải tích
                    </h1>
                    <svg id="mode-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-500 transition-transform duration-300 -rotate-90"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </div>
                
                <div id="mode-content" class="px-4 pb-4 space-y-2 overflow-y-auto hidden-scrollbar hidden">
                    <button id="btn-mode-1" class="w-full text-left px-4 py-2.5 rounded-lg transition font-semibold text-sm shadow-sm">1. Ý nghĩa Hình học của Đạo hàm</button>
                    <button id="btn-mode-2" class="w-full text-left px-4 py-2.5 rounded-lg transition font-semibold text-sm shadow-sm">2. Bản chất Tích phân (Tổng Riemann)</button>
                    <button id="btn-mode-3" class="w-full text-left px-4 py-2.5 rounded-lg transition font-semibold text-sm shadow-sm">3. Mối liên hệ đồ thị y, y', y''</button>
                    <button id="btn-mode-4" class="w-full text-left px-4 py-2.5 rounded-lg transition font-semibold text-sm shadow-sm">4. Cấp số nhân Lùi vô hạn (Nghịch lý)</button>
                    <button id="btn-mode-5" class="w-full text-left px-4 py-2.5 rounded-lg transition font-semibold text-sm shadow-sm">5. Xác suất & Quy luật số lớn (Galton)</button>
                </div>
            </div>

            <!-- Bảng Công thức Phải -->
            <div id="info-panel" class="w-full md:w-[420px] glass-panel rounded-xl pointer-events-auto shrink-0 flex flex-col transition-all duration-300 relative z-20">
                <div class="p-4 flex justify-between items-center select-none border-b border-slate-100">
                    <h3 class="font-bold text-indigo-700 text-lg flex items-center gap-2 cursor-pointer" onclick="togglePanel('info-content', 'info-icon')">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                        Kiến thức Trọng tâm
                    </h3>
                    <div class="flex items-center gap-3">
                        <button onclick="toggleFullScreen()" class="text-slate-400 hover:text-blue-600 transition-colors" title="Toàn màn hình (Phím F)">
                            <svg id="fullscreen-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
                        </button>
                        <button onclick="toggleExpand()" class="text-slate-400 hover:text-blue-600 transition-colors" title="Phóng to bảng">
                            <svg id="expand-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
                        </button>
                        <svg id="info-icon" onclick="togglePanel('info-content', 'info-icon')" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-500 cursor-pointer transition-transform duration-300 -rotate-90"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </div>
                </div>
                
                <div id="info-content" class="p-4 flex flex-col gap-3 hidden">
                    <div id="math-formula" class="bg-slate-100 p-3 rounded-lg overflow-x-auto text-center border border-slate-200 shadow-inner min-h-[80px] flex items-center justify-center text-lg text-slate-800 transition-all duration-300"></div>
                    <div id="math-result" class="text-sm text-slate-800 space-y-2 leading-relaxed bg-white p-3 rounded-lg border border-slate-200 shadow-sm transition-all duration-300"></div>
                </div>
            </div>
        </div>

        <!-- BOTTOM ROW -->
        <div class="w-full flex justify-center relative mt-4">
            <div id="bottom-panel" class="w-full md:w-[750px] glass-panel rounded-xl pointer-events-auto flex flex-col transition-all duration-300 shadow-xl border-t-4 border-t-indigo-500 minimized-panel">
                <div class="panel-header p-3 px-5 flex justify-between items-center cursor-pointer select-none border-b border-slate-100 bg-white/50 rounded-t-xl transition-all duration-300" onclick="toggleControlPanel()">
                    <h2 class="panel-title text-base font-bold text-slate-800 flex items-center gap-2 transition-opacity duration-300">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-indigo-600"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                        Bảng điều khiển thông số
                    </h2>
                    <svg id="control-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-500 transition-transform duration-300 -rotate-90"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </div>
                
                <div id="control-content" class="p-4 transition-all duration-300">
                    <div id="controls-container"></div>
                    <div id="control-footer-hint" class="mt-4 pt-3 border-t border-slate-200 flex flex-col md:flex-row justify-between items-center gap-2 text-xs text-slate-600">
                        <span class="font-medium">🖱️ Chuột trái: Pan/Di chuyển đồ thị | Lăn: Thu phóng</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;
        let objectsGroup = new THREE.Group();
        let currentMode = 1;
        
        // Khung State
        const state = {
            m1: { dx: 2 },            // Đạo hàm: khoảng cách delta x
            m2: { n: 4 },             // Tích phân: số hình chữ nhật
            m3: { x: -2.2 },          // Khảo sát: vạch x quét ngang
            m4: { steps: 1 },         // CSN lùi vô hạn: số bước chia
            m5: { speed: 1, active: false } // Bảng Galton
        };

        // Biến lưu trữ vật lý giả lập cho Bảng Galton
        let galtonBalls = [];
        let galtonBins = new Array(13).fill(0);
        let galtonMaxBin = 1;

        const mathFormula = document.getElementById('math-formula');
        const mathResult = document.getElementById('math-result');
        const controlsContainer = document.getElementById('controls-container');

        // --- HÀM VẼ ĐỒ THỊ 2D ---
        function drawLine(p1, p2, color=0x1e293b, width=3) {
            const radius = width * 0.008; // Đã giảm độ dày nét thẳng xuống mức vừa vặn
            const path = new THREE.LineCurve3(p1, p2);
            const mesh = new THREE.Mesh(new THREE.TubeGeometry(path, 1, radius, 8, false), new THREE.MeshPhongMaterial({ color }));
            objectsGroup.add(mesh);
            return mesh;
        }

        function drawDashed(p1, p2, color=0x94a3b8) {
            const dist = p1.distanceTo(p2);
            const dashSize = 0.2; const gapSize = 0.15; const step = dashSize + gapSize;
            const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
            const radius = 0.012; // Đã giảm độ dày nét đứt
            for (let d = 0; d < dist; d += step) {
                const start = new THREE.Vector3().copy(p1).addScaledVector(dir, d);
                const currentDash = Math.min(dashSize, dist - d);
                if (currentDash <= 0.001) continue;
                const end = new THREE.Vector3().copy(start).addScaledVector(dir, currentDash);
                const path = new THREE.LineCurve3(start, end);
                objectsGroup.add(new THREE.Mesh(new THREE.TubeGeometry(path, 1, radius, 8, false), new THREE.MeshBasicMaterial({ color })));
            }
        }

        function createPoint(pos, color=0xdc2626, size=0.15) {
            const mesh = new THREE.Mesh(new THREE.CircleGeometry(size, 32), new THREE.MeshBasicMaterial({ color }));
            mesh.position.copy(pos);
            objectsGroup.add(mesh);
            return mesh;
        }

        function createTextSprite(text, color, scale=1.0) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 128;
            const context = canvas.getContext('2d');
            context.font = 'Bold 48px "Segoe UI", Arial';
            context.fillStyle = color;
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.lineWidth = 4; context.strokeStyle = 'white';
            context.strokeText(text, 128, 64); context.fillText(text, 128, 64);
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture, depthTest: false, transparent: true });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(scale*2, scale, scale);
            return sprite;
        }

        function drawGraph(func, xMin, xMax, color, width=3) {
            const pts = [];
            for(let x = xMin; x <= xMax; x += 0.05) {
                pts.push(new THREE.Vector3(x, func(x), 0));
            }
            const radius = width * 0.012; // Đã giảm độ dày của đồ thị cong, giữ lại sự thanh thoát
            const curve = new THREE.CatmullRomCurve3(pts, false, "chordal");
            const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, pts.length, radius, 8, false), new THREE.MeshPhongMaterial({ color }));
            objectsGroup.add(mesh);
            return mesh;
        }

        function drawAxes() {
            const len = 15;
            // Ox
            const ox = new THREE.ArrowHelper(new THREE.Vector3(1,0,0), new THREE.Vector3(0,0,0), len, 0x64748b, 0.4, 0.2);
            objectsGroup.add(ox);
            const lX = createTextSprite('x', '#64748b', 0.8); lX.position.set(len+0.5, -0.5, 0); objectsGroup.add(lX);
            // Oy
            const oy = new THREE.ArrowHelper(new THREE.Vector3(0,1,0), new THREE.Vector3(0,0,0), len, 0x64748b, 0.4, 0.2);
            objectsGroup.add(oy);
            const lY = createTextSprite('y', '#64748b', 0.8); lY.position.set(-0.5, len+0.5, 0); objectsGroup.add(lY);
            
            // Trục âm mờ
            drawLine(new THREE.Vector3(-len,0,0), new THREE.Vector3(0,0,0), 0xcbd5e1, 2);
            drawLine(new THREE.Vector3(0,-len,0), new THREE.Vector3(0,0,0), 0xcbd5e1, 2);
        }

        function clearAll() {
            while (objectsGroup.children.length > 0) {
                const child = objectsGroup.children[0];
                if (child.geometry) child.geometry.dispose();
                if (child.material) {
                    if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
                    else child.material.dispose();
                }
                objectsGroup.remove(child);
            }
        }

        // Cài đặt Camera 2D hoặc 3D
        function setCameraMode(is2D) {
            if(is2D) {
                camera.position.set(0, 0, 16);
                controls.enableRotate = false; // Khóa xoay để nhìn như giấy phẳng
            } else {
                camera.position.set(0, -10, 15);
                controls.enableRotate = true;
                controls.maxPolarAngle = Math.PI/2;
            }
            controls.target.set(0,0,0);
            controls.update();
        }

        // --- INIT ---
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf8fafc); 
            
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.up.set(0, 1, 0); // Y là hướng lên
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; controls.dampingFactor = 0.05;
            
            scene.add(objectsGroup);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            for(let i=1; i<=5; i++) {
                document.getElementById(`btn-mode-${i}`).addEventListener('click', () => switchMode(i));
            }

            switchMode(1);
            animate();
        }

        function updateMath(tex, res) {
            katex.render(tex, mathFormula, { throwOnError: false, displayMode: true });
            const renderedRes = res.replace(/\$(.*?)\$/g, (m, math) => {
                try { return katex.renderToString(math, { throwOnError: false }); } catch(e) { return m; }
            });
            mathResult.innerHTML = renderedRes;
        }
        function buildUI(html) { controlsContainer.innerHTML = html; }

        // --- CÁC CHỦ ĐỀ ĐẠI SỐ & GIẢI TÍCH ---

        // 1. Đạo hàm (Cát tuyến -> Tiếp tuyến)
        function renderM1() {
            setCameraMode(true); controls.target.set(2, 2, 0); camera.position.set(2, 2, 12);
            clearAll(); drawAxes();
            
            const dx = state.m1.dx;
            const f = (x) => -0.5*x*x + 3*x; // Parabol
            const xA = 1, yA = f(xA);
            const xB = xA + dx, yB = f(xB);

            drawGraph(f, -1, 6, 0x0f172a, 3);
            
            createPoint(new THREE.Vector3(xA, yA, 0), 0xdc2626);
            const labelA = createTextSprite('A', '#dc2626', 0.8); labelA.position.set(xA-0.5, yA+0.5, 0); objectsGroup.add(labelA);

            createPoint(new THREE.Vector3(xB, yB, 0), 0x2563eb);
            const labelB = createTextSprite('B', '#2563eb', 0.8); labelB.position.set(xB+0.5, yB+0.5, 0); objectsGroup.add(labelB);

            // Cát tuyến AB
            const m = (yB - yA) / (xB - xA);
            const lineF = (x) => m*(x - xA) + yA;
            drawGraph(lineF, -1, 6, 0x059669, 2);

            drawDashed(new THREE.Vector3(xA, 0, 0), new THREE.Vector3(xA, yA, 0), 0x94a3b8);
            drawDashed(new THREE.Vector3(xB, 0, 0), new THREE.Vector3(xB, yB, 0), 0x94a3b8);

            let status = "";
            if (dx > 0.05) {
                status = `Đường thẳng AB là **Cát tuyến**. Hệ số góc $k = \\frac{\\Delta y}{\\Delta x} = ${m.toFixed(2)}$`;
            } else {
                status = `Khi $\\Delta x \\to 0$, $B$ trùng $A$. Cát tuyến trở thành **Tiếp tuyến**. Hệ số góc $f'(x_0) = 2$`;
            }

            updateMath(`f'(x_0) = \\lim_{\\Delta x \\to 0} \\frac{f(x_0+\\Delta x) - f(x_0)}{\\Delta x}`, 
                `<div class="mb-1 font-bold text-indigo-700">TÓM TẮT TRỌNG TÂM:</div>
                <ul class="list-disc pl-5 space-y-1 mb-3">
                    <li>Bản chất đạo hàm $f'(x_0)$ chính là **Hệ số góc của Tiếp tuyến** tại điểm $x_0$.</li>
                    <li>Nó thể hiện **tốc độ thay đổi tức thời** của hàm số (cát tuyến khi bị ép khoảng cách về 0).</li>
                </ul>
                <div class="text-rose-600 font-bold bg-rose-50 p-2 rounded border border-rose-200">${status}</div>`);
        }

        // 2. Bản chất Tích phân (Tổng Riemann)
        function renderM2() {
            setCameraMode(true); controls.target.set(2, 3, 0); camera.position.set(2, 3, 14);
            clearAll(); drawAxes();
            
            const n = state.m2.n;
            const f = (x) => 0.5*x*x + 1;
            const a = 0, b = 4;
            const dx = (b - a) / n;

            drawGraph(f, -0.5, 4.5, 0x0f172a, 3);

            let sumArea = 0;
            // Vẽ các hình chữ nhật (Chọn mốc trái)
            for(let i=0; i<n; i++) {
                let x_left = a + i*dx;
                let h = f(x_left); // Chiều cao
                sumArea += h * dx;

                const shape = new THREE.Shape();
                shape.moveTo(x_left, 0); shape.lineTo(x_left+dx, 0);
                shape.lineTo(x_left+dx, h); shape.lineTo(x_left, h); shape.lineTo(x_left, 0);
                
                const geom = new THREE.ShapeGeometry(shape);
                const mesh = new THREE.Mesh(geom, new THREE.MeshBasicMaterial({color: 0x3b82f6, transparent:true, opacity: 0.5, side: THREE.DoubleSide}));
                objectsGroup.add(mesh);
                
                // Viền
                const edges = new THREE.EdgesGeometry(geom);
                objectsGroup.add(new THREE.LineSegments(edges, new THREE.LineBasicMaterial({color: 0x1e3a8a})));
            }

            const trueArea = (Math.pow(4,3)/6 + 4) - 0; // x^3/6 + x. Tại 4: 64/6 + 4 = 10.66 + 4 = 14.66

            updateMath(`\\int_a^b f(x) dx = \\lim_{n \\to \\infty} \\sum_{i=1}^n f(x_i)\\Delta x`, 
                `<div class="mb-1 font-bold text-indigo-700">TÓM TẮT TRỌNG TÂM:</div>
                <ul class="list-disc pl-5 space-y-1 mb-3">
                    <li>Ký hiệu $\\int$ bản chất là chữ **S** kéo dài (Sum = Tổng). Nó là tổng diện tích của vô số hình chữ nhật mỏng manh (bề rộng $dx$).</li>
                    <li>Khi số lượng $n$ càng tăng, phần dư thừa càng nhỏ, tổng diện tích tiến tới diện tích thực.</li>
                </ul>
                <div class="bg-blue-50 p-2 rounded border border-blue-200">
                    <div>Tổng diện tích $n$ h.chữ nhật: $S_n \\approx ${sumArea.toFixed(2)}$</div>
                    <div class="font-bold text-blue-700">Tích phân thực tế (Giới hạn): $\\int_0^4 f(x)dx \\approx ${trueArea.toFixed(2)}$</div>
                </div>`);
        }

        // 3. Mối liên hệ y, y', y''
        function renderM3() {
            setCameraMode(true); controls.target.set(0, 0, 0); camera.position.set(0, 0, 18);
            clearAll(); drawAxes();
            
            const scanX = state.m3.x;
            // y = x^3/3 - 2x.  y' = x^2 - 2.  y'' = 2x. (Cực trị tại x = +- sqrt(2) ~ 1.41)
            const y_func  = (x) => Math.pow(x,3)/3 - 2*x;
            const yp_func = (x) => x*x - 2;
            const ypp_func= (x) => 2*x;

            drawGraph(y_func, -3, 3, 0x2563eb, 3); // Blue
            drawGraph(yp_func, -3, 3, 0x059669, 3); // Green
            drawGraph(ypp_func, -3, 3, 0xdc2626, 3); // Red

            // Labels
            const ly = createTextSprite('y', '#2563eb', 1.2); ly.position.set(3, y_func(3)+0.5, 0); objectsGroup.add(ly);
            const lyp = createTextSprite("y'", '#059669', 1.2); lyp.position.set(3, yp_func(3)-0.5, 0); objectsGroup.add(lyp);
            const lypp = createTextSprite("y''", '#dc2626', 1.2); lypp.position.set(3, ypp_func(3), 0); objectsGroup.add(lypp);

            // Scan line
            drawLine(new THREE.Vector3(scanX, -8, 0), new THREE.Vector3(scanX, 8, 0), 0x94a3b8, 1);
            
            const pY = createPoint(new THREE.Vector3(scanX, y_func(scanX), 0), 0x2563eb, 0.2);
            const pYp = createPoint(new THREE.Vector3(scanX, yp_func(scanX), 0), 0x059669, 0.2);
            const pYpp = createPoint(new THREE.Vector3(scanX, ypp_func(scanX), 0), 0xdc2626, 0.2);

            let note = "";
            if (Math.abs(yp_func(scanX)) < 0.2) {
                note = "🔥 Đang ở **Cực trị** của y. Chú ý y' đang cắt trục hoành ($y'=0$).";
            } else if (Math.abs(ypp_func(scanX)) < 0.2) {
                note = "🔥 Đang ở **Điểm uốn** của y (đổi bề lõm). Chú ý y'' đang cắt trục hoành ($y''=0$) và y' đạt cực trị.";
            } else if (yp_func(scanX) > 0) {
                note = "Hàm số đang Đồng biến ($y' > 0$).";
            } else {
                note = "Hàm số đang Nghịch biến ($y' < 0$).";
            }

            updateMath(`y = f(x), \\quad y' = f'(x), \\quad y'' = f''(x)`, 
                `<div class="mb-1 font-bold text-indigo-700">TÓM TẮT TRỌNG TÂM:</div>
                <ul class="list-disc pl-5 space-y-1 mb-3">
                    <li>Nghiệm của $\\color{#059669}{y'=0}$ chiếu thẳng đứng lên chính là **Điểm Cực trị** của $\\color{#2563eb}{y}$.</li>
                    <li>Nghiệm của $\\color{#dc2626}{y''=0}$ chiếu lên chính là **Điểm Uốn** của $\\color{#2563eb}{y}$ (nơi đồ thị chuyển từ lõm sang lồi hoặc ngược lại).</li>
                </ul>
                <div class="bg-slate-50 p-2 rounded border border-slate-200 text-slate-800">${note}</div>`);
        }

        // 4. CSN Lùi vô hạn
        function renderM4() {
            setCameraMode(true); controls.target.set(2, 2, 0); camera.position.set(2, 2, 8);
            clearAll(); 
            
            const maxSteps = state.m4.steps;
            let rect = {x: 0, y: 0, w: 4, h: 4}; // Area 16 represents 1 unit
            let sum = 0;
            const colors = [0x3b82f6, 0xef4444, 0x10b981, 0xf59e0b, 0x8b5cf6, 0x06b6d4, 0xf97316, 0x6366f1, 0x14b8a6, 0xd946ef];

            // Khung tổng 1x1
            const fullGeom = new THREE.ShapeGeometry(new THREE.Shape().moveTo(0,0).lineTo(4,0).lineTo(4,4).lineTo(0,4).lineTo(0,0));
            const edges = new THREE.EdgesGeometry(fullGeom);
            objectsGroup.add(new THREE.LineSegments(edges, new THREE.LineBasicMaterial({color: 0x1e293b, linewidth: 2})));

            for (let i = 0; i < maxSteps; i++) {
                let rW = rect.w, rH = rect.h;
                let cX = rect.x, cY = rect.y;
                
                if (i % 2 === 0) { // Cắt dọc
                    rW /= 2;
                    rect.x += rW; rect.w = rW;
                } else { // Cắt ngang
                    rH /= 2;
                    rect.y += rH; rect.h = rH;
                }

                let areaVal = 1 / Math.pow(2, i+1);
                sum += areaVal;

                const shape = new THREE.Shape();
                shape.moveTo(cX, cY); shape.lineTo(cX+rW, cY); shape.lineTo(cX+rW, cY+rH); shape.lineTo(cX, cY+rH); shape.lineTo(cX, cY);
                const mesh = new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshBasicMaterial({color: colors[i%10], transparent:true, opacity:0.8}));
                objectsGroup.add(mesh);
                objectsGroup.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.ShapeGeometry(shape)), new THREE.LineBasicMaterial({color: 0xffffff})));

                // Add text for larger boxes
                if (i < 5) {
                    const txt = createTextSprite(`1/${Math.pow(2, i+1)}`, '#ffffff', 0.5);
                    txt.position.set(cX + rW/2, cY + rH/2, 0.1);
                    objectsGroup.add(txt);
                }
            }

            updateMath(`S = \\frac{1}{2} + \\frac{1}{4} + \\frac{1}{8} + \\dots = \\frac{u_1}{1-q} = 1`, 
                `<div class="mb-1 font-bold text-indigo-700">TÓM TẮT TRỌNG TÂM:</div>
                <ul class="list-disc pl-5 space-y-1 mb-3">
                    <li>Nghịch lý: Cộng vô hạn các số dương lại ra một số hữu hạn?</li>
                    <li>Hình vuông có diện tích bằng 1. Dù bạn có chia đôi phần còn lại bao nhiêu lần (vô hạn bước), tổng diện tích các mảnh ghép lại **vĩnh viễn không vượt quá 1**.</li>
                </ul>
                <div class="text-blue-700 font-bold bg-blue-50 p-2 rounded">Cộng ${maxSteps} phần tử đầu: $S_n = ${sum.toFixed(4)}$</div>`);
        }

        // 5. Bảng Galton (Mô phỏng Phân phối chuẩn)
        function renderM5() {
            setCameraMode(false); // 3D mode
            controls.target.set(0, 0, 0); camera.position.set(0, -2, 18);
            
            // Chỉ build tĩnh 1 lần khi hàm được gọi
            if(objectsGroup.children.length === 0) {
                // Build Pegs
                for(let row = 0; row < 10; row++) {
                    for(let col = 0; col <= row; col++) {
                        const x = (col - row/2) * 1.2;
                        const y = 6 - row * 1.2;
                        const peg = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.5), new THREE.MeshPhongMaterial({color: 0xffffff}));
                        peg.rotation.x = Math.PI/2;
                        peg.position.set(x, y, -0.25);
                        objectsGroup.add(peg);
                    }
                }
                // Build Bins Dividers
                for(let i = 0; i <= 11; i++) {
                    const x = (i - 5.5) * 1.2;
                    const wall = new THREE.Mesh(new THREE.BoxGeometry(0.1, 4, 1), new THREE.MeshPhongMaterial({color: 0x94a3b8}));
                    wall.position.set(x, -6.5, 0);
                    objectsGroup.add(wall);
                }
            }

            updateMath(`P(X = k) = C_n^k p^k (1-p)^{n-k}`, 
                `<div class="mb-1 font-bold text-indigo-700">TÓM TẮT TRỌNG TÂM:</div>
                <ul class="list-disc pl-5 space-y-1 mb-3">
                    <li>Quy luật số lớn: Dù mỗi viên bi rẽ trái hay phải là **ngẫu nhiên 50/50**, nhưng khi số lượng bi cực lớn, tập hợp của chúng sẽ tạo thành một hình chuông hoàn hảo (**Phân phối chuẩn**).</li>
                    <li>Phép thử Bernoulli lặp lại nhiều lần sẽ tiệm cận về đồ thị hình chuông này.</li>
                </ul>
                <div class="text-emerald-700 font-bold bg-emerald-50 p-2 rounded">
                    Trạng thái: ${state.m5.active ? "Đang thả bi..." : "Đã dừng."}
                </div>`);
        }

        function updateGaltonPhysics() {
            if(currentMode !== 5) return;
            
            // Xóa rác
            galtonBalls = galtonBalls.filter(b => {
                if(b.dead) {
                    objectsGroup.remove(b.mesh);
                    return false;
                }
                return true;
            });

            // Spawn
            if (state.m5.active && Math.random() < 0.4 * state.m5.speed) {
                const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), new THREE.MeshPhongMaterial({color: 0xf43f5e}));
                objectsGroup.add(mesh);
                galtonBalls.push({ mesh: mesh, level: 0, pos: 0, t: 0, choice: Math.random() < 0.5 ? 0 : 1, dead: false });
            }

            // Update
            const speed = 0.05 * state.m5.speed;
            galtonBalls.forEach(b => {
                b.t += speed;
                if(b.t >= 1) {
                    b.level++;
                    b.pos += b.choice;
                    b.t = 0;
                    b.choice = Math.random() < 0.5 ? 0 : 1;
                    
                    if(b.level === 10) {
                        b.dead = true;
                        galtonBins[b.pos]++;
                        if(galtonBins[b.pos] > galtonMaxBin) galtonMaxBin = galtonBins[b.pos];
                        drawGaltonBins();
                    }
                }
                if(!b.dead) {
                    // Interpolate visual position
                    const xStart = (b.pos - b.level/2) * 1.2;
                    const yStart = 6 - b.level * 1.2;
                    const xEnd = (b.pos + b.choice - (b.level+1)/2) * 1.2;
                    const yEnd = 6 - (b.level+1) * 1.2;
                    
                    // Arc hop
                    const hop = Math.sin(b.t * Math.PI) * 0.4;
                    b.mesh.position.set(
                        xStart + (xEnd - xStart)*b.t,
                        yStart + (yEnd - yStart)*b.t + hop,
                        0
                    );
                }
            });
        }

        function drawGaltonBins() {
            // Xóa cột cũ
            objectsGroup.children = objectsGroup.children.filter(c => c.name !== 'binBar');
            
            for(let i=0; i<=10; i++) {
                if(galtonBins[i] === 0) continue;
                const h = (galtonBins[i] / galtonMaxBin) * 3.5; // Max height 3.5
                const x = (i - 5) * 1.2;
                const bar = new THREE.Mesh(new THREE.BoxGeometry(1, h, 0.8), new THREE.MeshPhongMaterial({color: 0x3b82f6, transparent:true, opacity:0.8}));
                bar.position.set(x, -8.5 + h/2, 0);
                bar.name = 'binBar';
                objectsGroup.add(bar);
            }
        }


        function switchMode(mode) {
            currentMode = mode;
            [1,2,3,4,5].forEach(i => {
                const btn = document.getElementById(`btn-mode-${i}`);
                if (i === mode) btn.className = "w-full text-left px-4 py-2.5 rounded-lg bg-indigo-600 font-bold text-sm text-white shadow-md border border-indigo-500";
                else btn.className = "w-full text-left px-4 py-2.5 rounded-lg bg-slate-100 hover:bg-slate-200 font-semibold text-sm text-slate-700 border border-slate-200";
            });

            // Cleanup
            state.m5.active = false;
            galtonBalls.forEach(b => objectsGroup.remove(b.mesh));
            galtonBalls = []; galtonBins = new Array(13).fill(0); galtonMaxBin = 1;

            if(mode === 1) buildUI(`<label class="text-xs font-bold">Kéo để Cát tuyến ép về Tiếp tuyến ($\\Delta x \\to 0$): <span class="text-blue-600">${state.m1.dx}</span><input type="range" min="0.01" max="3" step="0.01" value="${state.m1.dx}" oninput="state.m1.dx=parseFloat(this.value); renderM1(); this.previousElementSibling.innerText=this.value"></label>`);
            else if(mode === 2) buildUI(`<label class="text-xs font-bold">Tăng số lượng hình chữ nhật (n): <span class="text-blue-600">${state.m2.n}</span><input type="range" min="2" max="100" step="1" value="${state.m2.n}" oninput="state.m2.n=parseInt(this.value); renderM2(); this.previousElementSibling.innerText=this.value"></label>`);
            else if(mode === 3) buildUI(`<label class="text-xs font-bold">Di chuyển điểm quét khảo sát đồ thị (x): <span class="text-blue-600">${state.m3.x}</span><input type="range" min="-2.5" max="2.5" step="0.05" value="${state.m3.x}" oninput="state.m3.x=parseFloat(this.value); renderM3(); this.previousElementSibling.innerText=this.value"></label>`);
            else if(mode === 4) buildUI(`<label class="text-xs font-bold">Số bước chia đôi tờ giấy (Cấp số nhân lùi vô hạn): <span class="text-blue-600">${state.m4.steps}</span><input type="range" min="1" max="12" step="1" value="${state.m4.steps}" oninput="state.m4.steps=parseInt(this.value); renderM4(); this.previousElementSibling.innerText=this.value"></label>`);
            else if(mode === 5) buildUI(`<div class="flex gap-4 items-center">
                <button onclick="state.m5.active = !state.m5.active; renderM5(); this.innerText = state.m5.active ? 'Tạm dừng thả bi' : 'Bắt đầu thả bi';" class="px-4 py-2 bg-emerald-600 text-white rounded font-bold text-xs shadow hover:bg-emerald-700">Bắt đầu thả bi</button>
                <label class="text-xs font-bold flex-1">Tốc độ thả: <span class="text-blue-600">${state.m5.speed}x</span><input type="range" min="1" max="10" step="1" value="${state.m5.speed}" oninput="state.m5.speed=parseFloat(this.value); this.previousElementSibling.innerText=this.value+'x'"></label>
            </div>`);

            clearAll(); 
            window[`renderM${mode}`]();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updateGaltonPhysics(); // Chạy vật lý nếu đang ở Mode 5
            renderer.render(scene, camera);
        }

        window.state = state;
        window.renderM1 = renderM1; window.renderM2 = renderM2; window.renderM3 = renderM3;
        window.renderM4 = renderM4; window.renderM5 = renderM5;

        window.onload = init;
    </script>
</body>
</html>

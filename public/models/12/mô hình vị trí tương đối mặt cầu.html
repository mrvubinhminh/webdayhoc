<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô Phỏng 3D Phương Trình Mặt Cầu</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        sidebarBg: '#1e293b',
                        panelBg: '#1e293b',
                        accentBlue: '#3b82f6',
                        accentBlueHover: '#2563eb',
                        textMuted: '#94a3b8'
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- KaTeX for Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <style>
        /* Custom Scrollbar for sidebar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        body { margin: 0; overflow: hidden; background-color: #0f172a; }
        
        /* 3D Label Styles */
        .label-3d {
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-weight: bold;
            font-size: 16px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            pointer-events: none; /* Let mouse events pass through to 3D canvas */
        }
        .label-r { color: #facc15; font-size: 14px; } /* Yellowish for Radius */
    </style>
</head>
<body class="text-white h-screen flex flex-col font-sans select-none">

    <!-- Header -->
    <header class="h-14 bg-darkBg border-b border-slate-800 flex items-center justify-between px-4 shrink-0 z-10 relative shadow-md">
        <div class="flex items-center gap-4">
            <button class="flex items-center gap-2 bg-red-900/30 text-red-400 hover:bg-red-900/50 px-3 py-1.5 rounded text-sm transition-colors border border-red-900/50">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                Đóng
            </button>
            <h1 class="text-lg font-semibold tracking-wide">Mô Phỏng 3D Phương Trình Mặt Cầu</h1>
        </div>
        <button class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded text-sm text-textMuted transition-colors border border-slate-700">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path></svg>
            Thu nhỏ
        </button>
    </header>

    <!-- Main Content Area -->
    <div class="flex flex-1 overflow-hidden relative">
        
        <!-- Sidebar -->
        <aside class="w-72 bg-sidebarBg border-r border-slate-800 flex flex-col z-10 shadow-xl shrink-0">
            <!-- Logo Area -->
            <div class="p-4 border-b border-slate-800 flex items-center gap-3">
                <div class="w-10 h-10 rounded-full border-2 border-yellow-500 flex items-center justify-center font-bold text-yellow-500 shadow-[0_0_10px_rgba(234,179,8,0.3)]">
                    TC
                </div>
                <div>
                    <div class="font-bold tracking-wider text-sm">HYMTCLUB</div>
                    <div class="text-[10px] text-textMuted uppercase tracking-widest">Mô phỏng 3D Oxyz</div>
                </div>
            </div>

            <!-- Menu List -->
            <div class="flex-1 overflow-y-auto p-3 space-y-2" id="menu-list">
                <!-- Menu items generated by JS -->
            </div>
        </aside>

        <!-- 3D Viewport & Footer Container -->
        <main class="flex-1 relative flex flex-col">
            <!-- 3D Canvas Container -->
            <div id="canvas-container" class="flex-1 bg-[#0a1120] relative cursor-grab active:cursor-grabbing">
                <!-- Three.js renders here -->
            </div>

            <!-- Bottom Information Panel -->
            <div class="h-32 bg-sidebarBg/95 backdrop-blur-md border-t border-slate-700 p-6 flex items-center justify-between z-10 shrink-0 relative">
                <div class="flex-1">
                    <h2 class="text-xl font-bold flex items-center gap-2 mb-2 text-blue-100" id="info-title">
                        <svg class="text-yellow-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="9" y1="18" x2="15" y2="18"></line><line x1="10" y1="22" x2="14" y2="22"></line><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"></path></svg>
                        <!-- Title dynamically inserted -->
                    </h2>
                    <p class="text-textMuted text-sm" id="info-desc">
                        <!-- Description dynamically inserted -->
                    </p>
                </div>
                
                <!-- Formula Box -->
                <div class="bg-[#0f172a] border border-slate-700 rounded-xl px-8 py-4 flex items-center justify-center min-w-[200px] shadow-inner">
                    <div id="math-formula" class="text-yellow-400 text-2xl font-serif">
                        <!-- KaTeX Formula dynamically inserted -->
                    </div>
                </div>

                <!-- Đã loại bỏ Watermark Netlify theo yêu cầu -->
            </div>
        </main>
    </div>

    <!-- Application Logic -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>

    <script>
        // --- Data Definitions ---
        const menuData = [
            { id: 0, label: "Mặt cầu (S)", title: "Mặt cầu (S)", desc: "Tập hợp các điểm trong không gian cách điểm I cố định một khoảng không đổi R.", formula: "S(I, R)" },
            { id: 1, label: "Điểm M thuộc (S)", title: "Điểm M nằm trên mặt cầu (S)", desc: "Điểm M thuộc (S) khi khoảng cách từ tâm I đến M đúng bằng bán kính R.", formula: "IM = R" },
            { id: 2, label: "Điểm N nằm trong (S)", title: "Điểm N nằm trong (S)", desc: "Điểm N nằm trong (S) khi khoảng cách từ tâm I đến N nhỏ hơn bán kính.", formula: "IN < R" },
            { id: 3, label: "Điểm P nằm ngoài (S)", title: "Điểm P nằm ngoài (S)", desc: "Điểm P nằm ngoài (S) khi khoảng cách từ I đến P lớn hơn bán kính.", formula: "IP > R" },
            { id: 4, label: "Đường thẳng Δ cắt (S)", title: "Đường thẳng cắt mặt cầu", desc: "Đường thẳng Δ cắt mặt cầu (S) tại hai điểm phân biệt khi khoảng cách từ I đến Δ nhỏ hơn R.", formula: "d(I, \\Delta) < R" },
            { id: 5, label: "Đường thẳng Δ tiếp xúc", title: "Đường thẳng tiếp xúc mặt cầu", desc: "Đường thẳng Δ là tiếp tuyến của mặt cầu (S) khi khoảng cách từ I đến Δ bằng R.", formula: "d(I, \\Delta) = R" },
            { id: 6, label: "Đường thẳng Δ không cắt (S)", title: "Đường thẳng không cắt mặt cầu", desc: "Đường thẳng Δ không có điểm chung với (S) khi khoảng cách từ I đến Δ lớn hơn R.", formula: "d(I, \\Delta) > R" },
            { id: 7, label: "Mặt phẳng (P) cắt (S)", title: "Mặt phẳng cắt mặt cầu", desc: "Mặt phẳng (P) cắt mặt cầu (S) tạo thành giao tuyến là một đường tròn.", formula: "d(I, (P)) < R" },
            { id: 8, label: "Mặt phẳng (P) tiếp xúc với (S)", title: "Mặt phẳng tiếp diện", desc: "Mặt phẳng (P) tiếp xúc với mặt cầu (S) tại một điểm duy nhất (tiếp điểm).", formula: "d(I, (P)) = R" },
            { id: 9, label: "Mặt phẳng (P) không cắt (S)", title: "Mặt phẳng không cắt mặt cầu", desc: "Mặt phẳng (P) không có điểm chung với mặt cầu (S).", formula: "d(I, (P)) > R" }
        ];

        let currentStateId = 3; // Default state

        // --- Three.js Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a1120, 0.02); // Add slight depth fog

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(20, 15, 30); // Isometric-ish view

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const labelRenderer = new THREE.CSS2DRenderer();
        labelRenderer.setSize(container.clientWidth, container.clientHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none'; // Important to allow orbit controls
        container.appendChild(labelRenderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.2; // Don't allow going too far below the grid

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        // --- Grid ---
        const gridHelper = new THREE.GridHelper(40, 40, 0x1e293b, 0x1e293b);
        gridHelper.position.y = -10; // Hạ thấp grid xuống một chút để thoáng hơn
        scene.add(gridHelper);

        // --- Objects Creation ---
        const R = 8; // Sphere Radius
        const objectsToManage = {}; // Keep track to show/hide based on ID

        // Helper to create HTML Label
        function createLabel(text, className = 'label-3d') {
            const div = document.createElement('div');
            div.className = className;
            div.textContent = text;
            return new THREE.CSS2DObject(div);
        }

        const pointGeo = new THREE.SphereGeometry(0.3, 32, 32); // Làm điểm to hơn chút
        const pointMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

        // 1. Center Point I
        const centerPointI = new THREE.Mesh(pointGeo, pointMat);
        scene.add(centerPointI);
        
        const labelI = createLabel('I');
        labelI.position.set(0.6, 0.8, 0);
        centerPointI.add(labelI);

        // 2. The Sphere (S)
        const sphereGroup = new THREE.Group();
        
        // Solid transparent sphere
        const sphereGeo = new THREE.SphereGeometry(R, 64, 64);
        const sphereMat = new THREE.MeshPhysicalMaterial({ 
            color: 0x2563eb, // Xanh nhạt hơn một chút
            transparent: true, 
            opacity: 0.15, // Trong suốt hơn để nhìn rõ bên trong
            roughness: 0.3,
            metalness: 0.2,
            side: THREE.DoubleSide,
            depthWrite: false
        });
        const sphere = new THREE.Mesh(sphereGeo, sphereMat);
        sphereGroup.add(sphere);

        // Subtle Wireframe (latitude/longitude lines)
        const wireGeo = new THREE.WireframeGeometry(new THREE.SphereGeometry(R, 24, 24)); // Tăng lưới cho mịn
        const wireMat = new THREE.LineBasicMaterial({ color: 0x60a5fa, transparent: true, opacity: 0.2 });
        const wireSphere = new THREE.LineSegments(wireGeo, wireMat);
        sphereGroup.add(wireSphere);
        
        scene.add(sphereGroup);

        // --- Helper functions for visual elements ---
        function createDashedLine(start, end, color = 0xfacc15) {
            const mat = new THREE.LineDashedMaterial({ color: color, dashSize: 0.8, gapSize: 0.4 });
            const geo = new THREE.BufferGeometry().setFromPoints([start, end]);
            const line = new THREE.Line(geo, mat);
            line.computeLineDistances();
            return line;
        }

        function createSolidLine(start, end, color = 0x3b82f6, opacity = 0.8) {
            const mat = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: opacity, linewidth: 2 });
            const geo = new THREE.BufferGeometry().setFromPoints([start, end]);
            return new THREE.Line(geo, mat);
        }

        function createPointWithLabel(pos, text, color = 0xffffff) {
            const mat = new THREE.MeshBasicMaterial({ color: color });
            const pt = new THREE.Mesh(pointGeo, mat);
            pt.position.copy(pos);
            const lbl = createLabel(text);
            lbl.position.set(0.6, 0.8, 0);
            pt.add(lbl);
            return pt;
        }

        // Helper for Plane
        function createPlane(yPos, color, name, isTransparent = true) {
            const group = new THREE.Group();
            // Mặt phẳng chính
            const planeGeo = new THREE.PlaneGeometry(30, 30);
            const planeMat = new THREE.MeshBasicMaterial({
                color: color, 
                transparent: true, 
                opacity: isTransparent ? 0.2 : 0.4, 
                side: THREE.DoubleSide
            });
            const plane = new THREE.Mesh(planeGeo, planeMat);
            plane.rotation.x = Math.PI / 2;
            plane.position.y = yPos;
            
            // Viền mặt phẳng để nhìn rõ ranh giới
            const edgesGeo = new THREE.EdgesGeometry(planeGeo);
            const edgesMat = new THREE.LineBasicMaterial({ color: color, linewidth: 2 });
            const planeEdges = new THREE.LineSegments(edgesGeo, edgesMat);
            planeEdges.rotation.x = Math.PI / 2;
            planeEdges.position.y = yPos;

            // Grid nội bộ mặt phẳng
            const grid = new THREE.GridHelper(30, 15, color, color);
            grid.position.y = yPos;
            grid.material.opacity = 0.3;
            grid.material.transparent = true;

            const labelPlane = createLabel(`( ${name} )`, 'label-3d text-xl');
            labelPlane.position.set(12, yPos + 0.5, 12);

            group.add(plane, planeEdges, grid, labelPlane);
            return group;
        }

        // BIẾN TOÀN CỤC ĐỂ LƯU STATE HIỆN TẠI
        let currentStateGroup = null;

        // HÀM BUILD TỪNG STATE (Chỉ gọi khi cần)
        function buildState(id) {
            const group = new THREE.Group();
            
            switch (id) {
                case 0: { // State 0: Mặt cầu (S)
                    const rPos0 = new THREE.Vector3(R, 0, 0);
                    const radiusLine0 = createDashedLine(new THREE.Vector3(0,0,0), rPos0);
                    const ptR0 = createPointWithLabel(rPos0, '', 0x60a5fa);
                    const labelR0 = createLabel('R', 'label-3d label-r');
                    labelR0.position.copy(rPos0).multiplyScalar(0.5).add(new THREE.Vector3(0, 0.6, 0));
                    group.add(radiusLine0, ptR0, labelR0);
                    break;
                }
                case 1: { // State 1: Điểm M thuộc (S)
                    const posM = new THREE.Vector3(R, 0, 0).applyAxisAngle(new THREE.Vector3(0,1,0), Math.PI/3).applyAxisAngle(new THREE.Vector3(1,0,0), Math.PI/6);
                    const ptM = createPointWithLabel(posM, 'M', 0x10b981);
                    const lineM = createSolidLine(new THREE.Vector3(0,0,0), posM, 0x10b981);
                    const labelR1 = createLabel('R', 'label-3d label-r');
                    labelR1.position.copy(posM).multiplyScalar(0.5).add(new THREE.Vector3(0, 0.6, 0));
                    group.add(ptM, lineM, labelR1);
                    break;
                }
                case 2: { // State 2: Điểm N nằm trong (S)
                    const posN = new THREE.Vector3(R * 0.4, R * 0.2, R * 0.5);
                    const ptN = createPointWithLabel(posN, 'N', 0xef4444);
                    const lineN = createSolidLine(new THREE.Vector3(0,0,0), posN, 0xef4444);
                    const posN_ext = posN.clone().normalize().multiplyScalar(R);
                    const lineN_ext = createDashedLine(posN, posN_ext, 0x64748b);
                    const labelR2 = createLabel('R', 'label-3d label-r');
                    labelR2.position.copy(posN_ext).multiplyScalar(0.8).add(new THREE.Vector3(0, 0.6, 0));
                    group.add(ptN, lineN, lineN_ext, labelR2);
                    break;
                }
                case 3: { // State 3: Điểm P nằm ngoài (S)
                    const posP = new THREE.Vector3(15, 6, 8);
                    const ptP = createPointWithLabel(posP, 'P', 0xf59e0b);
                    const dirP = posP.clone().normalize();
                    const surfP = dirP.clone().multiplyScalar(R);
                    const radiusLine3 = createSolidLine(new THREE.Vector3(0,0,0), surfP, 0xfacc15);
                    const extLine3 = createSolidLine(surfP, posP, 0xf59e0b);
                    const ptSurfP = createPointWithLabel(surfP, '', 0xfacc15);
                    const labelR3 = createLabel('R', 'label-3d label-r');
                    labelR3.position.copy(surfP).multiplyScalar(0.5).add(new THREE.Vector3(-0.5, 0.5, 0));
                    group.add(ptP, ptSurfP, radiusLine3, extLine3, labelR3);
                    break;
                }
                case 4: { // State 4: Đường thẳng cắt
                    const y4 = 4, z4 = 0;
                    const ptLine4A = new THREE.Vector3(-18, y4, z4);
                    const ptLine4B = new THREE.Vector3(18, y4, z4);
                    const line4 = createSolidLine(ptLine4A, ptLine4B, 0xec4899, 1);
                    const closestPt4 = new THREE.Vector3(0, y4, z4); 
                    const distLine4 = createDashedLine(new THREE.Vector3(0,0,0), closestPt4, 0xa855f7);
                    const chordLen = Math.sqrt(R*R - y4*y4);
                    const intA4 = new THREE.Vector3(-chordLen, y4, z4);
                    const intB4 = new THREE.Vector3(chordLen, y4, z4);
                    const meshIntA4 = createPointWithLabel(intA4, 'A', 0xec4899);
                    const meshIntB4 = createPointWithLabel(intB4, 'B', 0xec4899);
                    const lineIA = createDashedLine(new THREE.Vector3(0,0,0), intA4, 0x64748b);
                    const lineIB = createDashedLine(new THREE.Vector3(0,0,0), intB4, 0x64748b);
                    const labelH4 = createLabel('H');
                    labelH4.position.copy(closestPt4).add(new THREE.Vector3(0, -0.8, 0));
                    const labelD4 = createLabel('d', 'label-3d text-purple-400');
                    labelD4.position.copy(closestPt4).multiplyScalar(0.5).add(new THREE.Vector3(0.5, 0, 0));
                    group.add(line4, distLine4, meshIntA4, meshIntB4, lineIA, lineIB, labelH4, labelD4);
                    break;
                }
                case 5: { // State 5: Đường thẳng tiếp xúc
                    const ptLine5A = new THREE.Vector3(-18, R, 0);
                    const ptLine5B = new THREE.Vector3(18, R, 0);
                    const line5 = createSolidLine(ptLine5A, ptLine5B, 0xec4899, 1);
                    const closestPt5 = new THREE.Vector3(0, R, 0);
                    const distLine5 = createSolidLine(new THREE.Vector3(0,0,0), closestPt5, 0xa855f7);
                    const meshInt5 = createPointWithLabel(closestPt5, 'H', 0xec4899);
                    const sqGeo = new THREE.BufferGeometry().setFromPoints([
                        new THREE.Vector3(0.5, R, 0), new THREE.Vector3(0.5, R-0.5, 0), new THREE.Vector3(0, R-0.5, 0)
                    ]);
                    const sqMat = new THREE.LineBasicMaterial({ color: 0xa855f7 });
                    const sqLine = new THREE.Line(sqGeo, sqMat);
                    const labelD5 = createLabel('d = R', 'label-3d text-purple-400');
                    labelD5.position.copy(closestPt5).multiplyScalar(0.5).add(new THREE.Vector3(1, 0, 0));
                    group.add(line5, distLine5, meshInt5, sqLine, labelD5);
                    break;
                }
                case 6: { // State 6: Đường thẳng không cắt
                    const ptLine6A = new THREE.Vector3(-18, R + 5, 0);
                    const ptLine6B = new THREE.Vector3(18, R + 5, 0);
                    const line6 = createSolidLine(ptLine6A, ptLine6B, 0xec4899, 1);
                    const closestPt6 = new THREE.Vector3(0, R + 5, 0);
                    const distLine6 = createDashedLine(new THREE.Vector3(0,0,0), closestPt6, 0xa855f7);
                    const labelD6 = createLabel('d', 'label-3d text-purple-400');
                    labelD6.position.copy(closestPt6).multiplyScalar(0.5).add(new THREE.Vector3(0.5, 0, 0));
                    const intShell6 = createPointWithLabel(new THREE.Vector3(0, R, 0), '', 0x64748b);
                    group.add(line6, distLine6, intShell6, labelD6);
                    break;
                }
                case 7: { // State 7: Mặt phẳng cắt
                    const y7 = 3.5;
                    const plane7 = createPlane(y7, 0x14b8a6, 'P', true);
                    const distLine7 = createDashedLine(new THREE.Vector3(0,0,0), new THREE.Vector3(0, y7, 0), 0xa855f7);
                    const r7 = Math.sqrt(R*R - y7*y7);
                    const circleGeo7 = new THREE.BufferGeometry();
                    const points7 = [];
                    for(let i=0; i<=64; i++) {
                        const theta = (i/64) * Math.PI * 2;
                        points7.push(new THREE.Vector3(Math.cos(theta)*r7, y7, Math.sin(theta)*r7));
                    }
                    circleGeo7.setFromPoints(points7);
                    const circleMat7 = new THREE.LineBasicMaterial({color: 0xef4444, linewidth: 3});
                    const circle7 = new THREE.Line(circleGeo7, circleMat7);
                    const circleShapeGeo = new THREE.CircleGeometry(r7, 64);
                    const circleShapeMat = new THREE.MeshBasicMaterial({ color: 0xef4444, transparent: true, opacity: 0.3, side: THREE.DoubleSide });
                    const circleShape = new THREE.Mesh(circleShapeGeo, circleShapeMat);
                    circleShape.rotation.x = -Math.PI / 2;
                    circleShape.position.y = y7;
                    const centerCircle7 = createPointWithLabel(new THREE.Vector3(0, y7, 0), 'H');
                    const rSmallLine = createDashedLine(new THREE.Vector3(0, y7, 0), new THREE.Vector3(r7, y7, 0), 0xfacc15);
                    const labelRSmall = createLabel('r', 'label-3d text-yellow-400 text-sm');
                    labelRSmall.position.set(r7/2, y7 + 0.3, 0);
                    const labelD7 = createLabel('d', 'label-3d text-purple-400');
                    labelD7.position.set(0.5, y7/2, 0);
                    group.add(plane7, distLine7, circle7, circleShape, centerCircle7, rSmallLine, labelRSmall, labelD7);
                    break;
                }
                case 8: { // State 8: Mặt phẳng tiếp xúc
                    const plane8 = createPlane(R, 0x14b8a6, 'P', false);
                    const distLine8 = createSolidLine(new THREE.Vector3(0,0,0), new THREE.Vector3(0, R, 0), 0xa855f7);
                    const touchPt8 = createPointWithLabel(new THREE.Vector3(0, R, 0), 'H', 0xef4444);
                    const labelD8 = createLabel('d = R', 'label-3d text-purple-400');
                    labelD8.position.set(1.5, R/2, 0);
                    group.add(plane8, distLine8, touchPt8, labelD8);
                    break;
                }
                case 9: { // State 9: Mặt phẳng không cắt
                    const y9 = R + 4;
                    const plane9 = createPlane(y9, 0x14b8a6, 'P', true);
                    const distLine9 = createDashedLine(new THREE.Vector3(0,0,0), new THREE.Vector3(0, y9, 0), 0xa855f7);
                    const labelD9 = createLabel('d', 'label-3d text-purple-400');
                    labelD9.position.set(0.5, y9/2, 0);
                    group.add(plane9, distLine9, labelD9);
                    break;
                }
            }
            return group;
        }

        // HÀM TIÊU HỦY HOÀN TOÀN NHÃN HTML
        function destroyCSS2DObjects(group) {
            if (!group) return;
            group.traverse(child => {
                // Nếu child là một nhãn (CSS2DObject), nó sẽ có thuộc tính .element
                if (child.isCSS2DObject && child.element) {
                    if (child.element.parentNode) {
                        child.element.parentNode.removeChild(child.element);
                    }
                }
            });
        }


        // --- Render Loop ---
        function animate() {
            requestAnimationFrame(animate);
            if (controls) controls.update();
            
            // Slowly rotate the wireframe sphere for a nice effect
            if (wireSphere) wireSphere.rotation.y += 0.001;

            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        
        // Start animation after window loads to ensure canvas size is correct
        window.onload = function() {
            onWindowResize();
            animate();
        };

        // --- Window Resize Handling ---
        function onWindowResize() {
            const width = container.clientWidth;
            const height = container.clientHeight;
            
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            
            renderer.setSize(width, height);
            labelRenderer.setSize(width, height);
        }
        
        window.addEventListener('resize', onWindowResize);


        // --- UI Logic ---
        const menuListEl = document.getElementById('menu-list');
        const infoTitleEl = document.getElementById('info-title');
        const infoDescEl = document.getElementById('info-desc');
        const mathFormulaEl = document.getElementById('math-formula');

        function renderMenu() {
            menuListEl.innerHTML = '';
            menuData.forEach(item => {
                const btn = document.createElement('button');
                const isActive = item.id === currentStateId;
                
                btn.className = `w-full text-left px-4 py-3 rounded-lg text-sm transition-all duration-200 flex items-center gap-3 border ${
                    isActive 
                    ? 'bg-indigo-900/40 border-indigo-500/50 text-white shadow-[0_0_15px_rgba(99,102,241,0.1)]' 
                    : 'bg-transparent border-transparent text-slate-400 hover:bg-slate-800/50 hover:text-slate-200'
                }`;
                
                btn.innerHTML = `
                    <div class="w-6 h-6 rounded-full flex items-center justify-center text-xs shrink-0 ${
                        isActive ? 'bg-indigo-600 text-white' : 'bg-slate-700 text-slate-300'
                    }">
                        ${item.id}
                    </div>
                    <span class="truncate">${item.label}</span>
                `;
                
                btn.onclick = () => changeState(item.id);
                menuListEl.appendChild(btn);
            });
        }

        function updateFooter(id) {
            const data = menuData.find(item => item.id === id);
            if (!data) return;

            // Preserve the SVG icon in title
            const iconHtml = `<svg class="text-yellow-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="9" y1="18" x2="15" y2="18"></line><line x1="10" y1="22" x2="14" y2="22"></line><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"></path></svg>`;
            infoTitleEl.innerHTML = iconHtml + ' ' + data.title;
            infoDescEl.textContent = data.desc;

            // Render KaTeX
            katex.render(data.formula, mathFormulaEl, {
                throwOnError: false,
                displayMode: true
            });
        }

        function update3DScene(id) {
            // 1. Phá hủy và xóa hoàn toàn State cũ khỏi scene
            if (currentStateGroup) {
                destroyCSS2DObjects(currentStateGroup);
                scene.remove(currentStateGroup);
                currentStateGroup = null;
            }

            // 2. Build mới và thêm State mới vào scene
            currentStateGroup = buildState(id);
            scene.add(currentStateGroup);
        }

        function changeState(id) {
            currentStateId = id;
            renderMenu();
            updateFooter(id);
            update3DScene(id);
        }

        // --- Initialization ---
        renderMenu();
        updateFooter(currentStateId);
        
        // Timeout to ensure fonts load before calculating layout for labels occasionally
        setTimeout(() => {
            update3DScene(currentStateId);
        }, 100);

    </script>
</body>
</html>
